  /* ---- render sub-view INTO nw-stage (replaces graph) ---- */
  function renderStageSubView(node,mode){
    var nwStage=wrap.querySelector('.nw-stage');
    if(!nwStage)return;
    var oldOv=nwStage.querySelector('.nw-stage-subview');
    if(oldOv)oldOv.remove();

    var ov=document.createElement('div');
    ov.className='nw-stage-subview';
    ov.addEventListener('pointerdown',function(e){e.stopPropagation();});
    ov.addEventListener('wheel',function(e){e.stopPropagation();},{passive:true});

    /* ── 3-way toggle (sticky top) ── */
    var tbar=document.createElement('div');
    tbar.className='sv-toggle';
    var pill=document.createElement('div');
    pill.className='ig-toggle';
    pill.style.cssText='position:static;bottom:auto;left:auto;transform:none';
    var graphIcon='<svg viewBox="0 0 16 16"><circle cx="4" cy="4" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><line x1="6" y1="4" x2="10" y2="4"/><line x1="4" y1="6" x2="4" y2="10"/><line x1="12" y1="6" x2="12" y2="10"/><line x1="6" y1="5" x2="10" y2="11"/></svg>';
    var relIcon='<svg viewBox="0 0 16 16"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="10" y="1" width="5" height="5" rx="1"/><rect x="1" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/></svg>';
    var accIcon='<svg viewBox="0 0 16 16"><line x1="1" y1="3" x2="15" y2="3"/><line x1="1" y1="7" x2="15" y2="7"/><line x1="1" y1="11" x2="15" y2="11"/><line x1="1" y1="15" x2="12" y2="15"/></svg>';
    var gLbl=_lang==='en'?'Graph':'関係図';
    var rLbl=_lang==='en'?'Relations':'関連';
    var aLbl=_lang==='en'?'Accounts':'アカウント';
    pill.innerHTML='<button class="ig-toggle-btn" data-m="graph">'+graphIcon+gLbl+'</button>'
      +'<button class="ig-toggle-btn'+(mode==='relation'?' active':'')+'" data-m="relation">'+relIcon+rLbl+'</button>'
      +'<button class="ig-toggle-btn'+(mode==='account'?' active':'')+'" data-m="account">'+accIcon+aLbl+'</button>';
    pill.addEventListener('click',function(e){
      var btn=e.target.closest('.ig-toggle-btn');if(!btn)return;
      var m=btn.getAttribute('data-m');
      if(m==='graph'){ov.remove();var bb=wrap.querySelector('button[data-nw-back]');if(bb)bb.style.display='none';if(window._nwViewToggle)window._nwViewToggle.hide();return;}
      if(m!==mode){renderStageSubView(node,m);if(window._nwViewToggle)window._nwViewToggle.show(m);}
    });
    tbar.appendChild(pill);
    ov.appendChild(tbar);

    /* ── render existing tree into overlay ── */
    /* save global state */
    var prevFilter=filterBy, prevMode=viewMode, prevVis=new Set(vis);
    filterBy=node.name;
    viewMode=(mode==='relation'?'sector':'proposer');
    vis.clear(); vis.add('root');
    /* expand all L1 so proposals show */
    var treeRoot=buildTree();
    if(treeRoot.children) for(var ci=0;ci<treeRoot.children.length;ci++) vis.add(treeRoot.children[ci].id);
    var lay=doLayout(treeRoot);

    /* create stage/layer/svg inside overlay */
    var miniStage=document.createElement('div');
    miniStage.style.cssText='position:relative;overflow:visible;transform-origin:0 0';
    var miniLayer=document.createElement('div');
    miniLayer.style.cssText='position:absolute;left:0;top:0;transform-origin:0 0';
    var svgNS='http://www.w3.org/2000/svg';
    var miniSvg=document.createElementNS(svgNS,'svg');
    miniSvg.style.cssText='position:absolute;left:0;top:0;overflow:visible;pointer-events:none;transform-origin:0 0';

    var keys=Object.keys(lay);
    var maxX=0,maxY=0;

    for(var i=0;i<keys.length;i++){
      var n=lay[keys[i]];
      if(n.x+n.w>maxX)maxX=n.x+n.w;
      if(n.y+n.h>maxY)maxY=n.y+n.h;

      var el=document.createElement('div');
      var clsCls=(n.depth===2&&n.raw&&n.raw.cls&&n.raw.cls!=='main')?' cls-'+n.raw.cls:'';
      el.className='node'+(n.depth===0?' root':n.depth===1?' l1':' l2')+clsCls;
      el.style.cssText='left:'+n.x+'px;top:'+n.y+'px;';

      var card=document.createElement('div');
      card.className='node-card expanded';
      card.style.setProperty('--c',n.hue!=null?hsl(n.hue):'var(--ink)');

      if(n.depth===0){
        card.innerHTML='<div class="sub">'+esc(node.props.length+T('propsOf')+' · '+fmtJpy(node.soloUsdK+node.coUsdK))+'</div><div class="label">'+esc(node.name)+'</div>';
      } else if(n.depth===1){
        var raw=n.raw;
        var secAmt=raw._usdK>0?'<span class="sec-amt">'+fmtJpy(raw._usdK)+'</span>':'';
        var miniBar='';
        if(raw._total){
          var okP=(raw._ok/raw._total*100).toFixed(1);
          var wiP=(raw._wip/raw._total*100).toFixed(1);
          var dnP=(raw._dnf/raw._total*100).toFixed(1);
          miniBar='<div class="mini-bar">';
          if(raw._ok)miniBar+='<div class="mini-bar-seg" style="width:'+okP+'%;background:var(--st-ok)"></div>';
          if(raw._wip)miniBar+='<div class="mini-bar-seg" style="width:'+wiP+'%;background:var(--st-wip)"></div>';
          if(raw._dnf)miniBar+='<div class="mini-bar-seg" style="width:'+dnP+'%;background:var(--st-dnf)"></div>';
          miniBar+='</div>';
        }
        card.innerHTML='<div class="row"><div class="label">'+esc(n.label)+'</div>'
          +secAmt
          +'<span class="cat-tag">'+raw._total+' proposals</span></div>'
          +miniBar;
      } else {
        var p=n.raw;
        var ctxTag='';
        if(viewMode==='proposer'&&p.sector){
          ctxTag='<span class="cat-tag" style="color:var(--ink);border:1px solid var(--border)">'+esc(trunc(p.sector,20))+'</span>';
        } else if(p.by){
          ctxTag='<span class="cat-tag" style="color:var(--ink);border:1px solid var(--border)">'+esc(p.by)+'</span>';
        }
        var myRole=p._teamRole||p.role;
        var rTag=myRole&&myRole!=='提案者'&&myRole!=='仲介'?roleTag(myRole):'';
        var fTag=p.fund?'<span class="cat-tag fund-tag">F'+p.fund+'</span>':'';
        var lkIcons='';
        if(p.url)lkIcons+='<span class="lk-icon" title="Project" data-href="'+esc(p.url)+'">↗</span>';
        if(p.x)lkIcons+='<span class="lk-icon" title="X" data-href="'+esc(p.x)+'">𝕏</span>';
        if(p.yt)lkIcons+='<span class="lk-icon" title="YouTube" data-href="'+esc(p.yt)+'">▶</span>';
        if(p.report)lkIcons+='<span class="lk-icon lk-cr" title="'+T('completionReport')+'" data-report="'+esc(p.id)+'">CR</span>';
        card.innerHTML='<div class="row"><span class="st-dot" style="background:'+stColor(p.st)+'"></span>'
          +'<div class="label">'+esc(n.label)+'</div>'
          +(lkIcons?'<span class="lk-row">'+lkIcons+'</span>':'')
          +'<span class="amount">'+fmtDual(p.amt,p.u,p.adaPrice)+'</span></div>'
          +'<div class="row">'+stBadge(p.st)+clsTag(p.cls)+fTag+ctxTag+rTag
          +'<span class="cat-tag">'+esc(trunc(p.ch,28))+'</span></div>';
      }

      /* clicks */
      (function(nid,depth,raw){card.onclick=function(e){
        e.stopPropagation();
        var lki=e.target.closest('.lk-icon');
        if(lki){var href=lki.getAttribute('data-href');if(href)window.open(href,'_blank');return;}
        if(depth===2&&raw) openInLens(raw);
      };})(n.id,n.depth,n.depth===2?n.raw:null);

      el.appendChild(card);
      miniLayer.appendChild(el);

      /* bezier line to parent */
      if(n.parent&&lay[n.parent]){
        var pn=lay[n.parent];
        var x1=pn.x+pn.w, y1=pn.y+pn.h/2;
        var x2=n.x, y2=n.y+n.h/2;
        var path=document.createElementNS(svgNS,'path');
        path.setAttribute('d',pathD(x1,y1,x2,y2));
        path.setAttribute('fill','none');
        path.setAttribute('stroke',n.hue!=null?hsl(n.hue):'var(--border)');
        path.setAttribute('stroke-width','1.5');
        path.setAttribute('opacity','0.4');
        miniSvg.appendChild(path);
      }
    }

    miniSvg.setAttribute('width',maxX+200);
    miniSvg.setAttribute('height',maxY+200);
    miniStage.style.width=(maxX+200)+'px';
    miniStage.style.height=(maxY+200)+'px';
    miniStage.appendChild(miniSvg);
    miniStage.appendChild(miniLayer);
    ov.appendChild(miniStage);

    /* restore global state */
    filterBy=prevFilter; viewMode=prevMode; vis=prevVis;

    nwStage.appendChild(ov);

    /* ── zoom / pan ── */
    var svZ=1, svPX=0, svPY=0;
    function svApply(){
      var tfm='translate('+svPX+'px,'+svPY+'px) scale('+svZ+')';
      miniLayer.style.transform=tfm;
      miniSvg.style.transform=tfm;
    }
    /* auto-fit: scale down to fit stage */
    var stageW=nwStage.offsetWidth, stageH=nwStage.offsetHeight-50;/* 50 for toggle */
    var treeW=maxX+200, treeH=maxY+200;
    svZ=Math.min(1,Math.min(stageW/treeW,stageH/treeH)*0.9);
    svPX=Math.max(10,(stageW-treeW*svZ)/2);
    svPY=10;
    svApply();

    /* wheel zoom */
    ov.addEventListener('wheel',function(e){
      e.preventDefault();
      var d=e.deltaY>0?-0.05:0.05;
      var oldZ=svZ;
      svZ=Math.max(0.15,Math.min(2,svZ+d));
      /* zoom toward cursor */
      var rect=ov.getBoundingClientRect();
      var mx=e.clientX-rect.left, my=e.clientY-rect.top;
      svPX+=(mx-svPX)*(1-svZ/oldZ);
      svPY+=(my-svPY)*(1-svZ/oldZ);
      svApply();
    },{passive:false});

    /* drag pan */
    var svDrag=false, svDX=0, svDY=0;
    ov.addEventListener('pointerdown',function(e){
      if(e.target.closest('.node-card')||e.target.closest('.ig-toggle'))return;
      svDrag=true; svDX=e.clientX; svDY=e.clientY;
      ov.style.cursor='grabbing';
    });
    ov.addEventListener('pointermove',function(e){
      if(!svDrag)return;
      svPX+=e.clientX-svDX; svPY+=e.clientY-svDY;
      svDX=e.clientX; svDY=e.clientY;
      svApply();
    });
    ov.addEventListener('pointerup',function(){svDrag=false;ov.style.cursor='';});
  }

  renderDetail(null);
}

/* ================================================================
   EXPAND ALL
   ================================================================ */
function toggleExpandAll(){
  var tree=buildTree();
  if(!tree.children||!tree.children.length)return;
  var hasRoot=vis.has('root');
  var hasL2=false;
  if(hasRoot){
    for(var i=0;i<tree.children.length;i++){if(vis.has(tree.children[i].id)){hasL2=true;break;}}
  }
  if(!hasRoot){
    /* step 1: open L1 */
    vis.clear();vis.add('root');
  } else if(!hasL2){
    /* step 2: open L2 */
    for(var i=0;i<tree.children.length;i++) vis.add(tree.children[i].id);
  } else {
    /* step 3: close all */
    vis.clear();
  }
  render();
}

/* === Bootstrap with focused start (when ?highlight=<id> is present) ===
   Goal: the very first paint already shows the target proposal in view + highlighted,
   no animation from a default state. */
(function(){
  var _initHl=null, _initCtx=null;
  try{
    _initHl=new URLSearchParams(location.search).get('highlight');
    if(_initHl) _initCtx=_findProposalCtx(_initHl);
  }catch(e){}

  /* Pre-expand vis for sector view BEFORE the initial render */
  if(_initCtx && viewMode==='sector'){
    vis.add(_initCtx.sectorId);
  }

  buildShell();
  if(viewMode==='catalog'){renderCatalog();}
  else if(viewMode==='network'){renderNetwork();}
  else if(viewMode==='timeline'){renderTimeline();}
  else if(viewMode==='chart'){renderChart();}
  else{render();centerView();}

  if(!_initHl) return;
  _catalogHighlightId=_initHl;

  /* For proposer view, the by-X node id is only known after the first render —
     so do the find + expand + re-render synchronously (browser paints only once).
     We match by the data-name attribute (now set on every node by render()). */
  if(_initCtx && viewMode==='proposer'){
    try{
      var byNodes=document.querySelectorAll('.node[data-id^="by-"]');
      for(var k=0;k<byNodes.length;k++){
        if(byNodes[k].getAttribute('data-name')===_initCtx.proposer){
          vis.add(byNodes[k].getAttribute('data-id'));
          render();
          break;
        }
      }
    }catch(e){}
  }

  /* For tree views, pan the layer so the target leaf sits in the center */
  if(viewMode==='sector'||viewMode==='proposer'){
    try{
      var el=document.querySelector('[data-id="'+_initHl+'"]');
      var stage=document.querySelector('.stage');
      if(el&&stage){
        var r=el.getBoundingClientRect();
        var sr=stage.getBoundingClientRect();
        panX -= (r.left + r.width/2 - sr.left - sr.width/2);
        panY -= (r.top  + r.height/2 - sr.top  - sr.height/2);
        setTfm();
      }
    }catch(e){}
  }

  /* For network view, select the proposer node so edges/related nodes light up.
     Plus add a strong extra-pulse on the selected node itself. */
  if(viewMode==='network' && _initCtx){
    /* renderNetwork exposes _nwSelectByName synchronously */
    try{
      if(typeof window._nwSelectByName==='function') window._nwSelectByName(_initCtx.proposer);
      /* Extra glow on the selected bubble */
      setTimeout(function(){
        try{
          var selNode=document.querySelector('.nw-node-g.sel');
          if(selNode){
            if(!document.getElementById('nw-extra-pulse-style')){
              var s=document.createElement('style'); s.id='nw-extra-pulse-style';
              s.textContent='@keyframes nw-extra-pulse{0%,100%{filter:drop-shadow(0 0 12px var(--c,#d4a04a)) drop-shadow(0 0 0 rgba(212,160,74,0));}50%{filter:drop-shadow(0 0 28px var(--c,#d4a04a)) drop-shadow(0 0 12px rgba(255,255,255,0.6));}}';
              document.head.appendChild(s);
            }
            selNode.style.animation='nw-extra-pulse 1.6s ease-in-out infinite';
          }
        }catch(e){}
      }, 200);
    }catch(e){}
  }

  /* For chart view: switch to account mode, find + click the proposer's row */
  if(viewMode==='chart' && _initCtx){
    setTimeout(function(){
      try{
        /* Switch left list to account mode */
        var togs=document.querySelectorAll('.ch-tog-btn');
        if(togs.length>=2 && !togs[1].classList.contains('active')) togs[1].click();
        /* After a tick, find the row matching the proposer name */
        setTimeout(function(){
          var rows=document.querySelectorAll('.ch-list-card');
          for(var i=0;i<rows.length;i++){
            var nameEl=rows[i].querySelector('.ch-list-name');
            if(nameEl && (nameEl.textContent||'').indexOf(_initCtx.proposer)>=0){
              rows[i].scrollIntoView({block:'center'});
              rows[i].click();
              /* Add strong pulse outline on the selected row so it stands out */
              if(!document.getElementById('chart-pulse-style')){
                var s=document.createElement('style'); s.id='chart-pulse-style';
                s.textContent='@keyframes chart-row-pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,160,74,0);outline:2px solid rgba(212,160,74,0);}50%{box-shadow:0 0 0 6px rgba(212,160,74,0.3),0 0 24px rgba(212,160,74,0.5);outline:2px solid rgba(212,160,74,0.95);}}';
                document.head.appendChild(s);
              }
              rows[i].style.animation='chart-row-pulse 1.4s ease-in-out infinite';
              rows[i].classList.add('catalog-pulsing');
              break;
            }
          }
        }, 120);
      }catch(e){}
    }, 200);
  }

  /* Pulse the matching element (short delay for any layout settle) */
  setTimeout(function(){ try{ highlightCatalogTarget(_initHl); }catch(e){} }, 60);
})();

/* ================================================================
   LIVE PRICE API (CoinGecko)
   現在のADA価格 + 各Fund提案時/採択時の過去価格を取得し全額を再計算
   ================================================================ */
/* 全統計を再計算 (FUND_PRICES 更新後に呼ぶ) */
function recalcAll(){
  var src=_priceMode==='result'?FUND_RESULT_PRICES:FUND_SUBMIT_PRICES;
  for(var k in src) FUND_PRICES[k]=src[k];
  /* 1) adaPrice を再セット */
  for(var i=0;i<INDUSTRIES.length;i++){
    for(var j=0;j<INDUSTRIES[i].children.length;j++){
      var p=INDUSTRIES[i].children[j];
      p.adaPrice=FUND_PRICES[p.fund]||ADA_USD;
    }
  }
  /* 2) グローバル集計やり直し */
  TOTAL_USD_K=0;TOTAL_ADA=0;TOTAL_FUNDED=0;TOTAL_COMPLETED=0;TOTAL_PROGRESS=0;TOTAL_DNF=0;
  for(var i2=0;i2<INDUSTRIES.length;i2++){
    var ind=INDUSTRIES[i2],ok=0,wip=0,dnf=0,secK=0;
    for(var j2=0;j2<ind.children.length;j2++){
      var q=ind.children[j2];
      var uK=q.u==='ada'?q.amt*q.adaPrice:q.amt;
      if(q.st==='complete'){ok++;TOTAL_COMPLETED++;}
      else if(q.st==='progress'){wip++;TOTAL_PROGRESS++;}
      else{dnf++;TOTAL_DNF++;}
      TOTAL_FUNDED++;TOTAL_USD_K+=uK;secK+=uK;
      TOTAL_ADA+=q.u==='ada'?q.amt:q.amt/(q.adaPrice||ADA_USD);
    }
    ind._ok=ok;ind._wip=wip;ind._dnf=dnf;ind._total=ok+wip+dnf;ind._usdK=secK;
  }
  AVG_USD_K=TOTAL_FUNDED?Math.round(TOTAL_USD_K/TOTAL_FUNDED):0;
  console.log('[CJ] Recalculated ('+_priceMode+'): TOTAL_USD_K='+TOTAL_USD_K.toFixed(1)+' TOTAL_ADA='+Math.round(TOTAL_ADA));
}

/* 価格モード切替 */
function setPriceMode(mode){
  _priceMode=mode;recalcAll();buildShell();
  /* recalcAll() has mutated INDUSTRIES (p.adaPrice on each proposal). Notify the catalog
     iframe so its amount components re-read from p._raw and reflect the new prices. */
  postToCatalog({type:'price-mode-change',value:mode});
  if(viewMode==='network')renderNetwork();else if(viewMode==='timeline')renderTimeline();else if(viewMode==='chart')renderChart();else render();
}

(function(){
  /* 1) 現在のADA価格 + USD/JPYを取得 */
  function fetchCurrentPrice(){
    return fetch('https://api.coingecko.com/api/v3/simple/price?ids=cardano&vs_currencies=usd,jpy')
      .then(function(r){return r.json()}).then(function(d){
        if(d&&d.cardano){
          if(d.cardano.usd) ADA_USD=d.cardano.usd;
          if(d.cardano.jpy&&d.cardano.usd) USD_JPY=d.cardano.jpy/d.cardano.usd;
          console.log('[CJ] Live prices: ADA=$'+ADA_USD+' USD/JPY='+USD_JPY.toFixed(1));
        }
      });
  }

  /* 2) 両セットのFund価格を取得 (提案時 + 採択時) */
  function fetchFundPrices(){
    var allDates={};
    var sf=Object.keys(FUND_SUBMIT_DATES);
    var rf=Object.keys(FUND_RESULT_DATES);
    for(var i=0;i<sf.length;i++) allDates['s:'+sf[i]]=FUND_SUBMIT_DATES[sf[i]];
    for(var j=0;j<rf.length;j++) allDates['r:'+rf[j]]=FUND_RESULT_DATES[rf[j]];
    var keys=Object.keys(allDates);
    var done=0,total=keys.length;
    keys.forEach(function(key,idx){
      setTimeout(function(){
        var date=allDates[key];
        var parts=key.split(':');
        var type=parts[0],fund=parts[1];
        fetch('https://api.coingecko.com/api/v3/coins/cardano/history?date='+date+'&localization=false')
          .then(function(r){return r.json()}).then(function(d){
            if(d&&d.market_data&&d.market_data.current_price){
              var p=d.market_data.current_price.usd;
              if(p){
                if(type==='s') FUND_SUBMIT_PRICES[fund]=p;
                else FUND_RESULT_PRICES[fund]=p;
                console.log('[CJ] F'+fund+' '+(type==='s'?'submit':'result')+' ('+date+'): $'+p.toFixed(4));
              }
            }
          }).catch(function(){/* use fallback */})
          .finally(function(){
            done++;
            if(done>=total){
              recalcAll();
              /* Chart mode: don't rebuild — user may have selection/panel open.
                 Just update header price display. Full rebuild destroys bottom+right panels. */
              if(viewMode==='chart'){
                var pe=document.querySelector('.ch-price');
                if(pe) pe.textContent='$'+ADA_USD.toFixed(4);
                var ps=document.querySelector('.ch-price-sub');
                if(ps) ps.textContent='≈ ¥'+(ADA_USD*USD_JPY).toFixed(2);
                console.log('[CJ] Fund prices updated (chart data refreshed, UI preserved)');
              } else {
                buildShell();
                if(viewMode==='network')renderNetwork();else if(viewMode==='timeline')renderTimeline();else render();
                console.log('[CJ] All fund prices updated (submit+result)');
              }
            }
          });
      }, idx*500);
    });
  }

  /* 起動: 現在価格→Fund過去価格の順 */
  fetchCurrentPrice()
    .then(function(){fetchFundPrices();})
    .catch(function(e){
      console.log('[CJ] Price fetch failed, using defaults',e);
      fetchFundPrices();
    });
})();
</script>
</body>
</html>
