<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>if(screen.width<768&&!location.pathname.includes('mobile'))location.replace('mobile.html'+location.search);</script>
<meta name="description" content="Catalyst Japan — Project Catalyst funded proposals visualization for the Japanese ecosystem">
<meta property="og:title" content="Catalyst Japan">
<meta property="og:description" content="Interactive visualization of Project Catalyst funded proposals in the Japanese ecosystem">
<title>Catalyst Japan</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1715">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf7;--ink:#1a1715;--paper:#ffffff;--muted:#8a8a83;
  --border:#1a17151f;--border-h:#1a17153a;--dim:#1a17150a;
  --card-shadow:#1a171533;--stage-g1:#f0e8d8;--stage-g2:#e8e8e0;
  --selection-bg:#1a1715;--selection-fg:#fafaf7;
  --st-ok:#3d8b6e;--st-wip:#c49b2a;--st-dnf:#b85450;
  --bar-bg:rgba(255,255,255,0.92);--bar-border:rgba(26,23,21,0.1);
  --bar-text:rgba(26,23,21,0.45);--bar-text-h:rgba(26,23,21,0.7);
  --bar-text-a:var(--ink);--bar-pill:rgba(26,23,21,0.06);
  --bar-pill-a:rgba(26,23,21,0.12);--bar-sep:rgba(26,23,21,0.1);
  --bar-shadow:rgba(0,0,0,0.08);
  --ref-text:rgba(26,23,21,0.35);--ref-bg:rgba(26,23,21,0.05);
  --ref-border:rgba(26,23,21,0.08);--ref-link:rgba(26,23,21,0.5);
  --ref-bg-h:rgba(26,23,21,0.1);--ref-border-h:rgba(26,23,21,0.18);
  --fund-bg:hsl(270 30% 93%);--fund-fg:hsl(270 40% 38%);--fund-border:none;
}
html.night{
  --bg:#0c0d10;--ink:#e8e6e1;--paper:#16171a;--muted:#7a7a74;
  --border:#e8e6e11f;--border-h:#e8e6e13a;--dim:#e8e6e10a;
  --card-shadow:#00000066;--stage-g1:#12141a;--stage-g2:#101418;
  --selection-bg:#e8e6e1;--selection-fg:#0c0d10;
  --st-ok:#4ca882;--st-wip:#d4a832;--st-dnf:#c86460;
  --bar-bg:rgba(20,20,25,0.88);--bar-border:rgba(255,255,255,0.12);
  --bar-text:rgba(255,255,255,0.4);--bar-text-h:rgba(255,255,255,0.7);
  --bar-text-a:#fff;--bar-pill:rgba(255,255,255,0.06);
  --bar-pill-a:rgba(255,255,255,0.12);--bar-sep:rgba(255,255,255,0.1);
  --bar-shadow:rgba(0,0,0,0.4);
  --ref-text:rgba(255,255,255,0.25);--ref-bg:rgba(255,255,255,0.06);
  --ref-border:rgba(255,255,255,0.08);--ref-link:rgba(255,255,255,0.5);
  --ref-bg-h:rgba(255,255,255,0.12);--ref-border-h:rgba(255,255,255,0.2);
  --fund-bg:hsl(270 30% 25%);--fund-fg:hsl(270 50% 75%);--fund-border:none;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif}
#root{position:relative;height:100%;width:100%}
::selection{background:var(--selection-bg);color:var(--selection-fg)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}


.stage{
  position:absolute;top:0;left:180px;right:0;bottom:0;overflow:hidden;cursor:grab;
  background-image:
    radial-gradient(circle at 20% 30%,var(--stage-g1) 0%,transparent 40%),
    radial-gradient(circle at 80% 70%,var(--stage-g2) 0%,transparent 40%),
    var(--bg);
}
.stage.grabbing{cursor:grabbing}
.layer{position:absolute;left:0;top:0;transform-origin:0 0}
.lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;transform-origin:0 0}

/* Header */
.header{
  position:fixed;top:12px;left:196px;right:24px;
  display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;z-index:50;
}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.title-row{display:flex;align-items:baseline;gap:12px;flex-wrap:nowrap}
.title{font-family:'Fraunces',serif;font-size:28px;font-weight:500;letter-spacing:-0.01em;line-height:1;font-variation-settings:"opsz" 96;white-space:nowrap}
.title em{font-style:italic;color:var(--muted);font-weight:400;margin-left:8px}
.title-info{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.hdr-src{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.04em;
  color:var(--muted);white-space:nowrap;
}
.ref-links{display:flex;gap:8px;align-items:center}
.ref-links a{
  display:flex;align-items:center;gap:4px;
  padding:3px 8px 3px 5px;border-radius:5px;
  background:var(--ref-bg);border:1px solid var(--ref-border);
  transition:all .15s;opacity:0.5;text-decoration:none;
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ref-link);letter-spacing:0.02em;
}
.ref-links a:hover{opacity:1;background:var(--ref-bg-h);border-color:var(--ref-border-h)}
.ref-links a img{width:14px;height:14px;border-radius:2px}
.meta{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--muted);text-transform:uppercase;text-align:right;line-height:1.9;opacity:0;pointer-events:none;transition:opacity 0.2s ease}
.meta.show{opacity:1;pointer-events:auto}
.meta b{color:var(--ink);font-weight:500}

/* Sidebar */
.sector-bar{
  position:absolute;top:0;left:0;bottom:0;width:180px;
  display:flex;flex-direction:column;gap:0;z-index:70;pointer-events:auto;
  background:var(--paper);border-right:1px solid var(--border);
  padding:20px 0 80px;overflow-y:auto;
}
.sector-bar .s-card{
  padding:12px 16px;cursor:pointer;transition:all 0.15s ease;
  display:flex;flex-direction:column;gap:4px;position:relative;
  border-bottom:1px solid var(--dim);
}
.sector-bar .s-card:hover{background:var(--dim)}
.sector-bar .s-card.active{background:var(--dim);box-shadow:inset 3px 0 0 var(--ink)}
.sector-bar .s-card.active .s-name{color:var(--ink);font-weight:500}
.sector-bar .s-top{display:flex;align-items:center;gap:6px}
.sector-bar .s-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sector-bar .s-name{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.06em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sector-bar .s-bottom{display:flex;align-items:baseline;justify-content:space-between;gap:4px}
.sector-bar .s-amt{
  font-family:'Fraunces',serif;font-size:15px;font-weight:500;line-height:1;
  font-variation-settings:"opsz" 96;white-space:nowrap;
}
.sector-bar .s-pct{
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.05em;
}
.sector-bar .s-bar{height:3px;border-radius:2px;background:var(--dim);overflow:hidden;display:flex}
.sector-bar .s-bar-seg{height:100%;transition:width 0.3s ease}
.sector-bar .s-cnt{
  font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:0.05em;
}
.sector-bar .s-card.s-all{align-items:center;justify-content:center;gap:2px;padding:14px 16px}
.sector-bar .s-card.s-all .s-name{font-size:10px;letter-spacing:0.15em;text-align:center;margin-bottom:4px}
.s-all-row1{display:flex;align-items:baseline;gap:4px;justify-content:center}
.s-all-num{font-family:'Inter',sans-serif;font-size:26px;font-weight:600;line-height:1;font-feature-settings:"tnum"}
.s-all-sep{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);opacity:0.5}
.s-all-amt{font-family:'Inter',sans-serif;font-size:22px;font-weight:600;line-height:1;font-feature-settings:"tnum";opacity:0.85}
.s-all-stats{display:flex;justify-content:center;gap:6px;margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:0.02em}
.s-all-stats span{display:flex;align-items:center;gap:4px}
.s-all-stats i{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0}

.sector-bar .s-divider{
  font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--muted);padding:14px 16px 6px;border-bottom:1px solid var(--dim);
}
.sector-bar .s-card .s-by-cnt{
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);
  margin-left:auto;white-space:nowrap;
}
.sector-bar .s-card .s-sub-amt{
  font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);
  padding:0 16px 2px;opacity:0.7;
}
.s-amt-sub{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;opacity:0.65}
.s-name-big{font-size:11px;letter-spacing:0.04em;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-amt-line{display:flex;align-items:baseline;gap:4px;padding-top:2px}
.s-amt-line .s-amt{font-family:'Inter',sans-serif;font-size:16px;font-weight:600;line-height:1;font-feature-settings:"tnum"}
.s-amt-line .s-co-paren{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);opacity:0.7;white-space:nowrap}
.s-amt-line .s-co-only{font-family:'JetBrains Mono',monospace;font-size:8px;color:hsl(270 50% 75%);opacity:0.85}
.s-amt-line .s-amt-named{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);opacity:0.6;letter-spacing:0.06em}
.s-tag-line{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);opacity:0.7;padding-top:1px;letter-spacing:0.04em}
.s-row3{display:flex;justify-content:flex-end;padding-top:2px}

/* ---- Inline Graph Toggle ---- */
.ig-toggle{
  position:absolute;bottom:68px;left:50%;transform:translateX(-50%);z-index:55;
  display:flex;align-items:center;gap:2px;
  background:var(--bar-bg);backdrop-filter:blur(12px);
  border:1px solid var(--bar-border);border-radius:10px;padding:3px;
  box-shadow:0 4px 16px var(--bar-shadow);
  transition:opacity .3s ease,transform .3s ease;
}
.ig-toggle-btn{
  padding:6px 16px;border:none;border-radius:8px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.06em;line-height:1;
  color:var(--bar-text);background:none;transition:all .2s ease;white-space:nowrap;
  display:flex;align-items:center;gap:5px;
}
.ig-toggle-btn:hover{color:var(--bar-text-h);background:var(--bar-pill)}
.ig-toggle-btn.active{color:var(--bar-text-a);background:var(--bar-pill-a)}
.ig-toggle-btn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---- Detail Panel ---- */
.ct-detail{
  position:absolute;top:24px;right:24px;bottom:24px;width:480px;
  background:var(--paper);border:1px solid var(--border);border-radius:8px;
  box-shadow:0 8px 32px -8px var(--card-shadow);z-index:60;
  display:none;flex-direction:column;overflow:hidden;
  transform:translateX(12px);opacity:0;
  transition:transform .25s ease,opacity .25s ease;
}
.ct-detail.open{display:flex;transform:translateX(0);opacity:1}
.ct-detail-close{
  position:absolute;top:12px;right:12px;width:26px;height:26px;
  border:none;background:var(--dim);border-radius:4px;cursor:pointer;
  font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;
}
.ct-detail-close:hover{background:var(--border-h);color:var(--ink)}
.ct-detail-head{
  padding:18px 22px 14px;border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:6px;flex-shrink:0;
}
.ct-d-entity{
  display:flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--muted);
}
.ct-d-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ct-d-title{
  font-family:'Fraunces',serif;font-size:16px;font-weight:500;
  letter-spacing:-0.01em;line-height:1.35;color:var(--ink);
}
.ct-d-amounts{display:flex;align-items:baseline;gap:10px}
.ct-d-amt{
  font-family:'Inter',sans-serif;font-size:20px;font-weight:600;
  font-feature-settings:"tnum";color:var(--c);
}
.ct-d-amt .unit{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.12em;margin-left:2px}
.ct-d-usd{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.ct-d-meta{
  display:flex;gap:8px;flex-wrap:wrap;
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.06em;
}
.ct-d-badge{padding:2px 8px;border-radius:3px;font-size:9px;letter-spacing:0.1em;text-transform:uppercase}
.ct-d-badge.st-complete{background:hsl(145 35% 92%);color:hsl(145 40% 35%);border:none}
.ct-d-badge.st-progress{background:hsl(40 40% 92%);color:hsl(40 50% 32%);border:none}
.ct-d-badge.st-dnf{background:hsl(0 35% 92%);color:hsl(0 40% 38%);border:none}
html.night .ct-d-badge.st-complete{background:hsl(145 35% 20%);color:hsl(145 55% 70%);border:none}
html.night .ct-d-badge.st-progress{background:hsl(40 40% 20%);color:hsl(40 60% 70%);border:none}
html.night .ct-d-badge.st-dnf{background:hsl(0 35% 20%);color:hsl(0 55% 70%);border:none}
.ct-detail-body{flex:1;overflow-y:auto;padding:16px 22px 20px}
.ct-detail-body::-webkit-scrollbar{width:4px}
.ct-detail-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ct-d-section{margin-bottom:16px}
.ct-d-label{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px;
}
.ct-d-text{font-size:13px;line-height:1.7;color:var(--ink);word-wrap:break-word}
.ct-d-fetch-btn{
  display:inline-flex;align-items:center;gap:4px;margin-top:8px;
  background:transparent;border:1px solid var(--border);border-radius:4px;
  color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;cursor:pointer;
}
.ct-d-fetch-btn:hover{background:var(--dim);color:var(--ink);border-color:var(--border-h)}
.ct-d-team{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ct-d-team-tag{
  font-family:'JetBrains Mono',monospace;font-size:9px;
  padding:2px 6px;border-radius:3px;background:var(--dim);color:var(--ink);
}
.ct-lens-row{
  border-top:1px solid var(--border);padding:12px 22px;flex-shrink:0;
  display:flex;flex-direction:column;gap:8px;
}
.ct-lens-header{display:flex;align-items:center;gap:8px}
.ct-lens-logo{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;color:var(--muted)}
.ct-lens-logo::before{content:'◉ ';color:var(--c)}
.ct-lens-presets{display:flex;gap:6px;flex-wrap:wrap}
.ct-lens-preset{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.04em;
  padding:4px 10px;border-radius:4px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;
}
.ct-lens-preset:hover{background:var(--dim);color:var(--ink);border-color:var(--border-h)}
.ct-lens-input-row{display:flex;gap:6px}
.ct-lens-input{
  flex:1;background:var(--dim);border:1px solid var(--border);border-radius:4px;
  padding:6px 10px;font-size:12px;color:var(--ink);outline:none;
  font-family:inherit;
}
.ct-lens-input::placeholder{color:var(--muted)}
.ct-lens-send{
  padding:6px 14px;border:none;border-radius:4px;background:var(--c);
  color:var(--bg);font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:0.08em;cursor:pointer;
}
.ct-lens-send:hover{opacity:0.85}
.ct-lens-log{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.ct-lens-msg{padding:8px 10px;border-radius:6px;font-size:11px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.ct-lens-msg-user{background:var(--dim);color:var(--ink)}
.ct-lens-msg-ai{background:hsla(270,40%,50%,0.12);color:var(--ink)}
.ct-lens-msg-err{background:rgba(239,68,68,0.12);color:#ef4444}
.ct-lens-msg-label{font-size:8px;font-weight:700;letter-spacing:0.08em;color:var(--muted);margin-bottom:2px;text-transform:uppercase}
.ct-lens-thinking{font-size:11px;color:var(--muted);font-style:italic;padding:4px 0}
.fund-tag{background:var(--fund-bg);color:var(--fund-fg);border:var(--fund-border)}
/* ---- Main view bar (top center) ---- */
/* ---- Main view bar (top center) ---- */
.view-bar{
  position:fixed;top:10px;left:calc(190px + (100% - 190px)/2);transform:translateX(-50%);z-index:100;
  display:flex;flex-direction:column;align-items:center;gap:0;
  background:var(--bar-bg);backdrop-filter:blur(12px);
  border:1px solid var(--bar-border);border-radius:12px;padding:5px;
  box-shadow:0 4px 20px var(--bar-shadow);
  min-width:0;
}
.view-bar-main{display:flex;align-items:center;gap:3px}
.view-modes{display:flex;gap:2px;width:auto}
.view-modes .view-bar-btn{flex:0 0 auto;min-width:0;padding:7px 10px}
.view-bar-sort{display:flex;align-items:center;gap:2px;padding:4px 0 1px;border-top:1px solid var(--bar-sep);margin-top:4px;width:100%;justify-content:center}
.view-bar-sort-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.06em;color:var(--bar-text);opacity:0.5;margin-right:4px;white-space:nowrap}
.view-bar-btn{
  padding:7px 12px;border:none;border-radius:8px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.03em;line-height:1;
  color:var(--bar-text);background:none;transition:all .2s ease;white-space:nowrap;
  min-width:0;text-align:center;
}
.view-bar-btn:hover{color:var(--bar-text-h);background:var(--bar-pill)}
.view-bar-btn.active{color:var(--bar-text-a);background:rgba(255,255,255,0.1)}
.view-bar-sep{width:1px;height:22px;background:var(--bar-sep);margin:0 4px}
.zoom-ctrl{display:flex;align-items:center;gap:2px;margin-left:2px}
.zoom-btn{
  width:22px;height:22px;border:none;border-radius:5px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;line-height:1;
  color:var(--bar-text);background:none;transition:all .15s ease;
  display:flex;align-items:center;justify-content:center;
}
.zoom-btn:hover{color:var(--bar-text-h);background:var(--bar-pill)}
.zoom-range{
  width:64px;height:4px;-webkit-appearance:none;appearance:none;
  background:var(--bar-sep);border-radius:2px;outline:none;cursor:pointer;margin:0 1px;
}
.zoom-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--bar-text-a);cursor:pointer;border:none;
}
.zoom-note{font-family:'JetBrains Mono',monospace;font-size:7px;color:var(--bar-text);opacity:0.4;margin-left:3px;white-space:nowrap;line-height:1}
.legend-strip{display:flex;flex-direction:column;gap:3px;padding:10px 16px 8px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);opacity:0.7;border-bottom:1px solid var(--border)}
.sb-title{padding:12px 12px 10px;border-bottom:1px solid var(--border)}
.sb-title-main{font-family:'Fraunces',serif;font-size:22px;font-weight:500;letter-spacing:-0.01em;line-height:1;font-variation-settings:"opsz" 96;white-space:nowrap}
.sb-title-main em{font-style:italic;color:var(--muted);font-weight:400;margin-left:6px}
.sb-title-info{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;margin-top:6px;line-height:1.6}
.legend-strip span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend-strip i{display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sort-group{display:flex;align-items:center;gap:2px;background:var(--bar-pill);border-radius:7px;padding:2px;margin-left:4px;border:1px solid var(--bar-border)}
.sort-btn{padding:5px 10px;border:none;border-radius:5px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.04em;color:var(--bar-text);background:none;transition:all .15s ease;white-space:nowrap;line-height:1}
.sort-btn:hover{color:var(--bar-text-h)}
.sort-btn.active{color:var(--bar-text-a);background:var(--bar-pill-a)}
.sort-hl{color:var(--ink)!important;font-weight:500;text-shadow:none}
html.night .sort-hl{color:#fff!important;font-weight:500;text-shadow:none}
.cur-toggle{
  position:relative;display:flex;align-items:center;
  background:var(--bar-pill);border-radius:8px;padding:3px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;letter-spacing:0.02em;line-height:1;
  border:1px solid var(--bar-border);margin-left:6px;
}
.cur-toggle-label{
  position:relative;z-index:1;padding:5px 10px;color:var(--bar-text);transition:color .2s;
  user-select:none;cursor:pointer;white-space:nowrap;
}
.cur-toggle-label.active{color:var(--bar-text-a);font-weight:700}
.cur-toggle-pill{
  position:absolute;top:3px;height:calc(100% - 6px);width:calc(100%/3);border-radius:5px;
  background:rgba(255,255,255,0.1);
  transition:left .2s ease;
}
.cur-toggle-pill.cur-jpy{left:3px}
.cur-toggle-pill.cur-usd{left:calc(100%/3)}
.cur-toggle-pill.cur-ada{left:calc(200%/3 - 3px)}
.lang-toggle{
  position:relative;display:flex;align-items:center;
  background:var(--bar-pill);border-radius:8px;padding:3px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:0.04em;line-height:1;
  border:1px solid var(--bar-border);margin-left:2px;
}
.lang-toggle-label{
  position:relative;z-index:1;padding:5px 12px;color:var(--bar-text);transition:color .2s;user-select:none;
  min-width:36px;text-align:center;cursor:pointer;white-space:nowrap;
}
.lang-toggle-label.active{color:var(--bar-text-a);font-weight:700}
.lang-toggle-pill{
  position:absolute;top:3px;height:calc(100% - 6px);width:calc(100%/2);border-radius:5px;
  background:rgba(255,255,255,0.1);
  transition:left .2s ease;
}
.lang-toggle-pill.en{left:3px}
.lang-toggle-pill.jp{left:calc(50% - 3px)}

/* Nodes */
.node{
  position:absolute;left:0;top:0;
  pointer-events:auto;cursor:default;transition:opacity .25s ease;
}
.node.dim{opacity:0.32}
.node-card{
  background:var(--paper);border:1px solid var(--border);border-radius:6px;
  padding:10px 14px;width:280px;overflow:hidden;
  transition:background .2s,border-color .2s,box-shadow .2s,transform .2s;
  cursor:pointer;user-select:none;
}
.node-card:hover{border-color:var(--c);box-shadow:0 4px 16px -6px var(--card-shadow);transform:translateY(-1px)}
.node-card.expanded{box-shadow:inset 3px 0 0 var(--c)}

.row{display:flex;align-items:baseline;gap:8px;overflow:hidden;min-width:0}
.label{
  font-size:13px;font-weight:500;color:var(--ink);line-height:1.3;letter-spacing:-0.005em;
  flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.amount{
  font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
  color:var(--ink);font-feature-settings:"tnum";white-space:nowrap;flex-shrink:0;
}
.amount .unit{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.15em;margin-left:2px}
.toggle{
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.05em;
  border:1px solid var(--border);border-radius:3px;padding:1px 5px;line-height:1.3;
  transition:color .2s,border-color .2s;flex-shrink:0;
}
.node-card:hover .toggle{color:var(--c);border-color:var(--c)}
.cat-tag{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.04em;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;
}
.st-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}
.st-badge{
  font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.04em;
  padding:1px 5px;border-radius:2px;white-space:nowrap;
}
.st-complete{background:hsl(145 35% 92%);color:hsl(145 40% 35%);border:none}
.st-progress{background:hsl(40 40% 92%);color:hsl(40 50% 32%);border:none}
.st-dnf{background:hsl(0 35% 92%);color:hsl(0 40% 38%);border:none}
html.night .st-complete{background:hsl(145 35% 20%);color:hsl(145 55% 70%);border:none}
html.night .st-progress{background:hsl(40 40% 20%);color:hsl(40 60% 70%);border:none}
html.night .st-dnf{background:hsl(0 35% 20%);color:hsl(0 55% 70%);border:none}
.st-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.04em;color:var(--muted)}

/* Root pill */
.node.root .node-card{
  background:var(--ink);color:var(--bg);border-color:var(--ink);
  padding:10px 22px;border-radius:999px;text-align:center;width:220px;
}
.node.root .node-card:hover{transform:none;box-shadow:0 8px 24px -8px var(--card-shadow)}
.node.root .label{color:var(--bg);font-family:'Fraunces',serif;font-size:22px;letter-spacing:-0.01em;text-align:center;font-weight:500;white-space:normal}
.node.root .sub{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.25em;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:2px}
.root-stats{display:flex;justify-content:center;gap:8px;margin-top:3px;font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:0.04em}
.root-stats span{display:flex;align-items:center;gap:3px}
.root-stats i{display:inline-block;width:5px;height:5px;border-radius:50%}

/* L1 industry group */
.node.l1 .node-card{padding:10px 16px;width:480px;min-height:42px;height:auto;position:relative}
.node.l1 .row{flex-wrap:nowrap;white-space:nowrap;position:relative}
.node.l1 .label{font-family:'Fraunces',serif;font-size:15px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:100px;flex:1}
.node.l1 .sec-amt{font-family:'Inter',sans-serif;font-size:15px;font-weight:600;letter-spacing:-0.01em;font-feature-settings:"tnum";white-space:nowrap;position:absolute;left:240px}
.node.l1 .cat-tag{max-width:180px;overflow:hidden;text-overflow:ellipsis;position:absolute;right:40px;bottom:0}
.node.l1 .toggle{position:absolute;right:0;bottom:0}
/* 3-column proposer layout */
.l1-prop{display:grid;grid-template-columns:130px 140px 1fr;gap:0 8px;align-items:center}
.l1-col-left{grid-column:1;display:flex;flex-direction:column;gap:0;min-width:0;overflow:hidden;justify-content:center}
.l1-col-left .label{font-family:'Fraunces',serif;font-size:17px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1-top-right{position:absolute;top:5px;right:10px;font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:0.04em;color:var(--muted);opacity:0.6}
.l1-col-mid{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:center;align-self:center;gap:0}
.l1-col-mid .l1-mid-label{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:0.04em;color:var(--muted);text-transform:uppercase;display:grid;grid-template-columns:50px auto 50px;gap:0 2px}
.l1-col-mid .l1-mid-label .lbl-l{text-align:right}.l1-col-mid .l1-mid-label .lbl-r{text-align:left}
.l1-col-mid .l1-mid-val{font-family:'Inter',sans-serif;font-size:15px;font-weight:600;letter-spacing:-0.01em;font-feature-settings:"tnum";white-space:nowrap;display:grid;grid-template-columns:50px auto 50px;gap:0 2px;align-items:baseline}
.l1-col-mid .l1-mid-val .v-l{text-align:right}.l1-col-mid .l1-mid-val .v-sl{opacity:0.35;font-size:14px}.l1-col-mid .l1-mid-val .v-r{text-align:left}
.l1-col-mid-named{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:center;align-self:center;gap:0}
.l1-col-mid-named .l1-mid-label{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:0.06em;color:var(--muted)}
.l1-col-mid-named .l1-mid-val{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.l1-col-right{grid-column:3;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.02em;white-space:nowrap;display:flex;gap:10px;align-self:center;align-items:flex-start;justify-content:flex-end;padding-top:10px}
.l1-col-right .l1-r-cell{display:flex;flex-direction:column;gap:0;align-items:flex-end}
.l1-col-right .l1-r-title{color:var(--ink);opacity:0.9;font-size:6px;letter-spacing:0.04em;text-transform:uppercase;display:grid;grid-template-columns:30px auto 52px;gap:0 2px}
.l1-col-right .l1-r-title .lbl-l{text-align:right}.l1-col-right .l1-r-title .lbl-r{text-align:left}
.l1-col-right .l1-r-val{color:var(--muted);font-size:8px;display:grid;grid-template-columns:30px auto 52px;gap:0 2px}
.l1-col-right .l1-r-val .v-l{text-align:right}.l1-col-right .l1-r-val .v-sl{opacity:0.35}.l1-col-right .l1-r-val .v-r{text-align:left}
.l1-col-right .l1-r-cell2{display:flex;flex-direction:column;gap:0;align-items:flex-end}
.l1-col-right .l1-r-title2{color:var(--ink);opacity:0.9;font-size:7px;letter-spacing:0.06em;text-transform:uppercase}
.l1-col-right .l1-r-val2{color:var(--ink);opacity:0.7}
.node.l1 .mini-bar{height:3px;border-radius:2px;background:var(--dim);overflow:hidden;display:flex;margin-top:4px}
.node.l1 .mini-bar-seg{height:100%}

/* L2 proposals */
.node.l2 .node-card{padding:10px 14px;width:560px;min-height:44px;border-left:3px solid hsl(200 40% 45%)}
.node.l2.cls-co .node-card{border-left-color:hsl(270 50% 55%)}
.node.l2.cls-bridge .node-card{border-left-color:hsl(30 55% 55%)}
.node.l2 .label{font-size:13px;font-weight:400;letter-spacing:0}
.node.l2 .row{gap:6px}
.node.l2 .amount{white-space:nowrap}
.node.l2 .amt-sub{font-size:9px;color:var(--muted);margin-left:4px}
.amt-now{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);opacity:0.55;margin-left:4px;white-space:nowrap}
.role-pfx{font-size:10px;color:var(--muted);opacity:0.7;font-weight:400;letter-spacing:0.02em}
.role-tag{
  font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.04em;
  padding:1px 5px;border-radius:2px;white-space:nowrap;
}
.role-proposer{background:hsl(200 35% 92%);color:hsl(200 45% 35%);border:none}
.role-co{background:hsl(260 30% 93%);color:hsl(260 35% 38%);border:none}
.role-advisor{background:hsl(40 40% 92%);color:hsl(40 50% 32%);border:none}
.role-marketing{background:hsl(330 30% 93%);color:hsl(330 40% 38%);border:none}
.role-dev{background:hsl(150 30% 92%);color:hsl(150 40% 32%);border:none}
.role-ops{background:hsl(20 30% 92%);color:hsl(20 40% 32%);border:none}
html.night .role-proposer{background:hsl(200 40% 25%);color:hsl(200 60% 80%);border:none}
html.night .role-co{background:hsl(260 30% 25%);color:hsl(260 50% 80%);border:none}
html.night .role-advisor{background:hsl(40 40% 25%);color:hsl(40 60% 80%);border:none}
html.night .role-marketing{background:hsl(330 35% 25%);color:hsl(330 55% 80%);border:none}
html.night .role-dev{background:hsl(150 35% 25%);color:hsl(150 55% 80%);border:none}
html.night .role-ops{background:hsl(20 35% 25%);color:hsl(20 55% 80%);border:none}
.cls-tag{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.06em;padding:1px 5px;border-radius:2px;white-space:nowrap}
.cls-co{background:hsl(270 30% 93%);color:hsl(270 35% 38%);border:none}
.cls-bridge{background:hsl(30 30% 92%);color:hsl(30 40% 32%);border:none}
html.night .cls-co{background:hsl(270 30% 22%);color:hsl(270 50% 75%);border:none}
html.night .cls-bridge{background:hsl(30 35% 22%);color:hsl(30 55% 75%);border:none}

/* Link icons (tree view) */
.lk-row{display:inline-flex;gap:1px;margin-left:auto;flex-shrink:0;vertical-align:middle}
.lk-icon{
  display:inline-grid;place-items:center;width:18px;height:18px;border-radius:3px;
  font-size:9px;cursor:pointer;color:var(--muted);transition:all .15s;
  border:1px solid transparent;user-select:none;
}
.lk-icon:hover{
  background:color-mix(in srgb,var(--accent) 15%,var(--paper));
  border-color:color-mix(in srgb,var(--accent) 30%,var(--border));
  color:var(--ink);
}
.lk-cr{font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;letter-spacing:-0.02em}

/* Sector view (drill-down) */
.sector-view{
  position:absolute;top:0;left:0;right:0;bottom:0;z-index:55;background:var(--bg);color:var(--ink);
  overflow-y:auto;overflow-x:hidden;display:none;padding:32px 40px 80px;
}
.sector-view.open{display:block}
.sv-head{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.sv-back{
  background:var(--paper);border:1px solid var(--border);border-radius:6px;
  color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:11px;
  padding:6px 14px;cursor:pointer;letter-spacing:0.1em;
}
.sv-back:hover{background:var(--dim)}
.sv-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.sv-title{font-family:'Fraunces',serif;font-size:26px;font-weight:500;letter-spacing:-0.01em;font-variation-settings:"opsz" 96}
.sv-stats{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.1em;margin-left:auto}

.sv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;margin-top:16px}
.sv-card{
  background:var(--paper);border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;cursor:default;transition:border-color 0.15s,box-shadow 0.15s;
  display:flex;flex-direction:column;gap:6px;user-select:none;
}
.sv-card:hover{border-color:var(--border-h);box-shadow:0 2px 8px -2px var(--card-shadow)}
.sv-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sv-card-label{font-size:13px;font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-card-tag{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.06em;
  padding:2px 8px;border-radius:3px;background:var(--dim);color:var(--muted);white-space:nowrap;
}
.sv-card-amt{font-family:'Inter',sans-serif;font-size:15px;font-weight:600;font-feature-settings:"tnum"}
.sv-card-ch{font-size:11px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.disc-bar{
  position:fixed;bottom:0;left:180px;right:0;z-index:90;
  background:var(--bg);border-top:1px solid var(--border);
  padding:5px 24px;display:flex;align-items:center;gap:16px;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.03em;
  color:var(--ink);line-height:1.5;
}
.disc-text{flex:1;min-width:0;opacity:0.45}
.disc-refs{flex-shrink:0;display:flex;align-items:center;gap:6px;opacity:0.75}
.disc-refs .ref-links a{font-size:8px;padding:2px 6px 2px 4px}
.disc-refs .ref-links a img{width:12px;height:12px}

/* Timeline view */
.tl-wrap{
  position:absolute;top:0;left:180px;right:0;bottom:0;overflow:hidden;background:var(--bg);z-index:40;
  display:none;cursor:grab;
}
.tl-wrap.open{display:block}
.tl-wrap.grabbing{cursor:grabbing}
.tl-layer{transform-origin:0 0;padding:80px 24px 40px}
.tl-scroll{overflow:auto;max-height:calc(100vh - 140px);border-radius:4px}
.tl-scroll::-webkit-scrollbar{width:6px;height:6px}
.tl-scroll::-webkit-scrollbar-track{background:transparent}
.tl-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tl-scroll::-webkit-scrollbar-corner{background:transparent}
.tl-wrap.grabbing{cursor:grabbing}
.tl-grid{
  display:grid;gap:0;border-left:1px solid var(--border);
  font-family:'JetBrains Mono',monospace;font-size:10px;
}
.tl-hdr{
  position:sticky;top:0;z-index:3;background:var(--bg);
  font-size:11px;letter-spacing:0.12em;font-weight:500;color:var(--ink);
  text-align:center;padding:10px 4px;border-bottom:2px solid var(--border);border-right:1px solid var(--border);
}
.tl-hdr-name{text-align:left;padding-left:12px;min-width:120px}
.tl-row-name{
  position:sticky;left:0;z-index:2;background:var(--paper);
  font-size:10px;letter-spacing:0.04em;color:var(--ink);font-weight:500;
  padding:6px 10px;border-bottom:1px solid var(--dim);border-right:1px solid var(--border);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px;cursor:pointer;
}
.tl-row-name:hover{background:var(--dim)}
.tl-row-name .tl-cnt{
  font-size:8px;color:var(--muted);margin-left:auto;
}
.tl-cell{
  border-bottom:1px solid var(--dim);border-right:1px solid var(--dim);
  padding:3px 4px;min-height:32px;display:flex;flex-direction:column;gap:2px;align-items:stretch;
}
.tl-cell:nth-child(even){background:var(--dim)}
.tl-pip{
  background:var(--paper);border:1px solid var(--border);border-radius:4px;
  padding:3px 6px;font-size:9px;line-height:1.3;cursor:default;
  transition:border-color .15s,box-shadow .15s;overflow:hidden;
  display:flex;flex-direction:column;gap:2px;
}
.tl-pip:hover{border-color:var(--border-h);box-shadow:0 2px 6px -2px var(--card-shadow)}
.tl-pip-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;color:var(--ink)}
.tl-pip-meta{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tl-pip-amt{font-family:'Inter',sans-serif;font-size:10px;font-weight:500;color:var(--ink);white-space:nowrap;font-feature-settings:"tnum"}

/* ═══════ Network View ═══════ */
.nw-wrap{
  position:absolute;top:0;left:180px;right:0;bottom:0;overflow:hidden;z-index:40;
  display:none;
}
.nw-wrap.open{display:grid;grid-template-columns:1fr 340px}

/* ── Stage ── */
.nw-stage{
  position:relative;overflow:hidden;min-width:0;
  background:
    radial-gradient(1000px 650px at 50% 42%,color-mix(in oklab,var(--accent,#6BA6FF) 6%,transparent),transparent 72%),
    var(--bg);
}
.nw-stage::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,var(--border) 0.8px,transparent 0.8px);
  background-size:26px 26px;opacity:0.25;pointer-events:none;
  mask-image:radial-gradient(ellipse 65% 55% at 50% 48%,black 40%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 65% 55% at 50% 48%,black 40%,transparent 100%);
}
.nw-svg-wrap{position:absolute;inset:0;z-index:1}
.nw-svg-wrap svg{width:100%;height:100%;display:block}

/* ── Edges ── */
.nw-edge{
  stroke-width:1.2;opacity:0.30;
  stroke:color-mix(in oklab,var(--ink) 30%,var(--border));
  transition:stroke .25s ease,stroke-width .25s ease,opacity .25s ease;
}
.nw-edge.hi{
  stroke:var(--hi-c,var(--accent,#6BA6FF));stroke-width:2.6;opacity:0.88;
  filter:drop-shadow(0 0 4px var(--hi-c,var(--accent,#6BA6FF)));
}
.nw-edge.dim{opacity:0.04}
.nw-edge-lbl{
  fill:var(--muted);font-size:8.5px;text-anchor:middle;dominant-baseline:middle;
  pointer-events:auto;cursor:pointer;font-family:'JetBrains Mono',monospace;

<script>

   ================================================================ */
var COL=520, ROW=52, GAP=3, DUR=350;

/* ---- Night mode ---- */
var NIGHT=(function(){
  if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches) return true;
  var cs=window.getComputedStyle(document.documentElement);
  var bg=cs.backgroundColor||'';
  var m=bg.match(/\d+/g);
  if(m&&m.length>=3){var lum=(parseInt(m[0])*299+parseInt(m[1])*587+parseInt(m[2])*114)/1000;if(lum<50)return true}
  return false;
})();
if(NIGHT)document.documentElement.classList.add('night');

/* ---- Helpers ---- */
var ADA_USD=0.75, USD_JPY=150;
var _amtMode='ada'; /* 'auto'=follow _lang | 'jpy' | 'usd' | 'ada' */
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
function trunc(s,m){if(!s)return'';s=s.replace(/\s+/g,' ').trim();return s.length>m?s.slice(0,m-1)+'…':s}
function hsl(h){return 'hsl('+h+' 50% '+(NIGHT?'58':'44')+'%)'}
function _curMode(){return _amtMode==='auto'?(_lang==='en'?'usd':'jpy'):_amtMode}
function fmtAmt(v,u){
  if(u==='ada'){
    if(v>=1000) return (v/1000).toFixed(1)+'M ₳';
    return v+'K ₳';
  }
  if(v>=1000) return '$'+(v/1000).toFixed(v%1000?1:0)+'M';
  if(v<1) return '$'+Math.round(v*1000);
  return '$'+v+'K';
}
function fmtJpy(usdK){
  var mode=_curMode();
  if(mode==='ada'){
    var ada=usdK/ADA_USD;
    if(ada>=1e3) return (ada/1e3).toFixed(1)+'M ₳';
    if(ada>=1) return Math.round(ada)+'K ₳';
    return Math.round(ada*1e3)+' ₳';
  }
  if(mode==='usd'){
    if(usdK>=1000) return '$'+(usdK/1000).toFixed(1)+'M';
    if(usdK>=1) return '$'+Math.round(usdK)+'K';
    return '$'+(usdK*1000).toFixed(0);
  }
  var jpy=usdK*1000*USD_JPY;
  if(jpy>=1e8) return '¥'+(jpy/1e8).toFixed(1)+'億';
  if(jpy>=1e4) return '¥'+Math.round(jpy/1e4)+'万';
  return '¥'+Math.round(jpy);
}
function fmtDual(v,u,adaP){
  var ap=adaP||ADA_USD;

function _buildLensContext(p,question){
  var teamStr='';
  if(p.team){for(var i=0;i<p.team.length;i++){teamStr+='\n  '+p.team[i].name+' ('+p.team[i].role+')';}}
  var msg='【'+pLabel(p)+'】\n提案者: '+(p.by||'不明')+'\n'
    +(teamStr?'チーム:'+teamStr+'\n':'')
    +'Fund: '+(p.fund||'?')+' / 金額: '+fmtPlain(p.amt,p.u,p.adaPrice)+' / 状態: '+stLabel(p.st)+'\n'
    +'チャレンジ: '+(p.ch||'');
  if(_ctDetailApi){
    msg+='\n\n--- Catalyst Explorer ---\n'
      +'課題: '+(_ctDetailApi.problem||'N/A')+'\n'
      +'解決策: '+(_ctDetailApi.solution||'N/A')+'\n'
      +(_ctDetailApi.content?'詳細: '+_ctDetailApi.content.substring(0,800)+'\n':'');
  }
  msg+='\n\n'+question;
  return msg;
}

function sendToLens(p,question){
  var msg=_buildLensContext(p,question);
  _lensAppend('user',question);

  var keys={};
  try{keys=JSON.parse(localStorage.getItem('catalyst_apikeys')||'{}');}catch(e){}
  var providers=['claude','grok','gemini','groq','openrouter'];

  var log=document.getElementById('ct-lens-log');
  var loadDiv=document.createElement('div');
  loadDiv.className='ct-lens-thinking';
  loadDiv.textContent='考え中...';
  if(log)log.appendChild(loadDiv);

  (function tryProvider(idx){
    if(idx>=providers.length){
      if(loadDiv.parentNode)loadDiv.remove();
      _lensAppend('error','API キー未設定です。右上の ⚙ から設定してください。');
      return;
    }
    var pName=providers[idx],key=keys[pName];
    if(!key){tryProvider(idx+1);return;}

    var url,headers={},body;

    switch(pName){
      case 'claude':
        tryProvider(idx+1);return;
      case 'grok':
        url='https://api.x.ai/v1/chat/completions';
        headers={'Content-Type':'application/json','Authorization':'Bearer '+key};
        body=JSON.stringify({model:'grok-3-mini',messages:[{role:'user',content:msg}],max_tokens:2048});
        break;
      case 'gemini':
        url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+key;
        headers={'Content-Type':'application/json'};
        body=JSON.stringify({contents:[{parts:[{text:msg}]}]});
        break;
      case 'groq':
        url='https://api.groq.com/openai/v1/chat/completions';
        headers={'Content-Type':'application/json','Authorization':'Bearer '+key};
        body=JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:msg}],max_tokens:2048});
        break;
      case 'openrouter':
        url='https://openrouter.ai/api/v1/chat/completions';
        headers={'Content-Type':'application/json','Authorization':'Bearer '+key};
        body=JSON.stringify({model:'meta-llama/llama-3.3-70b-instruct',messages:[{role:'user',content:msg}],max_tokens:2048});
        break;
      default:tryProvider(idx+1);return;
    }

    fetch(url,{method:'POST',headers:headers,body:body})
    .then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(data){
      if(loadDiv.parentNode)loadDiv.remove();
      var text='';
      if(pName==='gemini'){
        text=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]?data.candidates[0].content.parts[0].text:'No response';
      }else{
        text=data.choices&&data.choices[0]&&data.choices[0].message?data.choices[0].message.content:'No response';
      }
      _lensAppend('ai','['+pName.toUpperCase()+']\n'+text);
    })
    .catch(function(err){
      var es=String(err);
      if(es.indexOf('429')>=0){tryProvider(idx+1);return;}
      if(loadDiv.parentNode)loadDiv.remove();
      _lensAppend('error',pName+': '+es);
    });
  })(0);
}

/* mainUsdK/mainAda = cls:'main' の直接提案のみ
   allUsdK/allAda   = 全関与(メイン+共同+仲介+チーム参加) */
var PROPOSER_STATS=(function(){
  function init(){return{mainCount:0,mainUsdK:0,mainAda:0,coCount:0,coUsdK:0,coAda:0,teamCount:0,teamUsdK:0,teamAda:0,namedFor:{}};}
  var map={},unkCount=0,unkUsd=0;
  for(var i=0;i<INDUSTRIES.length;i++){
    for(var j=0;j<INDUSTRIES[i].children.length;j++){
      var p=INDUSTRIES[i].children[j];
      var uK=p.u==='ada'?p.amt*p.adaPrice:p.amt;
      var ada=p.u==='ada'?p.amt:p.amt/p.adaPrice;
      if(p.by){
        if(!map[p.by])map[p.by]=init();
        if(p.cls==='main'){
          map[p.by].mainCount++;map[p.by].mainUsdK+=uK;map[p.by].mainAda+=ada;
        }else{
          map[p.by].coCount++;map[p.by].coUsdK+=uK;map[p.by].coAda+=ada;
        }
      } else {
        unkCount++;unkUsd+=uK;
      }
      if(p.team){
        var owner=p.by||'unknown';
        for(var t=0;t<p.team.length;t++){
          var tn=p.team[t].name;
          var tRole=p.team[t].role;
          if(!map[tn])map[tn]=init();
          if(tRole==='共同提案'){
            map[tn].coCount++;map[tn].coUsdK+=uK;map[tn].coAda+=ada;
          } else {
            map[tn].teamCount++;map[tn].teamUsdK+=uK;map[tn].teamAda+=ada;
            if(!map[tn].namedFor[owner]) map[tn].namedFor[owner]=0;
            map[tn].namedFor[owner]++;
          }
        }
      }
    }
  }
  var arr=[];
  for(var k in map){
    var m=map[k];
    var allCount=m.mainCount+m.coCount+m.teamCount;
    var allUsdK=m.mainUsdK+m.coUsdK+m.teamUsdK;
    var allAda=m.mainAda+m.coAda+m.teamAda;
    arr.push({name:k,
      mainCount:m.mainCount,mainUsdK:m.mainUsdK,mainAda:m.mainAda,
      coCount:m.coCount,coUsdK:m.coUsdK,coAda:m.coAda,
      teamCount:m.teamCount,teamUsdK:m.teamUsdK,teamAda:m.teamAda,
      namedFor:m.namedFor,
      count:m.mainCount+m.coCount,usdK:m.mainUsdK+m.coUsdK,
      allCount:allCount,allUsdK:allUsdK,allAda:allAda});
  }
  arr.sort(function(a,b){return b.allCount-a.allCount});
  if(unkCount) arr.push({name:'未確認',mainCount:unkCount,mainUsdK:unkUsd,mainAda:0,coCount:0,coUsdK:0,coAda:0,teamCount:0,teamUsdK:0,teamAda:0,count:unkCount,usdK:unkUsd,allCount:unkCount,allUsdK:unkUsd,allAda:0,unknown:true});
  return arr;
})();

function sumUsdK(kids){
  var s=0;for(var i=0;i<kids.length;i++){var c=kids[i];s+=c.u==='ada'?c.amt*(c.adaPrice||ADA_USD):c.amt;}return s;
}
function fmtTotal(usdK){
  return fmtJpy(usdK);
}

function buildTreeBySector(){
  var active=filterSec?INDUSTRIES.filter(function(d){return d.id===filterSec}):INDUSTRIES;
  var rootKids=[];
  for(var k=0;k<active.length;k++){
    var ind=active[k];
    var propKids=[];
    for(var j=0;j<ind.children.length;j++){
      var p=ind.children[j];
      if(filterBy&&p.by!==filterBy) continue;
      propKids.push({id:p.id,label:pLabel(p),amt:p.amt,u:p.u,st:p.st,ch:p.ch,by:p.by,role:p.role,fund:p.fund,adaPrice:p.adaPrice,team:p.team,cls:p.cls,hue:ind.hue,children:[]});
    }
    if(filterBy&&propKids.length===0) continue;
    var ok=0,wip=0,dnf=0;
    for(var m=0;m<propKids.length;m++){var s=propKids[m].st;if(s==='complete')ok++;else if(s==='progress')wip++;else dnf++;}
    rootKids.push({id:ind.id,label:secName(ind),amt:0,hue:ind.hue,children:propKids,_ok:ok,_wip:wip,_dnf:dnf,_total:propKids.length,_usdK:sumUsdK(propKids)});
  }
  var rootLabel='Catalyst Japan', rootSub=TOTAL_FUNDED+' / '+fmtTotal(TOTAL_USD_K);
  if(filterBy){
    var allKids=[];for(var i=0;i<rootKids.length;i++)allKids=allKids.concat(rootKids[i].children);
    rootLabel=filterBy; rootSub=allKids.length+' / '+fmtTotal(sumUsdK(allKids));
  }
  return {id:'root',label:rootLabel,sub:rootSub,children:rootKids};
}

function buildTreeByProposer(){
  var rootKids=[];
  /* sort PROPOSER_STATS by current sortMode */
  var sortedPS=PROPOSER_STATS.slice().sort(function(a,b){
    if(a.unknown) return 1;if(b.unknown) return -1;
    if(sortMode==='solo') return b.mainUsdK-a.mainUsdK||b.allCount-a.allCount;
    if(sortMode==='co') return b.coUsdK-a.coUsdK||b.allCount-a.allCount;
    if(sortMode==='named') return b.teamUsdK-a.teamUsdK||b.allCount-a.allCount;
    if(sortMode==='total') return b.allUsdK-a.allUsdK||b.allCount-a.allCount;
    if(sortMode==='count') return b.allCount-a.allCount;
    return b.allCount-a.allCount;
  });
  var hueStep=Math.floor(360/sortedPS.length);
  for(var pi=0;pi<sortedPS.length;pi++){
    var ps=sortedPS[pi];
    if(filterBy&&ps.name!==filterBy) continue;
    var propKids=[],seen={};
    for(var i=0;i<INDUSTRIES.length;i++){
      for(var j=0;j<INDUSTRIES[i].children.length;j++){
        var p=INDUSTRIES[i].children[j];
        if(ps.unknown?!p.by:p.by===ps.name){
          seen[p.id]=true;
          propKids.push({id:p.id,label:pLabel(p),amt:p.amt,u:p.u,st:p.st,ch:p.ch,by:p.by,role:p.role,
            fund:p.fund,adaPrice:p.adaPrice,team:p.team,cls:p.cls,sector:secName(INDUSTRIES[i]),hue:pi*hueStep,children:[]});
        }
      }
    }
    /* チーム参加の提案も追加 */
    if(!ps.unknown){
      for(var i=0;i<INDUSTRIES.length;i++){
        for(var j=0;j<INDUSTRIES[i].children.length;j++){
          var p=INDUSTRIES[i].children[j];
          if(seen[p.id]||!p.team) continue;
          for(var t=0;t<p.team.length;t++){
            if(p.team[t].name===ps.name){
              seen[p.id]=true;
              propKids.push({id:p.id+'-t',label:pLabel(p),amt:p.amt,u:p.u,st:p.st,ch:p.ch,by:p.by,
                role:p.team[t].role,fund:p.fund,adaPrice:p.adaPrice,team:p.team,cls:p.cls,
                sector:secName(INDUSTRIES[i]),hue:pi*hueStep,children:[],_teamRole:p.team[t].role});
              break;
            }
          }
        }
      }
    }
    var ok=0,wip=0,dnf=0;
    for(var m=0;m<propKids.length;m++){var s=propKids[m].st;if(s==='complete')ok++;else if(s==='progress')wip++;else dnf++;}
    var personUsd=sumUsdK(propKids);
    rootKids.push({id:'by-'+pi,label:ps.name,amt:personUsd,hue:pi*hueStep,children:propKids,
      _ok:ok,_wip:wip,_dnf:dnf,_total:propKids.length,_usdK:personUsd,
      _mainUsdK:ps.mainUsdK,_coUsdK:ps.coUsdK,_teamCount:ps.teamCount,_teamUsdK:ps.teamUsdK,_namedFor:ps.namedFor,_allUsdK:ps.allUsdK});
  }
  var rootLabel='Catalyst Japan', rootSub=TOTAL_FUNDED+' / '+fmtTotal(TOTAL_USD_K);
  if(filterBy){
    var allKids=[];for(var i=0;i<rootKids.length;i++)allKids=allKids.concat(rootKids[i].children);
    rootLabel=filterBy; rootSub=allKids.length+' / '+fmtTotal(sumUsdK(allKids));
  }
  return {id:'root',label:rootLabel,sub:rootSub,children:rootKids};
}

function buildTree(){
  return viewMode==='proposer'?buildTreeByProposer():buildTreeBySector();
}

/* ================================================================
   FLATTEN + LAYOUT
   ================================================================ */
function flatTree(root){
  var list=[],byId={};
  function walk(n,par,depth,bh){
    var h=(depth>=1&&n.hue!=null)?n.hue:(bh!=null?bh:null);
    var nd={id:n.id,label:n.label,raw:n,depth:depth,parent:par?par.id:null,hue:h,
      hasKids:!!(n.children&&n.children.length),expanded:vis.has(n.id)||(filterBy&&depth<=1),_ch:[]};
    if(par)par._ch.push(nd);
    byId[nd.id]=nd;list.push(nd);
    if(nd.hasKids&&nd.expanded){
      for(var i=0;i<n.children.length;i++)walk(n.children[i],nd,depth+1,h);
    }
  }
  walk(root,null,0,null);
  return{list:list,byId:byId};
}

function doLayout(root){
  var ft=flatTree(root);
  var list=ft.list;
  var lay={};
  var yOff=0;
  function place(n){
    var x=n.depth*COL;
    var w=n.depth===0?220:n.depth===1?480:560;
    var h=n.depth===0?80:n.depth===1?(viewMode==='proposer'?67:52):50;
    var y=yOff;
    lay[n.id]={id:n.id,x:x,y:y,w:w,h:h,depth:n.depth,hue:n.hue,parent:n.parent,hasKids:n.hasKids,expanded:n.expanded,raw:n.raw,label:n.label};
    yOff+=h+GAP;
    if(n.expanded){
      for(var i=0;i<n._ch.length;i++) place(n._ch[i]);
    }
  }
  place(list[0]);
  return lay;
}

            +'<span class="l1-r-val"><span class="v-l">'+nVal+'</span><span class="v-sl">/</span><span class="v-r">'+nkVal+'</span></span></div>'
            +'<div class="l1-r-cell2"><span class="l1-r-title2">'+(_lang==='en'?'Total Related':'総合関連額')+'</span><span class="l1-r-val2">'+tVal+'</span></div></div>';
        }
        l1Body=colTop+'<div class="l1-prop">'+colL+colM+colR+'</div>'+miniBar;
      } else {
        var secAmt=raw._usdK>0?'<span class="sec-amt">'+fmtJpy(raw._usdK)+'</span>':'';
        l1Body='<div class="row"><div class="label">'+esc(n.label)+'</div>'
          +secAmt
          +'<span class="cat-tag">'+raw._total+' proposals</span>'
          +'<span class="toggle">'+(n.expanded?'−':'+'+raw._total)+'</span></div>'
          +miniBar;
      }
      card.innerHTML=l1Body;
    } else {
      var p=n.raw;
      var ctxTag='';
      if(viewMode==='proposer'&&p.sector){
        ctxTag='<span class="cat-tag" style="color:var(--ink);border:1px solid var(--border)">'+esc(trunc(p.sector,20))+'</span>';
      } else if(p.by){
        ctxTag='<span class="cat-tag" style="color:var(--ink);border:1px solid var(--border)">'+esc(p.by)+'</span>';
      }
      var myRole=p._teamRole||p.role;
      var rTag=myRole&&myRole!=='提案者'&&myRole!=='仲介'?roleTag(myRole):'';
      var fTag=p.fund?'<span class="cat-tag fund-tag">F'+p.fund+'</span>':'';
      var teamTags='';
      if(p.team&&!p._teamRole){for(var ti=0;ti<p.team.length;ti++){
        teamTags+='<span class="role-tag '+roleClass(p.team[ti].role)+'">'+esc(p.team[ti].name)+'</span>';
      }}
      var lkIcons='';
      if(p.url)lkIcons+='<span class="lk-icon" title="Project" data-href="'+esc(p.url)+'">↗</span>';
      if(p.x)lkIcons+='<span class="lk-icon" title="X" data-href="'+esc(p.x)+'">𝕏</span>';
      if(p.yt)lkIcons+='<span class="lk-icon" title="YouTube" data-href="'+esc(p.yt)+'">▶</span>';
      if(p.report)lkIcons+='<span class="lk-icon lk-cr" title="'+T('completionReport')+'" data-report="'+esc(p.id)+'">CR</span>';
      var lblPrefix=(viewMode==='proposer'&&myRole&&myRole!=='提案者')?(roleName(myRole)+' → '):'';
      card.innerHTML='<div class="row"><span class="st-dot" style="background:'+stColor(p.st)+'"></span>'
        +'<div class="label">'+(lblPrefix?'<span class="role-pfx">'+esc(lblPrefix)+'</span>':'')+esc(n.label)+'</div>'
        +(lkIcons?'<span class="lk-row">'+lkIcons+'</span>':'')
        +'<span class="amount">'+fmtDual(p.amt,p.u,p.adaPrice)+'</span></div>'
        +'<div class="row">'+stBadge(p.st)
        +clsTag(p.cls)+fTag+ctxTag+rTag+teamTags
        +'<span class="cat-tag">'+esc(trunc(p.ch,28))+'</span></div>';
    }

    card.onclick=(function(nid,depth,raw){return function(e){
      e.stopPropagation();
      var lki=e.target.closest('.lk-icon');
      if(lki){
        var href=lki.getAttribute('data-href');
        var reportId=lki.getAttribute('data-report');
        if(href){
          if(href){window.open(href,'_blank');}
        }else if(reportId&&raw){
          var crUrl='https://catalystexplorer.com/proposals?search='+encodeURIComponent(raw.label);
          window.open(crUrl,'_blank');
        }
        return;
      }
      if(depth===0||depth===1){
        if(vis.has(nid))vis.delete(nid);else vis.add(nid);
        render();
      } else if(depth===2&&raw){
        openInLens(raw);
      }
    }})(n.id,n.depth,n.depth===2?n.raw:null);

    el.appendChild(card);
    layer.appendChild(el);

    /* draw line to parent */
    if(n.parent&&lay[n.parent]){
      var pn=lay[n.parent];
      var x1=pn.x+pn.w, y1=pn.y+pn.h/2;
      var x2=n.x, y2=n.y+n.h/2;
      var path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',pathD(x1,y1,x2,y2));
      path.setAttribute('fill','none');
      path.setAttribute('stroke',n.hue!=null?hsl(n.hue):'var(--border)');
      path.setAttribute('stroke-width','1.5');
      path.setAttribute('opacity','0.4');
      svg.appendChild(path);
    }
  }

  svg.setAttribute('width',maxX+200);
  svg.setAttribute('height',maxY+200);
  setTfm();
}

  function syncSlider(){

    else{pct=Math.round(zoom*100);}
    zoomSlider.value=String(pct);
    zoomSlider.title=pct+'%';
  }
  window._syncZoomSlider=syncSlider;
  function applyZoom(val){
    if(viewMode==='network'&&window._nwVB&&window._nwApplyVB){
      var ratio=100/val;
      var cx=window._nwVB.x+window._nwVB.w/2,cy=window._nwVB.y+window._nwVB.h/2;
      window._nwVB.w=1200*ratio;window._nwVB.h=800*ratio;
      window._nwVB.x=cx-window._nwVB.w/2;window._nwVB.y=cy-window._nwVB.h/2;
      window._nwApplyVB();
    }else{
      zoom=val/100;setTfm();
    }
    syncSlider();
  }
  zoomOut.onclick=function(e){e.stopPropagation();var cur=parseInt(zoomSlider.value);applyZoom(Math.max(20,cur-10));};
  zoomIn.onclick=function(e){e.stopPropagation();var cur=parseInt(zoomSlider.value);applyZoom(Math.min(300,cur+10));};
  zoomSlider.oninput=function(){applyZoom(parseInt(this.value));};
  zoomCtrl.appendChild(zoomOut);zoomCtrl.appendChild(zoomSlider);zoomCtrl.appendChild(zoomIn);zoomCtrl.appendChild(zoomNote);
  mainRow.appendChild(zoomCtrl);
  var gearBtn=document.createElement('button');

        card.innerHTML='<div class="s-name s-name-big">'+esc(dispName)+'</div>'
          +amtLine+tagLine
          +'<div class="s-row3"><span class="s-by-cnt'+_hCnt+'">'+ps.allCount+' proposals</span></div>';
        card.onclick=function(){

        };

      })(sorted[pi]);

  var totalLine='<b>'+fmtJpy(TOTAL_USD_K)+'</b> · <b>'+adaStr+'</b>';
  var avgStr=fmtJpy(AVG_USD_K);
  var maxStr=fmtJpy(_maxUsdK);
  hdr.innerHTML='<div class="meta"></div>';
  stage.appendChild(hdr);

/* sector view overlay */
  var sv=document.createElement('div');
  sv.className='sector-view';
  sv.id='sector-view';
  root.appendChild(sv);

  /* timeline view */
  var tlw=document.createElement('div');
  tlw.className='tl-wrap'+(viewMode==='timeline'?' open':'');
  tlw.id='tl-wrap';
  root.appendChild(tlw);

  /* network view */
  var nww=document.createElement('div');
  nww.className='nw-wrap'+(viewMode==='network'?' open':'');
  nww.id='nw-wrap';
  root.appendChild(nww);

  /* detail panel */
  var dp=document.createElement('div');dp.className='ct-detail';dp.id='ct-detail';
  dp.innerHTML='<button class="ct-detail-close" id="ct-d-close">✕</button>'
    +'<div class="ct-detail-head">'
    +'<div class="ct-d-entity"><span class="ct-d-dot" id="ct-d-dot"></span><span id="ct-d-ent"></span></div>'
    +'<div class="ct-d-title" id="ct-d-title"></div>'
    +'<div class="ct-d-amounts"><span class="ct-d-amt" id="ct-d-amt"></span><span class="ct-d-usd" id="ct-d-usd"></span></div>'
    +'<div class="ct-d-meta" id="ct-d-meta"></div>'
    +'</div>'
    +'<div class="ct-detail-body" id="ct-d-body"></div>'
    +'<div class="ct-lens-row">'
    +'<div class="ct-lens-header"><span class="ct-lens-logo">CIGNAL LENS</span></div>'
    +'<div class="ct-lens-presets" id="ct-lens-presets"></div>'
    +'<div class="ct-lens-log" id="ct-lens-log"></div>'
    +'<div class="ct-lens-input-row"><input class="ct-lens-input" id="ct-lens-input" placeholder="質問を入力..." /><button class="ct-lens-send" id="ct-lens-send">SEND</button></div>'
    +'</div>';
  root.appendChild(dp);
  document.getElementById('ct-d-close').onclick=function(){dp.classList.remove('open');_ctDetailProp=null;};
  document.getElementById('ct-lens-send').onclick=function(){
    var inp=document.getElementById('ct-lens-input');
    if(inp.value.trim()&&_ctDetailProp){sendToLens(_ctDetailProp,inp.value.trim());inp.value='';}
  };
  document.getElementById('ct-lens-input').addEventListener('keydown',function(e){
    if(e.key==='Enter'){document.getElementById('ct-lens-send').click();}
  });

  /* hide stage when timeline/network active */
  if(viewMode==='timeline'||viewMode==='network') stage.style.display='none';

  /* pan/zoom events */
  stage.addEventListener('pointerdown',ptrDown);
  stage.addEventListener('pointermove',ptrMove);
  stage.addEventListener('pointerup',ptrUp);
  stage.addEventListener('wheel',onWheel,{passive:false});
}

function buildSidebar(){
  var sb=document.querySelector('.sector-bar');
  if(!sb)return;
  var cards=sb.querySelectorAll('.s-card');
  var idx=0;
  for(var i=0;i<cards.length;i++){
    var el=cards[i];
    if(el.classList.contains('s-all')){
      el.classList.toggle('active',filterSec===null&&filterBy===null);
    } else {
      if(viewMode==='sector'){
        if(idx<INDUSTRIES.length) el.classList.toggle('active',filterSec===INDUSTRIES[idx].id);
      } else {
        if(idx<PROPOSER_STATS.length) el.classList.toggle('active',filterBy===PROPOSER_STATS[idx].name);
      }
      idx++;
    }
  }
}

    +'<span>'+(_lang==='en'?'Co = co-proposer (shared funding)':'共同 = 共同提案（資金共有）')+'</span>'

/* ================================================================
   PAN / ZOOM
   ================================================================ */
function ptrDown(e){
  if(e.target.closest('.node'))return;
  dragging=true;dragX=e.clientX;dragY=e.clientY;
  document.querySelector('.stage').classList.add('grabbing');
  e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId);
}
function ptrMove(e){
  if(!dragging)return;
  panX+=e.clientX-dragX;panY+=e.clientY-dragY;
  dragX=e.clientX;dragY=e.clientY;setTfm();
}
function ptrUp(e){
  dragging=false;
  var s=document.querySelector('.stage');
  if(s)s.classList.remove('grabbing');
}
function onWheel(e){
  e.preventDefault();
  var d=e.deltaY>0?-0.06:0.06;
  zoom=Math.max(0.2,Math.min(3,zoom+d));
  setTfm();
  if(window._syncZoomSlider)window._syncZoomSlider();
}
function setTfm(){
  var layer=document.querySelector('.layer');
  var svg=document.querySelector('.lines');
  var tlLayer=document.querySelector('.tl-layer');
  var tfm='translate('+panX+'px,'+panY+'px) scale('+zoom+')';
  if(layer)layer.style.transform=tfm;
  if(svg)svg.style.transform=tfm;
  if(tlLayer)tlLayer.style.transform=tfm;
}

/* ================================================================
   TIMELINE VIEW
   ================================================================ */
function renderTimeline(){
  var wrap=document.getElementById('tl-wrap');
  if(!wrap)return;
  wrap.innerHTML='';
  panX=0;panY=0;zoom=1;

  /* collect all funds used */
  var fundSet={};
  for(var i=0;i<INDUSTRIES.length;i++){
    for(var j=0;j<INDUSTRIES[i].children.length;j++){
      var f=INDUSTRIES[i].children[j].fund;
      if(f) fundSet[f]=true;
    }
  }
  var funds=Object.keys(fundSet).map(Number).sort(function(a,b){return a-b});

  /* build proposer→fund→proposals map */
  var sorted=PROPOSER_STATS.slice().sort(function(a,b){
    if(a.unknown) return 1;if(b.unknown) return -1;
    return b.count-a.count;
  });
  if(filterBy){
    sorted=sorted.filter(function(ps){return ps.name===filterBy});
  }

  var pMap=[];
  for(var pi=0;pi<sorted.length;pi++){
    var ps=sorted[pi];
    var byFund={};
    var total=0;
    for(var ii=0;ii<INDUSTRIES.length;ii++){
      for(var jj=0;jj<INDUSTRIES[ii].children.length;jj++){
        var p=INDUSTRIES[ii].children[jj];
        if(ps.unknown?!p.by:p.by===ps.name){
          if(!byFund[p.fund]) byFund[p.fund]=[];
          byFund[p.fund].push(p);
          total++;
        }
      }
    }
    /* find first and last fund for this proposer */
    var firstF=99,lastF=0;
    for(var fk in byFund){var fn=Number(fk);if(fn<firstF)firstF=fn;if(fn>lastF)lastF=fn;}
    pMap.push({name:ps.name,byFund:byFund,total:total,unknown:ps.unknown,first:firstF,last:lastF});
  }

  var cols=funds.length+1; /* +1 for name column */

  /* grid */
  var grid=document.createElement('div');
  grid.className='tl-grid';
  grid.style.gridTemplateColumns='140px repeat('+funds.length+',140px)';

  /* header row */
  var hdrName=document.createElement('div');
  hdrName.className='tl-hdr tl-hdr-name';
  hdrName.textContent=T('proposer');
  grid.appendChild(hdrName);
  for(var fi=0;fi<funds.length;fi++){
    var hdr=document.createElement('div');
    hdr.className='tl-hdr';
    hdr.textContent='F'+funds[fi];
    grid.appendChild(hdr);
  }

  /* rows */
  for(var ri=0;ri<pMap.length;ri++){
    var row=pMap[ri];
    var nameCell=document.createElement('div');
    nameCell.className='tl-row-name';
    nameCell.innerHTML=esc(row.name)+'<span class="tl-cnt">'+row.total+'</span>';
    (function(name){
      nameCell.onclick=function(){
        filterBy=(filterBy===name?null:name);
        viewMode='proposer';vis.clear();buildShell();render();centerView();
      };
    })(row.name);
    grid.appendChild(nameCell);

    for(var fi=0;fi<funds.length;fi++){
      var cell=document.createElement('div');
      cell.className='tl-cell';
      var proposals=row.byFund[funds[fi]];
      if(proposals){
        for(var pk=0;pk<proposals.length;pk++){
          var p=proposals[pk];
          var pip=document.createElement('div');
          pip.className='tl-pip';
          pip.style.borderLeft='3px solid '+stColor(p.st);
          pip.innerHTML='<div class="tl-pip-title">'+esc(trunc(pLabel(p),30))+'</div>'
            +'<div class="tl-pip-meta">'+stBadge(p.st)
            +'<span class="tl-pip-amt">'+fmtDual(p.amt,p.u,p.adaPrice)+'</span></div>';
          pip.title=pLabel(p)+'\n'+stLabel(p.st)+' · F'+p.fund+'\n'+(p.ch||'');
          pip.style.cursor='pointer';
          (function(pr){pip.onclick=function(e){e.stopPropagation();openInLens(pr)};})(p);
          cell.appendChild(pip);
        }
      }
      /* draw span indicator for first/last */
      if(!proposals&&funds[fi]>=row.first&&funds[fi]<=row.last){
        var dot=document.createElement('div');
        dot.style.cssText='height:1px;background:var(--border);margin:auto 0;opacity:0.4';
        cell.appendChild(dot);
      }
      grid.appendChild(cell);
    }
  }

  /* wrap grid in scroll container for sticky headers */
  var tlScroll=document.createElement('div');
  tlScroll.className='tl-scroll';
  tlScroll.appendChild(grid);

  var tlLayer=document.createElement('div');
  tlLayer.className='tl-layer';
  tlLayer.appendChild(tlScroll);
  wrap.appendChild(tlLayer);

  /* wheel inside scroll area = native scroll (not zoom) */
  tlScroll.addEventListener('wheel',function(e){e.stopPropagation();},{passive:true});

  /* drag = transform-based pan */
  wrap.addEventListener('wheel',onWheel,{passive:false});
  wrap.addEventListener('pointerdown',function(e){
    if(e.target.closest('.tl-pip'))return;
    dragging=true;dragX=e.clientX;dragY=e.clientY;
    wrap.classList.add('grabbing');
    e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove',function(e){
    if(!dragging)return;
    panX+=e.clientX-dragX;panY+=e.clientY-dragY;
    dragX=e.clientX;dragY=e.clientY;setTfm();
  });
  wrap.addEventListener('pointerup',function(){dragging=false;wrap.classList.remove('grabbing');});
}

/* ================================================================
   NETWORK VIEW
   ================================================================ */
function renderNetwork(){
  var wrap=document.getElementById('nw-wrap');
  if(!wrap)return;
  wrap.innerHTML='';

  /* ---- build graph data ---- */
  var ppl={},edg={};
  for(var i=0;i<INDUSTRIES.length;i++){
    var sec=INDUSTRIES[i];
    for(var j=0;j<sec.children.length;j++){
      var p=sec.children[j];
      var inv=[];
      if(p.by)inv.push({name:p.by,role:'提案者'});
      if(p.team)for(var t=0;t<p.team.length;t++)inv.push({name:p.team[t].name,role:p.team[t].role});
      for(var k=0;k<inv.length;k++){
        var nm=inv[k].name;
        if(!ppl[nm])ppl[nm]={name:nm,props:[],totalAda:0,totalUsd:0,soloUsdK:0,coUsdK:0,_sectors:{}};
        ppl[nm].props.push({id:p.id,label:pLabel(p),role:inv[k].role,fund:p.fund,st:p.st,amt:p.amt,u:p.u,adaPrice:p.adaPrice,ch:p.ch,by:p.by,team:p.team,cls:p.cls,url:p.url,x:p.x,yt:p.yt,report:p.report,_secId:sec.id,_secHue:sec.hue,_secJa:sec.ja});
        if(p.u==='ada')ppl[nm].totalAda+=p.amt;
        else ppl[nm].totalUsd+=p.amt;
        var _uK=p.u==='ada'?p.amt*p.adaPrice:p.amt;
        if(inv[k].role==='提案者'&&p.cls==='main')ppl[nm].soloUsdK+=_uK;
        else ppl[nm].coUsdK+=_uK;
        ppl[nm]._sectors[sec.id]=(ppl[nm]._sectors[sec.id]||0)+1;
      }
      if(inv.length>=2){
        for(var a=0;a<inv.length;a++){
          for(var b=a+1;b<inv.length;b++){
            var ns=[inv[a].name,inv[b].name].sort();
            var ek=ns[0]+'|'+ns[1];
            if(!edg[ek])edg[ek]={a:ns[0],b:ns[1],proposals:[]};
            edg[ek].proposals.push(p);
          }
        }
      }
    }
  }

  var edges=[];for(var ek in edg)edges.push(edg[ek]);
  var conn={};
  for(var ei=0;ei<edges.length;ei++){conn[edges[ei].a]=true;conn[edges[ei].b]=true;}

  var nodes=[];
  for(var pk in ppl)nodes.push(ppl[pk]);
  for(var ni=0;ni<nodes.length;ni++){
    var c=0;
    for(var ei=0;ei<edges.length;ei++){if(edges[ei].a===nodes[ni].name||edges[ei].b===nodes[ni].name)c++;}
    nodes[ni].edgeCnt=c;
    nodes[ni].connected=!!conn[nodes[ni].name];
  }
  nodes.sort(function(a,b){return b.props.length-a.props.length});

  if(nodes.length===0){
    wrap.innerHTML='<div style="padding:80px 40px;color:var(--muted);font-family:\'JetBrains Mono\',monospace;font-size:11px">'+T('noTeamData')+'</div>';
    return;
  }

  /* name→index mapping + adjacency */
  var nameIdx={};
  for(var ni=0;ni<nodes.length;ni++)nameIdx[nodes[ni].name]=ni;
  var adjSets=[];
  for(var ni=0;ni<nodes.length;ni++)adjSets.push(new Set());
  for(var ei=0;ei<edges.length;ei++){
    var ai=nameIdx[edges[ei].a],bi=nameIdx[edges[ei].b];
    if(ai!=null&&bi!=null){adjSets[ai].add(bi);adjSets[bi].add(ai);}
  }

  /* primary sector → hue per person */
  var secIdx={};
  for(var si=0;si<INDUSTRIES.length;si++)secIdx[INDUSTRIES[si].id]={hue:INDUSTRIES[si].hue,ja:INDUSTRIES[si].ja,label:INDUSTRIES[si].label};
  var sectorCounts={};
  for(var ni=0;ni<nodes.length;ni++){
    var best=null,bestCnt=0;
    for(var sk in nodes[ni]._sectors){
      if(nodes[ni]._sectors[sk]>bestCnt){bestCnt=nodes[ni]._sectors[sk];best=sk;}
    }
    nodes[ni].sector=best;
    nodes[ni].hue=best&&secIdx[best]?secIdx[best].hue:0;
    nodes[ni].radius=18+Math.min(nodes[ni].props.length*3,28);
    if(best){sectorCounts[best]=(sectorCounts[best]||0)+1;}
  }

  /* ---- SVG viewBox layout ---- */
  var VW=1200,VH=800;
  var vcx=VW/2,vcy=VH/2;

  /* ALL nodes get positions (connected + solo) */
  var allIdx=[];
  for(var ni=0;ni<nodes.length;ni++)allIdx.push(ni);

  var pos=[];
  /* initial: circle layout for all */
  var initR=Math.min(VW,VH)*0.35;
  for(var ni=0;ni<nodes.length;ni++){
    var angle=(2*Math.PI*ni/nodes.length)-Math.PI/2;
    pos[ni]={x:vcx+Math.cos(angle)*initR,y:vcy+Math.sin(angle)*initR};
  }

  /* force simulation — all nodes participate */
  var SIM_ITER=600,linkDist=200,linkStr=0.04,charge=-2500,centerStr=0.006,collidePad=30;
  for(var it=0;it<SIM_ITER;it++){
    var alpha=1-it/SIM_ITER;
    /* link attraction */
    for(var ei=0;ei<edges.length;ei++){
      var ai=nameIdx[edges[ei].a],bi=nameIdx[edges[ei].b];
      if(ai==null||bi==null)continue;
      var dx=pos[bi].x-pos[ai].x,dy=pos[bi].y-pos[ai].y;
      var dist=Math.sqrt(dx*dx+dy*dy)||0.01;
      var f=(dist-linkDist)*linkStr*alpha;
      var fx=(dx/dist)*f,fy=(dy/dist)*f;
      pos[ai].x+=fx;pos[ai].y+=fy;
      pos[bi].x-=fx;pos[bi].y-=fy;
    }
    /* charge repulsion — all nodes */
    for(var a=0;a<nodes.length;a++){
      for(var b=a+1;b<nodes.length;b++){
        var dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;
        var d2=dx*dx+dy*dy;if(d2<1)d2=1;
        var dist=Math.sqrt(d2);
        var force=(charge*alpha)/d2;
        var fx=(dx/dist)*force,fy=(dy/dist)*force;
        pos[a].x-=fx;pos[a].y-=fy;
        pos[b].x+=fx;pos[b].y+=fy;
      }
    }
    /* centering */
    for(var ni=0;ni<nodes.length;ni++){
      pos[ni].x+=(vcx-pos[ni].x)*centerStr*alpha;
      pos[ni].y+=(vcy-pos[ni].y)*centerStr*alpha;
    }
    /* collision */
    for(var a=0;a<nodes.length;a++){
      for(var b=a+1;b<nodes.length;b++){
        var dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;
        var dist=Math.sqrt(dx*dx+dy*dy)||0.01;
        var minD=nodes[a].radius+nodes[b].radius+collidePad;
        if(dist<minD){
          var ov=(minD-dist)/2;
          var ox=(dx/dist)*ov,oy=(dy/dist)*ov;
          pos[a].x-=ox;pos[a].y-=oy;
          pos[b].x+=ox;pos[b].y+=oy;
        }
      }
    }
    /* clamp */
    var pad=60;
    for(var ni=0;ni<nodes.length;ni++){
      pos[ni].x=Math.max(pad,Math.min(VW-pad,pos[ni].x));
      pos[ni].y=Math.max(pad,Math.min(VH-pad,pos[ni].y));
    }
  }

  /* ---- state ---- */
  var nwSelected=null;

  /* ---- build DOM ---- */
  var stage=document.createElement('div');
  stage.className='nw-stage';

  var svgWrap=document.createElement('div');
  svgWrap.className='nw-svg-wrap';
  var svgNS='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+VW+' '+VH);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svgWrap.appendChild(svg);
  stage.appendChild(svgWrap);

  /* draw edges */
  var edgeGroup=document.createElementNS(svgNS,'g');
  var edgeEls=[];
  for(var ei=0;ei<edges.length;ei++){
    var e=edges[ei];
    var ai=nameIdx[e.a],bi=nameIdx[e.b];
    if(ai==null||bi==null)continue;
    var pa=pos[ai],pb=pos[bi];
    var mx=(pa.x+pb.x)/2,my=(pa.y+pb.y)/2;

    var line=document.createElementNS(svgNS,'line');
    line.setAttribute('x1',pa.x.toFixed(1));line.setAttribute('y1',pa.y.toFixed(1));
    line.setAttribute('x2',pb.x.toFixed(1));line.setAttribute('y2',pb.y.toFixed(1));
    line.setAttribute('class','nw-edge');
    line.setAttribute('stroke-width',String(Math.min(1.2+e.proposals.length*0.6,4.5)));
    line.setAttribute('data-ei',String(ei));
    edgeGroup.appendChild(line);
    edgeEls.push({el:line,ai:ai,bi:bi,edge:e});

    var hiColor=activeIdx!=null?hsl(nodes[activeIdx].hue):null;
    for(var i=0;i<nodeEls.length;i++){
      var ne=nodeEls[i];
      if(activeIdx==null){
        ne.el.classList.remove('dim','hi');
        if(nwSelected!=null&&ne.ni===nwSelected)ne.el.classList.add('sel');
        else ne.el.classList.remove('sel');
      } else {
        ne.el.classList.remove('dim','hi','sel');
        if(ne.ni===activeIdx)ne.el.classList.add('hi');
        else if(adj&&adj.has(ne.ni))ne.el.classList.add('hi');
        else ne.el.classList.add('dim');
        if(nwSelected!=null&&ne.ni===nwSelected)ne.el.classList.add('sel');
      }
    }
    for(var i=0;i<edgeEls.length;i++){
      var ee=edgeEls[i];
      if(activeIdx==null){
        ee.el.classList.remove('dim','hi');
        ee.el.style.removeProperty('--hi-c');

        if(ee.ai===activeIdx||ee.bi===activeIdx){
          ee.el.classList.add('hi');ee.el.classList.remove('dim');

          ee.el.classList.add('dim');ee.el.classList.remove('hi');
          ee.el.style.removeProperty('--hi-c');
        }
      }

  }
  var fitPad=80;
  bMinX-=fitPad;bMinY-=fitPad;bMaxX+=fitPad;bMaxY+=fitPad;
  var fitW=bMaxX-bMinX,fitH=bMaxY-bMinY;
  /* align bubble center with top/bottom bar center (account for 340px detail panel) */
  var detailPanelW=340;
  var extraLeft=fitW*(detailPanelW/(detailPanelW+fitW));

    e.preventDefault();
    var factor=e.deltaY>0?1.08:0.93;
    var rect=svgWrap.getBoundingClientRect();
    var mx=(e.clientX-rect.left)/rect.width;
    var my=(e.clientY-rect.top)/rect.height;
    var nw=nwVB.w*factor,nh=nwVB.h*factor;
    nw=Math.max(200,Math.min(VW*4,nw));nh=Math.max(150,Math.min(VH*4,nh));
    nwVB.x+=(nwVB.w-nw)*mx;nwVB.y+=(nwVB.h-nh)*my;

    if(window._syncZoomSlider)window._syncZoomSlider();
  },{passive:false});
