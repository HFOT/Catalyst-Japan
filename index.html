/* Build milestone data for proposals */
function _buildMsData(proposals){
  var MS=window.CJ_MILESTONES||{};
  var COMP=window.CJ_COMPLETIONS||{};
  /* Word-match helpers for CJ_COMPLETIONS lookup */
  function _w(s){return s.toLowerCase().replace(/[^a-z0-9]/g,' ').split(/\s+/).filter(function(w){return w.length>2;});}
  function _ov(a,b){var n=0;for(var i=0;i<a.length;i++)for(var j=0;j<b.length;j++)if(a[i]===b[j]){n++;break;}return n;}
  var _ca=[];
  var _byLid={}; /* local_id → COMP entry, for explicit binding */
  for(var ck in COMP){
    var cc=COMP[ck];
    _ca.push({w:_w(cc.t),completed:cc.completed,dist:cc.dist||0,req:cc.req||0,st:cc.st,_lid:cc._lid});
    if(cc._lid) _byLid[cc._lid]={completed:cc.completed,dist:cc.dist||0,req:cc.req||0,st:cc.st};
  }

  var results=[];
  for(var i=0;i<proposals.length;i++){
    var c=proposals[i];
    var msEntries=MS[c.id];
    var adaK=c.u==='ada'?c.amt:(c.amt/(c.adaPrice||0.5));
    var item={id:c.id,label:pLabel(c),fund:c.fund,status:c.st,adaK:adaK,milestones:[]};
    if(msEntries&&msEntries.length>0){
      for(var ei=0;ei<msEntries.length;ei++){
        var entry=msEntries[ei];
        for(var mi=0;mi<entry.milestones.length;mi++){
          var m=entry.milestones[mi];
          item.milestones.push({ms:m.ms,cost:m.cost,signoff:m.signoff?m.signoff.split('T')[0]:null,title:m.title});
        }
      }
      item.milestones.sort(function(a,b){return a.ms-b.ms;});
    } else {
      /* No CJ_MILESTONES — synthetic entry from proposal + CJ_COMPLETIONS */
      var totalAda=adaK*1000;
      var sDate=null;
      var isParentFunded=false;
      /* Prefer explicit _lid binding; fall back to fuzzy match */
      var bm=null,bn=0;
      if(_byLid[c.id]){bm=_byLid[c.id];bn=99;}
      else {
        var pw=_w(c.label||'');
        for(var cj=0;cj<_ca.length;cj++){
          /* Skip entries already bound to another local id */
          if(_ca[cj]._lid && _ca[cj]._lid!==c.id) continue;
          var n=_ov(pw,_ca[cj].w);
          if(n>bn){bn=n;bm=_ca[cj];}
        }
      }
      var preMs=(c.fund||0)<10; /* F2-F9: before milestone system */
      /* _lid binding bypasses both fuzzy threshold AND status check —
         an explicit _lid means official completion data exists, trust it */
      var hasLidMatch = bn===99;
      if(bm&&(bn>=2||hasLidMatch)){
        /* F2-F9 with dist:0 & req:0 = genuinely parent-funded sub-project (e.g. Milkomeda) */
        if(preMs&&bm.dist===0&&bm.req===0){ isParentFunded=true; }
        else if(bm.dist>0) totalAda=bm.dist;
        else if(bm.req>0) totalAda=bm.req;
        /* F10+ CJ_COMPLETIONS always has req:0/dist:0 — keep INDUSTRIES amt */
        if(c.st==='complete'||c.st==='dnf'||hasLidMatch) sDate=bm.completed;
      }
      if(isParentFunded){
        /* Sub-project: funding via parent project, no direct withdrawal.
           Milkomeda sub-projects (dist:0/req:0) were funded via the Milkomeda Accelerator
           parent series. Identify parent by: same fund + req>0 + title contains "accelerator"/"batch". */
        var parentName=null;
        var subTitle=(c.label||'').toLowerCase();
        var isMilkomedaSub=subTitle.indexOf('milkomeda')>=0;
        for(var ck2 in COMP){
          var cc2=COMP[ck2];
          if(cc2.f!==c.fund||!(cc2.req>0)) continue;
          var pTitleLc=cc2.t.toLowerCase();
          if(isMilkomedaSub && pTitleLc.indexOf('milkomeda')>=0 &&
             (pTitleLc.indexOf('accelerator')>=0||pTitleLc.indexOf('batch')>=0)){
            parentName=cc2.t;
            break; /* exact-pattern match wins */
          }
        }
        /* Fallback: any req>0 entry in same fund with highest keyword overlap */
        if(!parentName){
          var bestOverlap=0;
          var subWords=_w(c.label||'');
          for(var ck3 in COMP){
            var cc3=COMP[ck3];
            if(cc3.f===c.fund && cc3.req>0){
              var ov=_ov(subWords, _w(cc3.t));
              if(ov>bestOverlap){bestOverlap=ov; parentName=cc3.t;}
            }
          }
        }
        item.milestones.push({ms:1,cost:0,signoff:sDate,title:'親経由',parentFunded:true,parentTitle:parentName});
      } else if(totalAda>0){
        var msNotFound=!preMs; /* F10+: MS system exists but not in Supabase */
        var reason=preMs?'MS制度前':msNotFound?(c.st==='complete'?'制度外':'MS未取得'):'進行中';
        /* Pre-MS: funds were paid LUMP-SUM at fund result date — that's the actual receipt date.
           For dnf items: also keep the close-out date as dnfDate (when IOG marked it cancelled). */
        var displayDate=sDate;
        var dnfDate=null;
        if(preMs){
          var frd=(typeof FUND_RESULT_DATES!=='undefined')?FUND_RESULT_DATES[c.fund]:null;
          if(frd){var fp=frd.split('-');displayDate=fp[2]+'-'+fp[1]+'-'+fp[0];} /* receipt date */
          if(c.st==='dnf'&&sDate) dnfDate=sDate; /* close-out / cancel date */
        }
        item.milestones.push({ms:1,cost:totalAda,signoff:displayDate,title:reason,preMs:preMs,msNotFound:msNotFound,dnfDate:dnfDate});
      }
    }
    results.push(item);
  }
  return results;
}

/* Add colored wd bars + blue fund bars to main chart — reuse existing _chWdSeries */
function _addColoredWdBars(msData){
  if(!_chartInstance||!window._chWdSeries) return;

  /* ── Hide funded/recv global bars ── */
  if(window._chFundedSeries&&window._chRecvSeries){
    if(!window._chFdOrigData) window._chFdOrigData='saved';
    window._chFundedSeries.setData([]);
    window._chRecvSeries.setData([]);
  }

  /* ── Build combined bars: blue fund adoption + colored MS withdrawal ── */
  var bars=[];
  var markers=[];
  var usedDates={};

  /* Blue fund adoption bars */
  for(var fi=0;fi<msData.length;fi++){
    var fp=msData[fi];
    var fn=fp.fund;
    var frd=FUND_RESULT_DATES[fn];
    if(!frd) continue;
    var parts=frd.split('-');
    var fKey=parts[2]+'-'+parts[1]+'-'+parts[0];
    var adaK=fp.adaK||fp.milestones.reduce(function(s,m){return s+m.cost;},0)/1000;
    var tryF=fKey;var fa=0;
    while(usedDates[tryF]){fa++;var fd2=new Date(fKey);fd2.setDate(fd2.getDate()+fa);tryF=fd2.toISOString().split('T')[0];}
    usedDates[tryF]=true;
    bars.push({time:tryF,value:adaK,color:'rgba(91,138,240,0.7)',_pid:fp.id,_isFund:true,_fund:fn});
    markers.push({time:tryF,position:'aboveBar',color:'rgba(91,138,240,0.9)',shape:'arrowDown',size:0.5,
      text:'F'+fn+(_lang!=='en'?' 採択':' Fund')});
  }

  /* Colored MS withdrawal bars — convert raw cost to K-ADA proportionally */
  for(var pi=0;pi<msData.length;pi++){
    var p=msData[pi];
    var col=PCOLS[pi%PCOLS.length];
    /* Fund result date = when funds were actually disbursed (pre-MS lump-sum payment) */
    var pFrd=FUND_RESULT_DATES[p.fund];
    var pFundDate=null;
    if(pFrd){var pFp=pFrd.split('-');pFundDate=pFp[2]+'-'+pFp[1]+'-'+pFp[0];}
    /* Total raw MS cost (may be USD or ADA depending on proposal currency) */
    var totalMsCost=0;
    for(var ti=0;ti<p.milestones.length;ti++) totalMsCost+=p.milestones[ti].cost;
    for(var mi=0;mi<p.milestones.length;mi++){
      var m=p.milestones[mi];
      if(!m.signoff||m.cost<=0) continue;
      /* Convert to K-ADA: milestone share of total × proposal adaK */
      var msAdaK=totalMsCost>0?(m.cost/totalMsCost)*p.adaK:m.cost/1000;
      /* Pre-MS (F2-F9): m.signoff IS the receipt date (set in _buildMsData).
         For F10+ MS: m.signoff is the milestone signoff date. */
      var barCol=m.preMs?'rgba(232,160,72,0.85)':col+'0.85)';
      var mkCol=m.preMs?'rgba(232,160,72,0.9)':col+'0.9)';
      var mkText=m.preMs?(_lang!=='en'?'受領':'Recv')
        :(m.ms<=10?'①②③④⑤⑥⑦⑧⑨⑩'.charAt(m.ms-1):'M'+m.ms);
      var baseDate=m.signoff;
      /* Clamp: signoff can't predate fund result (data anomaly) */
      if(pFundDate&&baseDate<pFundDate) baseDate=pFundDate;
      var tryDate=baseDate;var attempt=0;
      while(usedDates[tryDate]){attempt++;var dd=new Date(baseDate);dd.setDate(dd.getDate()+attempt);tryDate=dd.toISOString().split('T')[0];}
      usedDates[tryDate]=true;
      bars.push({time:tryDate,value:msAdaK,color:barCol,_pid:p.id,_ms:m.ms,_label:p.label});
      markers.push({time:tryDate,position:'aboveBar',color:mkCol,shape:'arrowDown',size:0.5,text:mkText});
      /* Pre-MS dnf: add a "✕中止" flag at the IOG close-out date (separate from receipt date) */
      if(m.preMs && m.dnfDate && m.dnfDate!==tryDate){
        var dnfTry=m.dnfDate;var dnfAttempt=0;
        while(usedDates[dnfTry]){dnfAttempt++;var dnd=new Date(m.dnfDate);dnd.setDate(dnd.getDate()+dnfAttempt);dnfTry=dnd.toISOString().split('T')[0];}
        usedDates[dnfTry]=true;
        markers.push({time:dnfTry,position:'aboveBar',color:'rgba(200,80,80,0.9)',shape:'arrowDown',size:0.5,
          text:(_lang!=='en'?'END':'END')});
      }
    }
  }
  if(!bars.length) return;
  bars.sort(function(a,b){return a.time<b.time?-1:1;});
  markers.sort(function(a,b){return a.time<b.time?-1:1;});

  /* Reuse existing _chWdSeries (same scale config = bars touch bottom) */
  window._chWdSeries.setData(bars);
  /* Save the colored bars so we can restore them after filter-to-proposal */
  window._chWdOrigData=bars.slice();
  window._chWdOrigMarkers=[];

  /* Markers on histogram series shift coord(0) up by ~21px (LW adds padding).
     Instead, attach markers to a separate invisible line series so the
     'wd' scale stays unaffected and bars touch the bottom axis. */
  if(markers.length){
    if(window._chMarkerSeries){try{_chartInstance.removeSeries(window._chMarkerSeries);}catch(e){}}
    var mkSeries=_chartInstance.addLineSeries({
      color:'rgba(0,0,0,0)',lineWidth:0,
      lastValueVisible:false,priceLineVisible:false,
      priceScaleId:'mk'
    });
    _chartInstance.priceScale('mk').applyOptions({visible:false,scaleMargins:{top:0,bottom:0}});
    /* Marker series needs data at the same timestamps; use value=0 (invisible) */
    var mkData=[];
    var mkUsed={};
    for(var mi=0;mi<markers.length;mi++){
      if(!mkUsed[markers[mi].time]){mkData.push({time:markers[mi].time,value:0});mkUsed[markers[mi].time]=true;}
    }
    mkData.sort(function(a,b){return a.time<b.time?-1:1;});
    mkSeries.setData(mkData);
    mkSeries.setMarkers(markers);
    window._chMarkerSeries=mkSeries;
  }
}

/* Tab view: proposals matrix ↔ chronological timeline (toggle) */
function _renderMsSplitView(title,msData,proposals){
  var pCont=document.getElementById('ch-person-chart');
  if(!pCont) return;
  if(_personChartInstance){try{_personChartInstance.remove();}catch(e){}_personChartInstance=null;}

  var isEn=_lang==='en';
  function fmtA(v){return v>=1000?Math.round(v/1000)+'K':''+Math.round(v);}
  var _msNums='①②③④⑤⑥⑦⑧⑨⑩';
  var allProps=window._chAllProps||[];

  function handleRowClick(pid){
    for(var ai=0;ai<allProps.length;ai++){
      if(allProps[ai].id===pid){_chartShowLens(allProps[ai]);addProposalMarkers(allProps[ai]);return;}
    }
  }

  /* === TAB A: Proposal x Milestone matrix === */
  var maxMs=0;
  for(var i=0;i<msData.length;i++){
    var msCnt=msData[i].milestones.length;
    if(msCnt>maxMs) maxMs=msCnt;
  }
  if(maxMs===0) maxMs=1;
  /* Table min-width = proposal col (220) + each MS col (55) so it overflows panel
     and triggers horizontal scrollbar on parent (overflow:auto) */
  var _tblMinW=220+maxMs*55;
  var aHtml='<table style="min-width:'+_tblMinW+'px;width:100%;border-collapse:collapse">';
  aHtml+='<thead><tr style="color:var(--muted);font-size:9px;text-align:left;border-bottom:1px solid var(--border)">'
    +'<th style="padding:3px 6px">'+(isEn?'Proposal':'提案')+'</th>';
  for(var m=1;m<=maxMs;m++) aHtml+='<th style="padding:3px 4px;text-align:right;min-width:55px">'+(m<=10?_msNums.charAt(m-1):'M'+m)+'</th>';
  aHtml+='</tr></thead><tbody>';

  for(var pi=0;pi<msData.length;pi++){
    var p=msData[pi];
    var col=PCOLS[pi%PCOLS.length];
    var miniF=_renderMiniFlags(_findIndustryProposal(p.id));
    aHtml+='<tr style="border-bottom:1px solid var(--border);cursor:pointer" data-tab-id="'+p.id+'">';
    aHtml+='<td style="padding:5px 6px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
      +'<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+col+'0.8);margin-right:6px;vertical-align:middle"></span>'
      +'<span style="color:var(--ink);vertical-align:middle">'+esc(p.label)+'</span>'
      +' <span style="opacity:.4;font-size:9px">F'+p.fund+'</span>'+miniF+'</td>';
    for(var mi=0;mi<maxMs;mi++){
      var ms=p.milestones[mi];
      if(!ms){
        aHtml+='<td style="padding:5px 4px;text-align:right;color:var(--muted);opacity:.3">—</td>';
      } else if(ms.parentFunded){
        var _pT2=ms.parentTitle?esc(ms.parentTitle):'';
        aHtml+='<td style="padding:5px 4px;text-align:right;color:var(--muted);font-size:9px;opacity:.6"'
          +(_pT2?' title="親: '+_pT2+'"':'')+'>'
          +(isEn?'via parent':'親経由')
          +(_pT2?'<div style="font-size:8px;opacity:.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px">↑'+_pT2+'</div>':'')
          +(ms.signoff?'<div style="font-size:8px;opacity:.5">'+ms.signoff.substring(5)+'</div>':'')+'</td>';
      } else if(ms.preMs){
        aHtml+='<td style="padding:5px 4px;text-align:right;color:'+col+'0.7)">'
          +'₳'+fmtA(ms.cost)
          +'<div style="font-size:8px;opacity:.4">'+(isEn?'pre-MS':'MS制度前')+'</div></td>';
      } else if(ms.msNotFound){
        var msLabel=ms.title==='制度外'?(isEn?'outside MS':'制度外'):(isEn?'MS n/a':'MS未取得');
        aHtml+='<td style="padding:5px 4px;text-align:right;color:'+col+'0.6)">'
          +'₳'+fmtA(ms.cost)
          +'<div style="font-size:8px;opacity:.4">'+msLabel+'</div></td>';

  var flat=[];

    +'<th style="padding:3px 4px;text-align:center">MS</th>'
    +'<th style="padding:3px 6px;text-align:right">'+(isEn?'Amount':'金額')+'</th>'
    +'<th style="padding:3px 6px">'+(isEn?'Note':'備考')+'</th>'
    +'</tr></thead><tbody>';

  for(var fi=0;fi<flat.length;fi++){

    var msLbl=f.ms<=10?_msNums.charAt(f.ms-1):'M'+f.ms;
    var amtH='';
    if(f.parentFunded){
      amtH='<span style="color:var(--muted);font-size:9px;opacity:.6">'+(isEn?'via parent':'親経由')+'</span>';
    } else if(f.cost>0){
      amtH='<span style="color:'+f.col+'0.9)">₳'+fmtA(f.cost)+'</span>';
    } else {

    else if(!f.signoff) note=isEn?'pending':'未請求';

    var dCol=f.signoff?f.col+'0.7)':'var(--muted)';
    var tlMiniF=_renderMiniFlags(_findIndustryProposal(f.pId));
    bHtml+='<tr style="border-bottom:1px solid var(--border);cursor:pointer" data-tab-id="'+f.pId+'">';

/* ---- Show withdrawal detail in bottom panel + project in right ---- */
function _showWdDetail(wdEvents){
  var personEl=document.getElementById('ch-person');
  var pCont=document.getElementById('ch-person-chart');
  if(!personEl||!pCont) return;

  /* Clear chart instance and restore global bars */
  if(_personChartInstance){try{_personChartInstance.remove();}catch(e){}_personChartInstance=null;}
  /* Restore global orange wd bars + clear person markers */
  if(window._chWdSeries&&window._chWdOrigData){
    window._chWdSeries.setData(window._chWdOrigData);
    window._chWdSeries.setMarkers([]);
  }
  if(window._chFdOrigData){_updateFundFlow(null);window._chFdOrigData=null;}

  var isEn=_lang==='en';
  var jpy=USD_JPY||150;
  function fmtAda(v){return v>=1000000?'₳'+(v/1000000).toFixed(2)+'M':v>=1000?'₳'+(v/1000).toFixed(1)+'K':'₳'+Math.round(v);}

  /* Find matching proposals from INDUSTRIES for right panel */
  var allProps=window._chAllProps||[];
  function findProp(ev){
    /* Match by pid first */
    if(ev.pid){
      for(var i=0;i<allProps.length;i++){
        if(allProps[i].id===ev.pid) return allProps[i];
      }
    }
    /* Fallback: label substring */
    var label=ev.label||'';
    for(var i=0;i<allProps.length;i++){
      if(allProps[i].title&&label&&allProps[i].title.indexOf(label.substring(0,15))>=0) return allProps[i];
      if(allProps[i]._src&&pLabel(allProps[i]._src).indexOf(label.substring(0,15))>=0) return allProps[i];
    }
    return null;
  }

  /* Get ADA price at event date */
  var priceData=window._chAllData||[];
  function priceAt(dateStr){
    for(var i=priceData.length-1;i>=0;i--){
      if(priceData[i].time<=dateStr) return priceData[i].value;
    }
    return ADA_USD||0.5;
  }

  var html='<div style="padding:12px 16px;height:100%;overflow-y:auto;font:11px \'JetBrains Mono\',monospace">';
  html+='<div style="color:var(--ink);font-size:13px;font-weight:600;margin-bottom:10px">'
    +(isEn?'Withdrawal Detail':'引出詳細')
    +' <span style="opacity:.5;font-weight:400;font-size:11px">'+wdEvents[0].time+'</span></div>';

  var totalAda=0;
  for(var i=0;i<wdEvents.length;i++){
    var ev=wdEvents[i];
    totalAda+=ev.ada;
    var p=priceAt(ev.time);
    var usd=ev.ada*p;
    var stColor=ev.label&&ev.label.indexOf('中止')>=0?'var(--st-dnf)':'rgba(232,160,72,0.9)';
    html+='<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" data-wd-idx="'+i+'">';
    html+='<div style="width:6px;height:6px;border-radius:50%;background:'+stColor+';margin-top:5px;flex-shrink:0"></div>';
    html+='<div style="flex:1;min-width:0">';
    html+='<div style="color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(ev.label||'Unknown')+'</div>';
    html+='<div style="color:var(--muted);font-size:10px;margin-top:2px">'
      +fmtAda(ev.ada)+' <span style="opacity:.5">·</span> $'+(usd/1000).toFixed(1)+'K'
      +' <span style="opacity:.5">·</span> ¥'+Math.round(usd*jpy/1000)+'K'
      +(ev.fund?' <span style="opacity:.4">F'+ev.fund+'</span>':'')
      +'</div>';
    html+='</div></div>';
  }

  /* Total */
  var totalP=priceAt(wdEvents[0].time);
  var totalUsd=totalAda*totalP;
  html+='<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);color:var(--ink);font-size:12px">'
    +(isEn?'Total':'合計')+': '+fmtAda(totalAda)
    +' <span style="opacity:.5">·</span> $'+(totalUsd/1000).toFixed(1)+'K'
    +' <span style="opacity:.5">·</span> ¥'+Math.round(totalUsd*jpy/1000)+'K'
    +'</div>';
  html+='</div>';
  pCont.innerHTML=html;

  /* Click handler: row click → show project in right panel */
  pCont.addEventListener('click',function(e){
    var row=e.target.closest('[data-wd-idx]');
    if(!row) return;
    var idx=parseInt(row.getAttribute('data-wd-idx'));
    var ev=wdEvents[idx];
    if(!ev) return;
    /* Highlight active row */
    var rows=pCont.querySelectorAll('[data-wd-idx]');
    for(var r=0;r<rows.length;r++) rows[r].style.background=r==idx?'rgba(232,160,72,0.08)':'';
    /* Find and show project in right panel */
    var pr=findProp(ev);
    if(pr){
      _chartShowLens(pr);
      addProposalMarkers(pr);
    }
  });

  /* Auto-show first project in right panel if single event */
  if(wdEvents.length===1){
    var pr=findProp(wdEvents[0]);
    if(pr){
      _chartShowLens(pr);
      addProposalMarkers(pr);
    }
  }
}

function _updateFundFlow(children){
  var ff={};
  var src=children;
  if(!src){
    src=[];
    for(var fi=0;fi<INDUSTRIES.length;fi++){
      for(var fj=0;fj<INDUSTRIES[fi].children.length;fj++) src.push(INDUSTRIES[fi].children[fj]);
    }
  }
  for(var ci=0;ci<src.length;ci++){
    var fc=src[ci];
    var fn=fc.fund||0;if(!fn)continue;
    if(!ff[fn]) ff[fn]={count:0,adaK:0,budgetK:0,fundedK:0,receivedK:0,recvAdaK:0,proposals:[]};
    /* ADA amount (in K-ADA) */
    var adaK=fc.u==='ada'?fc.amt:(fc.amt/(fc.adaPrice||0.5));
    /* 3 financial metrics (all in K-USD) */
    var submitP=FUND_SUBMIT_PRICES[fn]||fc.adaPrice||0.5;
    var resultP=FUND_RESULT_PRICES[fn]||fc.adaPrice||0.5;
    var budK=adaK*submitP;      /* 予算額: value at submission */
    var funK=adaK*resultP;      /* 採択額: value at result */
    /* receivedK: historical price at milestone signoff / completion date */
    var recv=_calcReceivedK(fc.id,adaK,fc.st,fn);
    var recAdaK=recv.recvAdaK;
    var recK=recv.usd;

    ff[fn].count++;
    ff[fn].adaK+=adaK;
    ff[fn].budgetK+=budK;
    ff[fn].fundedK+=funK;
    ff[fn].receivedK+=recK;
    ff[fn].recvAdaK+=recAdaK;
    var msProg=fc.st==='complete'?'4/4':fc.st==='progress'?'2/4':'1/4';
    var msLabel=fc.st==='complete'?'完了':fc.st==='progress'?'途中':'中止';
    ff[fn].proposals.push({
      label:pLabel(fc),status:fc.st,msProg:msProg,msLabel:msLabel,
      adaK:adaK,budgetK:budK,fundedK:funK,receivedK:recK,recvAdaK:recAdaK
    });
  }
  window._chFundFlow=ff;
  _updateFlowStrip(ff);
  /* rebuild time map + histogram data */
  window._chFundTimeMap={};
  for(var fk in ff){
    var frd=FUND_RESULT_DATES[fk];if(!frd)continue;
    var fp=frd.split('-');
    var ftk=fp[2]+'-'+fp[1]+'-'+fp[0];
    window._chFundTimeMap[ftk]=fk;
  }
  for(var afk in FUND_RESULT_DATES){
    var afrd=FUND_RESULT_DATES[afk].split('-');
    var aftk=afrd[2]+'-'+afrd[1]+'-'+afrd[0];
    if(!window._chFundTimeMap[aftk]) window._chFundTimeMap[aftk]=afk;
  }
  _expandFundTimeMap(window._chFundTimeMap);
  /* update markers — show ALL fund dates (F2-F14) */
  if(window._chAdaLine){
    var markers=[];
    for(var fr in FUND_RESULT_DATES){
      var cnt=ff[fr]?ff[fr].count:0;
      var rp2=FUND_RESULT_DATES[fr].split('-');
      var rKey=rp2[2]+'-'+rp2[1]+'-'+rp2[0];
      if(cnt>0){
        markers.push({time:rKey,position:'aboveBar',color:'rgba(255,255,255,0.9)',shape:'arrowDown',size:0.5,text:'F'+fr});
      } else {
        markers.push({time:rKey,position:'aboveBar',color:'rgba(255,255,255,0.3)',shape:'arrowDown',size:0.5,text:'F'+fr});
      }
    }
    markers.sort(function(a,b){return a.time<b.time?-1:1;});
    window._chAdaLine.setMarkers(markers);
  }
  /* update funded/recv histogram series */
  if(window._chFundedSeries&&window._chRecvSeries){
    var fdData=[],rvData=[];
    for(var _fk in ff){
      var _frd=FUND_RESULT_DATES[_fk];if(!_frd)continue;
      var _fp=_frd.split('-');
      var _ftk=_fp[2]+'-'+_fp[1]+'-'+_fp[0];
      fdData.push({time:_ftk,value:ff[_fk].fundedK,color:'rgba(61,139,110,0.45)'});
      rvData.push({time:_ftk,value:ff[_fk].receivedK,color:'rgba(91,138,240,0.5)'});
    }
    fdData.sort(function(a,b){return a.time<b.time?-1:1;});
    rvData.sort(function(a,b){return a.time<b.time?-1:1;});
    window._chFundedSeries.setData(fdData);
    window._chRecvSeries.setData(rvData);
  }
}


/* ---- Range control ---- */
function applyChartRange(days){
  if(!_chartInstance||!window._chAllData)return;
  var all=window._chAllData;
  if(days>=all.length){
    _chartInstance.timeScale().fitContent();
    return;
  }
  var from=all[Math.max(0,all.length-days)].time;
  var to=all[all.length-1].time;
  _chartInstance.timeScale().setVisibleRange({from:from,to:to});
}

/* ================================================================
   NETWORK VIEW
   ================================================================ */
function renderNetwork(){
  var wrap=document.getElementById('nw-wrap');
  if(!wrap)return;
  wrap.innerHTML='';

  /* ---- build graph data ---- */
  var ppl={},edg={};
  for(var i=0;i<INDUSTRIES.length;i++){
    var sec=INDUSTRIES[i];
    for(var j=0;j<sec.children.length;j++){
      var p=sec.children[j];
      var inv=[];
      if(p.by)inv.push({name:p.by,role:'提案者'});
      if(p.team)for(var t=0;t<p.team.length;t++)inv.push({name:p.team[t].name,role:p.team[t].role});
      for(var k=0;k<inv.length;k++){
        var nm=inv[k].name;
        if(!ppl[nm])ppl[nm]={name:nm,props:[],totalAda:0,totalUsd:0,soloUsdK:0,coUsdK:0,_sectors:{}};
        ppl[nm].props.push({id:p.id,label:pLabel(p),role:inv[k].role,fund:p.fund,st:p.st,amt:p.amt,u:p.u,adaPrice:p.adaPrice,ch:p.ch,by:p.by,team:p.team,cls:p.cls,url:p.url,x:p.x,yt:p.yt,report:p.report,_secId:sec.id,_secHue:sec.hue,_secJa:sec.ja});
        if(p.u==='ada')ppl[nm].totalAda+=p.amt;
        else ppl[nm].totalUsd+=p.amt;
        var _uK=p.u==='ada'?p.amt*p.adaPrice:p.amt;
        if(inv[k].role==='提案者'&&p.cls==='main')ppl[nm].soloUsdK+=_uK;
        else ppl[nm].coUsdK+=_uK;
        ppl[nm]._sectors[sec.id]=(ppl[nm]._sectors[sec.id]||0)+1;
      }
      if(inv.length>=2){
        for(var a=0;a<inv.length;a++){
          for(var b=a+1;b<inv.length;b++){
            var ns=[inv[a].name,inv[b].name].sort();
            var ek=ns[0]+'|'+ns[1];
            if(!edg[ek])edg[ek]={a:ns[0],b:ns[1],proposals:[]};
            edg[ek].proposals.push(p);
          }
        }
      }
    }
  }

  var edges=[];for(var ek in edg)edges.push(edg[ek]);
  var conn={};
  for(var ei=0;ei<edges.length;ei++){conn[edges[ei].a]=true;conn[edges[ei].b]=true;}

  var nodes=[];
  for(var pk in ppl)nodes.push(ppl[pk]);
  for(var ni=0;ni<nodes.length;ni++){
    var c=0;
    for(var ei=0;ei<edges.length;ei++){if(edges[ei].a===nodes[ni].name||edges[ei].b===nodes[ni].name)c++;}
    nodes[ni].edgeCnt=c;
    nodes[ni].connected=!!conn[nodes[ni].name];
  }
  nodes.sort(function(a,b){return b.props.length-a.props.length});

  if(nodes.length===0){
    wrap.innerHTML='<div style="padding:80px 40px;color:var(--muted);font-family:\'JetBrains Mono\',monospace;font-size:11px">'+T('noTeamData')+'</div>';
    return;
  }

  /* name→index mapping + adjacency */
  var nameIdx={};
  for(var ni=0;ni<nodes.length;ni++)nameIdx[nodes[ni].name]=ni;
  var adjSets=[];
  for(var ni=0;ni<nodes.length;ni++)adjSets.push(new Set());
  for(var ei=0;ei<edges.length;ei++){
    var ai=nameIdx[edges[ei].a],bi=nameIdx[edges[ei].b];
    if(ai!=null&&bi!=null){adjSets[ai].add(bi);adjSets[bi].add(ai);}
  }

  /* primary sector → hue per person */
  var secIdx={};
  for(var si=0;si<INDUSTRIES.length;si++)secIdx[INDUSTRIES[si].id]={hue:INDUSTRIES[si].hue,ja:INDUSTRIES[si].ja,label:INDUSTRIES[si].label};
  var sectorCounts={};
  for(var ni=0;ni<nodes.length;ni++){
    var best=null,bestCnt=0;
    for(var sk in nodes[ni]._sectors){
      if(nodes[ni]._sectors[sk]>bestCnt){bestCnt=nodes[ni]._sectors[sk];best=sk;}
    }
    nodes[ni].sector=best;
    nodes[ni].hue=best&&secIdx[best]?secIdx[best].hue:0;
    nodes[ni].radius=18+Math.min(nodes[ni].props.length*3,28);
    if(best){sectorCounts[best]=(sectorCounts[best]||0)+1;}
  }

  /* ---- SVG viewBox layout ---- */
  var VW=1200,VH=800;
  var vcx=VW/2,vcy=VH/2;

  /* ALL nodes get positions (connected + solo) */
  var allIdx=[];
  for(var ni=0;ni<nodes.length;ni++)allIdx.push(ni);

  var pos=[];
  /* initial: circle layout for all */
  var initR=Math.min(VW,VH)*0.35;
  for(var ni=0;ni<nodes.length;ni++){
    var angle=(2*Math.PI*ni/nodes.length)-Math.PI/2;
    pos[ni]={x:vcx+Math.cos(angle)*initR,y:vcy+Math.sin(angle)*initR};
  }

  /* force simulation — all nodes participate */
  var SIM_ITER=600,linkDist=200,linkStr=0.04,charge=-2500,centerStr=0.006,collidePad=30;
  for(var it=0;it<SIM_ITER;it++){
    var alpha=1-it/SIM_ITER;
    /* link attraction */
    for(var ei=0;ei<edges.length;ei++){
      var ai=nameIdx[edges[ei].a],bi=nameIdx[edges[ei].b];
      if(ai==null||bi==null)continue;
      var dx=pos[bi].x-pos[ai].x,dy=pos[bi].y-pos[ai].y;
      var dist=Math.sqrt(dx*dx+dy*dy)||0.01;
      var f=(dist-linkDist)*linkStr*alpha;
      var fx=(dx/dist)*f,fy=(dy/dist)*f;
      pos[ai].x+=fx;pos[ai].y+=fy;
      pos[bi].x-=fx;pos[bi].y-=fy;
    }
    /* charge repulsion — all nodes */
    for(var a=0;a<nodes.length;a++){
      for(var b=a+1;b<nodes.length;b++){
        var dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;
        var d2=dx*dx+dy*dy;if(d2<1)d2=1;
        var dist=Math.sqrt(d2);
        var force=(charge*alpha)/d2;
        var fx=(dx/dist)*force,fy=(dy/dist)*force;
        pos[a].x-=fx;pos[a].y-=fy;
        pos[b].x+=fx;pos[b].y+=fy;
      }
    }
    /* centering */
    for(var ni=0;ni<nodes.length;ni++){
      pos[ni].x+=(vcx-pos[ni].x)*centerStr*alpha;
      pos[ni].y+=(vcy-pos[ni].y)*centerStr*alpha;
    }
    /* collision */
    for(var a=0;a<nodes.length;a++){
      for(var b=a+1;b<nodes.length;b++){
        var dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;
        var dist=Math.sqrt(dx*dx+dy*dy)||0.01;
        var minD=nodes[a].radius+nodes[b].radius+collidePad;
        if(dist<minD){
          var ov=(minD-dist)/2;
          var ox=(dx/dist)*ov,oy=(dy/dist)*ov;
          pos[a].x-=ox;pos[a].y-=oy;
          pos[b].x+=ox;pos[b].y+=oy;
        }
      }
    }
    /* clamp */
    var pad=60;
    for(var ni=0;ni<nodes.length;ni++){
      pos[ni].x=Math.max(pad,Math.min(VW-pad,pos[ni].x));
      pos[ni].y=Math.max(pad,Math.min(VH-pad,pos[ni].y));
    }
  }

  /* ---- state ---- */
  var nwSelected=null;

  /* ---- build DOM ---- */
  var stage=document.createElement('div');
  stage.className='nw-stage';

  var svgWrap=document.createElement('div');
  svgWrap.className='nw-svg-wrap';
  var svgNS='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+VW+' '+VH);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svgWrap.appendChild(svg);
  stage.appendChild(svgWrap);

  /* draw edges */
  var edgeGroup=document.createElementNS(svgNS,'g');
  var edgeEls=[];
  for(var ei=0;ei<edges.length;ei++){
    var e=edges[ei];
    var ai=nameIdx[e.a],bi=nameIdx[e.b];
    if(ai==null||bi==null)continue;
    var pa=pos[ai],pb=pos[bi];
    var mx=(pa.x+pb.x)/2,my=(pa.y+pb.y)/2;

    var line=document.createElementNS(svgNS,'line');
    line.setAttribute('x1',pa.x.toFixed(1));line.setAttribute('y1',pa.y.toFixed(1));
    line.setAttribute('x2',pb.x.toFixed(1));line.setAttribute('y2',pb.y.toFixed(1));
    line.setAttribute('class','nw-edge');
    line.setAttribute('stroke-width',String(Math.min(1.2+e.proposals.length*0.6,4.5)));
    line.setAttribute('data-ei',String(ei));
    edgeGroup.appendChild(line);
    edgeEls.push({el:line,ai:ai,bi:bi,edge:e});

    /* edge label */
    var lbl=document.createElementNS(svgNS,'text');
    lbl.setAttribute('x',mx.toFixed(1));
    lbl.setAttribute('y',(my-4).toFixed(1));
    lbl.setAttribute('class','nw-edge-lbl');
    lbl.textContent=e.proposals.length+'件';
    edgeGroup.appendChild(lbl);

    (function(edge,px,py){
      lbl.onclick=function(ev){ev.stopPropagation();showEdgePopup(edge,px,py);};
    })(e,mx,my);
  }
  svg.appendChild(edgeGroup);

  /* draw nodes */
  var nodeGroup=document.createElementNS(svgNS,'g');
  var nodeEls=[];
  for(var ni=0;ni<nodes.length;ni++){
    var node=nodes[ni];
    var p=pos[ni];
    var r=node.radius;
    var h=node.hue;

    var g=document.createElementNS(svgNS,'g');
    g.setAttribute('class','nw-node-g'+(node.connected?'':' solo'));
    g.setAttribute('transform','translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')');
    g.style.setProperty('--c',hsl(h));
    g.setAttribute('data-ni',String(ni));

    var halo=document.createElementNS(svgNS,'circle');
    halo.setAttribute('class','nw-halo');
    halo.setAttribute('r',String(r+12));
    g.appendChild(halo);

    var ring=document.createElementNS(svgNS,'circle');
    ring.setAttribute('class','nw-ring');
    ring.setAttribute('r',String(r+6));
    g.appendChild(ring);

    var circle=document.createElementNS(svgNS,'circle');
    circle.setAttribute('class','nw-nc');
    circle.setAttribute('r',String(r));
    g.appendChild(circle);

    var initial=node.name.charAt(0);
    if(/[a-zA-Z]/.test(initial))initial=initial.toUpperCase();
    var txt=document.createElementNS(svgNS,'text');
    txt.setAttribute('class','nw-init');
    txt.textContent=initial;
    g.appendChild(txt);

    var label=document.createElementNS(svgNS,'text');
    label.setAttribute('class','nw-label');
    label.setAttribute('y',String(r+14));
    label.textContent=node.name;
    g.appendChild(label);

    var sub=document.createElementNS(svgNS,'text');
    sub.setAttribute('class','nw-sub');
    sub.setAttribute('y',String(r+25));
    sub.textContent=node.props.length+'件'+(node.edgeCnt>0?' · '+node.edgeCnt+'接続':'');
    g.appendChild(sub);

    nodeGroup.appendChild(g);
    nodeEls.push({el:g,ni:ni,adj:adjSets[ni]});
  }
  svg.appendChild(nodeGroup);

  /* ---- hover & select interactions ---- */
  function applyHighlight(activeIdx){
    var adj=activeIdx!=null?adjSets[activeIdx]:null;
    var hiColor=activeIdx!=null?hsl(nodes[activeIdx].hue):null;
    for(var i=0;i<nodeEls.length;i++){
      var ne=nodeEls[i];
      if(activeIdx==null){
        ne.el.classList.remove('dim','hi');
        if(nwSelected!=null&&ne.ni===nwSelected)ne.el.classList.add('sel');
        else ne.el.classList.remove('sel');
      } else {
        ne.el.classList.remove('dim','hi','sel');
        if(ne.ni===activeIdx)ne.el.classList.add('hi');
        else if(adj&&adj.has(ne.ni))ne.el.classList.add('hi');
        else ne.el.classList.add('dim');
        if(nwSelected!=null&&ne.ni===nwSelected)ne.el.classList.add('sel');
      }
    }
    for(var i=0;i<edgeEls.length;i++){
      var ee=edgeEls[i];
      if(activeIdx==null){
        ee.el.classList.remove('dim','hi');
        ee.el.style.removeProperty('--hi-c');
      } else {
        if(ee.ai===activeIdx||ee.bi===activeIdx){
          ee.el.classList.add('hi');ee.el.classList.remove('dim');
          ee.el.style.setProperty('--hi-c',hiColor);
        } else {
          ee.el.classList.add('dim');ee.el.classList.remove('hi');
          ee.el.style.removeProperty('--hi-c');
        }
      }
    }
  }

  function selectNode(ni){
    nwSelected=ni;
    applyHighlight(ni);
    renderDetail(ni!=null?nodes[ni]:null);
  }
  /* expose for sidebar clicks */
  window._nwSelectByName=function(name){
    for(var i=0;i<nodes.length;i++){
      if(nodes[i].name===name){selectNode(i);return;}
    }
  };

  for(var i=0;i<nodeEls.length;i++){
    (function(ne){
      ne.el.onmouseenter=function(){if(nwSelected==null)applyHighlight(ne.ni);};
      ne.el.onmouseleave=function(){if(nwSelected==null)applyHighlight(null);};
      ne.el.onclick=function(ev){
        ev.stopPropagation();
        if(nwSelected===ne.ni){selectNode(null);}
        else{selectNode(ne.ni);}
      };
    })(nodeEls[i]);
  }

  stage.addEventListener('click',function(ev){
    if(!ev.target.closest('.nw-node-g')&&!ev.target.closest('.nw-popup')&&!ev.target.closest('.nw-edge-lbl')){
      selectNode(null);
      var pp=document.getElementById('nw-popup');
      if(pp)pp.classList.remove('open');
    }
  });

  /* popup container */
  var popup=document.createElement('div');
  popup.className='nw-popup';
  popup.id='nw-popup';
  stage.appendChild(popup);

  /* left legend panel */
  var legend=document.createElement('div');
  legend.className='nw-legend';
  var sharedIds={};
  for(var ei=0;ei<edges.length;ei++){
    for(var pi=0;pi<edges[ei].proposals.length;pi++){sharedIds[edges[ei].proposals[pi].id]=true;}
  }
  var sharedCnt=Object.keys(sharedIds).length;
  var connCnt=0;for(var ni=0;ni<nodes.length;ni++){if(nodes[ni].connected)connCnt++;}

  /* 概況 */
  var kpiSec=document.createElement('div');
  kpiSec.className='nw-legend-sec';
  kpiSec.innerHTML='<div class="nw-legend-title">'+T('overview')+'</div>'
    +'<div class="nw-legend-kpi">'
    +'<div class="kv"><b>'+nodes.length+'</b><span>'+T('people')+'</span></div>'
    +'<div class="kv"><b>'+edges.length+'</b><span>'+T('connLabel')+'</span></div>'
    +'<div class="kv"><b>'+connCnt+'</b><span>'+T('hasCollab')+'</span></div>'
    +'<div class="kv"><b>'+sharedCnt+'</b><span>'+T('sharedProp')+'</span></div>'
    +'</div>';
  legend.appendChild(kpiSec);

  /* カテゴリ */
  var catSec=document.createElement('div');
  catSec.className='nw-legend-sec';
  var catHtml='<div class="nw-legend-title">'+T('categories')+'</div><div class="nw-legend-cat">';
  for(var si=0;si<INDUSTRIES.length;si++){
    var sid=INDUSTRIES[si].id;
    var cnt=sectorCounts[sid]||0;
    if(cnt===0)continue;
    catHtml+='<div class="cat-row" data-sec="'+sid+'">'
      +'<div class="cat-dot" style="background:'+hsl(INDUSTRIES[si].hue)+'"></div>'
      +'<div class="cat-label">'+esc(secName(INDUSTRIES[si]))+'</div>'
      +'<div class="cat-cnt">'+cnt+'</div></div>';
  }
  catHtml+='</div>';
  catSec.innerHTML=catHtml;
  legend.appendChild(catSec);

  /* ノードサイズ */
  var sizeSec=document.createElement('div');
  sizeSec.className='nw-legend-sec';
  sizeSec.innerHTML='<div class="nw-legend-title">'+T('nodeSize')+'</div>'
    +'<div class="nw-legend-size">'
    +'<div class="sz" style="width:14px;height:14px"></div>'
    +'<div class="sz" style="width:22px;height:22px"></div>'
    +'<div class="sz" style="width:32px;height:32px"></div>'
    +'<span>'+T('propToNode')+'</span></div>';
  legend.appendChild(sizeSec);

  stage.appendChild(legend);

  /* category filter click */
  catSec.addEventListener('click',function(ev){
    var row=ev.target.closest('.cat-row');
    if(!row)return;
    var sid=row.getAttribute('data-sec');
    var rows=catSec.querySelectorAll('.cat-row');
    var isActive=row.style.opacity==='';
    if(isActive){
      for(var ri=0;ri<rows.length;ri++)rows[ri].style.opacity=rows[ri]===row?'':'0.3';
      for(var ni=0;ni<nodeEls.length;ni++){
        var ne=nodeEls[ni];
        if(nodes[ne.ni].sector===sid){ne.el.classList.remove('dim');ne.el.classList.add('hi');}
        else{ne.el.classList.add('dim');ne.el.classList.remove('hi');}
      }
      for(var ei=0;ei<edgeEls.length;ei++){
        var ee=edgeEls[ei];
        if(nodes[ee.ai].sector===sid||nodes[ee.bi].sector===sid){
          ee.el.classList.remove('dim');ee.el.classList.add('hi');
          ee.el.style.setProperty('--hi-c',hsl(secIdx[sid].hue));
        }else{ee.el.classList.add('dim');ee.el.classList.remove('hi');}
      }
    }else{
      for(var ri=0;ri<rows.length;ri++)rows[ri].style.opacity='';
      applyHighlight(nwSelected);
    }
  });

  /* bottom bar */
  var bbar=document.createElement('div');
  bbar.className='nw-bottombar';
  bbar.innerHTML='<button title="'+T('nwTooltipPeople')+'">'+T('peopleArrow')+'</button><span class="sep"></span><button title="'+T('nwTooltipAll')+'">'+T('allShow')+'</button>';
  bbar.children[0].onclick=function(){
    if(nwSelected!=null){
      filterBy=nodes[nwSelected].name;viewMode='proposer';vis.clear();vis.add('root');
      buildShell();render();centerView();
    }
  };
  stage.appendChild(bbar);

  /* ── bottom view-mode toggle (bubble ↔ tree) ── */
  var nwStageEl=stage;/* stage IS .nw-stage */
  var vToggle=document.createElement('div');
  vToggle.className='nw-view-toggle';
  var vtGraph=document.createElement('button');
  vtGraph.className='active';
  vtGraph.textContent=_lang==='en'?'⊙ Graph':'⊙ 関係図';
  var vtRel=document.createElement('button');
  vtRel.textContent=_lang==='en'?'↳ Relations':'↳ 関連';
  var vtAcc=document.createElement('button');
  vtAcc.textContent=_lang==='en'?'↳ Accounts':'↳ アカウント';
  vToggle.appendChild(vtGraph);
  vToggle.appendChild(vtRel);
  vToggle.appendChild(vtAcc);
  nwStageEl.appendChild(vToggle);

  function nwSetViewToggle(activeMode){
    vtGraph.className=(activeMode==='graph')?'active':'';
    vtRel.className=(activeMode==='relation')?'active':'';
    vtAcc.className=(activeMode==='account')?'active':'';
  }
  function nwHideViewToggle(){
    vtGraph.className='active';vtRel.className='';vtAcc.className='';
  }
  window._nwViewToggle={show:nwSetViewToggle,hide:nwHideViewToggle};

  vtGraph.onclick=function(){
    var ov=nwStageEl.querySelector('.nw-stage-subview');
    if(ov)ov.remove();
    nwHideViewToggle();

    if(pos[ni].x-r<bMinX)bMinX=pos[ni].x-r;
    if(pos[ni].y-r<bMinY)bMinY=pos[ni].y-r;
    if(pos[ni].x+r>bMaxX)bMaxX=pos[ni].x+r;
    if(pos[ni].y+r>bMaxY)bMaxY=pos[ni].y+r;
  }
  var fitPad=80;
  bMinX-=fitPad;bMinY-=fitPad;bMaxX+=fitPad;bMaxY+=fitPad;
  var fitW=bMaxX-bMinX,fitH=bMaxY-bMinY;
  /* align bubble center with top/bottom bar center (account for 340px detail panel) */
  var detailPanelW=340;
  var extraLeft=fitW*(detailPanelW/(detailPanelW+fitW));

    e.preventDefault();

    var rect=svgWrap.getBoundingClientRect();
    var mx=(e.clientX-rect.left)/rect.width;
    var my=(e.clientY-rect.top)/rect.height;
    var nw=nwVB.w*factor,nh=nwVB.h*factor;
    nw=Math.max(200,Math.min(VW*4,nw));nh=Math.max(150,Math.min(VH*4,nh));
    nwVB.x+=(nwVB.w-nw)*mx;nwVB.y+=(nwVB.h-nh)*my;

  },{passive:false});

  /* ---- render sub-view INTO nw-stage (replaces graph) ---- */

    var tbar=document.createElement('div');
    tbar.className='sv-toggle';

    pill.style.cssText='position:static;bottom:auto;left:auto;transform:none';

    var gLbl=_lang==='en'?'Graph':'関係図';

      +'<button class="ig-toggle-btn'+(mode==='account'?' active':'')+'" data-m="account">'+accIcon+aLbl+'</button>';
    pill.addEventListener('click',function(e){
      var btn=e.target.closest('.ig-toggle-btn');if(!btn)return;

      if(m==='graph'){ov.remove();var bb=wrap.querySelector('button[data-nw-back]');if(bb)bb.style.display='none';if(window._nwViewToggle)window._nwViewToggle.hide();return;}
      if(m!==mode){renderStageSubView(node,m);if(window._nwViewToggle)window._nwViewToggle.show(m);}
    });

    /* ── render existing tree into overlay ── */
    /* save global state */
    var prevFilter=filterBy, prevMode=viewMode, prevVis=new Set(vis);
    filterBy=node.name;
    viewMode=(mode==='relation'?'sector':'proposer');
    vis.clear(); vis.add('root');
    /* expand all L1 so proposals show */
    var treeRoot=buildTree();
    if(treeRoot.children) for(var ci=0;ci<treeRoot.children.length;ci++) vis.add(treeRoot.children[ci].id);
    var lay=doLayout(treeRoot);

    /* create stage/layer/svg inside overlay */
    var miniStage=document.createElement('div');
    miniStage.style.cssText='position:relative;overflow:visible;transform-origin:0 0';

    for(var i=0;i<keys.length;i++){
      var n=lay[keys[i]];
      if(n.x+n.w>maxX)maxX=n.x+n.w;
      if(n.y+n.h>maxY)maxY=n.y+n.h;

      var el=document.createElement('div');

      } else if(n.depth===1){
        var raw=n.raw;
        var secAmt=raw._usdK>0?'<span class="sec-amt">'+fmtJpy(raw._usdK)+'</span>':'';
        var miniBar='';
        if(raw._total){
          var okP=(raw._ok/raw._total*100).toFixed(1);
          var wiP=(raw._wip/raw._total*100).toFixed(1);
          var dnP=(raw._dnf/raw._total*100).toFixed(1);

          if(raw._ok)miniBar+='<div class="mini-bar-seg" style="width:'+okP+'%;background:var(--st-ok)"></div>';
          if(raw._wip)miniBar+='<div class="mini-bar-seg" style="width:'+wiP+'%;background:var(--st-wip)"></div>';

          +secAmt

          +miniBar;
      } else {
        var p=n.raw;
        var ctxTag='';
        if(viewMode==='proposer'&&p.sector){
          ctxTag='<span class="cat-tag" style="color:var(--ink);border:1px solid var(--border)">'+esc(trunc(p.sector,20))+'</span>';
        } else if(p.by){

        if(p.yt)lkIcons+='<span class="lk-icon" title="YouTube" data-href="'+esc(p.yt)+'">▶</span>';
        if(p.report)lkIcons+='<span class="lk-icon lk-cr" title="'+T('completionReport')+'" data-report="'+esc(p.id)+'">CR</span>';
        card.innerHTML='<div class="row"><span class="st-dot" style="background:'+stColor(p.st)+'"></span>'
          +'<div class="label">'+esc(n.label)+'</div>'
          +(lkIcons?'<span class="lk-row">'+lkIcons+'</span>':'')
          +'<span class="amount">'+fmtDual(p.amt,p.u,p.adaPrice)+'</span></div>'
          +'<div class="row">'+stBadge(p.st)+clsTag(p.cls)+fTag+ctxTag+rTag
          +'<span class="cat-tag">'+esc(trunc(p.ch,28))+'</span></div>';
      }

      /* clicks */
      (function(nid,depth,raw){card.onclick=function(e){
        e.stopPropagation();
        var lki=e.target.closest('.lk-icon');
        if(lki){var href=lki.getAttribute('data-href');if(href)window.open(href,'_blank');return;}
        if(depth===2&&raw) openInLens(raw);
      };})(n.id,n.depth,n.depth===2?n.raw:null);

      el.appendChild(card);
      miniLayer.appendChild(el);

      /* bezier line to parent */
      if(n.parent&&lay[n.parent]){
        var pn=lay[n.parent];
        var x1=pn.x+pn.w, y1=pn.y+pn.h/2;
        var x2=n.x, y2=n.y+n.h/2;
        var path=document.createElementNS(svgNS,'path');
        path.setAttribute('d',pathD(x1,y1,x2,y2));
        path.setAttribute('fill','none');
        path.setAttribute('stroke',n.hue!=null?hsl(n.hue):'var(--border)');
        path.setAttribute('stroke-width','1.5');
        path.setAttribute('opacity','0.4');
        miniSvg.appendChild(path);
      }
    }

    miniSvg.setAttribute('width',maxX+200);
    miniSvg.setAttribute('height',maxY+200);
    miniStage.style.width=(maxX+200)+'px';
    miniStage.style.height=(maxY+200)+'px';
    miniStage.appendChild(miniSvg);
    miniStage.appendChild(miniLayer);
    ov.appendChild(miniStage);

    /* restore global state */
    filterBy=prevFilter; viewMode=prevMode; vis=prevVis;

    nwStage.appendChild(ov);

    /* ── zoom / pan ── */
    var svZ=1, svPX=0, svPY=0;
    function svApply(){
      var tfm='translate('+svPX+'px,'+svPY+'px) scale('+svZ+')';
      miniLayer.style.transform=tfm;
      miniSvg.style.transform=tfm;
    }
    /* auto-fit: scale down to fit stage */
    var stageW=nwStage.offsetWidth, stageH=nwStage.offsetHeight-50;/* 50 for toggle */
    var treeW=maxX+200, treeH=maxY+200;
    svZ=Math.min(1,Math.min(stageW/treeW,stageH/treeH)*0.9);
    svPX=Math.max(10,(stageW-treeW*svZ)/2);
    svPY=10;
    svApply();

    /* wheel zoom */
    ov.addEventListener('wheel',function(e){
      e.preventDefault();
      var d=e.deltaY>0?-0.05:0.05;
      var oldZ=svZ;
      svZ=Math.max(0.15,Math.min(2,svZ+d));
      /* zoom toward cursor */
      var rect=ov.getBoundingClientRect();
      var mx=e.clientX-rect.left, my=e.clientY-rect.top;
      svPX+=(mx-svPX)*(1-svZ/oldZ);
      svPY+=(my-svPY)*(1-svZ/oldZ);
      svApply();
    },{passive:false});

    /* drag pan */
    var svDrag=false, svDX=0, svDY=0;
    ov.addEventListener('pointerdown',function(e){
      if(e.target.closest('.node-card')||e.target.closest('.ig-toggle'))return;
      svDrag=true; svDX=e.clientX; svDY=e.clientY;
      ov.style.cursor='grabbing';
    });
    ov.addEventListener('pointermove',function(e){
      if(!svDrag)return;
      svPX+=e.clientX-svDX; svPY+=e.clientY-svDY;
      svDX=e.clientX; svDY=e.clientY;
      svApply();
    });
    ov.addEventListener('pointerup',function(){svDrag=false;ov.style.cursor='';});
  }

  renderDetail(null);
}

function showEdgePopup(edge,x,y){
  var popup=document.getElementById('nw-popup');
  if(!popup)return;
  popup.innerHTML='';
  popup.className='nw-popup open';

  var mxX=stage?stage.clientWidth-300:500;
  var mxY=stage?stage.clientHeight-200:400;
  popup.style.left=Math.min(Math.max(10,x+10),mxX)+'px';
  popup.style.top=Math.min(Math.max(10,y+10),mxY)+'px';

  var title=document.createElement('div');
  title.className='nw-popup-title';
  title.textContent=edge.a+' × '+edge.b;
  popup.appendChild(title);

  for(var i=0;i<edge.proposals.length;i++){

    var item=document.createElement('div');

    var pLk='';

      if(p.x)pLk+='<span class="lk-icon" title="X" data-href="'+esc(p.x)+'">𝕏</span>';
      if(p.yt)pLk+='<span class="lk-icon" title="YouTube" data-href="'+esc(p.yt)+'">▶</span>';
      if(p.report)pLk+='<span class="lk-icon lk-cr" title="'+T('completionReport')+'" data-report="'+esc(p.id)+'">CR</span>';
      pLk+='</span>';
    }
    item.innerHTML='<div style="display:flex;align-items:center;gap:4px"><div class="nw-popup-item-label" style="flex:1;min-width:0">'+esc(pLabel(p))+'</div>'+pLk+'</div>'
      +'<div class="nw-popup-item-meta">'+stBadge(p.st)
      +'<span>F'+(p.fund||'?')+'</span>'
      +'<span>'+fmtAmt(p.amt,p.u)+'</span></div>';
    (function(pr){item.onclick=function(ev){
      var lki=ev.target.closest('.lk-icon');
      if(lki){
        ev.stopPropagation();
        var href=lki.getAttribute('data-href');
        var reportId=lki.getAttribute('data-report');
        if(href){
          window.open(href,'_blank');
        }else if(reportId){
          var crUrl='https://catalystexplorer.com/proposals?search='+encodeURIComponent(pr.label);
          window.open(crUrl,'_blank');
        }
        return;
      }
      ev.stopPropagation();openInLens(pr);
    };})(p);
    popup.appendChild(item);
  }
}

/* ================================================================
   EXPAND ALL
   ================================================================ */
function toggleExpandAll(){
  var tree=buildTree();
  if(!tree.children||!tree.children.length)return;
  var hasRoot=vis.has('root');
  var hasL2=false;
  if(hasRoot){
    for(var i=0;i<tree.children.length;i++){if(vis.has(tree.children[i].id)){hasL2=true;break;}}
  }
  if(!hasRoot){
    /* step 1: open L1 */
    vis.clear();vis.add('root');
  } else if(!hasL2){
    /* step 2: open L2 */
    for(var i=0;i<tree.children.length;i++) vis.add(tree.children[i].id);
  } else {
    /* step 3: close all */
    vis.clear();
  }
  render();
}

      }
    }
  }

  function saveKeys(){
    var keys={};
    for(var i=0;i<providers.length;i++){
      var inp=document.getElementById('key-'+providers[i]);
      if(inp&&inp.value.trim())keys[providers[i]]=inp.value.trim();
    }

    loadKeys();
    overlay.classList.remove('open');

  document.addEventListener('click',function(e){var g=e.target.closest('#api-gear-btn');if(g){loadKeys();overlay.classList.add('open');}});
  closeBtn.onclick=function(){overlay.classList.remove('open');};

  overlay.onclick=function(e){if(e.target===overlay)overlay.classList.remove('open');};
})();

/* ================================================================
   LIVE PRICE API (CoinGecko)
   現在のADA価格 + 各Fund提案時/採択時の過去価格を取得し全額を再計算
   ================================================================ */
/* 全統計を再計算 (FUND_PRICES 更新後に呼ぶ) */
function recalcAll(){
  var src=_priceMode==='result'?FUND_RESULT_PRICES:FUND_SUBMIT_PRICES;
  for(var k in src) FUND_PRICES[k]=src[k];
  /* 1) adaPrice を再セット */
  for(var i=0;i<INDUSTRIES.length;i++){
    for(var j=0;j<INDUSTRIES[i].children.length;j++){
      var p=INDUSTRIES[i].children[j];
      p.adaPrice=FUND_PRICES[p.fund]||ADA_USD;
    }
  }
  /* 2) グローバル集計やり直し */
  TOTAL_USD_K=0;TOTAL_ADA=0;TOTAL_FUNDED=0;TOTAL_COMPLETED=0;TOTAL_PROGRESS=0;TOTAL_DNF=0;
  for(var i2=0;i2<INDUSTRIES.length;i2++){
    var ind=INDUSTRIES[i2],ok=0,wip=0,dnf=0,secK=0;
    for(var j2=0;j2<ind.children.length;j2++){
      var q=ind.children[j2];
      var uK=q.u==='ada'?q.amt*q.adaPrice:q.amt;
      if(q.st==='complete'){ok++;TOTAL_COMPLETED++;}
      else if(q.st==='progress'){wip++;TOTAL_PROGRESS++;}
      else{dnf++;TOTAL_DNF++;}
      TOTAL_FUNDED++;TOTAL_USD_K+=uK;secK+=uK;
      TOTAL_ADA+=q.u==='ada'?q.amt:q.amt/(q.adaPrice||ADA_USD);
    }
    ind._ok=ok;ind._wip=wip;ind._dnf=dnf;ind._total=ok+wip+dnf;ind._usdK=secK;
  }
  AVG_USD_K=TOTAL_FUNDED?Math.round(TOTAL_USD_K/TOTAL_FUNDED):0;
  console.log('[CJ] Recalculated ('+_priceMode+'): TOTAL_USD_K='+TOTAL_USD_K.toFixed(1)+' TOTAL_ADA='+Math.round(TOTAL_ADA));
}

/* 価格モード切替 */
function setPriceMode(mode){
  _priceMode=mode;recalcAll();buildShell();
  if(viewMode==='network')renderNetwork();else if(viewMode==='timeline')renderTimeline();else if(viewMode==='chart')renderChart();else render();
}

(function(){
  /* 1) 現在のADA価格 + USD/JPYを取得 */
  function fetchCurrentPrice(){
    return fetch('https://api.coingecko.com/api/v3/simple/price?ids=cardano&vs_currencies=usd,jpy')
      .then(function(r){return r.json()}).then(function(d){
        if(d&&d.cardano){
          if(d.cardano.usd) ADA_USD=d.cardano.usd;
          if(d.cardano.jpy&&d.cardano.usd) USD_JPY=d.cardano.jpy/d.cardano.usd;
          console.log('[CJ] Live prices: ADA=$'+ADA_USD+' USD/JPY='+USD_JPY.toFixed(1));
        }
      });
  }

  /* 2) 両セットのFund価格を取得 (提案時 + 採択時) */
  function fetchFundPrices(){
    var allDates={};
    var sf=Object.keys(FUND_SUBMIT_DATES);
    var rf=Object.keys(FUND_RESULT_DATES);
    for(var i=0;i<sf.length;i++) allDates['s:'+sf[i]]=FUND_SUBMIT_DATES[sf[i]];
    for(var j=0;j<rf.length;j++) allDates['r:'+rf[j]]=FUND_RESULT_DATES[rf[j]];
    var keys=Object.keys(allDates);
    var done=0,total=keys.length;
    keys.forEach(function(key,idx){
      setTimeout(function(){
        var date=allDates[key];
        var parts=key.split(':');
        var type=parts[0],fund=parts[1];
        fetch('https://api.coingecko.com/api/v3/coins/cardano/history?date='+date+'&localization=false')
          .then(function(r){return r.json()}).then(function(d){
            if(d&&d.market_data&&d.market_data.current_price){
              var p=d.market_data.current_price.usd;
              if(p){
                if(type==='s') FUND_SUBMIT_PRICES[fund]=p;
                else FUND_RESULT_PRICES[fund]=p;
                console.log('[CJ] F'+fund+' '+(type==='s'?'submit':'result')+' ('+date+'): $'+p.toFixed(4));
              }
            }
          }).catch(function(){/* use fallback */})
          .finally(function(){
            done++;
            if(done>=total){
              recalcAll();
              /* Chart mode: don't rebuild — user may have selection/panel open.
                 Just update header price display. Full rebuild destroys bottom+right panels. */
              if(viewMode==='chart'){
                var pe=document.querySelector('.ch-price');
                if(pe) pe.textContent='$'+ADA_USD.toFixed(4);
                var ps=document.querySelector('.ch-price-sub');
                if(ps) ps.textContent='≈ ¥'+(ADA_USD*USD_JPY).toFixed(2);
                console.log('[CJ] Fund prices updated (chart data refreshed, UI preserved)');
              } else {
                buildShell();
                if(viewMode==='network')renderNetwork();else if(viewMode==='timeline')renderTimeline();else render();
                console.log('[CJ] All fund prices updated (submit+result)');
              }
            }
          });
      }, idx*500);
    });
  }

  /* 起動: 現在価格→Fund過去価格の順 */
  fetchCurrentPrice()
    .then(function(){fetchFundPrices();})
    .catch(function(e){
      console.log('[CJ] Price fetch failed, using defaults',e);
      fetchFundPrices();
    });
})();
</script>
