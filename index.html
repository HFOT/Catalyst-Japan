        +clsTag(pr.cls)
        +'<span class="cat-tag fund-tag">F'+(pr.fund||'?')+'</span>'
        +'<span>'+fmtAmt(pr.amt,pr.u)+'</span>'
        +(pr.role&&pr.role!=='提案者'?'<span style="color:var(--accent)">'+esc(roleName(pr.role))+'</span>':'')
        +'</div>';
      (function(p){row.onclick=function(e){
        if(e.target.closest('.lk'))return;
        openInLens(p);
      };})(pr);
      sec.appendChild(row);
    }
    /* link button click handler (delegation) */
    sec.addEventListener('click',function(e){
      var btn=e.target.closest('.lk');
      if(!btn)return;
      e.stopPropagation();
      var href=btn.getAttribute('data-href');
      var reportId=btn.getAttribute('data-report');
      if(href){
        window.open(href,'_blank');
      }else if(reportId){
        var pr=null;
        for(var ii=0;ii<INDUSTRIES.length&&!pr;ii++)
          for(var jj=0;jj<INDUSTRIES[ii].children.length;jj++)
            if(INDUSTRIES[ii].children[jj].id===reportId){pr=INDUSTRIES[ii].children[jj];break;}
        if(pr){
          var crUrl='https://catalystexplorer.com/proposals?search='+encodeURIComponent(pr.label);
          window.open(crUrl,'_blank');
        }
      }
    });
    d.appendChild(sec);

    /* connections section */
    var myAdj=adjSets[nameIdx[node.name]];
    if(myAdj&&myAdj.size>0){
      var csec=document.createElement('div');
      csec.className='nw-detail-sec';
      csec.innerHTML='<h4>'+T('connLabel')+' ('+myAdj.size+')</h4>';
      myAdj.forEach(function(ci){
        var cn=nodes[ci];
        var cr=document.createElement('div');
        cr.className='nw-conn-row';
        cr.style.setProperty('--c',hsl(cn.hue));
        var cIni=cn.name.charAt(0);if(/[a-zA-Z]/.test(cIni))cIni=cIni.toUpperCase();
        /* shared proposal count */
        var shared=0;
        for(var ei=0;ei<edges.length;ei++){
          if((edges[ei].a===node.name&&edges[ei].b===cn.name)||(edges[ei].b===node.name&&edges[ei].a===cn.name))
            shared=edges[ei].proposals.length;
        }
        cr.innerHTML='<div class="nw-conn-av">'+cIni+'</div>'
          +'<div><div class="nw-conn-name">'+esc(cn.name)+'</div></div>'
          +'<div class="nw-conn-cnt">'+shared+T('sharedN')+'</div>';
        (function(idx){cr.onclick=function(){selectNode(idx);};})(ci);
        csec.appendChild(cr);
      });
      d.appendChild(csec);
    }
  }

  /* ---- render sub-view INTO nw-stage (replaces graph) ---- */
  function renderStageSubView(node,mode){
    var nwStage=wrap.querySelector('.nw-stage');
    if(!nwStage)return;
    var oldOv=nwStage.querySelector('.nw-stage-subview');
    if(oldOv)oldOv.remove();

    var ov=document.createElement('div');
    ov.className='nw-stage-subview';
    ov.addEventListener('pointerdown',function(e){e.stopPropagation();});
    ov.addEventListener('wheel',function(e){e.stopPropagation();},{passive:true});

    /* ── 3-way toggle (sticky top) ── */
    var tbar=document.createElement('div');
    tbar.className='sv-toggle';
    var pill=document.createElement('div');
    pill.className='ig-toggle';
    pill.style.cssText='position:static;bottom:auto;left:auto;transform:none';
    var graphIcon='<svg viewBox="0 0 16 16"><circle cx="4" cy="4" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><line x1="6" y1="4" x2="10" y2="4"/><line x1="4" y1="6" x2="4" y2="10"/><line x1="12" y1="6" x2="12" y2="10"/><line x1="6" y1="5" x2="10" y2="11"/></svg>';
    var relIcon='<svg viewBox="0 0 16 16"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="10" y="1" width="5" height="5" rx="1"/><rect x="1" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/></svg>';
    var accIcon='<svg viewBox="0 0 16 16"><line x1="1" y1="3" x2="15" y2="3"/><line x1="1" y1="7" x2="15" y2="7"/><line x1="1" y1="11" x2="15" y2="11"/><line x1="1" y1="15" x2="12" y2="15"/></svg>';
    var gLbl=_lang==='en'?'Graph':'関係図';
    var rLbl=_lang==='en'?'Relations':'関連';
    var aLbl=_lang==='en'?'Accounts':'アカウント';
    pill.innerHTML='<button class="ig-toggle-btn" data-m="graph">'+graphIcon+gLbl+'</button>'
      +'<button class="ig-toggle-btn'+(mode==='relation'?' active':'')+'" data-m="relation">'+relIcon+rLbl+'</button>'
      +'<button class="ig-toggle-btn'+(mode==='account'?' active':'')+'" data-m="account">'+accIcon+aLbl+'</button>';
    pill.addEventListener('click',function(e){
      var btn=e.target.closest('.ig-toggle-btn');if(!btn)return;
      var m=btn.getAttribute('data-m');
      if(m==='graph'){ov.remove();var bb=wrap.querySelector('button[data-nw-back]');if(bb)bb.style.display='none';if(window._nwViewToggle)window._nwViewToggle.hide();return;}
      if(m!==mode){renderStageSubView(node,m);if(window._nwViewToggle)window._nwViewToggle.show(m);}
    });
    tbar.appendChild(pill);
    ov.appendChild(tbar);

    /* ── render existing tree into overlay ── */
    /* save global state */
    var prevFilter=filterBy, prevMode=viewMode, prevVis=new Set(vis);
    filterBy=node.name;
    viewMode=(mode==='relation'?'sector':'proposer');
    vis.clear(); vis.add('root');
    /* expand all L1 so proposals show */
    var treeRoot=buildTree();
    if(treeRoot.children) for(var ci=0;ci<treeRoot.children.length;ci++) vis.add(treeRoot.children[ci].id);
    var lay=doLayout(treeRoot);

    /* create stage/layer/svg inside overlay */
    var miniStage=document.createElement('div');
    miniStage.style.cssText='position:relative;overflow:visible;transform-origin:0 0';
    var miniLayer=document.createElement('div');
    miniLayer.style.cssText='position:absolute;left:0;top:0;transform-origin:0 0';
    var svgNS='http://www.w3.org/2000/svg';
    var miniSvg=document.createElementNS(svgNS,'svg');
    miniSvg.style.cssText='position:absolute;left:0;top:0;overflow:visible;pointer-events:none;transform-origin:0 0';

    var keys=Object.keys(lay);
    var maxX=0,maxY=0;

    for(var i=0;i<keys.length;i++){
      var n=lay[keys[i]];
      if(n.x+n.w>maxX)maxX=n.x+n.w;
      if(n.y+n.h>maxY)maxY=n.y+n.h;

      var el=document.createElement('div');
      var clsCls=(n.depth===2&&n.raw&&n.raw.cls&&n.raw.cls!=='main')?' cls-'+n.raw.cls:'';
      el.className='node'+(n.depth===0?' root':n.depth===1?' l1':' l2')+clsCls;
      el.style.cssText='left:'+n.x+'px;top:'+n.y+'px;';

      var card=document.createElement('div');
      card.className='node-card expanded';
      card.style.setProperty('--c',n.hue!=null?hsl(n.hue):'var(--ink)');

      if(n.depth===0){
        card.innerHTML='<div class="sub">'+esc(node.props.length+T('propsOf')+' · '+fmtJpy(node.soloUsdK+node.coUsdK))+'</div><div class="label">'+esc(node.name)+'</div>';
      } else if(n.depth===1){
        var raw=n.raw;
        var secAmt=raw._usdK>0?'<span class="sec-amt">'+fmtJpy(raw._usdK)+'</span>':'';
        var miniBar='';
        if(raw._total){
          var okP=(raw._ok/raw._total*100).toFixed(1);
          var wiP=(raw._wip/raw._total*100).toFixed(1);
          var dnP=(raw._dnf/raw._total*100).toFixed(1);
          miniBar='<div class="mini-bar">';
          if(raw._ok)miniBar+='<div class="mini-bar-seg" style="width:'+okP+'%;background:var(--st-ok)"></div>';
          if(raw._wip)miniBar+='<div class="mini-bar-seg" style="width:'+wiP+'%;background:var(--st-wip)"></div>';
          if(raw._dnf)miniBar+='<div class="mini-bar-seg" style="width:'+dnP+'%;background:var(--st-dnf)"></div>';
          miniBar+='</div>';
        }
        card.innerHTML='<div class="row"><div class="label">'+esc(n.label)+'</div>'
          +secAmt
          +'<span class="cat-tag">'+raw._total+' proposals</span></div>'
          +miniBar;
      } else {
        var p=n.raw;
        var ctxTag='';
        if(viewMode==='proposer'&&p.sector){
          ctxTag='<span class="cat-tag" style="color:var(--ink);border:1px solid var(--border)">'+esc(trunc(p.sector,20))+'</span>';
        } else if(p.by){
          ctxTag='<span class="cat-tag" style="color:var(--ink);border:1px solid var(--border)">'+esc(p.by)+'</span>';
        }
        var myRole=p._teamRole||p.role;
        var rTag=myRole&&myRole!=='提案者'&&myRole!=='仲介'?roleTag(myRole):'';
        var fTag=p.fund?'<span class="cat-tag fund-tag">F'+p.fund+'</span>':'';
        var lkIcons='';
        if(p.url)lkIcons+='<span class="lk-icon" title="Project" data-href="'+esc(p.url)+'">↗</span>';
        if(p.x)lkIcons+='<span class="lk-icon" title="X" data-href="'+esc(p.x)+'">𝕏</span>';
        if(p.yt)lkIcons+='<span class="lk-icon" title="YouTube" data-href="'+esc(p.yt)+'">▶</span>';
        if(p.report)lkIcons+='<span class="lk-icon lk-cr" title="'+T('completionReport')+'" data-report="'+esc(p.id)+'">CR</span>';
        card.innerHTML='<div class="row"><span class="st-dot" style="background:'+stColor(p.st)+'"></span>'
          +'<div class="label">'+esc(n.label)+'</div>'
          +(lkIcons?'<span class="lk-row">'+lkIcons+'</span>':'')
          +'<span class="amount">'+fmtDual(p.amt,p.u,p.adaPrice)+'</span></div>'
          +'<div class="row">'+stBadge(p.st)+clsTag(p.cls)+fTag+ctxTag+rTag
          +'<span class="cat-tag">'+esc(trunc(p.ch,28))+'</span></div>';
      }

      /* clicks */
      (function(nid,depth,raw){card.onclick=function(e){
        e.stopPropagation();
        var lki=e.target.closest('.lk-icon');
        if(lki){var href=lki.getAttribute('data-href');if(href)window.open(href,'_blank');return;}
        if(depth===2&&raw) openInLens(raw);
      };})(n.id,n.depth,n.depth===2?n.raw:null);

      el.appendChild(card);
      miniLayer.appendChild(el);

      /* bezier line to parent */
      if(n.parent&&lay[n.parent]){
        var pn=lay[n.parent];
        var x1=pn.x+pn.w, y1=pn.y+pn.h/2;
        var x2=n.x, y2=n.y+n.h/2;
        var path=document.createElementNS(svgNS,'path');
        path.setAttribute('d',pathD(x1,y1,x2,y2));
        path.setAttribute('fill','none');
        path.setAttribute('stroke',n.hue!=null?hsl(n.hue):'var(--border)');
        path.setAttribute('stroke-width','1.5');
        path.setAttribute('opacity','0.4');
        miniSvg.appendChild(path);
      }
    }

    miniSvg.setAttribute('width',maxX+200);
    miniSvg.setAttribute('height',maxY+200);
    miniStage.style.width=(maxX+200)+'px';
    miniStage.style.height=(maxY+200)+'px';
    miniStage.appendChild(miniSvg);
    miniStage.appendChild(miniLayer);
    ov.appendChild(miniStage);

    /* restore global state */
    filterBy=prevFilter; viewMode=prevMode; vis=prevVis;

    nwStage.appendChild(ov);

    /* ── zoom / pan ── */
    var svZ=1, svPX=0, svPY=0;
    function svApply(){
      var tfm='translate('+svPX+'px,'+svPY+'px) scale('+svZ+')';
      miniLayer.style.transform=tfm;
      miniSvg.style.transform=tfm;
    }
    /* auto-fit: scale down to fit stage */
    var stageW=nwStage.offsetWidth, stageH=nwStage.offsetHeight-50;/* 50 for toggle */
    var treeW=maxX+200, treeH=maxY+200;
    svZ=Math.min(1,Math.min(stageW/treeW,stageH/treeH)*0.9);
    svPX=Math.max(10,(stageW-treeW*svZ)/2);
    svPY=10;
    svApply();

    /* wheel zoom */
    ov.addEventListener('wheel',function(e){
      e.preventDefault();
      var d=e.deltaY>0?-0.05:0.05;
      var oldZ=svZ;
      svZ=Math.max(0.15,Math.min(2,svZ+d));
      /* zoom toward cursor */
      var rect=ov.getBoundingClientRect();
      var mx=e.clientX-rect.left, my=e.clientY-rect.top;
      svPX+=(mx-svPX)*(1-svZ/oldZ);
      svPY+=(my-svPY)*(1-svZ/oldZ);
      svApply();
    },{passive:false});

    /* drag pan */
    var svDrag=false, svDX=0, svDY=0;
    ov.addEventListener('pointerdown',function(e){
      if(e.target.closest('.node-card')||e.target.closest('.ig-toggle'))return;
      svDrag=true; svDX=e.clientX; svDY=e.clientY;
      ov.style.cursor='grabbing';
    });
    ov.addEventListener('pointermove',function(e){
      if(!svDrag)return;
      svPX+=e.clientX-svDX; svPY+=e.clientY-svDY;
      svDX=e.clientX; svDY=e.clientY;
      svApply();
    });
    ov.addEventListener('pointerup',function(){svDrag=false;ov.style.cursor='';});
  }

  renderDetail(null);
}

function showEdgePopup(edge,x,y){
  var popup=document.getElementById('nw-popup');
  if(!popup)return;
  popup.innerHTML='';
  popup.className='nw-popup open';
  var stage=popup.parentElement;
  var mxX=stage?stage.clientWidth-300:500;
  var mxY=stage?stage.clientHeight-200:400;
  popup.style.left=Math.min(Math.max(10,x+10),mxX)+'px';
  popup.style.top=Math.min(Math.max(10,y+10),mxY)+'px';

  var title=document.createElement('div');
  title.className='nw-popup-title';
  title.textContent=edge.a+' × '+edge.b;
  popup.appendChild(title);

  for(var i=0;i<edge.proposals.length;i++){
    var p=edge.proposals[i];
    var item=document.createElement('div');
    item.className='nw-popup-item';
    var pLk='';
    if(p.url||p.x||p.yt||p.report){
      pLk='<span class="lk-row" style="margin-left:auto">';
      if(p.url)pLk+='<span class="lk-icon" title="Project" data-href="'+esc(p.url)+'">↗</span>';
      if(p.x)pLk+='<span class="lk-icon" title="X" data-href="'+esc(p.x)+'">𝕏</span>';
      if(p.yt)pLk+='<span class="lk-icon" title="YouTube" data-href="'+esc(p.yt)+'">▶</span>';
      if(p.report)pLk+='<span class="lk-icon lk-cr" title="'+T('completionReport')+'" data-report="'+esc(p.id)+'">CR</span>';
      pLk+='</span>';
    }
    item.innerHTML='<div style="display:flex;align-items:center;gap:4px"><div class="nw-popup-item-label" style="flex:1;min-width:0">'+esc(pLabel(p))+'</div>'+pLk+'</div>'
      +'<div class="nw-popup-item-meta">'+stBadge(p.st)
      +'<span>F'+(p.fund||'?')+'</span>'
      +'<span>'+fmtAmt(p.amt,p.u)+'</span></div>';
    (function(pr){item.onclick=function(ev){
      var lki=ev.target.closest('.lk-icon');
      if(lki){
        ev.stopPropagation();
        var href=lki.getAttribute('data-href');
        var reportId=lki.getAttribute('data-report');
        if(href){
          window.open(href,'_blank');
        }else if(reportId){
          var crUrl='https://catalystexplorer.com/proposals?search='+encodeURIComponent(pr.label);
          window.open(crUrl,'_blank');
        }
        return;
      }
      ev.stopPropagation();openInLens(pr);
    };})(p);
    popup.appendChild(item);
  }
}

/* ================================================================
   EXPAND ALL
   ================================================================ */
function toggleExpandAll(){
  var tree=buildTree();
  if(!tree.children||!tree.children.length)return;
  var hasRoot=vis.has('root');
  var hasL2=false;
  if(hasRoot){
    for(var i=0;i<tree.children.length;i++){if(vis.has(tree.children[i].id)){hasL2=true;break;}}
  }
  if(!hasRoot){
    /* step 1: open L1 */
    vis.clear();vis.add('root');
  } else if(!hasL2){
    /* step 2: open L2 */
    for(var i=0;i<tree.children.length;i++) vis.add(tree.children[i].id);
  } else {
    /* step 3: close all */
    vis.clear();
  }
  render();
}

function centerView(){
  var stage=document.querySelector('.stage');
  if(!stage)return;
  var sw=stage.clientWidth,sh=stage.clientHeight;
  panX=120;panY=60;
  zoom=1;setTfm();
}

buildShell();
render();
centerView();

window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='theme-change'){
    if(e.data.dark)document.documentElement.classList.add('night');
    else document.documentElement.classList.remove('night');
    NIGHT=!!e.data.dark;render();
  }
});

/* ================================================================
   API SETTINGS MODAL
   ================================================================ */
(function(){
  var overlay=document.getElementById('api-modal-overlay');
  var saveBtn=document.getElementById('api-modal-save');
  var closeBtn=document.getElementById('api-modal-close');
  var providers=['claude','grok','gemini','groq','openrouter'];

  function loadKeys(){
    var keys={};
    try{keys=JSON.parse(localStorage.getItem('catalyst_apikeys')||'{}');}catch(e){}
    for(var i=0;i<providers.length;i++){
      var inp=document.getElementById('key-'+providers[i]);
      var dot=document.getElementById('dot-'+providers[i]);
      if(inp)inp.value=keys[providers[i]]||'';
      if(dot){
        if(keys[providers[i]])dot.classList.add('active');
        else dot.classList.remove('active');
      }
    }
  }

  function saveKeys(){
    var keys={};
    for(var i=0;i<providers.length;i++){
      var inp=document.getElementById('key-'+providers[i]);
      if(inp&&inp.value.trim())keys[providers[i]]=inp.value.trim();
    }
    localStorage.setItem('catalyst_apikeys',JSON.stringify(keys));
    loadKeys();
    overlay.classList.remove('open');
  }

  document.addEventListener('click',function(e){var g=e.target.closest('#api-gear-btn');if(g){loadKeys();overlay.classList.add('open');}});
  closeBtn.onclick=function(){overlay.classList.remove('open');};
  saveBtn.onclick=saveKeys;
  overlay.onclick=function(e){if(e.target===overlay)overlay.classList.remove('open');};
})();
</script>
