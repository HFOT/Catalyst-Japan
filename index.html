<script>
/* ================================================================
   CATALYST JAPAN — CIGNAL OS
   Horizontal Tree Map · Impact Report
   ================================================================ */
var COL=520, ROW=52, GAP=3, DUR=350;

/* ---- Night mode ---- */
var NIGHT=(function(){
  /* URL param wins over everything — lets the catalog deep-link into a specific theme
     (e.g. catalog tabs / panel-view iframes pass ?theme=light when the user is in light mode) */
  try{
    var qp=new URLSearchParams(location.search).get('theme');
    if(qp==='light') return false;
    if(qp==='dark')  return true;
  }catch(e){}
  /* User's explicit preference takes priority */
  try{
    var pref=localStorage.getItem('cj-theme');
    if(pref==='light') return false;
    if(pref==='dark') return true;
  }catch(e){}
  if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches) return true;
  var cs=window.getComputedStyle(document.documentElement);
  var bg=cs.backgroundColor||'';
  var m=bg.match(/\d+/g);
  if(m&&m.length>=3){var lum=(parseInt(m[0])*299+parseInt(m[1])*587+parseInt(m[2])*114)/1000;if(lum<50)return true}
  return false;
})();
if(NIGHT)document.documentElement.classList.add('night');

/* ---- Helpers ---- */
var ADA_USD=0.27, USD_JPY=150;
var _amtMode='ada'; /* 'auto'=follow _lang | 'jpy' | 'usd' | 'ada' */
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
function trunc(s,m){if(!s)return'';s=s.replace(/\s+/g,' ').trim();return s.length>m?s.slice(0,m-1)+'…':s}
function fmtK(n){if(!n&&n!==0)return'0';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n>=1?Math.round(n).toLocaleString():n.toFixed(2);}
function hsl(h){return 'hsl('+h+' 50% '+(NIGHT?'58':'44')+'%)'}
function _curMode(){return _amtMode==='auto'?(_lang==='en'?'usd':'jpy'):_amtMode}
function fmtAmt(v,u){
  if(u==='ada'){
    if(v>=1000) return (v/1000).toFixed(1)+'M ₳';
    return v+'K ₳';
  }
  if(v>=1000) return '$'+(v/1000).toFixed(v%1000?1:0)+'M';
  if(v<1) return '$'+Math.round(v*1000);
  return '$'+v+'K';
}
function fmtJpy(usdK){
  var mode=_curMode();
  if(mode==='ada'){
    var ada=usdK/ADA_USD;
    if(ada>=1e3) return (ada/1e3).toFixed(1)+'M ₳';
    if(ada>=1) return Math.round(ada)+'K ₳';
    return Math.round(ada*1e3)+' ₳';
  }
  if(mode==='usd'){
    if(usdK>=1000) return '$'+(usdK/1000).toFixed(1)+'M';
    if(usdK>=1) return '$'+Math.round(usdK)+'K';
    return '$'+(usdK*1000).toFixed(0);
  }
  var jpy=usdK*1000*USD_JPY;
  if(jpy>=1e8) return '¥'+(jpy/1e8).toFixed(1)+'億';
  if(jpy>=1e4) return '¥'+Math.round(jpy/1e4)+'万';
  return '¥'+Math.round(jpy);
}
function fmtDual(v,u,adaP){
  var ap=adaP||ADA_USD;
  var mode=_curMode();
  if(mode==='ada'){
    /* ADA mode: main=ADA, sub=fiat */
    var ada=u==='ada'?v:v/ap;
    var main=ada>=1000?(ada/1000).toFixed(1)+'M ₳':Math.round(ada)+'K ₳';
    var usdK=u==='ada'?v*ap:v;
    var sub=_lang==='en'?('$'+(usdK>=1000?(usdK/1000).toFixed(1)+'M':Math.round(usdK)+'K')):(function(){var j=usdK*1000*USD_JPY;return j>=1e8?'¥'+(j/1e8).toFixed(1)+'億':'¥'+Math.round(j/1e4)+'万'})();
    return main+'<span class="amt-sub">'+sub+'</span>';
  }
  var main=fmtAmt(v,u);
  var sub;
  if(u==='ada'){
    sub=fmtJpy(v*ap);
  } else {
    var ada=v/ap;
    sub=ada>=1000?(ada/1000).toFixed(1)+'M ₳':Math.round(ada)+'K ₳';
  }
  return main+'<span class="amt-sub">'+sub+'</span>';
}
/* ---- i18n ---- */

  try{
    var qp=new URLSearchParams(location.search).get('lang');
    if(qp==='en') return 'en';
    if(qp==='jp'||qp==='ja') return 'jp';
  }catch(e){}
  return 'jp';
})();
var _i18n={
  complete:{ja:'完了',en:'Completed'},progress:{ja:'進行中',en:'In Progress'},dnf:{ja:'中止',en:'Discontinued'},
  main:{ja:'メイン',en:'Main'},co:{ja:'共同提案者',en:'Co-proposer'},bridge:{ja:'仲介',en:'Bridge'},
  solo:{ja:'単独',en:'Solo'},coLabel:{ja:'共同提案者',en:'Co-proposer'},allCo:{ja:'全て共同提案',en:'All co-proposed'},
  totalInvolved:{ja:'関与総額',en:'Involved total'},totalInvolvedLong:{ja:'関与提案の総額',en:'Total value of involved proposals'},
  proposalInfo:{ja:'提案情報',en:'Proposal Info'},challenge:{ja:'チャレンジ',en:'Challenge'},
  team:{ja:'チーム',en:'Team'},proposer:{ja:'提案者',en:'Proposer'},proposals:{ja:'件',en:''},
  propCount:{ja:'件の提案',en:' proposals'},connections:{ja:'接続',en:' connections'},
  overview:{ja:'概況',en:'Overview'},people:{ja:'アカウント',en:'Accounts'},
  hasCollab:{ja:'共同提案あり',en:'Co-proposed'},sharedProp:{ja:'共有提案',en:'Shared'},
  categories:{ja:'カテゴリ',en:'Categories'},completionReport:{ja:'完了報告',en:'Completion Report'},
  openPeople:{ja:'📋 アカウントで開く',en:'📋 Open in Accounts'},
  openRelation:{ja:'🔗 関連で開く',en:'🔗 Open Relations'},
  backToGraph:{ja:'← 関係図に戻る',en:'← Back to Graph'},
  bySector:{ja:'セクター別',en:'By Sector'},
  sector:{ja:'業界',en:'Sector'},peopleTab:{ja:'アカウント別',en:'Accounts'},timeline:{ja:'時系列',en:'Timeline'},
  avg:{ja:'平均',en:'Avg'},max:{ja:'最大',en:'Max'},funded:{ja:'PROPOSALS FUNDED',en:'PROPOSALS FUNDED'},
  propS:{ja:'提案',en:'Proposals'},nameLabel:{ja:'名',en:''},
  allShow:{ja:'全表示',en:'Show all'},peopleArrow:{ja:'アカウント ↗',en:'Accounts ↗'},
  loading:{ja:'読み込み中...',en:'Loading...'},fetchOriginal:{ja:'⟳ 原文を取得',en:'⟳ Fetch original'},
  problem:{ja:'課題',en:'Problem'},solutionLabel:{ja:'解決策',en:'Solution'},
  votesLabel:{ja:'投票',en:'Votes'},linkLabel:{ja:'リンク',en:'Links'},
  descLabel:{ja:'説明',en:'Description'},apiFailed:{ja:'API取得失敗。LENSで質問してください。',en:'API fetch failed. Use LENS to ask.'},
  adaPriceLabel:{ja:'ADA価格',en:'ADA Price'},sortCount:{ja:'提案数順',en:'By count'},sortAmount:{ja:'調達額順',en:'By amount'},
  incomplete:{ja:'未完了',en:'Incomplete'},nodeSize:{ja:'ノードサイズ',en:'Node size'},
  propToNode:{ja:'提案数に比例',en:'Proportional to proposals'},
  selectNodeHint:{ja:'ノードを選択すると<br>詳細が表示されます',en:'Select a node to<br>view details'},
  sharedN:{ja:'件共有',en:' shared'},noTeamData:{ja:'チームデータのある提案がありません',en:'No proposals with team data'},
  collapseAll:{ja:'全部閉じる',en:'Collapse all'},expandAll:{ja:'全部開く',en:'Expand all'},
  japan:{ja:'日本',en:'Japan'},connLabel:{ja:'接続',en:' connections'},
  propsOf:{ja:'件の提案',en:' proposals'},total:{ja:'総額',en:'Total'},
  summary:{ja:'要約',en:'Summary'},riskAnalysis:{ja:'リスク分析',en:'Risk Analysis'},
  prosAndCons:{ja:'賛否の論点',en:'Pros & Cons'},comparison:{ja:'類似比較',en:'Compare similar'},
  lensAsk:{ja:'してください。',en:'. Please provide details.'},
  nwTooltipPeople:{ja:'アカウント別へ',en:'Go to Accounts view'},nwTooltipAll:{ja:'全ノード表示',en:'Show all nodes'},
  members:{ja:'名',en:' members'},
  'pm-submit':{ja:'提案時',en:'Proposal'},'pm-result':{ja:'採択時',en:'Result'}
};
function T(k){return _i18n[k]?(_i18n[k][_lang==='jp'?'ja':_lang]||_i18n[k].ja):k}
function secName(sec){return _lang==='en'?sec.label:sec.ja}
function pLabel(p){return (_lang==='jp'&&_JA_LABELS[p.id])?_JA_LABELS[p.id]:p.label}

function stColor(st){return st==='complete'?'var(--st-ok)':st==='progress'?'var(--st-wip)':'var(--st-dnf)'}
function stLabel(st){return st==='complete'?T('complete'):st==='progress'?T('progress'):T('dnf')}
function stBadgeClass(st){return st==='complete'?'st-complete':st==='progress'?'st-progress':'st-dnf'}
function stBadge(st){return '<span class="st-badge '+stBadgeClass(st)+'">'+stLabel(st)+'</span>'}
function roleClass(r){
  if(!r)return'role-proposer';
  if(r==='共同提案')return'role-co';
  if(r==='アドバイザー')return'role-advisor';
  if(r==='マーケティング')return'role-marketing';
  if(r==='開発')return'role-dev';
  if(r==='運営')return'role-ops';
  return'role-proposer';
}
function roleName(r){
  if(!r||r==='提案者')return T('proposer');
  if(r==='共同提案')return T('co');
  if(_lang==='en'){
    if(r==='アドバイザー')return'Advisor';if(r==='マーケティング')return'Marketing';
    if(r==='開発')return'Dev';if(r==='運営')return'Ops';if(r==='法務')return'Legal';if(r==='実行者')return'Executor';
  }
  return r;
}
function roleTag(role){
  if(!role)return'';
  return '<span class="role-tag '+roleClass(role)+'">'+esc(roleName(role))+'</span>';
}
function pathD(x1,y1,x2,y2){var mx=(x1+x2)/2;return'M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2}

function fmtPlain(amt,u,adaPrice){
  var ap=adaPrice||ADA_USD;
  if(u==='ada'){
    var usd=amt*ap;
    return Math.round(amt)+'K ₳ ('+fmtJpy(usd)+')';
  }
  return fmtJpy(amt);
}
var _ctDetailProp=null;
var _ctDetailApi=null;

var _lensLog=[];
function _lensAppend(role,text){
  _lensLog.push({role:role,text:text});
  var log=document.getElementById('ct-lens-log');
  if(!log)return;
  var cls=role==='user'?'ct-lens-msg-user':role==='error'?'ct-lens-msg-err':'ct-lens-msg-ai';
  var label=role==='user'?'You':role==='error'?'Error':'AI';
  var div=document.createElement('div');div.className='ct-lens-msg '+cls;
  div.innerHTML='<div class="ct-lens-msg-label">'+label+'</div>'+esc(text);
  log.appendChild(div);
  log.scrollTop=log.scrollHeight;
}

function _buildLensContext(p,question){
  var teamStr='';
  if(p.team){for(var i=0;i<p.team.length;i++){teamStr+='\n  '+p.team[i].name+' ('+p.team[i].role+')';}}
  var msg='【'+pLabel(p)+'】\n提案者: '+(p.by||'不明')+'\n'
    +(teamStr?'チーム:'+teamStr+'\n':'')
    +'Fund: '+(p.fund||'?')+' / 金額: '+fmtPlain(p.amt,p.u,p.adaPrice)+' / 状態: '+stLabel(p.st)+'\n'
    +'チャレンジ: '+(p.ch||'');
  if(_ctDetailApi){
    msg+='\n\n--- Catalyst Explorer ---\n'
      +'課題: '+(_ctDetailApi.problem||'N/A')+'\n'
      +'解決策: '+(_ctDetailApi.solution||'N/A')+'\n'
      +(_ctDetailApi.content?'詳細: '+_ctDetailApi.content.substring(0,800)+'\n':'');
  }
  msg+='\n\n'+question;
  return msg;
}

function sendToLens(p,question){
  var msg=_buildLensContext(p,question);
  _lensAppend('user',question);

  var keys={};
  try{keys=JSON.parse(localStorage.getItem('catalyst_apikeys')||'{}');}catch(e){}
  var providers=['claude','grok','gemini','groq','openrouter'];

  var log=document.getElementById('ct-lens-log');
  var loadDiv=document.createElement('div');
  loadDiv.className='ct-lens-thinking';
  loadDiv.textContent='考え中...';
  if(log)log.appendChild(loadDiv);

  (function tryProvider(idx){
    if(idx>=providers.length){
      if(loadDiv.parentNode)loadDiv.remove();
      _lensAppend('error','API キー未設定です。右上の ⚙ から設定してください。');
      return;
    }
    var pName=providers[idx],key=keys[pName];
    if(!key){tryProvider(idx+1);return;}

    var url,headers={},body;

    switch(pName){
      case 'claude':
        tryProvider(idx+1);return;
      case 'grok':
        url='https://api.x.ai/v1/chat/completions';
        headers={'Content-Type':'application/json','Authorization':'Bearer '+key};
        body=JSON.stringify({model:'grok-3-mini',messages:[{role:'user',content:msg}],max_tokens:2048});
        break;
      case 'gemini':
        url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+key;
        headers={'Content-Type':'application/json'};
        body=JSON.stringify({contents:[{parts:[{text:msg}]}]});
        break;
      case 'groq':
        url='https://api.groq.com/openai/v1/chat/completions';
        headers={'Content-Type':'application/json','Authorization':'Bearer '+key};
        body=JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:msg}],max_tokens:2048});
        break;
      case 'openrouter':
        url='https://openrouter.ai/api/v1/chat/completions';
        headers={'Content-Type':'application/json','Authorization':'Bearer '+key};
        body=JSON.stringify({model:'meta-llama/llama-3.3-70b-instruct',messages:[{role:'user',content:msg}],max_tokens:2048});
        break;
      default:tryProvider(idx+1);return;
    }

    fetch(url,{method:'POST',headers:headers,body:body})
    .then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(data){
      if(loadDiv.parentNode)loadDiv.remove();
      var text='';
      if(pName==='gemini'){
        text=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]?data.candidates[0].content.parts[0].text:'No response';
      }else{
        text=data.choices&&data.choices[0]&&data.choices[0].message?data.choices[0].message.content:'No response';
      }
      _lensAppend('ai','['+pName.toUpperCase()+']\n'+text);
    })
    .catch(function(err){
      var es=String(err);
      if(es.indexOf('429')>=0){tryProvider(idx+1);return;}
      if(loadDiv.parentNode)loadDiv.remove();
      _lensAppend('error',pName+': '+es);
    });
  })(0);
}

function openInLens(p){
  _ctDetailProp=p;
  _ctDetailApi=null;
  var panel=document.getElementById('ct-detail');
  if(!panel)return;

  var c=p.hue!=null?hsl(p.hue):'var(--ink)';
  panel.style.setProperty('--c',c);
  document.getElementById('ct-d-dot').style.background=c;
  document.getElementById('ct-d-ent').textContent=(p.by||'').toUpperCase();
  /* Title + per-proposal status flags inline (END/💧/⚠️/⏳/↔️/⌚/2-3-4) so the lens
     surface mirrors what the chart's left list shows. */
  document.getElementById('ct-d-title').innerHTML=esc(pLabel(p)||'')+_renderMiniFlags(p);
  document.getElementById('ct-d-amt').innerHTML=fmtDual(p.amt,p.u,p.adaPrice);
  document.getElementById('ct-d-usd').textContent='';

  var metaHtml='<span class="ct-d-badge st-'+p.st+'">'+stLabel(p.st)+'</span>';
  if(p.fund)metaHtml+='<span>F'+p.fund+'</span>';
  if(p.cls&&p.cls!=='main')metaHtml+='<span class="ct-d-badge" style="background:var(--dim);color:var(--ink)">'+clsLabel(p.cls)+'</span>';
  if(p.ch)metaHtml+='<span>'+esc(trunc(p.ch,30))+'</span>';
  document.getElementById('ct-d-meta').innerHTML=metaHtml;

  var bodyEl=document.getElementById('ct-d-body');

  /* ---- Local enrichment ---- */
  var localHtml='';

  /* Proposal details */
  var adaP=p.adaPrice||ADA_USD;
  var adaVal=p.u==='ada'?p.amt:p.amt/adaP;
  localHtml+='<div class="ct-d-section"><div class="ct-d-label">'+T('proposalInfo')+'</div><div class="ct-d-text">'
    +'<b>'+fmtDual(p.amt,p.u,adaP)+'</b><br>'
    +T('adaPriceLabel')+': $'+adaP.toFixed(2)+' (F'+(p.fund||'?')+' '+T('pm-'+_priceMode)+')'
    +(p.cls&&p.cls!=='main'?' · <span style="color:hsl(270 50% 65%)">'+clsLabel(p.cls)+'</span>':'')
    +'</div></div>';

  /* Challenge */
  if(p.ch){
    localHtml+='<div class="ct-d-section"><div class="ct-d-label">'+T('challenge')+'</div><div class="ct-d-text">'+esc(p.ch)+'</div></div>';
  }

  /* Team */
  if(p.team&&p.team.length){
    localHtml+='<div class="ct-d-section"><div class="ct-d-label">'+T('team')+' ('+p.team.length+T('members')+')</div><div class="ct-d-team">';

/* Detect proposal status patterns. Returns object with separate flags.
   - overdue: status='progress' + unsigned MS past deadline (month + 3-month grace)
   - gap:     status='progress' + consecutive signoffs >= 6 months apart
   - longGap: status='complete' + consecutive signoffs >= 8 months apart (historical, softer)
   - longYears: years since fund result date (2, 3, 4+) — flagged regardless of status */
function _proposalStatus(p){
  var out={overdue:false,gap:false,longGap:false,pastOverdue:false,maxGapMonths:0,years:0,plannedMonths:0,overrunRatio:0,pastOverdueDetail:null};
  /* Compute duration: adoption date → completion (or today if not done).
     Also compute planned duration (max milestone month) to detect overrun. */
  var pfrd=FUND_RESULT_DATES[p.fund||0];
  if(pfrd){
    var pp0=pfrd.split('-');
    var fd0=new Date(parseInt(pp0[2]),parseInt(pp0[1])-1,parseInt(pp0[0]));
    /* End date = last signoff (if complete) or today (in-progress/dnf) */
    var endDate=new Date();
    var MS0=window.CJ_MILESTONES||{};
    var ms0=MS0[p.id];
    if(ms0&&ms0.length){
      /* Planned: max milestone month from project start */
      for(var ei1=0;ei1<ms0.length;ei1++){
        for(var mi1=0;mi1<ms0[ei1].milestones.length;mi1++){
          var mo1=parseInt(ms0[ei1].milestones[mi1].month);
          if(!isNaN(mo1)&&mo1>out.plannedMonths) out.plannedMonths=mo1;
        }
      }
      if(p.st==='complete'){
        var lastSig=null;
        for(var ei0=0;ei0<ms0.length;ei0++){
          for(var mi0=0;mi0<ms0[ei0].milestones.length;mi0++){
            var sg=ms0[ei0].milestones[mi0].signoff;
            if(sg){var sd=new Date(sg);if(!lastSig||sd>lastSig) lastSig=sd;}
          }
        }
        if(lastSig) endDate=lastSig;
      }
    } else if(p.st==='complete'){
      /* Pre-MS: use COMP close-out date if available */
      var COMP0=window.CJ_COMPLETIONS||{};
      for(var ck0 in COMP0){
        if(COMP0[ck0]._lid===p.id && COMP0[ck0].completed){
          endDate=new Date(COMP0[ck0].completed);break;
        }
      }
    }
    out.years=((endDate-fd0)/(365.25*24*60*60*1000));
    if(out.plannedMonths>0) out.overrunRatio=(out.years*12)/out.plannedMonths;
  }
  if(p.st==='dnf') return out; /* 🚫 stopped, not ⚠️/⏳ */
  var MS=window.CJ_MILESTONES||{};
  var msData=MS[p.id];
  if(!msData||!msData.length) return out;
  /* Check 1: unsigned MS past deadline. Capture worst-case overdue details. */
  if(p.st==='progress'){
    var frd=FUND_RESULT_DATES[p.fund||0];
    if(frd){
      var pp=frd.split('-');
      var fundDate=new Date(parseInt(pp[2]),parseInt(pp[1])-1,parseInt(pp[0]));
      var now=new Date();
      for(var ei=0;ei<msData.length;ei++){
        var ms=msData[ei].milestones;
        for(var mi=0;mi<ms.length;mi++){
          var m=ms[mi];
          if(m.signoff) continue;
          var mo=parseInt(m.month);if(isNaN(mo)) continue;
          var ed=new Date(fundDate);ed.setMonth(ed.getMonth()+mo+3);
          if(now>ed){
            out.overdue=true;
            var planDate=new Date(fundDate);planDate.setMonth(planDate.getMonth()+mo);
            var monthsLate=(now-planDate)/(30.44*24*60*60*1000);
            /* Keep the FIRST (earliest) overdue MS — that's where progress stalled */
            if(!out.overdueDetail||m.ms<out.overdueDetail.msNum){
              out.overdueDetail={
                msNum:m.ms, plannedMonth:mo,
                plannedDate:planDate.toISOString().substring(0,10),
                monthsLate:monthsLate
              };
            }
          }
        }
      }
    }
  }
  /* Check 2: max gap between consecutive signoffs.
     Progress: >=6mo gap → ⏳ active stall
     Complete: >=8mo gap → ↔️ historical pause (allows for annual events like EXPO) */
  for(var ei2=0;ei2<msData.length;ei2++){
    var ms2=msData[ei2].milestones.slice().sort(function(a,b){return a.ms-b.ms;});
    var prevDate=null;
    for(var mi2=0;mi2<ms2.length;mi2++){
      var m2=ms2[mi2];
      if(!m2.signoff){prevDate=null;continue;}
      var curDate=new Date(m2.signoff);
      if(prevDate){
        var monthDiff=(curDate-prevDate)/(30*24*60*60*1000);
        if(monthDiff>out.maxGapMonths) out.maxGapMonths=monthDiff;
      }
      prevDate=curDate;
    }
  }
  if(p.st==='progress' && out.maxGapMonths>=6) out.gap=true;
  else if(p.st==='complete' && out.maxGapMonths>=8) out.longGap=true;
  /* Check 3: completed proposals where some MS was signed >=6 months past planned month.
     "Completed but late" — different from longGap (which is about pauses between MS). */
  if(p.st==='complete'){
    var frd3=FUND_RESULT_DATES[p.fund||0];
    if(frd3){
      var pp3=frd3.split('-');
      var fundDate3=new Date(parseInt(pp3[2]),parseInt(pp3[1])-1,parseInt(pp3[0]));
      var worstLate=0,worstMs=null;
      for(var ei3=0;ei3<msData.length;ei3++){
        var ms3=msData[ei3].milestones;
        for(var mi3=0;mi3<ms3.length;mi3++){
          var m3=ms3[mi3];
          if(!m3.signoff) continue;
          var mo3=parseInt(m3.month);if(isNaN(mo3)) continue;
          var planned=new Date(fundDate3);planned.setMonth(planned.getMonth()+mo3);
          var actual=new Date(m3.signoff);
          var monthsLate3=(actual-planned)/(30.44*24*60*60*1000);
          if(monthsLate3>worstLate){
            worstLate=monthsLate3;
            worstMs={msNum:m3.ms,plannedMonth:mo3,plannedDate:planned.toISOString().substring(0,10),actualDate:m3.signoff.substring(0,10),monthsLate:monthsLate3};
          }
        }
      }
      if(worstLate>=6){
        out.pastOverdue=true;
        out.pastOverdueDetail=worstMs;
      }
    }
  }
  return out;
}

    out+='<span class="past-overdue-flag" style="font-size:8px;padding:0 3px;margin-left:3px" title="'+esc(poT)+'">⌚</span>';

/* Render aggregate status flags for an account (PROPOSER_STATS entry).
   ps fields used: dnfList, overdueList, gapList, longGapList, oldList */
function _renderStatusFlags(ps){
  var out='';
  if(ps.dnfList && ps.dnfList.length){

  }
  if(ps.unfundedDnfList && ps.unfundedDnfList.length){

      +ps.unfundedDnfList.map(function(d){return '・F'+d.fund+' '+d.label;}).join('\n');
    out+='<span class="unfunded-flag" title="'+esc(t2)+'">💧'+ps.unfundedDnfList.length+'</span>';
  }
  if(ps.overdueList && ps.overdueList.length){
    var t=(_lang!=='en'?'期限超過 '+ps.overdueList.length+'件 (未署名MS)\n':'Overdue '+ps.overdueList.length+'\n')
      +ps.overdueList.map(function(d){
        var det='';
        if(d.detail){
          det=' [MS'+d.detail.msNum+' 計画 month '+d.detail.plannedMonth+' ('+d.detail.plannedDate+') → '+Math.round(d.detail.monthsLate)+'ヶ月遅延]';
        }
        return '・F'+d.fund+' '+d.label+det;
      }).join('\n');
    out+='<span class="stale-flag" title="'+esc(t)+'">⚠️'+ps.overdueList.length+'</span>';
  }
  if(ps.gapList && ps.gapList.length){
    var t=(_lang!=='en'?'請求間隔大 '+ps.gapList.length+'件 (進行中、MS間6ヶ月以上)\n':'Active gaps '+ps.gapList.length+'\n')
      +ps.gapList.map(function(d){return '・F'+d.fund+' '+d.label+' ('+d.gapMonths+'ヶ月)';}).join('\n');
    out+='<span class="gap-flag" title="'+esc(t)+'">⏳'+ps.gapList.length+'</span>';
  }
  if(ps.longGapList && ps.longGapList.length){
    var t=(_lang!=='en'?'過去長期空白 '+ps.longGapList.length+'件 (完了済、MS間8ヶ月以上)\n':'Historical gaps '+ps.longGapList.length+'\n')
      +ps.longGapList.map(function(d){return '・F'+d.fund+' '+d.label+' ('+d.gapMonths+'ヶ月)';}).join('\n');
    out+='<span class="long-gap-flag" title="'+esc(t)+'">↔️'+ps.longGapList.length+'</span>';
  }
  if(ps.pastOverdueList && ps.pastOverdueList.length){
    var t=(_lang!=='en'?'期限超過で完了 '+ps.pastOverdueList.length+'件 (MS が予定月から6ヶ月+遅延)\n':'Late completion '+ps.pastOverdueList.length+'\n')
      +ps.pastOverdueList.map(function(d){
        var det=d.detail?' [MS'+d.detail.msNum+' 計画 '+d.detail.plannedDate+' → 実際 '+d.detail.actualDate+' ('+Math.round(d.detail.monthsLate)+'ヶ月遅延)]':'';
        return '・F'+d.fund+' '+d.label+det;
      }).join('\n');
    out+='<span class="past-overdue-flag" title="'+esc(t)+'">⌚'+ps.pastOverdueList.length+'</span>';
  }
  if(ps.oldList && ps.oldList.length){
    /* Aggregate by year bucket — show highest year emoji per account */
    var maxY=0;
    for(var i=0;i<ps.oldList.length;i++) if(ps.oldList[i].years>maxY) maxY=ps.oldList[i].years;
    var yrEmoji=maxY>=4?'4️⃣':maxY>=3?'3️⃣':'2️⃣';
    var t=(_lang!=='en'?'長期案件 '+ps.oldList.length+'件 (採択から '+maxY+'年以上)\n':'Long-running '+ps.oldList.length+'\n')
      +ps.oldList.map(function(d){
        var stT=d.st==='complete'?'完了':d.st==='progress'?'進行中':'停止';
        var overrun=d.planned>0?' [計画 '+d.planned+'ヶ月 → '+d.ratio.toFixed(1)+'倍]':'';
        return '・F'+d.fund+' '+d.label+' ('+d.years+'年, '+stT+')'+overrun;
      }).join('\n');
    out+='<span class="old-flag" title="'+esc(t)+'">'+yrEmoji+ps.oldList.length+'</span>';

  return out;

/* Aggregate the same status flags _renderStatusFlags() draws for accounts, but for an
   entire sector. Walks every proposal in `ind.children`, applies the per-proposal flag
   detection from PROPOSER_STATS' addFlags(), and returns an object shaped like a
   PROPOSER_STATS entry — so it can be passed straight to _renderStatusFlags. */
function _sectorStatusFlags(ind){
  var entry={dnfList:[],unfundedDnfList:[],overdueList:[],gapList:[],longGapList:[],pastOverdueList:[],oldList:[]};
  if(!ind||!ind.children) return entry;
  for(var j=0;j<ind.children.length;j++){
    var p=ind.children[j];
    var ps=_proposalStatus(p);
    if(p.st==='dnf'){
      if(_dnfReceivedFunds(p)) entry.dnfList.push({label:p.label,fund:p.fund||0,id:p.id});
      else entry.unfundedDnfList.push({label:p.label,fund:p.fund||0,id:p.id});
    }
    if(ps.overdue) entry.overdueList.push({label:p.label,fund:p.fund||0,id:p.id,detail:ps.overdueDetail||null});
    if(ps.gap) entry.gapList.push({label:p.label,fund:p.fund||0,id:p.id,gapMonths:Math.round(ps.maxGapMonths)});
    if(ps.longGap) entry.longGapList.push({label:p.label,fund:p.fund||0,id:p.id,gapMonths:Math.round(ps.maxGapMonths)});
    if(ps.pastOverdue) entry.pastOverdueList.push({label:p.label,fund:p.fund||0,id:p.id,detail:ps.pastOverdueDetail});
    /* Duration flag mirrors addFlags(): only meaningful when MS data exists */
    var hasMs=(window.CJ_MILESTONES||{})[p.id];
    if(ps.years>=2 && hasMs) entry.oldList.push({label:p.label,fund:p.fund||0,id:p.id,years:Math.floor(ps.years),st:p.st,planned:ps.plannedMonths,ratio:ps.overrunRatio});
  }
  return entry;
}
/* Did this dnf proposal actually receive funds?
   Pre-MS (F2-F9): lump-sum at adoption → assume funded
   F10+: check distributed from MS data → only count as funded if dist > 0 */
function _dnfReceivedFunds(p){
  if(p.fund<10) return true; /* pre-MS: paid at adoption */
  var MS=window.CJ_MILESTONES||{};
  var ms=MS[p.id];
  if(ms&&ms.length) return (ms[0].distributed||0)>0;
  return false; /* no data — assume not funded */
}
var PROPOSER_STATS=(function(){
  function init(){return{mainCount:0,mainUsdK:0,mainAda:0,coCount:0,coUsdK:0,coAda:0,teamCount:0,teamUsdK:0,teamAda:0,namedFor:{},dnfList:[],unfundedDnfList:[],overdueList:[],gapList:[],longGapList:[],pastOverdueList:[],oldList:[]};}
  var map={},unkCount=0,unkUsd=0;
  function addFlags(entry,p,ps){
    if(p.st==='dnf'){
      if(_dnfReceivedFunds(p)) entry.dnfList.push({label:p.label,fund:p.fund||0,id:p.id});
      else entry.unfundedDnfList.push({label:p.label,fund:p.fund||0,id:p.id});
    }
    if(ps.overdue) entry.overdueList.push({label:p.label,fund:p.fund||0,id:p.id,detail:ps.overdueDetail||null});
    if(ps.gap) entry.gapList.push({label:p.label,fund:p.fund||0,id:p.id,gapMonths:Math.round(ps.maxGapMonths)});
    if(ps.longGap) entry.longGapList.push({label:p.label,fund:p.fund||0,id:p.id,gapMonths:Math.round(ps.maxGapMonths)});
    if(ps.pastOverdue) entry.pastOverdueList.push({label:p.label,fund:p.fund||0,id:p.id,detail:ps.pastOverdueDetail});
    /* Duration flag: 2/3/4+ years from adoption to completion (or to today if pending).
       Requires MS data (planned timeline) to be meaningful — skip pre-MS proposals
       without milestone tracking, since their "duration" is admin paperwork, not real progress. */
    var hasMs=(window.CJ_MILESTONES||{})[p.id];
    var skipDuration=!hasMs; /* skip if no MS data */
    if(ps.years>=2 && !skipDuration) entry.oldList.push({label:p.label,fund:p.fund||0,id:p.id,years:Math.floor(ps.years),st:p.st,planned:ps.plannedMonths,ratio:ps.overrunRatio});
  }
  for(var i=0;i<INDUSTRIES.length;i++){
    for(var j=0;j<INDUSTRIES[i].children.length;j++){
      var p=INDUSTRIES[i].children[j];
      var uK=p.u==='ada'?p.amt*p.adaPrice:p.amt;
      var ada=p.u==='ada'?p.amt:p.amt/p.adaPrice;
      var ps=_proposalStatus(p);
      if(p.by){
        if(!map[p.by])map[p.by]=init();
        if(p.cls==='main'){
          map[p.by].mainCount++;map[p.by].mainUsdK+=uK;map[p.by].mainAda+=ada;
        }else{
          map[p.by].coCount++;map[p.by].coUsdK+=uK;map[p.by].coAda+=ada;
        }
        addFlags(map[p.by],p,ps);
      } else {
        unkCount++;unkUsd+=uK;
      }
      if(p.team){
        var owner=p.by||'unknown';
        for(var t=0;t<p.team.length;t++){
          var tn=p.team[t].name;
          var tRole=p.team[t].role;
          if(!map[tn])map[tn]=init();
          if(tRole==='共同提案'){
            map[tn].coCount++;map[tn].coUsdK+=uK;map[tn].coAda+=ada;
          } else {
            map[tn].teamCount++;map[tn].teamUsdK+=uK;map[tn].teamAda+=ada;
            if(!map[tn].namedFor[owner]) map[tn].namedFor[owner]=0;
            map[tn].namedFor[owner]++;
          }
          addFlags(map[tn],p,ps);
        }
      }
    }
  }
  var arr=[];
  for(var k in map){
    var m=map[k];
    var allCount=m.mainCount+m.coCount+m.teamCount;
    var allUsdK=m.mainUsdK+m.coUsdK+m.teamUsdK;
    var allAda=m.mainAda+m.coAda+m.teamAda;
    arr.push({name:k,
      mainCount:m.mainCount,mainUsdK:m.mainUsdK,mainAda:m.mainAda,
      coCount:m.coCount,coUsdK:m.coUsdK,coAda:m.coAda,
      teamCount:m.teamCount,teamUsdK:m.teamUsdK,teamAda:m.teamAda,
      namedFor:m.namedFor,dnfList:m.dnfList,unfundedDnfList:m.unfundedDnfList,
      overdueList:m.overdueList,gapList:m.gapList,longGapList:m.longGapList,pastOverdueList:m.pastOverdueList,oldList:m.oldList,
      count:m.mainCount+m.coCount,usdK:m.mainUsdK+m.coUsdK,
      allCount:allCount,allUsdK:allUsdK,allAda:allAda});
  }
  arr.sort(function(a,b){return b.allCount-a.allCount});
  if(unkCount) arr.push({name:'未確認',mainCount:unkCount,mainUsdK:unkUsd,mainAda:0,coCount:0,coUsdK:0,coAda:0,teamCount:0,teamUsdK:0,teamAda:0,count:unkCount,usdK:unkUsd,allCount:unkCount,allUsdK:unkUsd,allAda:0,unknown:true});
  return arr;
})();

/* Look up a proposal's context (sector id + proposer name).
   Tries multiple sources because the local `INDUSTRIES` is what this page actually uses. */
function _findProposalCtx(pid){
  if(!pid) return null;
  /* 1. Local INDUSTRIES (defined inline in this file) */
  try{
    if(typeof INDUSTRIES!=='undefined'&&INDUSTRIES){
      for(var i=0;i<INDUSTRIES.length;i++){
        for(var j=0;j<INDUSTRIES[i].children.length;j++){
          var p=INDUSTRIES[i].children[j];
          if(p.id===pid) return {sectorId:INDUSTRIES[i].id, proposer:p.by, fund:p.fund, p:p};
        }
      }
    }
  }catch(e){}
  /* 2. Fall back to window.CJ_DATA if the host has it (e.g. catalog page) */
  try{
    if(window.CJ_DATA&&window.CJ_DATA.INDUSTRIES){
      var ind=window.CJ_DATA.INDUSTRIES;
      for(var i=0;i<ind.length;i++){
        for(var j=0;j<ind[i].children.length;j++){
          var p=ind[i].children[j];
          if(p.id===pid) return {sectorId:ind[i].id, proposer:p.by, fund:p.fund, p:p};
        }
      }
    }
  }catch(e){}
  return null;
}

/* Focus a specific view on a target proposal: pre-expand trees, select network node, etc.
   Then trigger the pulse highlight via highlightCatalogTarget. */
function focusOnProposal(pid){
  var ctx=_findProposalCtx(pid);
  if(!ctx){ highlightCatalogTarget(pid); return; }

  if(viewMode==='sector'){
    /* Expand the parent sector so the proposal leaf is visible, then pulse. */
    try{
      vis.add('root');
      vis.add(ctx.sectorId);
      render();
      /* Wait for DOM to settle before centering on the new leaf */
      setTimeout(function(){
        var el=document.querySelector('[data-id="'+pid+'"]');
        if(el){
          /* Compute pan to bring leaf into view */
          try{
            var stage=document.getElementById('canvas-stage')||document.querySelector('.stage');
            if(stage){
              var r=el.getBoundingClientRect();
              var sr=stage.getBoundingClientRect();
              panX -= (r.left + r.width/2 - sr.left - sr.width/2);
              panY -= (r.top  + r.height/2 - sr.top  - sr.height/2);
              setTfm();
            }
          }catch(e){}
          highlightCatalogTarget(pid);
        }
      }, 300);
    }catch(e){ highlightCatalogTarget(pid); }
  } else if(viewMode==='proposer'){
    /* Two-step: first render with root expanded to populate by-X nodes,
       then find the matching one by data-name attribute, expand it, render again. */
    try{
      vis.add('root');
      render();
      setTimeout(function(){
        try{
          var byNodes=document.querySelectorAll('.node[data-id^="by-"]');
          var byId=null;
          for(var k=0;k<byNodes.length;k++){
            if(byNodes[k].getAttribute('data-name')===ctx.proposer){
              byId=byNodes[k].getAttribute('data-id');
              break;
            }
          }
          if(byId){
            vis.add(byId);
            render();
            setTimeout(function(){
              var el=document.querySelector('[data-id="'+pid+'"]');
              if(el){
                try{
                  var stage=document.getElementById('canvas-stage')||document.querySelector('.stage');
                  if(stage){
                    var r=el.getBoundingClientRect();
                    var sr=stage.getBoundingClientRect();
                    panX -= (r.left + r.width/2 - sr.left - sr.width/2);
                    panY -= (r.top  + r.height/2 - sr.top  - sr.height/2);
                    setTfm();
                  }
                }catch(e){}
              }
              highlightCatalogTarget(pid);
            }, 250);
          } else {
            highlightCatalogTarget(pid);
          }
        }catch(e){ highlightCatalogTarget(pid); }
      }, 200);
    }catch(e){ highlightCatalogTarget(pid); }
  } else if(viewMode==='network'){
    /* Use the helper exposed by renderNetwork — selects the node + highlights its edges + dims the rest */
    try{
      if(typeof window._nwSelectByName==='function'){
        /* Try a few times in case renderNetwork hasn't finished wiring up yet */
        var tries=0;
        var iv=setInterval(function(){
          tries++;
          if(typeof window._nwSelectByName==='function'){
            window._nwSelectByName(ctx.proposer);
            clearInterval(iv);
          } else if(tries>10){ clearInterval(iv); }
        }, 150);
      }
    }catch(e){}
  } else if(viewMode==='timeline'){
    /* Timeline cells carry data-pid; just scroll and pulse */
    setTimeout(function(){ highlightCatalogTarget(pid); }, 200);
  } else if(viewMode==='chart'){
    /* Chart: nothing to pre-expand for MVP */
    setTimeout(function(){ highlightCatalogTarget(pid); }, 200);
  }
}

/* Best-effort: find the DOM element matching the proposal id and pulse it.
   Pulse runs forever; cleared by the document click listener below. */
function highlightCatalogTarget(hid){
  if(!hid) return;
  var sels=['[data-pid="'+hid+'"]','[data-id="'+hid+'"]','[data-proposal-id="'+hid+'"]'];
  var el=null;
  for(var i=0;i<sels.length;i++){ el=document.querySelector(sels[i]); if(el) break; }
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center', inline:'center'});
  if(!document.getElementById('catalog-pulse-style')){
    var s=document.createElement('style'); s.id='catalog-pulse-style';
    s.textContent='@keyframes catalog-pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,160,74,0);outline:1px solid rgba(212,160,74,0);}50%{box-shadow:0 0 0 8px rgba(212,160,74,0.45),0 0 32px rgba(212,160,74,0.6);outline:3px solid rgba(212,160,74,0.95);}}';
    document.head.appendChild(s);
  }
  el.classList.add('catalog-pulsing');
  el.style.animation='catalog-pulse 1.4s ease-in-out infinite';
}

/* ================================================================
   BUILD TREE
   ================================================================ */
function sumUsdK(kids){
  var s=0;for(var i=0;i<kids.length;i++){var c=kids[i];s+=c.u==='ada'?c.amt*(c.adaPrice||ADA_USD):c.amt;}return s;
}
function fmtTotal(usdK){
  return fmtJpy(usdK);
}

function buildTreeBySector(){
  var active=filterSec?INDUSTRIES.filter(function(d){return d.id===filterSec}):INDUSTRIES;
  var rootKids=[];
  for(var k=0;k<active.length;k++){
    var ind=active[k];
    var propKids=[];
    for(var j=0;j<ind.children.length;j++){
      var p=ind.children[j];
      if(filterBy&&p.by!==filterBy) continue;
      propKids.push({id:p.id,label:pLabel(p),amt:p.amt,u:p.u,st:p.st,ch:p.ch,by:p.by,role:p.role,fund:p.fund,adaPrice:p.adaPrice,team:p.team,cls:p.cls,hue:ind.hue,children:[]});
    }
    if(filterBy&&propKids.length===0) continue;
    var ok=0,wip=0,dnf=0;
    for(var m=0;m<propKids.length;m++){var s=propKids[m].st;if(s==='complete')ok++;else if(s==='progress')wip++;else dnf++;}
    rootKids.push({id:ind.id,label:secName(ind),amt:0,hue:ind.hue,children:propKids,_ok:ok,_wip:wip,_dnf:dnf,_total:propKids.length,_usdK:sumUsdK(propKids)});
  }
  var rootLabel='Catalyst Japan', rootSub=TOTAL_FUNDED+' / '+fmtTotal(TOTAL_USD_K);
  if(filterBy){
    var allKids=[];for(var i=0;i<rootKids.length;i++)allKids=allKids.concat(rootKids[i].children);
    rootLabel=filterBy; rootSub=allKids.length+' / '+fmtTotal(sumUsdK(allKids));
  }
  return {id:'root',label:rootLabel,sub:rootSub,children:rootKids};
}

function buildTreeByProposer(){
  var rootKids=[];
  /* sort PROPOSER_STATS by current sortMode */
  var sortedPS=PROPOSER_STATS.slice().sort(function(a,b){
    if(a.unknown) return 1;if(b.unknown) return -1;
    if(sortMode==='solo') return b.mainUsdK-a.mainUsdK||b.allCount-a.allCount;
    if(sortMode==='co') return b.coUsdK-a.coUsdK||b.allCount-a.allCount;
    if(sortMode==='named') return b.teamUsdK-a.teamUsdK||b.allCount-a.allCount;
    if(sortMode==='total') return b.allUsdK-a.allUsdK||b.allCount-a.allCount;
    if(sortMode==='count') return b.allCount-a.allCount;
    return b.allCount-a.allCount;
  });
  var hueStep=Math.floor(360/sortedPS.length);
  for(var pi=0;pi<sortedPS.length;pi++){
    var ps=sortedPS[pi];
    if(filterBy&&ps.name!==filterBy) continue;
    var propKids=[],seen={};
    for(var i=0;i<INDUSTRIES.length;i++){
      for(var j=0;j<INDUSTRIES[i].children.length;j++){
        var p=INDUSTRIES[i].children[j];
        if(ps.unknown?!p.by:p.by===ps.name){
          seen[p.id]=true;
          propKids.push({id:p.id,label:pLabel(p),amt:p.amt,u:p.u,st:p.st,ch:p.ch,by:p.by,role:p.role,
            fund:p.fund,adaPrice:p.adaPrice,team:p.team,cls:p.cls,sector:secName(INDUSTRIES[i]),hue:pi*hueStep,children:[]});
        }
      }
    }
    /* チーム参加の提案も追加 */
    if(!ps.unknown){
      for(var i=0;i<INDUSTRIES.length;i++){
        for(var j=0;j<INDUSTRIES[i].children.length;j++){
          var p=INDUSTRIES[i].children[j];
          if(seen[p.id]||!p.team) continue;
          for(var t=0;t<p.team.length;t++){
            if(p.team[t].name===ps.name){
              seen[p.id]=true;
              propKids.push({id:p.id+'-t',label:pLabel(p),amt:p.amt,u:p.u,st:p.st,ch:p.ch,by:p.by,
                role:p.team[t].role,fund:p.fund,adaPrice:p.adaPrice,team:p.team,cls:p.cls,
                sector:secName(INDUSTRIES[i]),hue:pi*hueStep,children:[],_teamRole:p.team[t].role});
              break;
            }
          }
        }
      }
    }
    var ok=0,wip=0,dnf=0;
    for(var m=0;m<propKids.length;m++){var s=propKids[m].st;if(s==='complete')ok++;else if(s==='progress')wip++;else dnf++;}
    var personUsd=sumUsdK(propKids);
    rootKids.push({id:'by-'+pi,label:ps.name,amt:personUsd,hue:pi*hueStep,children:propKids,
      _ok:ok,_wip:wip,_dnf:dnf,_total:propKids.length,_usdK:personUsd,
      _mainUsdK:ps.mainUsdK,_coUsdK:ps.coUsdK,_teamCount:ps.teamCount,_teamUsdK:ps.teamUsdK,_namedFor:ps.namedFor,_allUsdK:ps.allUsdK});
  }
  var rootLabel='Catalyst Japan', rootSub=TOTAL_FUNDED+' / '+fmtTotal(TOTAL_USD_K);
  if(filterBy){
    var allKids=[];for(var i=0;i<rootKids.length;i++)allKids=allKids.concat(rootKids[i].children);
    rootLabel=filterBy; rootSub=allKids.length+' / '+fmtTotal(sumUsdK(allKids));
  }
  return {id:'root',label:rootLabel,sub:rootSub,children:rootKids};
}

function buildTree(){
  return viewMode==='proposer'?buildTreeByProposer():buildTreeBySector();
}

/* ================================================================
   FLATTEN + LAYOUT
   ================================================================ */
function flatTree(root){
  var list=[],byId={};
  function walk(n,par,depth,bh){
    var h=(depth>=1&&n.hue!=null)?n.hue:(bh!=null?bh:null);
    var nd={id:n.id,label:n.label,raw:n,depth:depth,parent:par?par.id:null,hue:h,
      hasKids:!!(n.children&&n.children.length),expanded:vis.has(n.id)||(filterBy&&depth<=1),_ch:[]};
    if(par)par._ch.push(nd);
    byId[nd.id]=nd;list.push(nd);
    if(nd.hasKids&&nd.expanded){
      for(var i=0;i<n.children.length;i++)walk(n.children[i],nd,depth+1,h);
    }
  }
  walk(root,null,0,null);
  return{list:list,byId:byId};
}

function doLayout(root){
  var ft=flatTree(root);
  var list=ft.list;
  var lay={};
  var yOff=0;
  function place(n){
    var x=n.depth*COL;
    var w=n.depth===0?220:n.depth===1?480:560;
    var h=n.depth===0?80:n.depth===1?(viewMode==='proposer'?67:52):50;
    var y=yOff;
    lay[n.id]={id:n.id,x:x,y:y,w:w,h:h,depth:n.depth,hue:n.hue,parent:n.parent,hasKids:n.hasKids,expanded:n.expanded,raw:n.raw,label:n.label};
    yOff+=h+GAP;
    if(n.expanded){
      for(var i=0;i<n._ch.length;i++) place(n._ch[i]);
    }
  }
  place(list[0]);
  return lay;
}

            +'<div class="l1-r-cell"><span class="l1-r-title"><span class="lbl-l">'+(_lang==='en'?'Named':'名義あり')+'</span><span>/</span><span class="lbl-r">'+(_lang==='en'?'Project Total':'project調達合計')+'</span></span>'
            +'<span class="l1-r-val"><span class="v-l">'+nVal+'</span><span class="v-sl">/</span><span class="v-r">'+nkVal+'</span></span></div>'
            +'<div class="l1-r-cell2"><span class="l1-r-title2">'+(_lang==='en'?'Total Related':'総合関連額')+'</span><span class="l1-r-val2">'+tVal+'</span></div></div>';
        }
        l1Body=colTop+'<div class="l1-prop">'+colL+colM+colR+'</div>'+miniBar;
      } else {
        var secAmt=raw._usdK>0?'<span class="sec-amt">'+fmtJpy(raw._usdK)+'</span>':'';
        l1Body='<div class="row"><div class="label">'+esc(n.label)+'</div>'
          +secAmt
          +'<span class="cat-tag">'+raw._total+' proposals</span>'
          +'<span class="toggle">'+(n.expanded?'−':'+'+raw._total)+'</span></div>'
          +miniBar;
      }
      card.innerHTML=l1Body;
    } else {
      var p=n.raw;
      var ctxTag='';
      if(viewMode==='proposer'&&p.sector){
        ctxTag='<span class="cat-tag" style="color:var(--ink);border:1px solid var(--border)">'+esc(trunc(p.sector,20))+'</span>';
      } else if(p.by){
        ctxTag='<span class="cat-tag" style="color:var(--ink);border:1px solid var(--border)">'+esc(p.by)+'</span>';
      }
      var myRole=p._teamRole||p.role;
      var rTag=myRole&&myRole!=='提案者'&&myRole!=='仲介'?roleTag(myRole):'';
      var fTag=p.fund?'<span class="cat-tag fund-tag">F'+p.fund+'</span>':'';
      var teamTags='';
      if(p.team&&!p._teamRole){for(var ti=0;ti<p.team.length;ti++){
        teamTags+='<span class="role-tag '+roleClass(p.team[ti].role)+'">'+esc(p.team[ti].name)+'</span>';
      }}
      var lkIcons='';
      if(p.url)lkIcons+='<span class="lk-icon" title="Project" data-href="'+esc(p.url)+'">↗</span>';
      if(p.x)lkIcons+='<span class="lk-icon" title="X" data-href="'+esc(p.x)+'">𝕏</span>';
      if(p.yt)lkIcons+='<span class="lk-icon" title="YouTube" data-href="'+esc(p.yt)+'">▶</span>';
      if(p.report)lkIcons+='<span class="lk-icon lk-cr" title="'+T('completionReport')+'" data-report="'+esc(p.id)+'">CR</span>';
      var lblPrefix=(viewMode==='proposer'&&myRole&&myRole!=='提案者')?(roleName(myRole)+' → '):'';
      card.innerHTML='<div class="row"><span class="st-dot" style="background:'+stColor(p.st)+'"></span>'
        +'<div class="label">'+(lblPrefix?'<span class="role-pfx">'+esc(lblPrefix)+'</span>':'')+esc(n.label)+'</div>'
        +(lkIcons?'<span class="lk-row">'+lkIcons+'</span>':'')
        +'<span class="amount">'+fmtDual(p.amt,p.u,p.adaPrice)+'</span></div>'
        +'<div class="row">'+stBadge(p.st)
        +clsTag(p.cls)+fTag+ctxTag+rTag+teamTags
        +'<span class="cat-tag">'+esc(trunc(p.ch,28))+'</span></div>';
    }

    card.onclick=(function(nid,depth,raw){return function(e){
      e.stopPropagation();
      var lki=e.target.closest('.lk-icon');
      if(lki){
        var href=lki.getAttribute('data-href');
        var reportId=lki.getAttribute('data-report');
        if(href){
          if(href){window.open(href,'_blank');}
        }else if(reportId&&raw){
          var crUrl='https://catalystexplorer.com/proposals?search='+encodeURIComponent(raw.label);
          window.open(crUrl,'_blank');
        }
        return;
      }
      if(depth===0||depth===1){
        if(vis.has(nid))vis.delete(nid);else vis.add(nid);
        render();
      } else if(depth===2&&raw){
        openInLens(raw);
      }
    }})(n.id,n.depth,n.depth===2?n.raw:null);

    el.appendChild(card);
    layer.appendChild(el);

    /* draw line to parent */
    if(n.parent&&lay[n.parent]){
      var pn=lay[n.parent];
      var x1=pn.x+pn.w, y1=pn.y+pn.h/2;
      var x2=n.x, y2=n.y+n.h/2;
      var path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',pathD(x1,y1,x2,y2));
      path.setAttribute('fill','none');
      path.setAttribute('stroke',n.hue!=null?hsl(n.hue):'var(--border)');
      path.setAttribute('stroke-width','1.5');
      path.setAttribute('opacity','0.4');
      svg.appendChild(path);
    }
  }

  svg.setAttribute('width',maxX+200);
  svg.setAttribute('height',maxY+200);
  setTfm();
}

  mainRow.appendChild(modesWrap);

    +'</div>';
  allCard.onclick=function(){filterSec=null;filterBy=null;toggleExpandAll();centerView();buildSidebar();updateMeta()};
  sb.appendChild(allCard);

  if(viewMode==='sector'){
    for(var i=0;i<INDUSTRIES.length;i++){
      (function(ind){
        var card=document.createElement('div');
        card.className='s-card'+(filterSec===ind.id?' active':'');
        var tot=ind._total;
        var okP=tot?(ind._ok/tot*100).toFixed(1):'0';
        var wiP=tot?(ind._wip/tot*100).toFixed(1):'0';

      if(sortMode==='co') return b.coUsdK-a.coUsdK||b.allCount-a.allCount;
      if(sortMode==='named') return b.teamUsdK-a.teamUsdK||b.allCount-a.allCount;
      if(sortMode==='total') return b.allUsdK-a.allUsdK||b.allCount-a.allCount;
      return b.allCount-a.allCount;
    });

    for(var pi=0;pi<sorted.length;pi++){

          nfArr.sort(function(a,b){return b.cnt-a.cnt;});
          for(var ni=0;ni<Math.min(nfArr.length,3);ni++) nfNames.push(nfArr[ni].name);

            render();buildSidebar();updateMeta();

        sb.appendChild(card);
      })(sorted[pi]);
    }
  }

  root.appendChild(sb);

  /* stage */
  var stage=document.createElement('div');
  stage.className='stage';
  var svgEl=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgEl.className.baseVal='lines';

  stage.appendChild(layer);

  var hdr=document.createElement('div');
  hdr.className='header';
  var adaStr=TOTAL_ADA>=1e3?(TOTAL_ADA/1e3).toFixed(1)+'M ₳':Math.round(TOTAL_ADA)+'K ₳';
  var totalLine='<b>'+fmtJpy(TOTAL_USD_K)+'</b> · <b>'+adaStr+'</b>';
  var avgStr=fmtJpy(AVG_USD_K);
  var maxStr=fmtJpy(_maxUsdK);
  hdr.innerHTML='<div class="meta"></div>';
  stage.appendChild(hdr);

/* sector view overlay */
  var sv=document.createElement('div');
  sv.className='sector-view';
  sv.id='sector-view';
  root.appendChild(sv);

  /* timeline view */
  var tlw=document.createElement('div');
  tlw.className='tl-wrap'+(viewMode==='timeline'?' open':'');
  tlw.id='tl-wrap';
  root.appendChild(tlw);

  /* chart view */
  var chw=document.createElement('div');
  chw.className='ch-wrap'+(viewMode==='chart'?' open':'');
  chw.id='ch-wrap';
  root.appendChild(chw);

  /* network view */
  var nww=document.createElement('div');
  nww.className='nw-wrap'+(viewMode==='network'?' open':'');
  nww.id='nw-wrap';
  root.appendChild(nww);

  /* detail panel */
  var dp=document.createElement('div');dp.className='ct-detail';dp.id='ct-detail';
  dp.innerHTML='<button class="ct-detail-close" id="ct-d-close">✕</button>'
    +'<div class="ct-detail-head">'
    +'<div class="ct-d-entity"><span class="ct-d-dot" id="ct-d-dot"></span><span id="ct-d-ent"></span></div>'
    +'<div class="ct-d-title" id="ct-d-title"></div>'
    +'<div class="ct-d-amounts"><span class="ct-d-amt" id="ct-d-amt"></span><span class="ct-d-usd" id="ct-d-usd"></span></div>'
    +'<div class="ct-d-meta" id="ct-d-meta"></div>'
    +'</div>'
    +'<div class="ct-detail-body" id="ct-d-body"></div>'
    +'<div class="ct-lens-row">'
    +'<div class="ct-lens-header"><span class="ct-lens-logo">CIGNAL LENS</span></div>'
    +'<div class="ct-lens-presets" id="ct-lens-presets"></div>'
    +'<div class="ct-lens-log" id="ct-lens-log"></div>'
    +'<div class="ct-lens-input-row"><input class="ct-lens-input" id="ct-lens-input" placeholder="質問を入力..." /><button class="ct-lens-send" id="ct-lens-send">SEND</button></div>'

  /* pan/zoom events */
  stage.addEventListener('pointerdown',ptrDown);
  stage.addEventListener('pointermove',ptrMove);

function buildSidebar(){
  var sb=document.querySelector('.sector-bar');
  if(!sb)return;
  var cards=sb.querySelectorAll('.s-card');
  var idx=0;
  for(var i=0;i<cards.length;i++){
    var el=cards[i];
    if(el.classList.contains('s-all')){
      el.classList.toggle('active',filterSec===null&&filterBy===null);
    } else {
      if(viewMode==='sector'){
        if(idx<INDUSTRIES.length) el.classList.toggle('active',filterSec===INDUSTRIES[idx].id);
      } else {
        if(idx<PROPOSER_STATS.length) el.classList.toggle('active',filterBy===PROPOSER_STATS[idx].name);
      }
      idx++;
    }
  }
}

    +'<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:3px;border-radius:1px;background:var(--st-wip)"></span>'+T('progress')+'</span>'
    +'<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:3px;border-radius:1px;background:var(--st-dnf)"></span>'+T('dnf')+'</span>'
    +'</div>'

    +'<span>'+(_lang==='en'?'Co = co-proposer (shared funding)':'共同 = 共同提案（資金共有）')+'</span>'
    +'<span>'+(_lang==='en'?'Named = listed on proposal':'名義 = 提案に名前記載')+'</span>'

/* ================================================================
   PAN / ZOOM
   ================================================================ */
function ptrDown(e){
  if(e.target.closest('.node'))return;
  dragging=true;dragX=e.clientX;dragY=e.clientY;
  document.querySelector('.stage').classList.add('grabbing');
  e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId);
}
function ptrMove(e){
  if(!dragging)return;
  panX+=e.clientX-dragX;panY+=e.clientY-dragY;
  dragX=e.clientX;dragY=e.clientY;setTfm();
}
function ptrUp(e){
  dragging=false;
  var s=document.querySelector('.stage');
  if(s)s.classList.remove('grabbing');
}
function onWheel(e){
  e.preventDefault();
  var d=e.deltaY>0?-0.06:0.06;
  zoom=Math.max(0.2,Math.min(3,zoom+d));
  setTfm();
  if(window._syncZoomSlider)window._syncZoomSlider();
}
function setTfm(){
  var layer=document.querySelector('.layer');
  var svg=document.querySelector('.lines');
  var tlLayer=document.querySelector('.tl-layer');
  var tfm='translate('+panX+'px,'+panY+'px) scale('+zoom+')';
  if(layer)layer.style.transform=tfm;
  if(svg)svg.style.transform=tfm;
  if(tlLayer)tlLayer.style.transform=tfm;
}

/* ================================================================
   TIMELINE VIEW
   ================================================================ */
function renderTimeline(){
  var wrap=document.getElementById('tl-wrap');
  if(!wrap)return;
  wrap.innerHTML='';
  panX=0;panY=0;zoom=1;

  /* collect all funds used */
  var fundSet={};
  for(var i=0;i<INDUSTRIES.length;i++){
    for(var j=0;j<INDUSTRIES[i].children.length;j++){
      var f=INDUSTRIES[i].children[j].fund;
      if(f) fundSet[f]=true;
    }
  }
  var funds=Object.keys(fundSet).map(Number).sort(function(a,b){return a-b});

  /* build proposer→fund→proposals map */
  var sorted=PROPOSER_STATS.slice().sort(function(a,b){
    if(a.unknown) return 1;if(b.unknown) return -1;
    return b.count-a.count;
  });
  if(filterBy){
    sorted=sorted.filter(function(ps){return ps.name===filterBy});
  }

  var pMap=[];
  for(var pi=0;pi<sorted.length;pi++){
    var ps=sorted[pi];
    var byFund={};
    var total=0;
    for(var ii=0;ii<INDUSTRIES.length;ii++){
      for(var jj=0;jj<INDUSTRIES[ii].children.length;jj++){
        var p=INDUSTRIES[ii].children[jj];
        if(ps.unknown?!p.by:p.by===ps.name){
          if(!byFund[p.fund]) byFund[p.fund]=[];
          byFund[p.fund].push(p);
          total++;
        }
      }
    }
    /* find first and last fund for this proposer */
    var firstF=99,lastF=0;
    for(var fk in byFund){var fn=Number(fk);if(fn<firstF)firstF=fn;if(fn>lastF)lastF=fn;}
    pMap.push({name:ps.name,byFund:byFund,total:total,unknown:ps.unknown,first:firstF,last:lastF});
  }

  var cols=funds.length+1; /* +1 for name column */

  /* grid */
  var grid=document.createElement('div');
  grid.className='tl-grid';
  grid.style.gridTemplateColumns='140px repeat('+funds.length+',140px)';

  /* header row */
  var hdrName=document.createElement('div');
  hdrName.className='tl-hdr tl-hdr-name';
  hdrName.textContent=T('proposer');
  grid.appendChild(hdrName);
  for(var fi=0;fi<funds.length;fi++){
    var hdr=document.createElement('div');
    hdr.className='tl-hdr';
    hdr.textContent='F'+funds[fi];
    grid.appendChild(hdr);
  }

  /* rows */
  for(var ri=0;ri<pMap.length;ri++){
    var row=pMap[ri];
    var nameCell=document.createElement('div');
    nameCell.className='tl-row-name';
    nameCell.innerHTML=esc(row.name)+'<span class="tl-cnt">'+row.total+'</span>';
    (function(name){
      nameCell.onclick=function(){
        filterBy=(filterBy===name?null:name);
        viewMode='proposer';vis.clear();buildShell();render();centerView();
      };
    })(row.name);
    grid.appendChild(nameCell);

    for(var fi=0;fi<funds.length;fi++){
      var cell=document.createElement('div');
      cell.className='tl-cell';
      var proposals=row.byFund[funds[fi]];
      if(proposals){
        for(var pk=0;pk<proposals.length;pk++){
          var p=proposals[pk];
          var pip=document.createElement('div');
          pip.className='tl-pip';
          pip.setAttribute('data-pid', p.id);
          pip.style.borderLeft='3px solid '+stColor(p.st);
          pip.innerHTML='<div class="tl-pip-title">'+esc(trunc(pLabel(p),30))+'</div>'
            +'<div class="tl-pip-meta">'+stBadge(p.st)
            +'<span class="tl-pip-amt">'+fmtDual(p.amt,p.u,p.adaPrice)+'</span></div>';
          pip.title=pLabel(p)+'\n'+stLabel(p.st)+' · F'+p.fund+'\n'+(p.ch||'');
          pip.style.cursor='pointer';
          (function(pr){pip.onclick=function(e){e.stopPropagation();openInLens(pr)};})(p);
          cell.appendChild(pip);
        }
      }
      /* draw span indicator for first/last */
      if(!proposals&&funds[fi]>=row.first&&funds[fi]<=row.last){
        var dot=document.createElement('div');
        dot.style.cssText='height:1px;background:var(--border);margin:auto 0;opacity:0.4';
        cell.appendChild(dot);
      }
      grid.appendChild(cell);
    }
  }

  /* wrap grid in scroll container for sticky headers */
  var tlScroll=document.createElement('div');
  tlScroll.className='tl-scroll';
  tlScroll.appendChild(grid);

  var tlLayer=document.createElement('div');
  tlLayer.className='tl-layer';
  tlLayer.appendChild(tlScroll);
  wrap.appendChild(tlLayer);

  /* wheel inside scroll area = native scroll (not zoom) */
  tlScroll.addEventListener('wheel',function(e){e.stopPropagation();},{passive:true});

  /* drag = transform-based pan */
  wrap.addEventListener('wheel',onWheel,{passive:false});
  wrap.addEventListener('pointerdown',function(e){
    if(e.target.closest('.tl-pip'))return;
    dragging=true;dragX=e.clientX;dragY=e.clientY;
    wrap.classList.add('grabbing');
    e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove',function(e){
    if(!dragging)return;
    panX+=e.clientX-dragX;panY+=e.clientY-dragY;
    dragX=e.clientX;dragY=e.clientY;setTfm();
  });
  wrap.addEventListener('pointerup',function(){dragging=false;wrap.classList.remove('grabbing');});
}

var _chartInstance=null;
var _chartPriceData=null; /* cached ADA daily prices */
var _chartSelectedProposer=null;
var _chartSelectedProposal=null;

function renderChart(){
  var wrap=document.getElementById('ch-wrap');
  if(!wrap)return;
  wrap.innerHTML='';

  /* ════ HEADER ════ */
  var hdr=document.createElement('div');
  hdr.className='ch-header';

  titleEl.innerHTML='<div class="ch-title">ADA / USD</div>';
  hdr.appendChild(titleEl);
  var priceEl=document.createElement('div');
  priceEl.id='ch-live-price';
  priceEl.innerHTML='<span class="ch-price">$'+(ADA_USD||0.75).toFixed(4)+'</span>'
    +' <span class="ch-price-sub">≈ ¥'+(ADA_USD*USD_JPY).toFixed(2)+'</span>';
  hdr.appendChild(priceEl);
  var ctrlsEl=document.createElement('div');
  ctrlsEl.className='ch-controls';
  var ranges=[{key:'1Y',days:365},{key:'2Y',days:730},{key:'3Y',days:1095},{key:'ALL',days:2000}];
  for(var ri=0;ri<ranges.length;ri++){(function(r){
    var btn=document.createElement('button');
    btn.className='ch-range-btn'+(r.key==='ALL'?' active':'');btn.textContent=r.key;
    btn.onclick=function(){
      var btns=ctrlsEl.querySelectorAll('.ch-range-btn');
      for(var b=0;b<btns.length;b++) btns[b].classList.remove('active');
      btn.classList.add('active');applyChartRange(r.days);
    };ctrlsEl.appendChild(btn);
  })(ranges[ri]);}
  hdr.appendChild(ctrlsEl);
  wrap.appendChild(hdr);

  /* ════ LEFT SIDEBAR: sector / account cards (same as main view) ════ */
  var left=document.createElement('div');left.className='ch-left';

  /* toggle: 業界別 / アカウント別 */
  var togDiv=document.createElement('div');togDiv.className='ch-left-toggle';
  var _chLeftMode='sector';
  var togSec=document.createElement('button');togSec.className='ch-tog-btn active';togSec.textContent=_lang!=='en'?'業界別':'Sector';
  var togAcc=document.createElement('button');togAcc.className='ch-tog-btn';togAcc.textContent=_lang!=='en'?'アカウント別':'Accounts';
  togSec.onclick=function(){_chLeftMode='sector';togSec.classList.add('active');togAcc.classList.remove('active');renderChartSidebar('');};
  togAcc.onclick=function(){_chLeftMode='account';togAcc.classList.add('active');togSec.classList.remove('active');renderChartSidebar('');};
  togDiv.appendChild(togSec);togDiv.appendChild(togAcc);
  left.appendChild(togDiv);

  var searchDiv=document.createElement('div');searchDiv.className='ch-search';
  var searchInp=document.createElement('input');
  searchInp.type='text';searchInp.placeholder=_lang!=='en'?'検索...':'Search...';
  searchDiv.appendChild(searchInp);left.appendChild(searchDiv);
  var listDiv=document.createElement('div');listDiv.className='ch-list';listDiv.id='ch-list';
  left.appendChild(listDiv);
  wrap.appendChild(left);

  /* build flat proposals list from INDUSTRIES (needed for milestone/markers) */
  var allProps=[];
  for(var si=0;si<INDUSTRIES.length;si++){
    var sec=INDUSTRIES[si];
    for(var ci=0;ci<sec.children.length;ci++){
      var c=sec.children[ci];
      var adaAmt=c.u==='ada'?c.amt:(c.amt*1000/(c.adaPrice||0.5));
      allProps.push({id:c.id,title:c.label,proposer:c.by||'Unknown',fund:c.fund||0,
        ada:adaAmt,usd:c.u==='usd'?c.amt*1000:(c.amt*(c.adaPrice||0.5)),
        status:c.st==='complete'?'complete':c.st==='progress'?'in_progress':'dnf',
        sector:sec.ja||sec.label,challenge:c.ch||'',adaPrice:c.adaPrice||0.5,_src:c});
    }
  }
  window._chAllProps=allProps;

  /* ════ Build fund flow aggregate data (initial — recalculated when price data loads) ════ */
  var fundFlow={};
  for(var fi=0;fi<INDUSTRIES.length;fi++){
    for(var fj=0;fj<INDUSTRIES[fi].children.length;fj++){
      var fc=INDUSTRIES[fi].children[fj];
      var ff=fc.fund||0;if(!ff)continue;
      if(!fundFlow[ff]) fundFlow[ff]={count:0,adaK:0,budgetK:0,fundedK:0,receivedK:0,recvAdaK:0,proposals:[]};
      var adaK=fc.u==='ada'?fc.amt:(fc.amt/(fc.adaPrice||0.5));
      var submitP=FUND_SUBMIT_PRICES[ff]||fc.adaPrice||0.5;
      var resultP=FUND_RESULT_PRICES[ff]||fc.adaPrice||0.5;
      var budK=adaK*submitP;
      var funK=adaK*resultP;
      /* receivedK: historical price at milestone signoff / completion date */
      var recv=_calcReceivedK(fc.id,adaK,fc.st,ff);
      var recAdaK=recv.recvAdaK;
      var recK=recv.usd;
      fundFlow[ff].count++;
      fundFlow[ff].adaK+=adaK;
      fundFlow[ff].budgetK+=budK;
      fundFlow[ff].fundedK+=funK;
      fundFlow[ff].receivedK+=recK;
      fundFlow[ff].recvAdaK+=recAdaK;
      var msProg=fc.st==='complete'?'4/4':fc.st==='progress'?'2/4':'1/4';
      var msLabel=fc.st==='complete'?'完了':fc.st==='progress'?'途中':'中止';
      fundFlow[ff].proposals.push({
        label:pLabel(fc),status:fc.st,msProg:msProg,msLabel:msLabel,
        adaK:adaK,budgetK:budK,fundedK:funK,receivedK:recK,recvAdaK:recAdaK
      });
    }
  }

  setTimeout(function(){

    });

      crosshairMarkerBorderColor:'#5b8af0',crosshairMarkerBackgroundColor:'#fff'
    });
    var ro=new ResizeObserver(function(){if(_chartInstance&&container.clientWidth>0)_chartInstance.applyOptions({width:container.clientWidth,height:container.clientHeight});});
