    window._chAdaLine=adaLine;window._chAllData=null;
    if(_chartPriceData&&_chartPriceData.length>0){setChartData(adaLine,_chartPriceData);}
    else{fetchAdaHistory(adaLine);}

    /* ════ FUNDING FLOW — histogram bars + fund labels ════ */
    /* Build time map for hover detection */
    window._chFundTimeMap={};
    for(var fk in fundFlow){
      var frd=FUND_RESULT_DATES[fk];if(!frd)continue;
      var fp=frd.split('-');
      var ftk=fp[2]+'-'+fp[1]+'-'+fp[0];
      window._chFundTimeMap[ftk]=fk;
    }
    for(var afk in FUND_RESULT_DATES){
      var afrd=FUND_RESULT_DATES[afk].split('-');
      var aftk=afrd[2]+'-'+afrd[1]+'-'+afrd[0];
      if(!window._chFundTimeMap[aftk]) window._chFundTimeMap[aftk]=afk;
    }
    _expandFundTimeMap(window._chFundTimeMap);
    /* Funded/Received histogram bars */
    var fundedSeries=_chartInstance.addHistogramSeries({
      color:'rgba(61,139,110,0.45)',
      priceLineVisible:false,
      lastValueVisible:false,
      priceFormat:{type:'custom',formatter:function(p){return '+'+Math.round(p)+'K';}},
      priceScaleId:'fund'
    });
    fundedSeries.priceScale().applyOptions({
      scaleMargins:{top:0.45,bottom:0}
    });
    var recvSeries=_chartInstance.addHistogramSeries({
      color:'rgba(91,138,240,0.5)',
      priceLineVisible:false,
      lastValueVisible:false,
      priceFormat:{type:'custom',formatter:function(p){return '+'+Math.round(p)+'K';}},
      priceScaleId:'fund'
    });
    window._chFundedSeries=fundedSeries;
    window._chRecvSeries=recvSeries;
    window._chFdOrigData=null;window._chRvOrigData=null;window._chWdOrigData=null;
    /* Set initial data */
    var _fdData=[],_rvData=[];
    for(var _fk in fundFlow){
      var _frd=FUND_RESULT_DATES[_fk];if(!_frd)continue;
      var _fp=_frd.split('-');
      var _ftk=_fp[2]+'-'+_fp[1]+'-'+_fp[0];
      _fdData.push({time:_ftk,value:fundFlow[_fk].fundedK,color:'rgba(61,139,110,0.45)'});
      _rvData.push({time:_ftk,value:fundFlow[_fk].receivedK,color:'rgba(91,138,240,0.5)'});
    }
    _fdData.sort(function(a,b){return a.time<b.time?-1:1;});
    _rvData.sort(function(a,b){return a.time<b.time?-1:1;});
    fundedSeries.setData(_fdData);
    recvSeries.setData(_rvData);

    /* ════ FUNDING FLOW OVERLAY — per-proposal IN/OUT timeline ════ */
    (function(){
      var COMP=window.CJ_COMPLETIONS||{};
      var MS=window.CJ_MILESTONES||{};

      /* Gather all proposals from INDUSTRIES */
      var allProps=[];
      for(var si=0;si<INDUSTRIES.length;si++)
        for(var sj=0;sj<INDUSTRIES[si].children.length;sj++)
          allProps.push(INDUSTRIES[si].children[sj]);

      /* ── Word tokenizer for fuzzy title matching ── */
      function wds(s){return s.toLowerCase().replace(/[^a-z0-9]/g,' ').split(/\s+/).filter(function(w){return w.length>2;});}
      function wordOverlap(a,b){var n=0;for(var i=0;i<a.length;i++)for(var j=0;j<b.length;j++)if(a[i]===b[j]){n++;break;}return n;}

      /* ── Build completion-date lookup from CJ_COMPLETIONS ── */
      var compArr=[];
      for(var ck in COMP){
        var c=COMP[ck];
        compArr.push({w:wds(c.t), completed:c.completed, dist:c.dist||0, req:c.req||0});
      }

      /* ── Build last-signoff lookup from CJ_MILESTONES ── */
      var msArr=[];
      for(var mk in MS){
        var entries=MS[mk];
        for(var ei=0;ei<entries.length;ei++){
          var e=entries[ei]; var last=null;
          for(var mi=0;mi<e.milestones.length;mi++){
            var m=e.milestones[mi];
            if(m.signoff){var d=m.signoff.split('T')[0];if(!last||d>last)last=d;}
          }
          if(last) msArr.push({w:wds(e.title), date:last});
        }
      }

      /* Find completion date for a proposal */
      function findCompDate(label,fund){
        var pw=wds(label||'');
        /* Try CJ_COMPLETIONS (word overlap ≥ 2) */
        for(var j=0;j<compArr.length;j++){
          if(wordOverlap(pw,compArr[j].w)>=2) return compArr[j].completed;
        }
        /* Try CJ_MILESTONES last signoff */
        for(var j=0;j<msArr.length;j++){
          if(wordOverlap(pw,msArr[j].w)>=2) return msArr[j].date;
        }
        /* Estimate: fund result date + 18 months */
        var frd=FUND_RESULT_DATES[fund];
        if(!frd) return null;
        var fp=frd.split('-');
        var dt=new Date(parseInt(fp[2]),parseInt(fp[1])-1,parseInt(fp[0]));
        dt.setMonth(dt.getMonth()+18);
        return dt.toISOString().split('T')[0];
      }

      /* ── Build timeline: per-proposal IN and OUT events ── */
      var timeline=[];
      for(var i=0;i<allProps.length;i++){
        var p=allProps[i];
        var frd=FUND_RESULT_DATES[p.fund];
        if(!frd) continue;
        var fp=frd.split('-');
        var fundDate=fp[2]+'-'+fp[1]+'-'+fp[0];
        /* ADA amount (amt is in K for currency unit) */
        var ada=p.u==='ada'?p.amt*1000:(p.amt/(p.adaPrice||0.5))*1000;
        if(ada<=0) continue;

        /* IN event: fund result date — full approved amount */
        timeline.push({time:fundDate, ada:ada, type:'in', fund:p.fund, label:(p.label||'').substring(0,25), pid:p.id});

        /* OUT events: milestone-based if available */
        var msData=MS[p.id];
        var isComplete=(p.st==='complete'||p.st==='dnf');
        if(msData && msData.length>0){
          /* ── Milestone signoff-based OUT ── */
          var msOutTotal=0;
          for(var ei=0;ei<msData.length;ei++){
            var entry=msData[ei];
            /* Convert MS cost to ADA if budget is in USD */
            var eBudget=entry.budget||0;
            var eIsUsd=(entry.currency==='usd'&&eBudget>0);
            for(var mi=0;mi<entry.milestones.length;mi++){
              var m=entry.milestones[mi];
              if(m.signoff && m.cost>0){
                var sDate=m.signoff.split('T')[0];
                /* Clamp: signoff can't predate fund result */
                if(sDate<fundDate) sDate=fundDate;
                /* Proportional ADA conversion: ms share of budget × total ADA */
                var msCostAda=eIsUsd?(m.cost/eBudget)*ada:m.cost;
                timeline.push({time:sDate, ada:msCostAda, type:'out',
                  label:(p.label||'').substring(0,20)+' MS'+m.ms, pid:p.id, fund:p.fund});
                msOutTotal+=msCostAda;
              }
            }
          }
          /* Complete: add remainder at completion date (budget fully distributed) */
          if(isComplete && msOutTotal<ada){
            var cd=findCompDate(p.label, p.fund);
            if(cd) timeline.push({time:cd, ada:ada-msOutTotal, type:'out',
              label:(p.label||'').substring(0,20)+' (残額)', pid:p.id, fund:p.fund});
          }
        } else if(isComplete){
          /* ── No MS data: complete = full budget OUT at completion date ── */
          /* DNF with known zero distribution: no OUT (money never distributed) */
          var outAda=ada;
          if(p.st==='dnf'){
            /* Check CJ_COMPLETIONS for actual distribution (DNF may be 0) */
            var pw=wds(p.label||'');
            var bestMatch=null, bestN=0;
            for(var cj=0;cj<compArr.length;cj++){
              var n=wordOverlap(pw,compArr[cj].w);
              if(n>bestN){bestN=n;bestMatch=compArr[cj];}
            }
            if(bestMatch && bestN>=3 && bestMatch.req>0 && bestMatch.dist===0) outAda=0;
            else if(bestMatch && bestN>=3 && bestMatch.dist>0) outAda=bestMatch.dist;
          }
          if(outAda>0){
            var cd=findCompDate(p.label, p.fund);
            if(cd) timeline.push({time:cd, ada:outAda, type:'out',
              label:(p.label||'').substring(0,25)+(p.st==='dnf'?' (中止)':''), pid:p.id, fund:p.fund});
          }
        }
        /* In-progress without MS data: no OUT events */
      }

      if(!timeline.length) return;
      timeline.sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:0;});

      /* ── Build wdBars BEFORE unified dedup ──
         OUT events are deduped only against other OUT events,
         so IN events (F13 etc.) don't steal their dates */
      var wdBars=[];
      var wdUsed={};
      for(var wi2=0;wi2<timeline.length;wi2++){
        var we2=timeline[wi2];
        if(we2.type!=='out') continue;
        var tryWd=we2.time;
        var wAttempt=0;
        while(wdUsed[tryWd]){
          wAttempt++;
          var wdd=new Date(we2.time);
          wdd.setDate(wdd.getDate()+wAttempt);
          tryWd=wdd.toISOString().split('T')[0];
        }
        wdUsed[tryWd]=true;
        wdBars.push({time:tryWd,value:we2.ada/1000,color:'rgba(232,160,72,0.7)',_pid:we2.pid,_label:we2.label,_fund:we2.fund,_ada:we2.ada});
      }

      /* Unified dedup for cum/bal line series (need unique timestamps) */
      var usedDates={};
      for(var i=0;i<timeline.length;i++){
        var ev=timeline[i];
        var tryDate=ev.time;
        var attempt=0;
        while(usedDates[tryDate]){
          attempt++;
          var dd=new Date(ev.time);
          dd.setDate(dd.getDate()+attempt);
          tryDate=dd.toISOString().split('T')[0];
        }
        usedDates[tryDate]=true;
        ev.time=tryDate;
      }
      timeline.sort(function(a,b){return a.time<b.time?-1:a.time>b.time?1:0;});

      /* ── Build cum/bal series data ── */
      var cumData=[];   /* green line: cumulative funded (monotonic up) */
      var balData=[];   /* orange line: balance = funded - completed */
      var cumIn=0, cumOut=0;

      for(var k=0;k<timeline.length;k++){
        var e=timeline[k];
        if(e.type==='in'){
          cumIn+=e.ada;
        } else {
          cumOut+=e.ada;
        }
        cumData.push({time:e.time,value:cumIn/1000});
        balData.push({time:e.time,value:(cumIn-cumOut)/1000});
      }

      /* Orange withdrawal bars — separate scale, higher opacity to ensure visibility */
      var wdSeries=_chartInstance.addHistogramSeries({
        color:'rgba(232,160,72,0.8)',
        priceLineVisible:false,lastValueVisible:false,
        priceFormat:{type:'custom',formatter:function(p){return Math.round(p)+'K ₳';}},
        priceScaleId:'wd'
      });
      _chartInstance.priceScale('wd').applyOptions({
        scaleMargins:{top:0.35,bottom:0}
      });
      wdSeries.setData(wdBars);
      window._chWdOrigData=wdBars.slice();

      /* Green line: cumulative funded (starts from F2, only goes up) */
      var cumSeries=_chartInstance.addLineSeries({
        color:'rgba(72,200,120,0.8)',
        lineWidth:2,
        priceLineVisible:false,lastValueVisible:true,
        priceFormat:{type:'custom',formatter:function(p){return Math.round(p)+'K ₳';}},
        priceScaleId:'ms'
      });
      _chartInstance.priceScale('ms').applyOptions({
        scaleMargins:{top:0.45,bottom:0.15}
      });
      cumSeries.setData(cumData);

      /* Orange line: balance = funded - completed (approaches 0) */
      /* Separate scale from cum so toggling one doesn't rescale the other */
      var balSeries=_chartInstance.addLineSeries({
        color:'rgba(232,160,72,0.9)',
        lineWidth:2,
        priceLineVisible:false,lastValueVisible:true,
        priceFormat:{type:'custom',formatter:function(p){return Math.round(p)+'K ₳';}},
        priceScaleId:'ms2'
      });
      _chartInstance.priceScale('ms2').applyOptions({
        scaleMargins:{top:0.45,bottom:0.15}, visible:false
      });
      balSeries.setData(balData);

      /* ════ ADA vs Stablecoin comparison (both in USD) ════ */
      /* Two lines on dedicated USD scale:
         1. Stablecoin equiv: cumulative USD at adoption ADA price (step function)
         2. ADA live value: cumulative ADA × ADA price at each date (fluctuates)
         When yellow > blue → ADA payment was better
         When yellow < blue → stablecoins would have been better */

      /* Store timeline/cumData for rebuild when price data arrives async */
      window._chTimeline=timeline;
      window._chCumData=cumData;

      /* Build withdrawal time map from wdBars (correct dates, not shifted by IN dedup) */
      window._chWdTimeMap={};
      for(var wmi=0;wmi<wdBars.length;wmi++){
        var wb=wdBars[wmi];
        if(!window._chWdTimeMap[wb.time]) window._chWdTimeMap[wb.time]=[];
        window._chWdTimeMap[wb.time].push({time:wb.time,ada:wb._ada,label:wb._label,pid:wb._pid,fund:wb._fund,type:'out'});
      }

      /* Stablecoin line (cyan dashed) */
      var usdAdoptSeries=_chartInstance.addLineSeries({
        color:'rgba(100,200,255,0.8)',
        lineWidth:2, lineStyle:2,
        priceLineVisible:false,lastValueVisible:true,
        priceFormat:{type:'custom',formatter:function(p){return '$'+Math.round(p)+'K';}},
        priceScaleId:'usd'
      });
      _chartInstance.priceScale('usd').applyOptions({
        scaleMargins:{top:0.45,bottom:0.15}, borderVisible:false
      });

      /* ADA live value line (yellow) */
      var usdLiveSeries=_chartInstance.addLineSeries({
        color:'rgba(255,220,80,0.8)',
        lineWidth:2,
        priceLineVisible:false,lastValueVisible:true,
        priceFormat:{type:'custom',formatter:function(p){return '$'+Math.round(p)+'K';}},
        priceScaleId:'usd'
      });

      window._chWdSeries=wdSeries;
      window._chCumSeries=cumSeries;
      window._chBalSeries=balSeries;
      window._chUsdAdoptSeries=usdAdoptSeries;
      window._chUsdLiveSeries=usdLiveSeries;

      /* Build USD line data (called here + again when price data loads async) */
      _rebuildUsdLines();
    })();

    /* ── compact fund hover tooltip ── */
    var tip=document.createElement('div');tip.className='ch-fund-tip';
    container.style.position='relative';
    container.appendChild(tip);

    /* ── crosshair: price display + compact fund tooltip ── */
    _chartInstance.subscribeCrosshairMove(function(param){
      var liveEl=document.getElementById('ch-live-price');
      if(liveEl){
        if(!param||!param.time||!param.seriesData||!param.seriesData.size){
          liveEl.innerHTML='<span class="ch-price">$'+(ADA_USD||0.75).toFixed(4)+'</span> <span class="ch-price-sub">≈ ¥'+((ADA_USD||0.75)*USD_JPY).toFixed(2)+'</span>';
        } else {
          var val=param.seriesData.get(adaLine);
          if(val){var v=val.value||val.close||0;
            liveEl.innerHTML='<span class="ch-price">$'+v.toFixed(4)+'</span> <span class="ch-price-sub">≈ ¥'+(v*USD_JPY).toFixed(2)+'</span> <span class="ch-price-sub" style="margin-left:6px">'+param.time+'</span>';
          }
        }
      }
      /* compact fund tooltip at bar position */
      if(!param||!param.time||!param.point){tip.classList.remove('show');return;}
      var tk=typeof param.time==='object'?(param.time.year+'-'+String(param.time.month).padStart(2,'0')+'-'+String(param.time.day).padStart(2,'0')):param.time;
      var mf=window._chFundTimeMap[tk];
      if(!mf){tip.classList.remove('show');return;}
      var _ff=window._chFundFlow||{};
      var fd=_ff[mf]||null;
      /* format DD-MM-YYYY → readable */
      function fmtD(dmy){if(!dmy)return'—';var p=dmy.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
      /* timeline dates */
      var vd=(typeof FUND_VOTE_DATES!=='undefined')?FUND_VOTE_DATES[mf]:null;
      var sd=FUND_SUBMIT_DATES[mf];
      var rd=FUND_RESULT_DATES[mf];
      var h='<div class="ch-fund-tip-hd">Fund '+mf;
      if(fd) h+=' <span style="font-weight:400;opacity:.5">'+fd.count+(_lang!=='en'?'件':'p')+'</span>';
      else h+=' <span style="font-weight:400;opacity:.5">'+(_lang!=='en'?'日本提案なし':'No JP proposals')+'</span>';
      h+='</div>';
      /* timeline rows */
      var dlbl=_lang!=='en';
      h+='<div style="font-size:9px;opacity:.7;margin-bottom:4px;line-height:1.5">';
      if(sd) h+=(dlbl?'提出':'Submit')+': <b>'+fmtD(sd)+'</b><br>';
      if(vd) h+=(dlbl?'投票':'Vote')+': <b>'+fmtD(vd.vs)+'</b> → <b>'+fmtD(vd.ve)+'</b><br>';
      if(rd) h+=(dlbl?'結果':'Result')+': <b>'+fmtD(rd)+'</b>';
      h+='</div>';
      if(fd){
        var pct=fd.fundedK>0?Math.round(fd.receivedK/fd.fundedK*100):0;
        var ok=0,wip=0,dnf=0;
        for(var si=0;si<fd.proposals.length;si++){
          if(fd.proposals[si].status==='complete')ok++;
          else if(fd.proposals[si].status==='progress')wip++;
          else dnf++;
        }
        h+='<div class="ch-fund-tip-r"><div class="ch-fund-tip-d" style="background:rgba(138,138,131,0.6)"></div>'+(_lang!=='en'?'予算':'Bud')+' <b>$'+Math.round(fd.budgetK)+'K</b></div>';
        h+='<div class="ch-fund-tip-r"><div class="ch-fund-tip-d" style="background:rgba(61,139,110,0.8)"></div>'+(_lang!=='en'?'採択':'Fund')+' <b>$'+Math.round(fd.fundedK)+'K</b></div>';
        h+='<div class="ch-fund-tip-r"><div class="ch-fund-tip-d" style="background:rgba(91,138,240,0.8)"></div>'+(_lang!=='en'?'受取':'Recv')+' <b>$'+Math.round(fd.receivedK)+'K</b> ('+pct+'%)</div>';
        h+='<div class="ch-fund-tip-st">';
        if(ok) h+='<span style="color:var(--st-ok)">'+(_lang!=='en'?'完了':'OK')+' '+ok+'</span>';
        if(wip) h+='<span style="color:var(--st-wip)">'+(_lang!=='en'?'途中':'WIP')+' '+wip+'</span>';
        if(dnf) h+='<span style="color:var(--st-dnf)">'+(_lang!=='en'?'中止':'DNF')+' '+dnf+'</span>';
        h+='</div>';
      }
      tip.innerHTML=h;
      var px=param.point.x;
      var tw=tip.offsetWidth||120;
      var left=px-tw/2;
      if(left<4)left=4;
      if(left+tw>container.clientWidth-4)left=container.clientWidth-tw-4;
      tip.style.left=left+'px';
      tip.style.bottom='34%';
      tip.classList.add('show');
    });

    /* ── click on chart: wd bar → bottom detail + right project, else fund detail ── */
    _chartInstance.subscribeClick(function(param){
      if(!param||!param.time)return;
      var tk=typeof param.time==='object'?(param.time.year+'-'+String(param.time.month).padStart(2,'0')+'-'+String(param.time.day).padStart(2,'0')):param.time;
      /* Check withdrawal bar first */
      var wdEvts=window._chWdTimeMap?window._chWdTimeMap[tk]:null;
      if(wdEvts&&wdEvts.length>0){
        _showWdDetail(wdEvts);
        return;
      }
      /* Fallback: fund detail */
      var mf=window._chFundTimeMap[tk];
      if(mf) _chartShowFund(Number(mf));
    });

    /* ── reposition fund labels on zoom/scroll ── */
    /* zoom/scroll handled natively by chart markers */

    /* ── live ADA price update hook ── */
    window._cjPriceCallback=function(){
      if(!window._chAdaLine||typeof ADA_USD!=='number'||!ADA_USD)return;
      var _n=new Date();
      var _tk=_n.getFullYear()+'-'+String(_n.getMonth()+1).padStart(2,'0')+'-'+String(_n.getDate()).padStart(2,'0');
      try{window._chAdaLine.update({time:_tk,value:ADA_USD});}catch(e){}
      /* refresh USD comparison lines with latest price */
      if(typeof _invalidatePriceMap==='function') _invalidatePriceMap();
      if(typeof _rebuildUsdLines==='function') _rebuildUsdLines();
      var liveEl=document.getElementById('ch-live-price');
      if(liveEl){
        liveEl.innerHTML='<span class="ch-price">$'+ADA_USD.toFixed(4)+'</span> <span class="ch-price-sub">≈ ¥'+(ADA_USD*USD_JPY).toFixed(2)+'</span>';
      }
    };

    /* ── Init empty person chart frame ── */
    var pCont=document.getElementById('ch-person-chart');
    if(pCont){
      var pw=pCont.clientWidth||600;var ph=pCont.clientHeight||200;
      if(pw<100)pw=600;if(ph<50)ph=200;
      if(_personChartInstance){try{_personChartInstance.remove();}catch(e){}_personChartInstance=null;}
      _personChartInstance=LightweightCharts.createChart(pCont,{
        width:pw,height:ph,
        layout:{background:{type:'solid',color:isNight?'#16171a':'#ffffff'},textColor:isNight?'#7a7a74':'#8a8a83',fontFamily:"'JetBrains Mono',monospace",fontSize:10},
        grid:{vertLines:{color:isNight?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)'},horzLines:{color:isNight?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)'}},
        crosshair:{mode:0},
        rightPriceScale:{visible:false},
        timeScale:{visible:false},
        handleScroll:false,handleScale:false
      });
      _personChartRO=new ResizeObserver(function(){if(_personChartInstance&&pCont.clientWidth>0)_personChartInstance.applyOptions({width:pCont.clientWidth,height:pCont.clientHeight});});
      _personChartRO.observe(pCont);
    }
  },200);
}

  var right=document.getElementById('ch-right');if(!right)return;
  var panel=document.getElementById('ct-detail');

    panel.classList.remove('in-chart','open');

    if(root)root.appendChild(panel);
  }
  right.innerHTML='<div class="ch-lens-empty">'+(_lang!=='en'?'左から提案を選択':'Select a proposal\nfrom the left')+'</div>';
  if(window._chAdaLine)try{window._chAdaLine.setMarkers([]);}catch(e){}
}

/* ---- Chart FUND detail (right sidebar) ---- */
function _chartShowFund(fundNum){
  var right=document.getElementById('ch-right');if(!right)return;
  var ctPanel=document.getElementById('ct-detail');
  if(ctPanel&&ctPanel.parentNode===right){
    ctPanel.classList.remove('in-chart','open');
    var root=document.getElementById('root');
    if(root)root.appendChild(ctPanel);
  }
  right.innerHTML='';

  var ff=window._chFundFlow||{};
  var fd=ff[fundNum];
  if(!fd){right.innerHTML='<div class="ch-lens-empty">No data</div>';return;}

  var curAda=ADA_USD||0.27;
  var jpy=USD_JPY||150;
  function fmtM(k){return k>=1000?(k/1000).toFixed(1)+'M':Math.round(k)+'K';}
  function fmtAda(k){return k>=1000?'₳'+(k/1000).toFixed(1)+'M':'₳'+Math.round(k)+'K';}
  function fmtY(k){var y=k*jpy;return y>=1000?'¥'+(y/1000).toFixed(1)+'M':'¥'+Math.round(y)+'K';}
  function triLine(adaK,usdK){return fmtAda(adaK)+' <span style="opacity:.5">·</span> $'+fmtM(usdK)+' <span style="opacity:.5">·</span> '+fmtY(usdK);}

  var wrap=document.createElement('div');wrap.className='ch-fund-panel';

  /* header */
  var head=document.createElement('div');head.className='ch-fund-head';
  var dateStr=FUND_RESULT_DATES[fundNum]||'';
  head.innerHTML='<div class="ch-fund-title">Fund '+fundNum+'</div>'
    +'<div class="ch-fund-date">'+dateStr+' · '+fd.count+(_lang!=='en'?'件の提案':' proposals')+'</div>';

  /* 3 financial metrics */
  var recvPct=fd.fundedK>0?Math.round(fd.receivedK/fd.fundedK*100):0;
  var stats=document.createElement('div');stats.className='ch-fund-stats';
  stats.innerHTML=
    '<div class="ch-fund-stat-row" style="margin-bottom:6px">'
    +'<div class="ch-fund-stat-dot" style="background:rgba(138,138,131,0.6)"></div>'
    +'<span class="ch-fund-stat-label">'+(_lang!=='en'?'予算':'Budget')+'</span>'
    +'</div>'
    +'<div style="margin-left:13px;margin-bottom:8px;font-size:10px;color:var(--ink)">'+triLine(fd.adaK,fd.budgetK)+'</div>'

    +'<div class="ch-fund-stat-row" style="margin-bottom:6px">'
    +'<div class="ch-fund-stat-dot" style="background:rgba(61,139,110,0.8)"></div>'
    +'<span class="ch-fund-stat-label">'+(_lang!=='en'?'採択':'Funded')+'</span>'
    +'</div>'
    +'<div style="margin-left:13px;margin-bottom:8px;font-size:10px;color:var(--ink)">'+triLine(fd.adaK,fd.fundedK)+'</div>'

    +'<div class="ch-fund-stat-row" style="margin-bottom:6px">'
    +'<div class="ch-fund-stat-dot" style="background:rgba(91,138,240,0.8)"></div>'
    +'<span class="ch-fund-stat-label">'+(_lang!=='en'?'受取':'Recv')+'</span>'
    +'<span class="ch-fund-stat-pct">'+recvPct+'%</span>'
    +'</div>'
    +'<div style="margin-left:13px;margin-bottom:4px;font-size:10px;color:var(--ink)">'+triLine(fd.recvAdaK,fd.receivedK)+'</div>'

    +'<div class="ch-fund-bar">'
    +'<div style="width:'+recvPct+'%;background:rgba(91,138,240,0.6)"></div>'
    +'<div style="width:'+(100-recvPct)+'%;background:rgba(61,139,110,0.25)"></div>'
    +'</div>';
  head.appendChild(stats);
  wrap.appendChild(head);

  /* fund selector tabs */
  var tabsWrap=document.createElement('div');tabsWrap.className='ch-fund-tabs';
  var fundNums=[];
  for(var fk in ff){if(ff[fk].count>0) fundNums.push(Number(fk));}
  fundNums.sort(function(a,b){return a-b;});
  for(var fi=0;fi<fundNums.length;fi++){(function(fn){
    var btn=document.createElement('button');btn.className='ch-fund-tab'+(fn===fundNum?' active':'');
    btn.textContent='F'+fn;
    btn.onclick=function(){_chartShowFund(fn);};
    tabsWrap.appendChild(btn);
  })(fundNums[fi]);}
  wrap.appendChild(tabsWrap);

  /* proposal list with per-proposal financials */
  var listEl=document.createElement('div');listEl.className='ch-fund-list';
  for(var pi=0;pi<fd.proposals.length;pi++){(function(pp){
    var sc=pp.status==='complete'?'var(--st-ok)':pp.status==='progress'?'var(--st-wip)':'var(--st-dnf)';
    var row=document.createElement('div');row.className='ch-fund-row';
    row.innerHTML='<div class="ch-fund-row-st" style="background:'+sc+'"></div>'
      +'<div class="ch-fund-row-info">'
      +'<div class="ch-fund-row-name">'+esc(pp.label)+'</div>'
      +'<div class="ch-fund-row-meta">'
      +'<span>'+pp.msLabel+'</span>'
      +'<span>'+fmtAda(pp.adaK)+'</span>'
      +'<span>$'+fmtM(pp.fundedK)+'</span>'
      +'<span style="color:rgba(91,138,240,0.9)">→$'+fmtM(pp.receivedK)+'</span>'
      +'</div></div>';
    row.onclick=function(){
      var allP=window._chAllProps||[];
      for(var ai=0;ai<allP.length;ai++){
        if(pLabel(allP[ai]._src)===pp.label){
          _chartShowLens(allP[ai]);
          addProposalMarkers(allP[ai]);
          return;
        }
      }
    };
    listEl.appendChild(row);
  })(fd.proposals[pi]);}
  wrap.appendChild(listEl);
  right.appendChild(wrap);
  _updateFundFlow(null);
}

    panel.classList.add('in-chart');

/* ---- Chart proposer detail (same as network LENS) ---- */
function _chartShowProposer(psName){
  var right=document.getElementById('ch-right');if(!right)return;
  /* move ct-detail out if present */
  var ctPanel=document.getElementById('ct-detail');
  if(ctPanel&&ctPanel.parentNode===right){
    ctPanel.classList.remove('in-chart','open');
    var root=document.getElementById('root');
    if(root)root.appendChild(ctPanel);
  }
  right.innerHTML='';

  /* collect proposals by role */

  for(var i=0;i<INDUSTRIES.length;i++){
    for(var j=0;j<INDUSTRIES[i].children.length;j++){
      var c=INDUSTRIES[i].children[j];

        if(c.cls==='co') co.push(c); else solo.push(c);

        for(var t=0;t<c.team.length;t++){
          if(c.team[t].name===psName){related.push(c);break;}
        }
      }
    }
  }
  /* Sort each role group by fund (chronological: F2 → F14) */
  function _fundSort(a,b){return (a.fund||0)-(b.fund||0);}
  solo.sort(_fundSort); co.sort(_fundSort); related.sort(_fundSort);
  var all=solo.concat(co).concat(related);
  all.sort(_fundSort);

  /* get PROPOSER_STATS */
  var ps=null;
  for(var pi=0;pi<PROPOSER_STATS.length;pi++){if(PROPOSER_STATS[pi].name===psName){ps=PROPOSER_STATS[pi];break;}}

  var ini=psName.charAt(0);if(/[a-zA-Z]/.test(ini))ini=ini.toUpperCase();
  var hdrFlags=_renderStatusFlags(ps||{});
  /* Compute avg overrun ratio across all proposals with planned milestones.

  var ovTotal=0,ovCount=0,ovWorst=0;
  for(var oi=0;oi<all.length;oi++){
    var ops=_proposalStatus(all[oi]);
    if(ops.overrunRatio>0){ovTotal+=ops.overrunRatio;ovCount++;if(ops.overrunRatio>ovWorst)ovWorst=ops.overrunRatio;}

  if(ovCount>0){
    var avgR=ovTotal/ovCount;
    var ratioCol=avgR>=2.5?'rgba(200,80,80,0.85)':avgR>=1.8?'rgba(232,180,72,0.85)':avgR>=1.3?'rgba(150,180,220,0.85)':'rgba(72,200,120,0.85)';
    var ratioInk=avgR>=2.5?'#fff':'#1a1715';
    var ratioTip=(_lang!=='en'?'平均超過率: 計画の '+avgR.toFixed(1)+'倍 (最大 '+ovWorst.toFixed(1)+'倍)\n':'Avg overrun: '+avgR.toFixed(1)+'x\n')
      +(_lang!=='en'?ovCount+'件のMSデータ提案を集計':'across '+ovCount+' MS-tracked proposals');
    hdrFlags+='<span class="dnf-flag" title="'+esc(ratioTip)+'" style="background:'+ratioCol+';color:'+ratioInk+'">'+avgR.toFixed(1)+'倍</span>';
  }
  head.innerHTML='<div class="ch-proposer-row">'
    +'<div class="ch-proposer-av">'+ini+'</div>'
    +'<div style="min-width:0;flex:1">'
    +'<div class="ch-proposer-name">'+esc(psName)+hdrFlags+'</div>'
    +'<div class="ch-proposer-sub">'+all.length+(_lang!=='en'?'件の提案':' proposals')+'</div>'
    +'</div></div>';
  if(ps){
    var amtHtml='<div style="font-size:14px;font-weight:700;color:var(--ink)">'+fmtJpy(ps.allUsdK)+'</div>'
      +'<div style="display:flex;gap:10px;margin-top:4px">';
    if(ps.mainUsdK>0) amtHtml+='<span style="color:var(--ink);opacity:0.8">'+T('solo')+' <b>'+fmtJpy(ps.mainUsdK)+'</b></span>';
    if(ps.coUsdK>0) amtHtml+='<span style="color:hsl(270 50% 65%)">'+T('coLabel')+' <b>'+fmtJpy(ps.coUsdK)+'</b></span>';
    amtHtml+='</div>';
    var amtDiv=document.createElement('div');amtDiv.className='ch-proposer-amt';amtDiv.innerHTML=amtHtml;
    head.appendChild(amtDiv);
  }
  wrap.appendChild(head);

  /* tabs */
  var tabs=document.createElement('div');tabs.className='ch-proposer-tabs';
  var listEl=document.createElement('div');listEl.className='ch-proposer-list';
  var tabData=[
    {key:'all',label:_lang!=='en'?'全て':'All',items:all},
    {key:'solo',label:_lang!=='en'?'個人':'Solo',items:solo},
    {key:'co',label:_lang!=='en'?'共同':'Co',items:co},

    /* Aggregate status flags per fund — stack as aboveBar markers at the fund result date */

    for(var fi3=0;fi3<items.length;fi3++){
      var fp=items[fi3];

      if(fp.st==='dnf'){if(_dnfReceivedFunds(fp)) fFlags[fn3].end++; else fFlags[fn3].unfunded++;}
      if(pst3.overdue) fFlags[fn3].overdue++;
      if(pst3.gap) fFlags[fn3].gap++;
      if(pst3.longGap) fFlags[fn3].longGap++;

    for(var fk in fCounts){

      /* Stack flag counters above the line (LW stacks multiple aboveBar markers at same time) */
      var ff=fFlags[fk]||{};
      var stackOrder=[
        {key:'end',emoji:'END',col:'rgba(220,110,55,0.95)'},
        {key:'unfunded',emoji:'💧',col:'rgba(80,140,200,0.9)'},
        {key:'overdue',emoji:'⚠️',col:'rgba(232,180,72,0.95)'},
        {key:'gap',emoji:'⏳',col:'rgba(150,180,220,0.9)'},
        {key:'longGap',emoji:'↔️',col:'rgba(180,180,180,0.85)'},
        {key:'pastOverdue',emoji:'⌚',col:'rgba(200,170,140,0.9)'},
        {key:'old',emoji:'2️⃣',col:'rgba(180,160,200,0.9)'}

      }
      if(pst.overdue){
        var ovR=(_lang!=='en'?'期限超過 ('+esc(pLabel(c))+')':'Overdue');
        if(pst.overdueDetail){

          ovR+=(_lang!=='en'
            ?'\n計画: MS'+d.msNum+' 採択+'+d.plannedMonth+'ヶ月 ('+d.plannedDate+')\n現在: '+Math.round(d.monthsLate)+'ヶ月遅延 (未署名)'

      }
      if(pst.gap){
        var gpR=(_lang!=='en'?'進行中の請求間隔大 ('+esc(pLabel(c))+')\n最大 '+Math.round(pst.maxGapMonths)+'ヶ月の空白':'Active gap — '+Math.round(pst.maxGapMonths)+' mo');
        propFlag+='<span class="gap-flag" title="'+gpR+'">⏳'+Math.round(pst.maxGapMonths)+'ヶ月</span>';
      }
      if(pst.longGap){
        var lgR=(_lang!=='en'?'過去の長期空白 ('+esc(pLabel(c))+')\n完了済みだが最大 '+Math.round(pst.maxGapMonths)+'ヶ月の空白あり':'Historical gap — '+Math.round(pst.maxGapMonths)+' mo (completed)');
        propFlag+='<span class="long-gap-flag" title="'+lgR+'">↔️'+Math.round(pst.maxGapMonths)+'ヶ月</span>';
      }
      if(pst.pastOverdue){
        var poR=(_lang!=='en'?'期限超過で完了 ('+esc(pLabel(c))+')':'Late completion');
        if(pst.pastOverdueDetail){
          var pd=pst.pastOverdueDetail;
          poR+=(_lang!=='en'
            ?'\nMS'+pd.msNum+' 計画 '+pd.plannedDate+' → 実際 '+pd.actualDate+' ('+Math.round(pd.monthsLate)+'ヶ月遅延)'
            :'\nMS'+pd.msNum+' planned '+pd.plannedDate+' → actual '+pd.actualDate);
        }
        propFlag+='<span class="past-overdue-flag" title="'+poR+'">⌚'+Math.round(pst.pastOverdueDetail.monthsLate)+'ヶ月</span>';
      }
      /* Skip if no MS data — duration without planned baseline isn't meaningful */
      var _skipDur=!(window.CJ_MILESTONES||{})[c.id];
      if(pst.years>=2 && !_skipDur){
        var ye=Math.floor(pst.years);
        var yEmoji=ye>=4?'4️⃣':ye>=3?'3️⃣':'2️⃣';
        var yR=(_lang!=='en'?'長期案件 ('+esc(pLabel(c))+')':'Long duration');
        if(pst.plannedMonths>0){
          yR+=(_lang!=='en'?'\n計画: '+pst.plannedMonths+'ヶ月 → 実際: '+pst.years.toFixed(1)+'年 ('+pst.overrunRatio.toFixed(1)+'倍)'
            :'\nPlan: '+pst.plannedMonths+'mo → Actual: '+pst.years.toFixed(1)+'y ('+pst.overrunRatio.toFixed(1)+'x)');
        } else {
          yR+=(_lang!=='en'?'\n採択から '+pst.years.toFixed(1)+'年':'\n'+pst.years.toFixed(1)+'y');
        }

      row.innerHTML='<div class="ch-prop-title">'+esc(pLabel(c))+propFlag+'</div>'
        +'<div class="ch-prop-meta">'+stBadge(c.st)
        +clsTag(c.cls)
        +'<span class="cat-tag fund-tag">F'+(c.fund||'?')+'</span>'
        +'<span>'+fmtDual(c.amt,c.u,c.adaPrice)+'</span>'
        +'</div>';
      row.onclick=function(){

        if(pr){_updateFundFlow([c]);_chartShowLens(pr);addProposalMarkers(pr);}

  for(var ti=0;ti<tabData.length;ti++){(function(td){

/* ---- Add proposal-specific markers to chart ---- */
function addProposalMarkers(pr){
  if(!window._chAdaLine||!_chartPriceData)return;
  var markers=[];
  /* fund submit/result dates as context */
  var sd=FUND_SUBMIT_DATES[pr.fund];
  var rd=FUND_RESULT_DATES[pr.fund];
  if(sd){var sp=sd.split('-');var sKey=sp[2]+'-'+sp[1]+'-'+sp[0];
    markers.push({time:sKey,position:'aboveBar',color:'rgba(138,138,131,0.6)',shape:'arrowDown',text:'F'+pr.fund+(_lang!=='en'?' 提案':' Sub')});
  }
  if(rd){var rp=rd.split('-');var rKey=rp[2]+'-'+rp[1]+'-'+rp[0];
    markers.push({time:rKey,position:'belowBar',color:'rgba(61,139,110,0.6)',shape:'arrowUp',text:'F'+pr.fund+(_lang!=='en'?' 採択':' Res')});
  }
  markers.sort(function(a,b){return a.time<b.time?-1:1;});
  window._chAdaLine.setMarkers(markers);
  /* Filter the withdrawal (WD) histogram to show ONLY this proposal's bars/markers.
     Other proposals' bars get dimmed; selected proposal's MS get number markers. */
  _filterWdToProposal(pr);
}

/* Show only the selected proposal's WD bars + MS markers on the chart.
   Reads from _chWdSeries (already populated with this account's colored bars).
   Filtering removes other bars entirely to avoid the 1px gap issue caused by
   semi-transparent fillRect at the base line. */
function _filterWdToProposal(pr){
  if(!window._chWdSeries||!window._chWdOrigData) return;
  var origBars=window._chWdOrigData;
  var FRD=window.FUND_RESULT_DATES||{};
  var newBars=[];
  var wdMarkers=[];
  var matched=0;
  for(var i=0;i<origBars.length;i++){
    var b=origBars[i];
    if(b._pid===pr.id){
      newBars.push({time:b.time,value:b.value,color:b.color}); /* keep full color */
      matched++;
    }
    /* Skip other proposals' bars entirely — clean focused view */
  }
  if(matched===0){
    /* No match in current dataset — likely we need to compute synthetic bars for the proposal */
    var pst=_proposalStatus(pr);
    var MS=window.CJ_MILESTONES||{};
    var msData=MS[pr.id];
    if(msData&&msData.length){
      var adaK=(pr.u==='ada'?pr.amt:(pr.amt/(pr.adaPrice||0.5)));
      var totalMsCost=0;
      for(var ti=0;ti<msData[0].milestones.length;ti++) totalMsCost+=msData[0].milestones[ti].cost;
      for(var mi=0;mi<msData[0].milestones.length;mi++){
        var m=msData[0].milestones[mi];
        if(!m.signoff||m.cost<=0) continue;
        var msAda=totalMsCost>0?(m.cost/totalMsCost)*adaK:m.cost/1000;
        newBars.push({time:m.signoff.substring(0,10),value:msAda,color:'rgba(91,138,240,0.85)'});
        var msLbl=m.ms<=10?'①②③④⑤⑥⑦⑧⑨⑩'.charAt(m.ms-1):'M'+m.ms;
        wdMarkers.push({time:m.signoff.substring(0,10),position:'aboveBar',color:'rgba(91,138,240,0.9)',shape:'arrowDown',size:0.5,text:msLbl});
      }
    }
  } else {
    /* Add markers: F-result fund bar + MS number markers for the proposal */
    for(var i=0;i<origBars.length;i++){
      var b=origBars[i];
      if(b._pid!==pr.id) continue;
      if(b._isFund){
        wdMarkers.push({time:b.time,position:'aboveBar',color:'rgba(91,138,240,0.95)',shape:'arrowDown',size:0.5,
          text:'F'+b._fund+(_lang!=='en'?' 採択':' Fund')});
      } else if(b._ms){
        var msLbl2=b._ms<=10?'①②③④⑤⑥⑦⑧⑨⑩'.charAt(b._ms-1):'M'+b._ms;
        wdMarkers.push({time:b.time,position:'aboveBar',color:'rgba(91,138,240,0.9)',shape:'arrowDown',size:0.5,text:msLbl2});
      }
    }
  }
  newBars.sort(function(a,b){return a.time<b.time?-1:1;});
  window._chWdSeries.setData(newBars);
  /* Clear any markers directly on wdSeries (those shift the scale + cause floating) */
  window._chWdSeries.setMarkers([]);
  /* Place markers on a separate invisible line series so the 'wd' scale isn't affected
     and bars stay touching the bottom axis. */
  wdMarkers.sort(function(a,b){return a.time<b.time?-1:1;});
  if(window._chMarkerSeries){try{_chartInstance.removeSeries(window._chMarkerSeries);}catch(e){}window._chMarkerSeries=null;}
  if(wdMarkers.length){
    var mkS=_chartInstance.addLineSeries({
      color:'rgba(0,0,0,0)',lineWidth:0,
      lastValueVisible:false,priceLineVisible:false,
      priceScaleId:'mk'
    });
    _chartInstance.priceScale('mk').applyOptions({visible:false,scaleMargins:{top:0,bottom:0}});
    var mkDat=[];var mkSeen={};
    for(var mi=0;mi<wdMarkers.length;mi++){
      if(!mkSeen[wdMarkers[mi].time]){mkDat.push({time:wdMarkers[mi].time,value:0});mkSeen[wdMarkers[mi].time]=true;}
    }
    mkDat.sort(function(a,b){return a.time<b.time?-1:1;});
    mkS.setData(mkDat);
    mkS.setMarkers(wdMarkers);
    window._chMarkerSeries=mkS;
  }
}

/* Restore the full account-level WD bars (called when proposal selection cleared) */
function _restoreAccountWdBars(){
  if(!window._chWdSeries||!window._chWdOrigData) return;
  window._chWdSeries.setData(window._chWdOrigData.slice());
  window._chWdSeries.setMarkers([]);
}

/* ---- Fetch ADA historical prices from CoinGecko ---- */
var _chartFetchId=0; /* guard against concurrent fetches */
function fetchAdaHistory(adaLine){
  var myId=++_chartFetchId;
  /* quick probe: try one small request first; if fetch itself fails, skip to fallback */
  var probeEnd=Math.floor(Date.now()/1000);
  var probeStart=probeEnd-30*86400;
  var probeUrl='https://api.coingecko.com/api/v3/coins/cardano/market_chart/range?vs_currency=usd&from='+probeStart+'&to='+probeEnd;
  fetch(probeUrl,{signal:AbortSignal.timeout?AbortSignal.timeout(8000):undefined})
  .then(function(r){return r.json();})
  .then(function(data){
    if(myId!==_chartFetchId)return; /* stale */
    if(!data.prices||data.prices.length===0){
      console.warn('[CJ-Chart] Probe returned no prices, using fallback');
      buildFallbackPriceData(adaLine);return;
    }
    /* probe succeeded — fetch full history in chunks */
    var chunks=[];
    var cursor=new Date(2020,8,1).getTime();
    var now=Date.now();
    while(cursor<now){
      var end=Math.min(cursor+364*86400000,now);
      chunks.push({from:Math.floor(cursor/1000),to:Math.floor(end/1000)});
      cursor=end+86400000;
    }
    var allPts=[];var seen={};var idx=0;
    function nextChunk(){
      if(myId!==_chartFetchId)return;
      if(idx>=chunks.length){
        allPts.sort(function(a,b){return a.time<b.time?-1:1;});
        _chartPriceData=allPts;window._chAllData=allPts;
        setChartData(adaLine,allPts);
        console.log('[CJ-Chart] Loaded '+allPts.length+' daily prices');return;
      }
      var c=chunks[idx++];
      var url='https://api.coingecko.com/api/v3/coins/cardano/market_chart/range?vs_currency=usd&from='+c.from+'&to='+c.to;
      fetch(url).then(function(r){return r.json();}).then(function(d){
        if(myId!==_chartFetchId)return;
        if(d.prices){for(var i=0;i<d.prices.length;i++){
          var dt=new Date(d.prices[i][0]);
          var key=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
          if(!seen[key]){seen[key]=true;allPts.push({time:key,value:d.prices[i][1]});}
        }}
        if(allPts.length>30){
          var tmp=allPts.slice().sort(function(a,b){return a.time<b.time?-1:1;});
          adaLine.setData(tmp);if(_chartInstance)_chartInstance.timeScale().fitContent();
        }
        setTimeout(nextChunk,600);
      }).catch(function(){if(myId===_chartFetchId)setTimeout(nextChunk,1000);});
    }
    nextChunk();
  })
  .catch(function(e){
    if(myId!==_chartFetchId)return;
    console.warn('[CJ-Chart] Fetch unavailable, using fallback',e.message||e);
    buildFallbackPriceData(adaLine);
  });
}

/* ---- Fallback: interpolate between known fund prices ---- */
function buildFallbackPriceData(adaLine){
  /* collect known price points from both submit and result dates */
  var raw=[];
  function addPts(dates,prices){
    for(var f in dates){
      var p=dates[f].split('-');
      var ms=new Date(Number(p[2]),Number(p[1])-1,Number(p[0])).getTime();
      raw.push({t:ms,v:prices[f]||0.3});
    }
  }
  addPts(FUND_SUBMIT_DATES,FUND_SUBMIT_PRICES);
  addPts(FUND_RESULT_DATES,FUND_RESULT_PRICES);
  /* add known ATH/ATL points for more realistic shape */
  raw.push({t:new Date(2021,4,16).getTime(),v:2.46});  /* May 2021 ATH */
  raw.push({t:new Date(2021,8,2).getTime(),v:3.10});   /* Sep 2021 ATH */
  raw.push({t:new Date(2022,5,18).getTime(),v:0.44});  /* Jun 2022 crash */
  raw.push({t:new Date(2022,11,30).getTime(),v:0.25}); /* Dec 2022 bottom */
  raw.push({t:new Date(2024,2,14).getTime(),v:0.76});  /* Mar 2024 */
  raw.push({t:new Date(2024,10,22).getTime(),v:1.15}); /* Nov 2024 rally */
  /* extend to today using live ADA price if available */
  if(typeof ADA_USD==='number'&&ADA_USD>0){
    raw.push({t:Date.now(),v:ADA_USD});
  }
  raw.sort(function(a,b){return a.t-b.t;});

  /* linear interpolate weekly points between known values */
  var pts=[];
  var seen={};
  for(var i=0;i<raw.length-1;i++){
    var a=raw[i],b=raw[i+1];
    var step=7*86400000; /* weekly */
    for(var t=a.t;t<=b.t;t+=step){
      var ratio=(t-a.t)/(b.t-a.t);
      var v=a.v+(b.v-a.v)*ratio;
      var d=new Date(t);
      var key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      if(!seen[key]){seen[key]=true;pts.push({time:key,value:v});}
    }
  }
  pts.sort(function(a,b){return a.time<b.time?-1:1;});
  _chartPriceData=pts;
  window._chAllData=pts;
  setChartData(adaLine,pts);
}

/* ---- Offset a YYYY-MM-DD date string by N days ---- */
function _offsetDate(dateStr,days){
  var d=new Date(dateStr);d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ---- Expand fund time map: ±14 days around each fund date for wider hover ---- */
function _expandFundTimeMap(map){
  var fundDates=[];
  for(var d in map) fundDates.push({date:d,fund:map[d]});
  fundDates.sort(function(a,b){return a.date<b.date?-1:1;});
  for(var i=0;i<fundDates.length;i++){
    var base=new Date(fundDates[i].date);
    var fnum=fundDates[i].fund;
    for(var offset=-14;offset<=14;offset++){

    }
  }
}

/* ---- Set chart data + simplified fund markers ---- */
function setChartData(adaLine,pts){
  adaLine.setData(pts);

  /* fund markers: show ALL fund dates (F2-F14) */
  var markers=[];
  var resultDates=FUND_RESULT_DATES;
  var ff=window._chFundFlow||{};

  for(var fr in resultDates){
    var cnt=ff[fr]?ff[fr].count:0;
    var rp=resultDates[fr].split('-');
    var rKey=rp[2]+'-'+rp[1]+'-'+rp[0];
    if(cnt>0){
      markers.push({time:rKey,position:'aboveBar',color:'rgba(255,255,255,0.9)',shape:'arrowDown',size:0.5,text:'F'+fr});
    } else {
      markers.push({time:rKey,position:'aboveBar',color:'rgba(255,255,255,0.3)',shape:'arrowDown',size:0.5,text:'F'+fr});
    }
  }

  markers.sort(function(a,b){return a.time<b.time?-1:1;});
  adaLine.setMarkers(markers);

  /* fill gap between last data point and today's live price with weekly interpolation */
  if(typeof ADA_USD==='number'&&ADA_USD>0){
    var _now=new Date();
    var _todayKey=_now.getFullYear()+'-'+String(_now.getMonth()+1).padStart(2,'0')+'-'+String(_now.getDate()).padStart(2,'0');
    /* find last existing point */
    var _lastPt=pts.length>0?pts[pts.length-1]:null;
    if(_lastPt&&_lastPt.time<_todayKey){
      var _lastT=new Date(_lastPt.time).getTime();
      var _nowT=_now.getTime();
      var _gapDays=(_nowT-_lastT)/86400000;
      /* if gap > 14 days, fill with weekly interpolated points */
      if(_gapDays>14){
        var _seen={};for(var gi=0;gi<pts.length;gi++)_seen[pts[gi].time]=true;
        for(var _t=_lastT+7*86400000;_t<_nowT;_t+=7*86400000){
          var _d=new Date(_t);
          var _k=_d.getFullYear()+'-'+String(_d.getMonth()+1).padStart(2,'0')+'-'+String(_d.getDate()).padStart(2,'0');
          if(!_seen[_k]){
            var _ratio=(_t-_lastT)/(_nowT-_lastT);
            pts.push({time:_k,value:_lastPt.value+(ADA_USD-_lastPt.value)*_ratio});
            _seen[_k]=true;
          }
        }
      }
      /* add/update today */
      var _foundToday=false;
      for(var ti=0;ti<pts.length;ti++){if(pts[ti].time===_todayKey){pts[ti].value=ADA_USD;_foundToday=true;break;}}
      if(!_foundToday) pts.push({time:_todayKey,value:ADA_USD});
    }
    pts.sort(function(a,b){return a.time<b.time?-1:1;});
    adaLine.setData(pts);
  }

  /* fit content */
  if(_chartInstance){
    _chartInstance.timeScale().fitContent();
  }

  /* rebuild USD comparison lines now that price data is available */
  _invalidatePriceMap(); /* clear cached price lookup */
  _rebuildUsdLines();

  /* recalculate fundFlow with historical prices (initial load) */
  if(typeof _updateFundFlow==='function') _updateFundFlow(null);
}

/* ---- Rebuild USD comparison lines (called after price data loads) ---- */
function _rebuildUsdLines(){
  if(!window._chUsdAdoptSeries||!window._chUsdLiveSeries||!window._chAdaLine)return;
  var timeline=window._chTimeline, cumData=window._chCumData;
  if(!timeline||!cumData)return;

  /* Build price lookup from current ADA line data */
  var priceData=_chAdaLine.data();
  var priceLookup={};
  for(var pi=0;pi<priceData.length;pi++) priceLookup[priceData[pi].time]=priceData[pi].value;
  function nearestPrice(date){
    if(priceLookup[date]) return priceLookup[date];
    var prevD='',prevV=null,nextD='9999',nextV=null;
    for(var d in priceLookup){
      if(d<=date&&d>prevD){prevD=d;prevV=priceLookup[d];}
      if(d>=date&&d<nextD){nextD=d;nextV=priceLookup[d];}
    }
    if(prevV!==null&&nextV!==null&&prevD!==nextD){
      var pT=new Date(prevD).getTime(),nT=new Date(nextD).getTime(),cT=new Date(date).getTime();
      return prevV+(nextV-prevV)*((cT-pT)/(nT-pT));
    }
    return prevV||nextV||0.27;
  }

  /* 1. Stablecoin line: cumulative USD at adoption price */
  var usdCum=0;
  var usdAdoptData=[];
  for(var ui=0;ui<timeline.length;ui++){
    var ue=timeline[ui];
    if(ue.type==='in'&&ue.fund){
      usdCum+=(ue.ada/1000)*(FUND_RESULT_PRICES[ue.fund]||0.27);
    }
    usdAdoptData.push({time:ue.time, value:usdCum});
  }

  /* 2. ADA live value: cumulative ADA × price at each date */
  var allDates={};
  for(var ci=0;ci<cumData.length;ci++) allDates[cumData[ci].time]=true;
  for(var pi=0;pi<priceData.length;pi++) allDates[priceData[pi].time]=true;
  var sortedDates=Object.keys(allDates).sort();

  var usdLiveData=[];
  var lastCumAda=0, cumIdx=0;
  for(var di=0;di<sortedDates.length;di++){
    var dd=sortedDates[di];
    while(cumIdx<cumData.length&&cumData[cumIdx].time<=dd){
      lastCumAda=cumData[cumIdx].value; cumIdx++;
    }
    if(lastCumAda>0){
      var pp=nearestPrice(dd);
      usdLiveData.push({time:dd, value:lastCumAda*pp});
    }
  }

  window._chUsdAdoptSeries.setData(usdAdoptData);
  window._chUsdLiveSeries.setData(usdLiveData);
}

/* ---- Historical ADA price lookup (shared by receivedK calc) ---- */
var _priceMap=null; /* cached {date→price} from ADA line */
function _invalidatePriceMap(){_priceMap=null;}
function _ensurePriceMap(){
  if(_priceMap) return _priceMap;
  if(!window._chAdaLine) return null;
  var pd=_chAdaLine.data();
  if(!pd||!pd.length) return null;
  _priceMap={};
  for(var i=0;i<pd.length;i++) _priceMap[pd[i].time]=pd[i].value;
  return _priceMap;
}
function _nearestPriceGlobal(date){
  var m=_ensurePriceMap();
  if(!m) return null;
  if(m[date]) return m[date];
  /* Interpolate between nearest earlier and later points */
  var prevD='',prevV=null,nextD='9999',nextV=null;
  for(var d in m){
    if(d<=date&&d>prevD){prevD=d;prevV=m[d];}
    if(d>=date&&d<nextD){nextD=d;nextV=m[d];}
  }
  if(prevV!==null&&nextV!==null&&prevD!==nextD){
    var pT=new Date(prevD).getTime(),nT=new Date(nextD).getTime(),cT=new Date(date).getTime();
    return prevV+(nextV-prevV)*((cT-pT)/(nT-pT));
  }
  return prevV||nextV||null;
}

/* ---- Calculate received USD using historical prices ---- */
/* Uses: milestone signoff dates → completion dates → fund result prices → current price */
function _calcReceivedK(id, adaK, status, fundNum){
  if(status==='dnf') return {usd:0, recvAdaK:0};

  /* 1. Milestone-tracked proposals (F10+): sum signed-off milestones × price at signoff */
  var ms=window.CJ_MILESTONES?window.CJ_MILESTONES[id]:null;
  if(ms&&ms.length>0){
    var tUsd=0, tAda=0, hasMilestones=false;
    for(var i=0;i<ms.length;i++){
      var entry=ms[i];
      for(var j=0;j<entry.milestones.length;j++){
        var m=entry.milestones[j];
        hasMilestones=true;
        if(m.signoff){
          var sDate=m.signoff.split('T')[0]; /* YYYY-MM-DD */
          var price=_nearestPriceGlobal(sDate);
          if(price===null) price=FUND_RESULT_PRICES[fundNum]||ADA_USD||0.27;
          tUsd+=(m.cost/1000)*price;   /* cost is ADA, convert to K-ADA × USD = K-USD */
          tAda+=m.cost/1000;
        }
      }
    }
    if(tAda>0) return {usd:tUsd, recvAdaK:tAda};
    /* Has milestones but none signed off yet — 0 received */
    if(hasMilestones&&status==='progress') return {usd:0, recvAdaK:0};
  }

  /* 2. Completed proposals without milestones: use completion date or fund result price */
  if(status==='complete'){
    var compDate=PROPOSAL_COMPLETION_DATES[id];
    if(compDate){
      var p=_nearestPriceGlobal(compDate);
      if(p!==null) return {usd:adaK*p, recvAdaK:adaK};
    }
    /* Fallback: fund result price (historical approximation) */
    var rp=FUND_RESULT_PRICES[fundNum]||0.27;
    return {usd:adaK*rp, recvAdaK:adaK};
  }

  /* 3. In-progress without milestones: estimate 40% at current price */
  var recAdaK=adaK*0.4;
  return {usd:recAdaK*(ADA_USD||0.27), recvAdaK:recAdaK};
}

var _personChartInstance=null;
var _personChartRO=null;
var _personSyncUnsub=null;

var PCOLS=[
  'rgba(232,160,72,','rgba(200,100,160,','rgba(120,180,220,','rgba(180,140,220,',
  'rgba(220,180,80,','rgba(140,200,160,','rgba(220,120,100,','rgba(160,160,220,'

/* Build milestone data for proposals */
function _buildMsData(proposals){
  var MS=window.CJ_MILESTONES||{};
  var COMP=window.CJ_COMPLETIONS||{};
  /* Word-match helpers for CJ_COMPLETIONS lookup */
  function _w(s){return s.toLowerCase().replace(/[^a-z0-9]/g,' ').split(/\s+/).filter(function(w){return w.length>2;});}
  function _ov(a,b){var n=0;for(var i=0;i<a.length;i++)for(var j=0;j<b.length;j++)if(a[i]===b[j]){n++;break;}return n;}
  var _ca=[];
  var _byLid={}; /* local_id → COMP entry, for explicit binding */
  for(var ck in COMP){
    var cc=COMP[ck];
    _ca.push({w:_w(cc.t),completed:cc.completed,dist:cc.dist||0,req:cc.req||0,st:cc.st,_lid:cc._lid});
    if(cc._lid) _byLid[cc._lid]={completed:cc.completed,dist:cc.dist||0,req:cc.req||0,st:cc.st};
  }

  var results=[];
  for(var i=0;i<proposals.length;i++){
    var c=proposals[i];
    var msEntries=MS[c.id];
    var adaK=c.u==='ada'?c.amt:(c.amt/(c.adaPrice||0.5));
    var item={id:c.id,label:pLabel(c),fund:c.fund,status:c.st,adaK:adaK,milestones:[]};
    if(msEntries&&msEntries.length>0){
      for(var ei=0;ei<msEntries.length;ei++){
        var entry=msEntries[ei];
        for(var mi=0;mi<entry.milestones.length;mi++){
          var m=entry.milestones[mi];
          item.milestones.push({ms:m.ms,cost:m.cost,signoff:m.signoff?m.signoff.split('T')[0]:null,title:m.title});
        }
      }
      item.milestones.sort(function(a,b){return a.ms-b.ms;});
    } else {
      /* No CJ_MILESTONES — synthetic entry from proposal + CJ_COMPLETIONS */
      var totalAda=adaK*1000;
      var sDate=null;
      var isParentFunded=false;
      /* Prefer explicit _lid binding; fall back to fuzzy match */
      var bm=null,bn=0;
      if(_byLid[c.id]){bm=_byLid[c.id];bn=99;}
      else {
        var pw=_w(c.label||'');
        for(var cj=0;cj<_ca.length;cj++){
          /* Skip entries already bound to another local id */
          if(_ca[cj]._lid && _ca[cj]._lid!==c.id) continue;
          var n=_ov(pw,_ca[cj].w);
          if(n>bn){bn=n;bm=_ca[cj];}
        }
      }
      var preMs=(c.fund||0)<10; /* F2-F9: before milestone system */
      /* _lid binding bypasses both fuzzy threshold AND status check —
         an explicit _lid means official completion data exists, trust it */
      var hasLidMatch = bn===99;
      if(bm&&(bn>=2||hasLidMatch)){
        /* F2-F9 with dist:0 & req:0 = genuinely parent-funded sub-project (e.g. Milkomeda) */
        if(preMs&&bm.dist===0&&bm.req===0){ isParentFunded=true; }
        else if(bm.dist>0) totalAda=bm.dist;
        else if(bm.req>0) totalAda=bm.req;
        /* F10+ CJ_COMPLETIONS always has req:0/dist:0 — keep INDUSTRIES amt */
        if(c.st==='complete'||c.st==='dnf'||hasLidMatch) sDate=bm.completed;
      }
      if(isParentFunded){
        /* Sub-project: funding via parent project, no direct withdrawal.
           Milkomeda sub-projects (dist:0/req:0) were funded via the Milkomeda Accelerator
           parent series. Identify parent by: same fund + req>0 + title contains "accelerator"/"batch". */
        var parentName=null;
        var subTitle=(c.label||'').toLowerCase();
        var isMilkomedaSub=subTitle.indexOf('milkomeda')>=0;
        for(var ck2 in COMP){
          var cc2=COMP[ck2];
          if(cc2.f!==c.fund||!(cc2.req>0)) continue;
          var pTitleLc=cc2.t.toLowerCase();
          if(isMilkomedaSub && pTitleLc.indexOf('milkomeda')>=0 &&
             (pTitleLc.indexOf('accelerator')>=0||pTitleLc.indexOf('batch')>=0)){
            parentName=cc2.t;
            break; /* exact-pattern match wins */
          }
        }
        /* Fallback: any req>0 entry in same fund with highest keyword overlap */
        if(!parentName){
          var bestOverlap=0;
          var subWords=_w(c.label||'');
          for(var ck3 in COMP){
            var cc3=COMP[ck3];
            if(cc3.f===c.fund && cc3.req>0){
              var ov=_ov(subWords, _w(cc3.t));
              if(ov>bestOverlap){bestOverlap=ov; parentName=cc3.t;}
            }
          }
        }
        item.milestones.push({ms:1,cost:0,signoff:sDate,title:'親経由',parentFunded:true,parentTitle:parentName});
      } else if(totalAda>0){
        var msNotFound=!preMs; /* F10+: MS system exists but not in Supabase */
        var reason=preMs?'MS制度前':msNotFound?(c.st==='complete'?'制度外':'MS未取得'):'進行中';
        /* Pre-MS: funds were paid LUMP-SUM at fund result date — that's the actual receipt date.
           For dnf items: also keep the close-out date as dnfDate (when IOG marked it cancelled). */
        var displayDate=sDate;
        var dnfDate=null;
        if(preMs){
          var frd=(typeof FUND_RESULT_DATES!=='undefined')?FUND_RESULT_DATES[c.fund]:null;
          if(frd){var fp=frd.split('-');displayDate=fp[2]+'-'+fp[1]+'-'+fp[0];} /* receipt date */
          if(c.st==='dnf'&&sDate) dnfDate=sDate; /* close-out / cancel date */
        }
        item.milestones.push({ms:1,cost:totalAda,signoff:displayDate,title:reason,preMs:preMs,msNotFound:msNotFound,dnfDate:dnfDate});
      }
    }
    results.push(item);
  }
  return results;
}

/* Add colored wd bars + blue fund bars to main chart — reuse existing _chWdSeries */
function _addColoredWdBars(msData){
  if(!_chartInstance||!window._chWdSeries) return;

  /* ── Hide funded/recv global bars ── */
  if(window._chFundedSeries&&window._chRecvSeries){
    if(!window._chFdOrigData) window._chFdOrigData='saved';
    window._chFundedSeries.setData([]);
    window._chRecvSeries.setData([]);
  }

  /* ── Build combined bars: blue fund adoption + colored MS withdrawal ── */
  var bars=[];
  var markers=[];
  var usedDates={};

  /* Blue fund adoption bars */
  for(var fi=0;fi<msData.length;fi++){
    var fp=msData[fi];
    var fn=fp.fund;
    var frd=FUND_RESULT_DATES[fn];
    if(!frd) continue;
    var parts=frd.split('-');
    var fKey=parts[2]+'-'+parts[1]+'-'+parts[0];
    var adaK=fp.adaK||fp.milestones.reduce(function(s,m){return s+m.cost;},0)/1000;
    var tryF=fKey;var fa=0;
    while(usedDates[tryF]){fa++;var fd2=new Date(fKey);fd2.setDate(fd2.getDate()+fa);tryF=fd2.toISOString().split('T')[0];}
    usedDates[tryF]=true;
    bars.push({time:tryF,value:adaK,color:'rgba(91,138,240,0.7)',_pid:fp.id,_isFund:true,_fund:fn});
    markers.push({time:tryF,position:'aboveBar',color:'rgba(91,138,240,0.9)',shape:'arrowDown',size:0.5,
      text:'F'+fn+(_lang!=='en'?' 採択':' Fund')});
  }

  /* Colored MS withdrawal bars — convert raw cost to K-ADA proportionally */
  for(var pi=0;pi<msData.length;pi++){
    var p=msData[pi];
    var col=PCOLS[pi%PCOLS.length];
    /* Fund result date = when funds were actually disbursed (pre-MS lump-sum payment) */
    var pFrd=FUND_RESULT_DATES[p.fund];
    var pFundDate=null;
    if(pFrd){var pFp=pFrd.split('-');pFundDate=pFp[2]+'-'+pFp[1]+'-'+pFp[0];}
    /* Total raw MS cost (may be USD or ADA depending on proposal currency) */
    var totalMsCost=0;
    for(var ti=0;ti<p.milestones.length;ti++) totalMsCost+=p.milestones[ti].cost;
    for(var mi=0;mi<p.milestones.length;mi++){
      var m=p.milestones[mi];
      if(!m.signoff||m.cost<=0) continue;
      /* Convert to K-ADA: milestone share of total × proposal adaK */
      var msAdaK=totalMsCost>0?(m.cost/totalMsCost)*p.adaK:m.cost/1000;
      /* Pre-MS (F2-F9): m.signoff IS the receipt date (set in _buildMsData).
         For F10+ MS: m.signoff is the milestone signoff date. */
      var barCol=m.preMs?'rgba(232,160,72,0.85)':col+'0.85)';
      var mkCol=m.preMs?'rgba(232,160,72,0.9)':col+'0.9)';
      var mkText=m.preMs?(_lang!=='en'?'受領':'Recv')
        :(m.ms<=10?'①②③④⑤⑥⑦⑧⑨⑩'.charAt(m.ms-1):'M'+m.ms);
      var baseDate=m.signoff;
      /* Clamp: signoff can't predate fund result (data anomaly) */
      if(pFundDate&&baseDate<pFundDate) baseDate=pFundDate;
      var tryDate=baseDate;var attempt=0;
      while(usedDates[tryDate]){attempt++;var dd=new Date(baseDate);dd.setDate(dd.getDate()+attempt);tryDate=dd.toISOString().split('T')[0];}
      usedDates[tryDate]=true;
      bars.push({time:tryDate,value:msAdaK,color:barCol,_pid:p.id,_ms:m.ms,_label:p.label});
      markers.push({time:tryDate,position:'aboveBar',color:mkCol,shape:'arrowDown',size:0.5,text:mkText});
      /* Pre-MS dnf: add a "✕中止" flag at the IOG close-out date (separate from receipt date) */
      if(m.preMs && m.dnfDate && m.dnfDate!==tryDate){
        var dnfTry=m.dnfDate;var dnfAttempt=0;
        while(usedDates[dnfTry]){dnfAttempt++;var dnd=new Date(m.dnfDate);dnd.setDate(dnd.getDate()+dnfAttempt);dnfTry=dnd.toISOString().split('T')[0];}
        usedDates[dnfTry]=true;
        markers.push({time:dnfTry,position:'aboveBar',color:'rgba(200,80,80,0.9)',shape:'arrowDown',size:0.5,
          text:(_lang!=='en'?'END':'END')});
      }
    }
  }
  if(!bars.length) return;
  bars.sort(function(a,b){return a.time<b.time?-1:1;});
  markers.sort(function(a,b){return a.time<b.time?-1:1;});

  /* Reuse existing _chWdSeries (same scale config = bars touch bottom) */
  window._chWdSeries.setData(bars);
  /* Save the colored bars so we can restore them after filter-to-proposal */
  window._chWdOrigData=bars.slice();
  window._chWdOrigMarkers=[];

  /* Markers on histogram series shift coord(0) up by ~21px (LW adds padding).
     Instead, attach markers to a separate invisible line series so the
     'wd' scale stays unaffected and bars touch the bottom axis. */
  if(markers.length){
    if(window._chMarkerSeries){try{_chartInstance.removeSeries(window._chMarkerSeries);}catch(e){}}
    var mkSeries=_chartInstance.addLineSeries({
      color:'rgba(0,0,0,0)',lineWidth:0,
      lastValueVisible:false,priceLineVisible:false,
      priceScaleId:'mk'
    });
    _chartInstance.priceScale('mk').applyOptions({visible:false,scaleMargins:{top:0,bottom:0}});
    /* Marker series needs data at the same timestamps; use value=0 (invisible) */
    var mkData=[];
    var mkUsed={};
    for(var mi=0;mi<markers.length;mi++){
      if(!mkUsed[markers[mi].time]){mkData.push({time:markers[mi].time,value:0});mkUsed[markers[mi].time]=true;}
    }
    mkData.sort(function(a,b){return a.time<b.time?-1:1;});
    mkSeries.setData(mkData);
    mkSeries.setMarkers(markers);
    window._chMarkerSeries=mkSeries;
  }
}

    html+='<td style="padding:4px 6px;text-align:right">'+amtHtml+'</td>';
    html+='<td style="padding:4px 6px;color:var(--muted);font-size:9px;opacity:.5">'+note+'</td>';
    html+='</tr>';
  }
  html+='</tbody></table></div>';
  pCont.innerHTML=html;

  /* Row click → show project in right panel */
  var allProps=window._chAllProps||[];
  pCont.addEventListener('click',function(e){
    var row=e.target.closest('[data-ms-id]');
    if(!row) return;
    var pid=row.getAttribute('data-ms-id');
    var rows=pCont.querySelectorAll('[data-ms-id]');
    for(var r=0;r<rows.length;r++) rows[r].style.background=rows[r]===row?'rgba(255,255,255,0.03)':'';
    for(var ai=0;ai<allProps.length;ai++){
      if(allProps[ai].id===pid){_chartShowLens(allProps[ai]);addProposalMarkers(allProps[ai]);return;}
    }
  });
}

/* ---- Show withdrawal detail in bottom panel + project in right ---- */
function _showWdDetail(wdEvents){
  var personEl=document.getElementById('ch-person');
  var pCont=document.getElementById('ch-person-chart');
  if(!personEl||!pCont) return;

  /* Clear chart instance and restore global bars */
  if(_personChartInstance){try{_personChartInstance.remove();}catch(e){}_personChartInstance=null;}
  /* Restore global orange wd bars + clear person markers */
  if(window._chWdSeries&&window._chWdOrigData){
    window._chWdSeries.setData(window._chWdOrigData);
    window._chWdSeries.setMarkers([]);
  }
  if(window._chFdOrigData){_updateFundFlow(null);window._chFdOrigData=null;}

  var isEn=_lang==='en';
  var jpy=USD_JPY||150;
  function fmtAda(v){return v>=1000000?'₳'+(v/1000000).toFixed(2)+'M':v>=1000?'₳'+(v/1000).toFixed(1)+'K':'₳'+Math.round(v);}

  /* Find matching proposals from INDUSTRIES for right panel */
  var allProps=window._chAllProps||[];
  function findProp(ev){
    /* Match by pid first */
    if(ev.pid){
      for(var i=0;i<allProps.length;i++){
        if(allProps[i].id===ev.pid) return allProps[i];
      }
    }
    /* Fallback: label substring */
    var label=ev.label||'';
    for(var i=0;i<allProps.length;i++){
      if(allProps[i].title&&label&&allProps[i].title.indexOf(label.substring(0,15))>=0) return allProps[i];
      if(allProps[i]._src&&pLabel(allProps[i]._src).indexOf(label.substring(0,15))>=0) return allProps[i];
    }
    return null;
  }

  /* Get ADA price at event date */
  var priceData=window._chAllData||[];
  function priceAt(dateStr){
    for(var i=priceData.length-1;i>=0;i--){
      if(priceData[i].time<=dateStr) return priceData[i].value;
    }
    return ADA_USD||0.5;
  }

  var html='<div style="padding:12px 16px;height:100%;overflow-y:auto;font:11px \'JetBrains Mono\',monospace">';
  html+='<div style="color:var(--ink);font-size:13px;font-weight:600;margin-bottom:10px">'
    +(isEn?'Withdrawal Detail':'引出詳細')
    +' <span style="opacity:.5;font-weight:400;font-size:11px">'+wdEvents[0].time+'</span></div>';

  var totalAda=0;
  for(var i=0;i<wdEvents.length;i++){
    var ev=wdEvents[i];
    totalAda+=ev.ada;
    var p=priceAt(ev.time);
    var usd=ev.ada*p;
    var stColor=ev.label&&ev.label.indexOf('中止')>=0?'var(--st-dnf)':'rgba(232,160,72,0.9)';
    html+='<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer" data-wd-idx="'+i+'">';
    html+='<div style="width:6px;height:6px;border-radius:50%;background:'+stColor+';margin-top:5px;flex-shrink:0"></div>';
    html+='<div style="flex:1;min-width:0">';
    html+='<div style="color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(ev.label||'Unknown')+'</div>';
    html+='<div style="color:var(--muted);font-size:10px;margin-top:2px">'
      +fmtAda(ev.ada)+' <span style="opacity:.5">·</span> $'+(usd/1000).toFixed(1)+'K'
      +' <span style="opacity:.5">·</span> ¥'+Math.round(usd*jpy/1000)+'K'
      +(ev.fund?' <span style="opacity:.4">F'+ev.fund+'</span>':'')
      +'</div>';
    html+='</div></div>';
  }

  /* Total */
  var totalP=priceAt(wdEvents[0].time);
  var totalUsd=totalAda*totalP;
  html+='<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);color:var(--ink);font-size:12px">'
    +(isEn?'Total':'合計')+': '+fmtAda(totalAda)
    +' <span style="opacity:.5">·</span> $'+(totalUsd/1000).toFixed(1)+'K'
    +' <span style="opacity:.5">·</span> ¥'+Math.round(totalUsd*jpy/1000)+'K'
    +'</div>';
  html+='</div>';
  pCont.innerHTML=html;

  /* Click handler: row click → show project in right panel */
  pCont.addEventListener('click',function(e){
    var row=e.target.closest('[data-wd-idx]');
    if(!row) return;
    var idx=parseInt(row.getAttribute('data-wd-idx'));
    var ev=wdEvents[idx];
    if(!ev) return;
    /* Highlight active row */
    var rows=pCont.querySelectorAll('[data-wd-idx]');
    for(var r=0;r<rows.length;r++) rows[r].style.background=r==idx?'rgba(232,160,72,0.08)':'';
    /* Find and show project in right panel */
    var pr=findProp(ev);
    if(pr){
      _chartShowLens(pr);
      addProposalMarkers(pr);
    }
  });

  /* Auto-show first project in right panel if single event */
  if(wdEvents.length===1){
    var pr=findProp(wdEvents[0]);
    if(pr){
      _chartShowLens(pr);
      addProposalMarkers(pr);
    }
  }
}

function _updateFundFlow(children){
  var ff={};
  var src=children;
  if(!src){
    src=[];
    for(var fi=0;fi<INDUSTRIES.length;fi++){
      for(var fj=0;fj<INDUSTRIES[fi].children.length;fj++) src.push(INDUSTRIES[fi].children[fj]);
    }
  }
  for(var ci=0;ci<src.length;ci++){
    var fc=src[ci];
    var fn=fc.fund||0;if(!fn)continue;
    if(!ff[fn]) ff[fn]={count:0,adaK:0,budgetK:0,fundedK:0,receivedK:0,recvAdaK:0,proposals:[]};
    /* ADA amount (in K-ADA) */
    var adaK=fc.u==='ada'?fc.amt:(fc.amt/(fc.adaPrice||0.5));
    /* 3 financial metrics (all in K-USD) */
    var submitP=FUND_SUBMIT_PRICES[fn]||fc.adaPrice||0.5;
    var resultP=FUND_RESULT_PRICES[fn]||fc.adaPrice||0.5;
    var budK=adaK*submitP;      /* 予算額: value at submission */
    var funK=adaK*resultP;      /* 採択額: value at result */
    /* receivedK: historical price at milestone signoff / completion date */
    var recv=_calcReceivedK(fc.id,adaK,fc.st,fn);
    var recAdaK=recv.recvAdaK;
    var recK=recv.usd;

    ff[fn].count++;
    ff[fn].adaK+=adaK;
    ff[fn].budgetK+=budK;
    ff[fn].fundedK+=funK;
    ff[fn].receivedK+=recK;
    ff[fn].recvAdaK+=recAdaK;
    var msProg=fc.st==='complete'?'4/4':fc.st==='progress'?'2/4':'1/4';
    var msLabel=fc.st==='complete'?'完了':fc.st==='progress'?'途中':'中止';
    ff[fn].proposals.push({
      label:pLabel(fc),status:fc.st,msProg:msProg,msLabel:msLabel,
      adaK:adaK,budgetK:budK,fundedK:funK,receivedK:recK,recvAdaK:recAdaK
    });
  }
  window._chFundFlow=ff;
  _updateFlowStrip(ff);
  /* rebuild time map + histogram data */
  window._chFundTimeMap={};
  for(var fk in ff){
    var frd=FUND_RESULT_DATES[fk];if(!frd)continue;
    var fp=frd.split('-');
    var ftk=fp[2]+'-'+fp[1]+'-'+fp[0];
    window._chFundTimeMap[ftk]=fk;
  }
  for(var afk in FUND_RESULT_DATES){
    var afrd=FUND_RESULT_DATES[afk].split('-');
    var aftk=afrd[2]+'-'+afrd[1]+'-'+afrd[0];
    if(!window._chFundTimeMap[aftk]) window._chFundTimeMap[aftk]=afk;
  }
  _expandFundTimeMap(window._chFundTimeMap);
  /* update markers — show ALL fund dates (F2-F14) */
  if(window._chAdaLine){
    var markers=[];
    for(var fr in FUND_RESULT_DATES){
      var cnt=ff[fr]?ff[fr].count:0;
      var rp2=FUND_RESULT_DATES[fr].split('-');
      var rKey=rp2[2]+'-'+rp2[1]+'-'+rp2[0];
      if(cnt>0){
        markers.push({time:rKey,position:'aboveBar',color:'rgba(255,255,255,0.9)',shape:'arrowDown',size:0.5,text:'F'+fr});
      } else {
        markers.push({time:rKey,position:'aboveBar',color:'rgba(255,255,255,0.3)',shape:'arrowDown',size:0.5,text:'F'+fr});
      }
    }
    markers.sort(function(a,b){return a.time<b.time?-1:1;});
    window._chAdaLine.setMarkers(markers);
  }
  /* update funded/recv histogram series */
  if(window._chFundedSeries&&window._chRecvSeries){
    var fdData=[],rvData=[];
    for(var _fk in ff){
      var _frd=FUND_RESULT_DATES[_fk];if(!_frd)continue;
      var _fp=_frd.split('-');
      var _ftk=_fp[2]+'-'+_fp[1]+'-'+_fp[0];
      fdData.push({time:_ftk,value:ff[_fk].fundedK,color:'rgba(61,139,110,0.45)'});
      rvData.push({time:_ftk,value:ff[_fk].receivedK,color:'rgba(91,138,240,0.5)'});
    }
    fdData.sort(function(a,b){return a.time<b.time?-1:1;});
    rvData.sort(function(a,b){return a.time<b.time?-1:1;});
    window._chFundedSeries.setData(fdData);
    window._chRecvSeries.setData(rvData);
  }
}


/* ---- Range control ---- */
function applyChartRange(days){

  var from=all[Math.max(0,all.length-days)].time;

/* ================================================================
   NETWORK VIEW
   ================================================================ */
function renderNetwork(){
  var wrap=document.getElementById('nw-wrap');
  if(!wrap)return;
  wrap.innerHTML='';

  /* ---- build graph data ---- */
  var ppl={},edg={};
  for(var i=0;i<INDUSTRIES.length;i++){
    var sec=INDUSTRIES[i];
    for(var j=0;j<sec.children.length;j++){
      var p=sec.children[j];
      var inv=[];
      if(p.by)inv.push({name:p.by,role:'提案者'});
      if(p.team)for(var t=0;t<p.team.length;t++)inv.push({name:p.team[t].name,role:p.team[t].role});
      for(var k=0;k<inv.length;k++){
        var nm=inv[k].name;
        if(!ppl[nm])ppl[nm]={name:nm,props:[],totalAda:0,totalUsd:0,soloUsdK:0,coUsdK:0,_sectors:{}};
        ppl[nm].props.push({id:p.id,label:pLabel(p),role:inv[k].role,fund:p.fund,st:p.st,amt:p.amt,u:p.u,adaPrice:p.adaPrice,ch:p.ch,by:p.by,team:p.team,cls:p.cls,url:p.url,x:p.x,yt:p.yt,report:p.report,_secId:sec.id,_secHue:sec.hue,_secJa:sec.ja});
        if(p.u==='ada')ppl[nm].totalAda+=p.amt;
        else ppl[nm].totalUsd+=p.amt;
        var _uK=p.u==='ada'?p.amt*p.adaPrice:p.amt;
        if(inv[k].role==='提案者'&&p.cls==='main')ppl[nm].soloUsdK+=_uK;
        else ppl[nm].coUsdK+=_uK;
        ppl[nm]._sectors[sec.id]=(ppl[nm]._sectors[sec.id]||0)+1;
      }
      if(inv.length>=2){
        for(var a=0;a<inv.length;a++){
          for(var b=a+1;b<inv.length;b++){
            var ns=[inv[a].name,inv[b].name].sort();
            var ek=ns[0]+'|'+ns[1];
            if(!edg[ek])edg[ek]={a:ns[0],b:ns[1],proposals:[]};
            edg[ek].proposals.push(p);
          }
        }
      }
    }
  }

  var edges=[];for(var ek in edg)edges.push(edg[ek]);
  var conn={};
  for(var ei=0;ei<edges.length;ei++){conn[edges[ei].a]=true;conn[edges[ei].b]=true;}

  var nodes=[];
  for(var pk in ppl)nodes.push(ppl[pk]);
  for(var ni=0;ni<nodes.length;ni++){
    var c=0;
    for(var ei=0;ei<edges.length;ei++){if(edges[ei].a===nodes[ni].name||edges[ei].b===nodes[ni].name)c++;}
    nodes[ni].edgeCnt=c;
    nodes[ni].connected=!!conn[nodes[ni].name];
  }
  nodes.sort(function(a,b){return b.props.length-a.props.length});

  if(nodes.length===0){
    wrap.innerHTML='<div style="padding:80px 40px;color:var(--muted);font-family:\'JetBrains Mono\',monospace;font-size:11px">'+T('noTeamData')+'</div>';
    return;
  }

  /* name→index mapping + adjacency */
  var nameIdx={};
  for(var ni=0;ni<nodes.length;ni++)nameIdx[nodes[ni].name]=ni;
  var adjSets=[];
  for(var ni=0;ni<nodes.length;ni++)adjSets.push(new Set());
  for(var ei=0;ei<edges.length;ei++){
    var ai=nameIdx[edges[ei].a],bi=nameIdx[edges[ei].b];
    if(ai!=null&&bi!=null){adjSets[ai].add(bi);adjSets[bi].add(ai);}
  }

  /* primary sector → hue per person */
  var secIdx={};
  for(var si=0;si<INDUSTRIES.length;si++)secIdx[INDUSTRIES[si].id]={hue:INDUSTRIES[si].hue,ja:INDUSTRIES[si].ja,label:INDUSTRIES[si].label};
  var sectorCounts={};
  for(var ni=0;ni<nodes.length;ni++){
    var best=null,bestCnt=0;
    for(var sk in nodes[ni]._sectors){
      if(nodes[ni]._sectors[sk]>bestCnt){bestCnt=nodes[ni]._sectors[sk];best=sk;}
    }
    nodes[ni].sector=best;
    nodes[ni].hue=best&&secIdx[best]?secIdx[best].hue:0;
    nodes[ni].radius=18+Math.min(nodes[ni].props.length*3,28);
    if(best){sectorCounts[best]=(sectorCounts[best]||0)+1;}
  }

  /* ---- SVG viewBox layout ---- */
  var VW=1200,VH=800;
  var vcx=VW/2,vcy=VH/2;

  /* ALL nodes get positions (connected + solo) */
  var allIdx=[];
  for(var ni=0;ni<nodes.length;ni++)allIdx.push(ni);

  var pos=[];
  /* initial: circle layout for all */
  var initR=Math.min(VW,VH)*0.35;
  for(var ni=0;ni<nodes.length;ni++){
    var angle=(2*Math.PI*ni/nodes.length)-Math.PI/2;
    pos[ni]={x:vcx+Math.cos(angle)*initR,y:vcy+Math.sin(angle)*initR};
  }

  /* force simulation — all nodes participate */
  var SIM_ITER=600,linkDist=200,linkStr=0.04,charge=-2500,centerStr=0.006,collidePad=30;
  for(var it=0;it<SIM_ITER;it++){
    var alpha=1-it/SIM_ITER;
    /* link attraction */
    for(var ei=0;ei<edges.length;ei++){
      var ai=nameIdx[edges[ei].a],bi=nameIdx[edges[ei].b];
      if(ai==null||bi==null)continue;
      var dx=pos[bi].x-pos[ai].x,dy=pos[bi].y-pos[ai].y;
      var dist=Math.sqrt(dx*dx+dy*dy)||0.01;
      var f=(dist-linkDist)*linkStr*alpha;
      var fx=(dx/dist)*f,fy=(dy/dist)*f;
      pos[ai].x+=fx;pos[ai].y+=fy;
      pos[bi].x-=fx;pos[bi].y-=fy;
    }
    /* charge repulsion — all nodes */
    for(var a=0;a<nodes.length;a++){
      for(var b=a+1;b<nodes.length;b++){
        var dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;
        var d2=dx*dx+dy*dy;if(d2<1)d2=1;
        var dist=Math.sqrt(d2);
        var force=(charge*alpha)/d2;
        var fx=(dx/dist)*force,fy=(dy/dist)*force;
        pos[a].x-=fx;pos[a].y-=fy;
        pos[b].x+=fx;pos[b].y+=fy;
      }
    }
    /* centering */
    for(var ni=0;ni<nodes.length;ni++){
      pos[ni].x+=(vcx-pos[ni].x)*centerStr*alpha;
      pos[ni].y+=(vcy-pos[ni].y)*centerStr*alpha;
    }
    /* collision */
    for(var a=0;a<nodes.length;a++){
      for(var b=a+1;b<nodes.length;b++){
        var dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;
        var dist=Math.sqrt(dx*dx+dy*dy)||0.01;
        var minD=nodes[a].radius+nodes[b].radius+collidePad;
        if(dist<minD){
          var ov=(minD-dist)/2;
          var ox=(dx/dist)*ov,oy=(dy/dist)*ov;
          pos[a].x-=ox;pos[a].y-=oy;
          pos[b].x+=ox;pos[b].y+=oy;
        }
      }
    }
    /* clamp */
    var pad=60;
    for(var ni=0;ni<nodes.length;ni++){
      pos[ni].x=Math.max(pad,Math.min(VW-pad,pos[ni].x));
      pos[ni].y=Math.max(pad,Math.min(VH-pad,pos[ni].y));
    }
  }

  /* ---- state ---- */
  var nwSelected=null;

  /* ---- build DOM ---- */
  var stage=document.createElement('div');
  stage.className='nw-stage';

  var svgWrap=document.createElement('div');
  svgWrap.className='nw-svg-wrap';
  var svgNS='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+VW+' '+VH);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svgWrap.appendChild(svg);
  stage.appendChild(svgWrap);

  /* draw edges */
  var edgeGroup=document.createElementNS(svgNS,'g');
  var edgeEls=[];
  for(var ei=0;ei<edges.length;ei++){
    var e=edges[ei];
    var ai=nameIdx[e.a],bi=nameIdx[e.b];
    if(ai==null||bi==null)continue;
    var pa=pos[ai],pb=pos[bi];
    var mx=(pa.x+pb.x)/2,my=(pa.y+pb.y)/2;

    var line=document.createElementNS(svgNS,'line');
    line.setAttribute('x1',pa.x.toFixed(1));line.setAttribute('y1',pa.y.toFixed(1));
    line.setAttribute('x2',pb.x.toFixed(1));line.setAttribute('y2',pb.y.toFixed(1));
    line.setAttribute('class','nw-edge');
    line.setAttribute('stroke-width',String(Math.min(1.2+e.proposals.length*0.6,4.5)));
    line.setAttribute('data-ei',String(ei));
    edgeGroup.appendChild(line);
    edgeEls.push({el:line,ai:ai,bi:bi,edge:e});

    /* edge label */
    var lbl=document.createElementNS(svgNS,'text');
    lbl.setAttribute('x',mx.toFixed(1));
    lbl.setAttribute('y',(my-4).toFixed(1));
    lbl.setAttribute('class','nw-edge-lbl');
    lbl.textContent=e.proposals.length+'件';
    edgeGroup.appendChild(lbl);

    (function(edge,px,py){
      lbl.onclick=function(ev){ev.stopPropagation();showEdgePopup(edge,px,py);};
    })(e,mx,my);
  }
  svg.appendChild(edgeGroup);

  /* draw nodes */
  var nodeGroup=document.createElementNS(svgNS,'g');
  var nodeEls=[];
  for(var ni=0;ni<nodes.length;ni++){
    var node=nodes[ni];
    var p=pos[ni];
    var r=node.radius;
    var h=node.hue;

    var g=document.createElementNS(svgNS,'g');
    g.setAttribute('class','nw-node-g'+(node.connected?'':' solo'));
    g.setAttribute('transform','translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')');
    g.style.setProperty('--c',hsl(h));
    g.setAttribute('data-ni',String(ni));

    var halo=document.createElementNS(svgNS,'circle');
    halo.setAttribute('class','nw-halo');
    halo.setAttribute('r',String(r+12));
    g.appendChild(halo);

    var ring=document.createElementNS(svgNS,'circle');
    ring.setAttribute('class','nw-ring');
    ring.setAttribute('r',String(r+6));
    g.appendChild(ring);

    var circle=document.createElementNS(svgNS,'circle');
    circle.setAttribute('class','nw-nc');
    circle.setAttribute('r',String(r));
    g.appendChild(circle);

    var initial=node.name.charAt(0);
    if(/[a-zA-Z]/.test(initial))initial=initial.toUpperCase();
    var txt=document.createElementNS(svgNS,'text');
    txt.setAttribute('class','nw-init');
    txt.textContent=initial;
    g.appendChild(txt);

    var label=document.createElementNS(svgNS,'text');
    label.setAttribute('class','nw-label');
    label.setAttribute('y',String(r+14));
    label.textContent=node.name;
    g.appendChild(label);

    var sub=document.createElementNS(svgNS,'text');
    sub.setAttribute('class','nw-sub');
    sub.setAttribute('y',String(r+25));
    sub.textContent=node.props.length+'件'+(node.edgeCnt>0?' · '+node.edgeCnt+'接続':'');
    g.appendChild(sub);

    nodeGroup.appendChild(g);
    nodeEls.push({el:g,ni:ni,adj:adjSets[ni]});
  }
  svg.appendChild(nodeGroup);

  /* ---- hover & select interactions ---- */
  function applyHighlight(activeIdx){
    var adj=activeIdx!=null?adjSets[activeIdx]:null;
    var hiColor=activeIdx!=null?hsl(nodes[activeIdx].hue):null;

        else ne.el.classList.add('dim');
        if(nwSelected!=null&&ne.ni===nwSelected)ne.el.classList.add('sel');

    }
    for(var i=0;i<edgeEls.length;i++){
      var ee=edgeEls[i];
      if(activeIdx==null){
        ee.el.classList.remove('dim','hi');

    var my=(e.clientY-rect.top)/rect.height;
    var nw=nwVB.w*factor,nh=nwVB.h*factor;
    nw=Math.max(200,Math.min(VW*4,nw));nh=Math.max(150,Math.min(VH*4,nh));
    nwVB.x+=(nwVB.w-nw)*mx;nwVB.y+=(nwVB.h-nh)*my;
