function buildSidebar(){
  var sb=document.querySelector('.sector-bar');
  if(!sb)return;
  var cards=sb.querySelectorAll('.s-card');
  var idx=0;
  for(var i=0;i<cards.length;i++){
    var el=cards[i];
    if(el.classList.contains('s-all')){
      el.classList.toggle('active',filterSec===null&&filterBy===null);
    } else {
      if(viewMode==='sector'){
        if(idx<INDUSTRIES.length) el.classList.toggle('active',filterSec===INDUSTRIES[idx].id);
      } else {
        if(idx<PROPOSER_STATS.length) el.classList.toggle('active',filterBy===PROPOSER_STATS[idx].name);
      }
      idx++;
    }
  }
}

function updateMeta(){
  var el=document.querySelector('.meta');
  if(!el)return;
  if(filterSec===null&&filterBy===null){el.classList.remove('show');return;}
  var html='';
  if(filterSec!==null){
    var ind=null;
    for(var i=0;i<INDUSTRIES.length;i++){if(INDUSTRIES[i].id===filterSec){ind=INDUSTRIES[i];break;}}
    if(!ind){el.classList.remove('show');return;}
    var tot=ind._total,ok=ind._ok,wip=ind._wip,dnf=ind._dnf;
    var amtStr=fmtJpy(ind._usdK);
    html='<b>'+esc(secName(ind))+'</b><br>'
      +'<b>'+tot+'</b> '+T('funded')+'<br>'
      +'<b>'+ok+'</b> '+T('complete')+' ('+Math.round(tot?ok/tot*100:0)+'%)  '
      +'<b>'+wip+'</b> '+T('progress')+'  '
      +'<b>'+dnf+'</b> '+T('incomplete')+'<br>'
      +T('total')+' <b>'+amtStr+'</b>';
  } else if(filterBy!==null){
    var ps=null;
    for(var i=0;i<PROPOSER_STATS.length;i++){if(PROPOSER_STATS[i].name===filterBy){ps=PROPOSER_STATS[i];break;}}
    if(!ps){el.classList.remove('show');return;}
    var dispName=ps.unknown&&_lang==='en'?'Unknown':ps.name;
    var soloK=ps.mainUsdK,coK=ps.coUsdK,namedCnt=ps.teamCount,allK=ps.allUsdK;
    html='<b>'+esc(dispName)+'</b><br>'
      +'<b>'+ps.allCount+'</b> proposals<br>';
    if(soloK>0) html+=T('solo')+' <b>'+fmtJpy(soloK)+'</b>  ';
    if(coK>0) html+=T('coLabel')+' <b>'+fmtJpy(coK)+'</b>  ';
    if(namedCnt>0) html+=(_lang==='en'?'Named':'名義')+' <b>'+namedCnt+(_lang==='en'?' prop':'件')+'</b>  ';
    html+=T('total')+' <b>'+fmtJpy(allK)+'</b>';
  }
  html+='<div style="margin-top:6px;display:flex;flex-direction:column;gap:4px;font-size:8px;letter-spacing:0.08em;opacity:0.7">'
    +'<div style="display:flex;gap:12px">'
    +'<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:3px;border-radius:1px;background:var(--st-ok)"></span>'+T('complete')+'</span>'
    +'<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:3px;border-radius:1px;background:var(--st-wip)"></span>'+T('progress')+'</span>'
    +'<span style="display:flex;align-items:center;gap:3px"><span style="width:8px;height:3px;border-radius:1px;background:var(--st-dnf)"></span>'+T('dnf')+'</span>'
    +'</div>'
    +'<div style="display:flex;gap:12px">'
    +'<span>'+(_lang==='en'?'Solo = main proposer':'単独 = メイン提案者')+'</span>'
    +'<span>'+(_lang==='en'?'Co = co-proposer (shared funding)':'共同 = 共同提案（資金共有）')+'</span>'
    +'<span>'+(_lang==='en'?'Named = listed on proposal':'名義 = 提案に名前記載')+'</span>'
    +'</div>'
    +'</div>';
  el.innerHTML=html;
  el.classList.add('show');
}

/* ================================================================
   PAN / ZOOM
   ================================================================ */
function ptrDown(e){
  if(e.target.closest('.node'))return;
  dragging=true;dragX=e.clientX;dragY=e.clientY;
  document.querySelector('.stage').classList.add('grabbing');
  e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId);
}
function ptrMove(e){
  if(!dragging)return;
  panX+=e.clientX-dragX;panY+=e.clientY-dragY;
  dragX=e.clientX;dragY=e.clientY;setTfm();
}
function ptrUp(e){
  dragging=false;
  var s=document.querySelector('.stage');
  if(s)s.classList.remove('grabbing');
}
function onWheel(e){
  e.preventDefault();
  var d=e.deltaY>0?-0.06:0.06;
  zoom=Math.max(0.2,Math.min(3,zoom+d));
  setTfm();
}
function setTfm(){
  var layer=document.querySelector('.layer');
  var svg=document.querySelector('.lines');
  if(layer)layer.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')';
  if(svg)svg.style.transform='translate('+panX+'px,'+panY+'px) scale('+zoom+')';
}

/* ================================================================
   TIMELINE VIEW
   ================================================================ */
function renderTimeline(){
  var wrap=document.getElementById('tl-wrap');
  if(!wrap)return;
  wrap.innerHTML='';

  /* collect all funds used */
  var fundSet={};
  for(var i=0;i<INDUSTRIES.length;i++){
    for(var j=0;j<INDUSTRIES[i].children.length;j++){
      var f=INDUSTRIES[i].children[j].fund;
      if(f) fundSet[f]=true;
    }
  }
  var funds=Object.keys(fundSet).map(Number).sort(function(a,b){return a-b});

  /* build proposer→fund→proposals map */
  var sorted=PROPOSER_STATS.slice().sort(function(a,b){
    if(a.unknown) return 1;if(b.unknown) return -1;
    return b.count-a.count;
  });
  if(filterBy){
    sorted=sorted.filter(function(ps){return ps.name===filterBy});
  }

  var pMap=[];
  for(var pi=0;pi<sorted.length;pi++){
    var ps=sorted[pi];
    var byFund={};
    var total=0;
    for(var ii=0;ii<INDUSTRIES.length;ii++){
      for(var jj=0;jj<INDUSTRIES[ii].children.length;jj++){
        var p=INDUSTRIES[ii].children[jj];
        if(ps.unknown?!p.by:p.by===ps.name){
          if(!byFund[p.fund]) byFund[p.fund]=[];
          byFund[p.fund].push(p);
          total++;
        }
      }
    }
    /* find first and last fund for this proposer */
    var firstF=99,lastF=0;
    for(var fk in byFund){var fn=Number(fk);if(fn<firstF)firstF=fn;if(fn>lastF)lastF=fn;}
    pMap.push({name:ps.name,byFund:byFund,total:total,unknown:ps.unknown,first:firstF,last:lastF});
  }

  var cols=funds.length+1; /* +1 for name column */

  /* grid */
  var grid=document.createElement('div');
  grid.className='tl-grid';
  grid.style.gridTemplateColumns='140px repeat('+funds.length+',minmax(100px,1fr))';

  /* header row */
  var hdrName=document.createElement('div');
  hdrName.className='tl-hdr tl-hdr-name';
  hdrName.textContent=T('proposer');
  grid.appendChild(hdrName);
  for(var fi=0;fi<funds.length;fi++){
    var hdr=document.createElement('div');
    hdr.className='tl-hdr';
    hdr.textContent='F'+funds[fi];
    grid.appendChild(hdr);
  }

  /* rows */
  for(var ri=0;ri<pMap.length;ri++){
    var row=pMap[ri];
    var nameCell=document.createElement('div');
    nameCell.className='tl-row-name';
    nameCell.innerHTML=esc(row.name)+'<span class="tl-cnt">'+row.total+'</span>';
    (function(name){
      nameCell.onclick=function(){
        filterBy=(filterBy===name?null:name);
        viewMode='proposer';vis.clear();buildShell();render();centerView();
      };
    })(row.name);
    grid.appendChild(nameCell);

    for(var fi=0;fi<funds.length;fi++){
      var cell=document.createElement('div');
      cell.className='tl-cell';
      var proposals=row.byFund[funds[fi]];
      if(proposals){
        for(var pk=0;pk<proposals.length;pk++){
          var p=proposals[pk];
          var pip=document.createElement('div');
          pip.className='tl-pip';
          pip.style.borderLeft='3px solid '+stColor(p.st);
          pip.innerHTML='<div class="tl-pip-title">'+esc(trunc(p.label,30))+'</div>'
            +'<div class="tl-pip-meta">'+stBadge(p.st)
            +'<span class="tl-pip-amt">'+fmtDual(p.amt,p.u,p.adaPrice)+'</span></div>';
          pip.title=p.label+'\n'+stLabel(p.st)+' · F'+p.fund+'\n'+(p.ch||'');
          pip.style.cursor='pointer';
          (function(pr){pip.onclick=function(e){e.stopPropagation();openInLens(pr)};})(p);
          cell.appendChild(pip);
        }
      }
      /* draw span indicator for first/last */
      if(!proposals&&funds[fi]>=row.first&&funds[fi]<=row.last){
        var dot=document.createElement('div');
        dot.style.cssText='height:1px;background:var(--border);margin:auto 0;opacity:0.4';
        cell.appendChild(dot);
      }
      grid.appendChild(cell);
    }
  }

  wrap.appendChild(grid);
}

/* ================================================================
   NETWORK VIEW
   ================================================================ */
function renderNetwork(){
  var wrap=document.getElementById('nw-wrap');
  if(!wrap)return;
  wrap.innerHTML='';

  /* ---- build graph data ---- */
  var ppl={},edg={};
  for(var i=0;i<INDUSTRIES.length;i++){
    var sec=INDUSTRIES[i];
    for(var j=0;j<sec.children.length;j++){
      var p=sec.children[j];
      var inv=[];
      if(p.by)inv.push({name:p.by,role:'提案者'});
      if(p.team)for(var t=0;t<p.team.length;t++)inv.push({name:p.team[t].name,role:p.team[t].role});
      for(var k=0;k<inv.length;k++){
        var nm=inv[k].name;
        if(!ppl[nm])ppl[nm]={name:nm,props:[],totalAda:0,totalUsd:0,soloUsdK:0,coUsdK:0,_sectors:{}};
        ppl[nm].props.push({id:p.id,label:p.label,role:inv[k].role,fund:p.fund,st:p.st,amt:p.amt,u:p.u,adaPrice:p.adaPrice,ch:p.ch,by:p.by,team:p.team,cls:p.cls,url:p.url,x:p.x,yt:p.yt,report:p.report,_secId:sec.id,_secHue:sec.hue,_secJa:sec.ja});
        if(p.u==='ada')ppl[nm].totalAda+=p.amt;
        else ppl[nm].totalUsd+=p.amt;
        var _uK=p.u==='ada'?p.amt*p.adaPrice:p.amt;
        if(inv[k].role==='提案者'&&p.cls==='main')ppl[nm].soloUsdK+=_uK;
        else ppl[nm].coUsdK+=_uK;
        ppl[nm]._sectors[sec.id]=(ppl[nm]._sectors[sec.id]||0)+1;
      }
      if(inv.length>=2){
        for(var a=0;a<inv.length;a++){
          for(var b=a+1;b<inv.length;b++){
            var ns=[inv[a].name,inv[b].name].sort();
            var ek=ns[0]+'|'+ns[1];
            if(!edg[ek])edg[ek]={a:ns[0],b:ns[1],proposals:[]};
            edg[ek].proposals.push(p);
          }
        }
      }
    }
  }

  var edges=[];for(var ek in edg)edges.push(edg[ek]);
  var conn={};
  for(var ei=0;ei<edges.length;ei++){conn[edges[ei].a]=true;conn[edges[ei].b]=true;}

  var nodes=[];
  for(var pk in ppl)nodes.push(ppl[pk]);
  for(var ni=0;ni<nodes.length;ni++){
    var c=0;
    for(var ei=0;ei<edges.length;ei++){if(edges[ei].a===nodes[ni].name||edges[ei].b===nodes[ni].name)c++;}
    nodes[ni].edgeCnt=c;
    nodes[ni].connected=!!conn[nodes[ni].name];
  }
  nodes.sort(function(a,b){return b.props.length-a.props.length});

  if(nodes.length===0){
    wrap.innerHTML='<div style="padding:80px 40px;color:var(--muted);font-family:\'JetBrains Mono\',monospace;font-size:11px">'+T('noTeamData')+'</div>';
    return;
  }

  /* name→index mapping + adjacency */
  var nameIdx={};
  for(var ni=0;ni<nodes.length;ni++)nameIdx[nodes[ni].name]=ni;
  var adjSets=[];
  for(var ni=0;ni<nodes.length;ni++)adjSets.push(new Set());
  for(var ei=0;ei<edges.length;ei++){
    var ai=nameIdx[edges[ei].a],bi=nameIdx[edges[ei].b];
    if(ai!=null&&bi!=null){adjSets[ai].add(bi);adjSets[bi].add(ai);}
  }

  /* primary sector → hue per person */
  var secIdx={};
  for(var si=0;si<INDUSTRIES.length;si++)secIdx[INDUSTRIES[si].id]={hue:INDUSTRIES[si].hue,ja:INDUSTRIES[si].ja,label:INDUSTRIES[si].label};
  var sectorCounts={};
  for(var ni=0;ni<nodes.length;ni++){
    var best=null,bestCnt=0;
    for(var sk in nodes[ni]._sectors){
      if(nodes[ni]._sectors[sk]>bestCnt){bestCnt=nodes[ni]._sectors[sk];best=sk;}
    }
    nodes[ni].sector=best;
    nodes[ni].hue=best&&secIdx[best]?secIdx[best].hue:0;
    nodes[ni].radius=18+Math.min(nodes[ni].props.length*3,28);
    if(best){sectorCounts[best]=(sectorCounts[best]||0)+1;}
  }

  /* ---- SVG viewBox layout ---- */
  var VW=1200,VH=800;
  var vcx=VW/2,vcy=VH/2;

  /* ALL nodes get positions (connected + solo) */
  var allIdx=[];
  for(var ni=0;ni<nodes.length;ni++)allIdx.push(ni);

  var pos=[];
  /* initial: circle layout for all */
  var initR=Math.min(VW,VH)*0.35;
  for(var ni=0;ni<nodes.length;ni++){
    var angle=(2*Math.PI*ni/nodes.length)-Math.PI/2;
    pos[ni]={x:vcx+Math.cos(angle)*initR,y:vcy+Math.sin(angle)*initR};
  }

  /* force simulation — all nodes participate */
  var SIM_ITER=600,linkDist=200,linkStr=0.04,charge=-2500,centerStr=0.006,collidePad=30;
  for(var it=0;it<SIM_ITER;it++){
    var alpha=1-it/SIM_ITER;
    /* link attraction */
    for(var ei=0;ei<edges.length;ei++){
      var ai=nameIdx[edges[ei].a],bi=nameIdx[edges[ei].b];
      if(ai==null||bi==null)continue;
      var dx=pos[bi].x-pos[ai].x,dy=pos[bi].y-pos[ai].y;
      var dist=Math.sqrt(dx*dx+dy*dy)||0.01;
      var f=(dist-linkDist)*linkStr*alpha;
      var fx=(dx/dist)*f,fy=(dy/dist)*f;
      pos[ai].x+=fx;pos[ai].y+=fy;
      pos[bi].x-=fx;pos[bi].y-=fy;
    }
    /* charge repulsion — all nodes */
    for(var a=0;a<nodes.length;a++){
      for(var b=a+1;b<nodes.length;b++){
        var dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;
        var d2=dx*dx+dy*dy;if(d2<1)d2=1;
        var dist=Math.sqrt(d2);
        var force=(charge*alpha)/d2;
        var fx=(dx/dist)*force,fy=(dy/dist)*force;
        pos[a].x-=fx;pos[a].y-=fy;
        pos[b].x+=fx;pos[b].y+=fy;
      }
    }
    /* centering */
    for(var ni=0;ni<nodes.length;ni++){
      pos[ni].x+=(vcx-pos[ni].x)*centerStr*alpha;
      pos[ni].y+=(vcy-pos[ni].y)*centerStr*alpha;
    }
    /* collision */
    for(var a=0;a<nodes.length;a++){
      for(var b=a+1;b<nodes.length;b++){
        var dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;
        var dist=Math.sqrt(dx*dx+dy*dy)||0.01;
        var minD=nodes[a].radius+nodes[b].radius+collidePad;
        if(dist<minD){
          var ov=(minD-dist)/2;
          var ox=(dx/dist)*ov,oy=(dy/dist)*ov;
          pos[a].x-=ox;pos[a].y-=oy;
          pos[b].x+=ox;pos[b].y+=oy;
        }
      }
    }
    /* clamp */
    var pad=60;
    for(var ni=0;ni<nodes.length;ni++){
      pos[ni].x=Math.max(pad,Math.min(VW-pad,pos[ni].x));
      pos[ni].y=Math.max(pad,Math.min(VH-pad,pos[ni].y));
    }
  }

  /* ---- state ---- */
  var nwSelected=null;

  /* ---- build DOM ---- */
  var stage=document.createElement('div');
  stage.className='nw-stage';

  var svgWrap=document.createElement('div');
  svgWrap.className='nw-svg-wrap';
  var svgNS='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 '+VW+' '+VH);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svgWrap.appendChild(svg);
  stage.appendChild(svgWrap);

  /* draw edges */
  var edgeGroup=document.createElementNS(svgNS,'g');
  var edgeEls=[];
  for(var ei=0;ei<edges.length;ei++){
    var e=edges[ei];
    var ai=nameIdx[e.a],bi=nameIdx[e.b];
    if(ai==null||bi==null)continue;
    var pa=pos[ai],pb=pos[bi];
    var mx=(pa.x+pb.x)/2,my=(pa.y+pb.y)/2;

    var line=document.createElementNS(svgNS,'line');
    line.setAttribute('x1',pa.x.toFixed(1));line.setAttribute('y1',pa.y.toFixed(1));
    line.setAttribute('x2',pb.x.toFixed(1));line.setAttribute('y2',pb.y.toFixed(1));
    line.setAttribute('class','nw-edge');
    line.setAttribute('stroke-width',String(Math.min(1.2+e.proposals.length*0.6,4.5)));
    line.setAttribute('data-ei',String(ei));
    edgeGroup.appendChild(line);
    edgeEls.push({el:line,ai:ai,bi:bi,edge:e});

    /* edge label */
    var lbl=document.createElementNS(svgNS,'text');
    lbl.setAttribute('x',mx.toFixed(1));
    lbl.setAttribute('y',(my-4).toFixed(1));
    lbl.setAttribute('class','nw-edge-lbl');
    lbl.textContent=e.proposals.length+'件';
    edgeGroup.appendChild(lbl);

    (function(edge,px,py){
      lbl.onclick=function(ev){ev.stopPropagation();showEdgePopup(edge,px,py);};
    })(e,mx,my);
  }
  svg.appendChild(edgeGroup);

  /* draw nodes */
  var nodeGroup=document.createElementNS(svgNS,'g');
  var nodeEls=[];
  for(var ni=0;ni<nodes.length;ni++){
    var node=nodes[ni];
    var p=pos[ni];
    var r=node.radius;
    var h=node.hue;

    var g=document.createElementNS(svgNS,'g');
    g.setAttribute('class','nw-node-g'+(node.connected?'':' solo'));
    g.setAttribute('transform','translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')');
    g.style.setProperty('--c',hsl(h));
    g.setAttribute('data-ni',String(ni));

    var halo=document.createElementNS(svgNS,'circle');
    halo.setAttribute('class','nw-halo');
    halo.setAttribute('r',String(r+12));
    g.appendChild(halo);

    var ring=document.createElementNS(svgNS,'circle');
    ring.setAttribute('class','nw-ring');
    ring.setAttribute('r',String(r+6));
    g.appendChild(ring);

    var circle=document.createElementNS(svgNS,'circle');
    circle.setAttribute('class','nw-nc');
    circle.setAttribute('r',String(r));
    g.appendChild(circle);

    var initial=node.name.charAt(0);
    if(/[a-zA-Z]/.test(initial))initial=initial.toUpperCase();
    var txt=document.createElementNS(svgNS,'text');
    txt.setAttribute('class','nw-init');
    txt.textContent=initial;
    g.appendChild(txt);

    var label=document.createElementNS(svgNS,'text');
    label.setAttribute('class','nw-label');
    label.setAttribute('y',String(r+14));
    label.textContent=node.name;
    g.appendChild(label);

    var sub=document.createElementNS(svgNS,'text');
    sub.setAttribute('class','nw-sub');
    sub.setAttribute('y',String(r+25));
    sub.textContent=node.props.length+'件'+(node.edgeCnt>0?' · '+node.edgeCnt+'接続':'');
    g.appendChild(sub);

    nodeGroup.appendChild(g);
    nodeEls.push({el:g,ni:ni,adj:adjSets[ni]});
  }
  svg.appendChild(nodeGroup);

  /* ---- hover & select interactions ---- */
  function applyHighlight(activeIdx){
    var adj=activeIdx!=null?adjSets[activeIdx]:null;
    var hiColor=activeIdx!=null?hsl(nodes[activeIdx].hue):null;
    for(var i=0;i<nodeEls.length;i++){
      var ne=nodeEls[i];
      if(activeIdx==null){
        ne.el.classList.remove('dim','hi');
        if(nwSelected!=null&&ne.ni===nwSelected)ne.el.classList.add('sel');
        else ne.el.classList.remove('sel');
      } else {
        ne.el.classList.remove('dim','hi','sel');
        if(ne.ni===activeIdx)ne.el.classList.add('hi');
        else if(adj&&adj.has(ne.ni))ne.el.classList.add('hi');
        else ne.el.classList.add('dim');
        if(nwSelected!=null&&ne.ni===nwSelected)ne.el.classList.add('sel');
      }
    }
    for(var i=0;i<edgeEls.length;i++){
      var ee=edgeEls[i];
      if(activeIdx==null){
        ee.el.classList.remove('dim','hi');
        ee.el.style.removeProperty('--hi-c');
      } else {
        if(ee.ai===activeIdx||ee.bi===activeIdx){
          ee.el.classList.add('hi');ee.el.classList.remove('dim');
          ee.el.style.setProperty('--hi-c',hiColor);
        } else {
          ee.el.classList.add('dim');ee.el.classList.remove('hi');
          ee.el.style.removeProperty('--hi-c');
        }
      }
    }
  }

  function selectNode(ni){
    nwSelected=ni;
    applyHighlight(ni);
    renderDetail(ni!=null?nodes[ni]:null);
  }

  for(var i=0;i<nodeEls.length;i++){
    (function(ne){
      ne.el.onmouseenter=function(){if(nwSelected==null)applyHighlight(ne.ni);};
      ne.el.onmouseleave=function(){if(nwSelected==null)applyHighlight(null);};
      ne.el.onclick=function(ev){
        ev.stopPropagation();
        if(nwSelected===ne.ni){selectNode(null);}
        else{selectNode(ne.ni);}
      };
    })(nodeEls[i]);
  }

  stage.addEventListener('click',function(ev){
    if(!ev.target.closest('.nw-node-g')&&!ev.target.closest('.nw-popup')&&!ev.target.closest('.nw-edge-lbl')){
      selectNode(null);
      var pp=document.getElementById('nw-popup');
      if(pp)pp.classList.remove('open');
    }
  });

  /* popup container */
  var popup=document.createElement('div');
  popup.className='nw-popup';
  popup.id='nw-popup';
  stage.appendChild(popup);

  /* left legend panel */
  var legend=document.createElement('div');
  legend.className='nw-legend';
  var sharedIds={};
  for(var ei=0;ei<edges.length;ei++){
    for(var pi=0;pi<edges[ei].proposals.length;pi++){sharedIds[edges[ei].proposals[pi].id]=true;}
  }
  var sharedCnt=Object.keys(sharedIds).length;
  var connCnt=0;for(var ni=0;ni<nodes.length;ni++){if(nodes[ni].connected)connCnt++;}

  /* 概況 */
  var kpiSec=document.createElement('div');
  kpiSec.className='nw-legend-sec';
  kpiSec.innerHTML='<div class="nw-legend-title">'+T('overview')+'</div>'
    +'<div class="nw-legend-kpi">'
    +'<div class="kv"><b>'+nodes.length+'</b><span>'+T('people')+'</span></div>'
    +'<div class="kv"><b>'+edges.length+'</b><span>'+T('connLabel')+'</span></div>'
    +'<div class="kv"><b>'+connCnt+'</b><span>'+T('hasCollab')+'</span></div>'
    +'<div class="kv"><b>'+sharedCnt+'</b><span>'+T('sharedProp')+'</span></div>'
    +'</div>';
  legend.appendChild(kpiSec);

  /* カテゴリ */
  var catSec=document.createElement('div');
  catSec.className='nw-legend-sec';
  var catHtml='<div class="nw-legend-title">'+T('categories')+'</div><div class="nw-legend-cat">';
  for(var si=0;si<INDUSTRIES.length;si++){
    var sid=INDUSTRIES[si].id;
    var cnt=sectorCounts[sid]||0;
    if(cnt===0)continue;
    catHtml+='<div class="cat-row" data-sec="'+sid+'">'
      +'<div class="cat-dot" style="background:'+hsl(INDUSTRIES[si].hue)+'"></div>'
      +'<div class="cat-label">'+esc(secName(INDUSTRIES[si]))+'</div>'
      +'<div class="cat-cnt">'+cnt+'</div></div>';
  }
  catHtml+='</div>';
  catSec.innerHTML=catHtml;
  legend.appendChild(catSec);

  /* ノードサイズ */
  var sizeSec=document.createElement('div');
  sizeSec.className='nw-legend-sec';
  sizeSec.innerHTML='<div class="nw-legend-title">'+T('nodeSize')+'</div>'
    +'<div class="nw-legend-size">'
    +'<div class="sz" style="width:14px;height:14px"></div>'
    +'<div class="sz" style="width:22px;height:22px"></div>'
    +'<div class="sz" style="width:32px;height:32px"></div>'
    +'<span>'+T('propToNode')+'</span></div>';
  legend.appendChild(sizeSec);

  stage.appendChild(legend);

  /* category filter click */
  catSec.addEventListener('click',function(ev){
    var row=ev.target.closest('.cat-row');
    if(!row)return;
    var sid=row.getAttribute('data-sec');
    var rows=catSec.querySelectorAll('.cat-row');
    var isActive=row.style.opacity==='';
    if(isActive){
      for(var ri=0;ri<rows.length;ri++)rows[ri].style.opacity=rows[ri]===row?'':'0.3';
      for(var ni=0;ni<nodeEls.length;ni++){
        var ne=nodeEls[ni];
        if(nodes[ne.ni].sector===sid){ne.el.classList.remove('dim');ne.el.classList.add('hi');}
        else{ne.el.classList.add('dim');ne.el.classList.remove('hi');}
      }
      for(var ei=0;ei<edgeEls.length;ei++){
        var ee=edgeEls[ei];
        if(nodes[ee.ai].sector===sid||nodes[ee.bi].sector===sid){
          ee.el.classList.remove('dim');ee.el.classList.add('hi');
          ee.el.style.setProperty('--hi-c',hsl(secIdx[sid].hue));
        }else{ee.el.classList.add('dim');ee.el.classList.remove('hi');}
      }
    }else{
      for(var ri=0;ri<rows.length;ri++)rows[ri].style.opacity='';
      applyHighlight(nwSelected);
    }
  });

  /* bottom bar */
  var bbar=document.createElement('div');
  bbar.className='nw-bottombar';
  bbar.innerHTML='<button title="'+T('nwTooltipPeople')+'">'+T('peopleArrow')+'</button><span class="sep"></span><button title="'+T('nwTooltipAll')+'">'+T('allShow')+'</button>';
  bbar.children[0].onclick=function(){
    if(nwSelected!=null){
      filterBy=nodes[nwSelected].name;viewMode='proposer';vis.clear();vis.add('root');
      buildShell();render();centerView();
    }
  };
  stage.appendChild(bbar);

  wrap.appendChild(stage);

  /* ---- detail panel ---- */
  var detail=document.createElement('div');
  detail.className='nw-detail';
  detail.id='nw-detail';
  wrap.appendChild(detail);

  function renderDetail(node){
    var d=document.getElementById('nw-detail');
    if(!d)return;
    d.innerHTML='';
    if(!node){
      d.innerHTML='<div class="nw-detail-empty"><div class="glyph">⦿</div>'+T('selectNodeHint')+'</div>';
      return;
    }
    var h=node.hue;

    /* head */
    var head=document.createElement('div');
    head.className='nw-detail-head';
    head.style.setProperty('--c',hsl(h));

    var row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:12px';
    var av=document.createElement('div');
    av.className='nw-detail-avatar';
    var ini=node.name.charAt(0);if(/[a-zA-Z]/.test(ini))ini=ini.toUpperCase();
    av.textContent=ini;
    av.style.borderColor=hsl(h);
    row.appendChild(av);

    var info=document.createElement('div');
    info.style.cssText='min-width:0;flex:1';
    var nm=document.createElement('h3');nm.className='nw-detail-name';nm.textContent=node.name;
    var org=document.createElement('div');org.className='nw-detail-org';
    org.textContent=node.props.length+T('propsOf')+' · '+node.edgeCnt+T('connLabel');
    info.appendChild(nm);info.appendChild(org);
    row.appendChild(info);

    var closeBtn=document.createElement('button');
    closeBtn.style.cssText='background:none;border:1px solid var(--border);border-radius:6px;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:14px';
    closeBtn.textContent='×';
    closeBtn.onclick=function(){selectNode(null);};
    row.appendChild(closeBtn);
    head.appendChild(row);

    /* chips */
    var chips=document.createElement('div');
    chips.className='nw-detail-chips';
    chips.style.setProperty('--c',hsl(h));
    var _totalUsdK=node.soloUsdK+node.coUsdK;
    var amtStr=fmtJpy(_totalUsdK);
    chips.innerHTML='<span class="nw-chip cat">'+node.props.length+T('propsOf')+'</span>'
      +'<span class="nw-chip">'+node.edgeCnt+T('connLabel')+'</span>';
    head.appendChild(chips);
    var amtSec=document.createElement('div');
    amtSec.style.cssText='margin-top:6px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 5%,var(--paper));border:1px solid color-mix(in srgb,var(--accent) 15%,var(--border))';
    var amtInner='<div style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:var(--muted);letter-spacing:0.08em;margin-bottom:4px">'+T('totalInvolvedLong')+'</div>'
      +'<div style="font-family:\'JetBrains Mono\',monospace;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-0.02em">'+amtStr+'</div>';
    if(node.coUsdK>0){
      amtInner+='<div style="display:flex;gap:12px;margin-top:6px;font-family:\'JetBrains Mono\',monospace;font-size:10px;letter-spacing:0.04em">'
        +'<span style="color:var(--ink);opacity:0.8">'+T('solo')+' <b>'+fmtJpy(node.soloUsdK)+'</b></span>'
        +'<span style="color:hsl(270 50% 75%)">'+T('coLabel')+' <b>'+fmtJpy(node.coUsdK)+'</b></span>'
        +'</div>';
    }
    amtSec.innerHTML=amtInner;
    head.appendChild(amtSec);

    /* go to proposer button */
    var goBtn=document.createElement('button');
    goBtn.style.cssText='margin-top:12px;width:100%;padding:8px 0;border:1px solid color-mix(in srgb,'+hsl(h)+' 30%,var(--border));border-radius:8px;background:color-mix(in srgb,'+hsl(h)+' 6%,var(--paper));color:var(--ink);font-family:\'JetBrains Mono\',monospace;font-size:10px;cursor:pointer;letter-spacing:0.04em;transition:background .2s,border-color .2s,transform .15s';
    goBtn.textContent=T('openPeople');
    goBtn.onmouseenter=function(){goBtn.style.background='color-mix(in srgb,'+hsl(h)+' 14%,var(--paper))';goBtn.style.borderColor='color-mix(in srgb,'+hsl(h)+' 50%,var(--border))'};
    goBtn.onmouseleave=function(){goBtn.style.background='color-mix(in srgb,'+hsl(h)+' 6%,var(--paper))';goBtn.style.borderColor='color-mix(in srgb,'+hsl(h)+' 30%,var(--border))'};
    goBtn.onclick=function(){
      filterBy=node.name;viewMode='proposer';vis.clear();vis.add('root');
      buildShell();render();centerView();
    };
    head.appendChild(goBtn);
    d.appendChild(head);

    /* proposals section */
    var sec=document.createElement('div');
    sec.className='nw-detail-sec';
    var hasLinks=node.props.some(function(p){return p.url||p.x||p.yt||p.report;});
    sec.innerHTML='<h4>'+T('propS')+' ('+node.props.length+')</h4>';
    for(var pi=0;pi<node.props.length;pi++){
      var pr=node.props[pi];
      var row=document.createElement('div');
      row.className='nw-prop-row';
      var linksHtml='';
      if(pr.url||pr.x||pr.yt||pr.report){
        linksHtml='<div class="nw-prop-links">';
        if(pr.url)linksHtml+='<button class="lk" data-href="'+esc(pr.url)+'" title="Project"><svg viewBox="0 0 16 16"><path d="M6.354 5.5H4a3 3 0 000 6h3a3 3 0 002.83-2H8.82A2 2 0 017 11H4a2 2 0 010-4h2.354M9.646 10.5H12a3 3 0 000-6H9a3 3 0 00-2.83 2h1.012A2 2 0 019 5h3a2 2 0 010 4H9.646"/></svg></button>';
        if(pr.x)linksHtml+='<button class="lk" data-href="'+esc(pr.x)+'" title="X (Twitter)"><svg viewBox="0 0 16 16"><path d="M9.333 6.929L14.546 1h-1.235L8.783 6.147 5.17 1H1l5.466 7.783L1 15.222h1.235l4.779-5.436L10.83 15.222H15L9.333 6.929zm-1.692 1.924l-.554-.776L2.874 1.91h1.898l3.556 4.977.554.776 4.623 6.47h-1.898L7.641 8.853z"/></svg></button>';
        if(pr.yt)linksHtml+='<button class="lk" data-href="'+esc(pr.yt)+'" title="YouTube"><svg viewBox="0 0 16 16"><path d="M15.665 4.264A2.01 2.01 0 0014.252 2.84C13.035 2.5 8 2.5 8 2.5s-5.035 0-6.253.34A2.01 2.01 0 00.335 4.264 21.06 21.06 0 000 8a21.06 21.06 0 00.335 3.736 2.01 2.01 0 001.412 1.424C2.965 13.5 8 13.5 8 13.5s5.035 0 6.253-.34a2.01 2.01 0 001.412-1.424A21.06 21.06 0 0016 8a21.06 21.06 0 00-.335-3.736zM6.4 10.5V5.5L10.667 8 6.4 10.5z"/></svg></button>';
        if(pr.report)linksHtml+='<button class="lk lk-report" data-report="'+esc(pr.id)+'" title="'+T('completionReport')+'">CR</button>';
        linksHtml+='</div>';
      }
      row.innerHTML='<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:6px">'
        +'<div class="nw-prop-title" style="flex:1;min-width:0">'+esc(pr.label)+'</div>'
        +linksHtml+'</div>'
        +'<div class="nw-prop-meta">'+stBadge(pr.st)
        +clsTag(pr.cls)
        +'<span class="cat-tag fund-tag">F'+(pr.fund||'?')+'</span>'
        +'<span>'+fmtAmt(pr.amt,pr.u)+'</span>'
        +(pr.role&&pr.role!=='提案者'?'<span style="color:var(--accent)">'+esc(roleName(pr.role))+'</span>':'')
        +'</div>';
      (function(p){row.onclick=function(e){
        if(e.target.closest('.lk'))return;
        openInLens(p);
      };})(pr);
      sec.appendChild(row);
    }
    /* link button click handler (delegation) */
    sec.addEventListener('click',function(e){
      var btn=e.target.closest('.lk');
      if(!btn)return;
      e.stopPropagation();
      var href=btn.getAttribute('data-href');
      var reportId=btn.getAttribute('data-report');
      if(href){
        window.open(href,'_blank');
      }else if(reportId){
        var pr=null;
        for(var ii=0;ii<INDUSTRIES.length&&!pr;ii++)
          for(var jj=0;jj<INDUSTRIES[ii].children.length;jj++)
            if(INDUSTRIES[ii].children[jj].id===reportId){pr=INDUSTRIES[ii].children[jj];break;}
        if(pr){
          var crUrl='https://catalystexplorer.com/proposals?search='+encodeURIComponent(pr.label);
          window.open(crUrl,'_blank');
        }
      }
    });
    d.appendChild(sec);

    /* connections section */
    var myAdj=adjSets[nameIdx[node.name]];
    if(myAdj&&myAdj.size>0){
      var csec=document.createElement('div');
      csec.className='nw-detail-sec';
      csec.innerHTML='<h4>'+T('connLabel')+' ('+myAdj.size+')</h4>';
      myAdj.forEach(function(ci){
        var cn=nodes[ci];
        var cr=document.createElement('div');
        cr.className='nw-conn-row';
        cr.style.setProperty('--c',hsl(cn.hue));
        var cIni=cn.name.charAt(0);if(/[a-zA-Z]/.test(cIni))cIni=cIni.toUpperCase();
        /* shared proposal count */
        var shared=0;
        for(var ei=0;ei<edges.length;ei++){
          if((edges[ei].a===node.name&&edges[ei].b===cn.name)||(edges[ei].b===node.name&&edges[ei].a===cn.name))
            shared=edges[ei].proposals.length;
        }
        cr.innerHTML='<div class="nw-conn-av">'+cIni+'</div>'
          +'<div><div class="nw-conn-name">'+esc(cn.name)+'</div></div>'
          +'<div class="nw-conn-cnt">'+shared+T('sharedN')+'</div>';
        (function(idx){cr.onclick=function(){selectNode(idx);};})(ci);
        csec.appendChild(cr);
      });
      d.appendChild(csec);
    }
  }

  renderDetail(null);
}

function showEdgePopup(edge,x,y){
  var popup=document.getElementById('nw-popup');
  if(!popup)return;
  popup.innerHTML='';
  popup.className='nw-popup open';
  var stage=popup.parentElement;
  var mxX=stage?stage.clientWidth-300:500;
  var mxY=stage?stage.clientHeight-200:400;
  popup.style.left=Math.min(Math.max(10,x+10),mxX)+'px';
  popup.style.top=Math.min(Math.max(10,y+10),mxY)+'px';

  var title=document.createElement('div');
  title.className='nw-popup-title';
  title.textContent=edge.a+' × '+edge.b;
  popup.appendChild(title);

  for(var i=0;i<edge.proposals.length;i++){
    var p=edge.proposals[i];
    var item=document.createElement('div');
    item.className='nw-popup-item';
    var pLk='';
    if(p.url||p.x||p.yt||p.report){
      pLk='<span class="lk-row" style="margin-left:auto">';
      if(p.url)pLk+='<span class="lk-icon" title="Project" data-href="'+esc(p.url)+'">↗</span>';
      if(p.x)pLk+='<span class="lk-icon" title="X" data-href="'+esc(p.x)+'">𝕏</span>';
      if(p.yt)pLk+='<span class="lk-icon" title="YouTube" data-href="'+esc(p.yt)+'">▶</span>';
      if(p.report)pLk+='<span class="lk-icon lk-cr" title="'+T('completionReport')+'" data-report="'+esc(p.id)+'">CR</span>';
      pLk+='</span>';
    }
    item.innerHTML='<div style="display:flex;align-items:center;gap:4px"><div class="nw-popup-item-label" style="flex:1;min-width:0">'+esc(p.label)+'</div>'+pLk+'</div>'
      +'<div class="nw-popup-item-meta">'+stBadge(p.st)
      +'<span>F'+(p.fund||'?')+'</span>'
      +'<span>'+fmtAmt(p.amt,p.u)+'</span></div>';
    (function(pr){item.onclick=function(ev){
      var lki=ev.target.closest('.lk-icon');
      if(lki){
        ev.stopPropagation();
        var href=lki.getAttribute('data-href');
        var reportId=lki.getAttribute('data-report');
        if(href){
          window.open(href,'_blank');
        }else if(reportId){
          var crUrl='https://catalystexplorer.com/proposals?search='+encodeURIComponent(pr.label);
          window.open(crUrl,'_blank');
        }
        return;
      }
      ev.stopPropagation();openInLens(pr);
    };})(p);
    popup.appendChild(item);
  }
}

/* ================================================================
   EXPAND ALL
   ================================================================ */
function toggleExpandAll(){
  var tree=buildTree();
  if(!tree.children||!tree.children.length)return;
  var hasRoot=vis.has('root');
  var hasL2=false;
  if(hasRoot){
    for(var i=0;i<tree.children.length;i++){if(vis.has(tree.children[i].id)){hasL2=true;break;}}
  }
  if(!hasRoot){
    /* step 1: open L1 */
    vis.clear();vis.add('root');
  } else if(!hasL2){
    /* step 2: open L2 */
    for(var i=0;i<tree.children.length;i++) vis.add(tree.children[i].id);
  } else {
    /* step 3: close all */
    vis.clear();
  }
  render();
}

/* ================================================================
   INIT
   ================================================================ */
function centerView(){
  var stage=document.querySelector('.stage');
  if(!stage)return;
  var sw=stage.clientWidth,sh=stage.clientHeight;
  panX=120;panY=60;
  zoom=1;setTfm();
}

buildShell();
render();
centerView();

window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='theme-change'){
    if(e.data.dark)document.documentElement.classList.add('night');
    else document.documentElement.classList.remove('night');
    NIGHT=!!e.data.dark;render();
  }
});

/* ================================================================
   API SETTINGS MODAL
   ================================================================ */
(function(){
  var gearBtn=document.getElementById('api-gear-btn');
  var overlay=document.getElementById('api-modal-overlay');
  var saveBtn=document.getElementById('api-modal-save');
  var closeBtn=document.getElementById('api-modal-close');
  var providers=['claude','grok','gemini','groq','openrouter'];

  function loadKeys(){
    var keys={};
    try{keys=JSON.parse(localStorage.getItem('catalyst_apikeys')||'{}');}catch(e){}
    for(var i=0;i<providers.length;i++){
      var inp=document.getElementById('key-'+providers[i]);
      var dot=document.getElementById('dot-'+providers[i]);
      if(inp)inp.value=keys[providers[i]]||'';
      if(dot){
        if(keys[providers[i]])dot.classList.add('active');
        else dot.classList.remove('active');
      }
    }
  }

  function saveKeys(){
    var keys={};
    for(var i=0;i<providers.length;i++){
      var inp=document.getElementById('key-'+providers[i]);
      if(inp&&inp.value.trim())keys[providers[i]]=inp.value.trim();
    }
    localStorage.setItem('catalyst_apikeys',JSON.stringify(keys));
    loadKeys();
    overlay.classList.remove('open');
  }

  gearBtn.onclick=function(){loadKeys();overlay.classList.add('open');};
  closeBtn.onclick=function(){overlay.classList.remove('open');};
  saveBtn.onclick=saveKeys;
  overlay.onclick=function(e){if(e.target===overlay)overlay.classList.remove('open');};
})();
</script>
