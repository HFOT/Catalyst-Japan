<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Catalyst Japan — Project Catalyst funded proposals visualization for the Japanese ecosystem">
<meta property="og:title" content="Catalyst Japan">
<meta property="og:description" content="Interactive visualization of Project Catalyst funded proposals in the Japanese ecosystem">
<title>Catalyst Japan</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=JetBrains+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf7;--ink:#1a1715;--paper:#ffffff;--muted:#8a8a83;
  --border:#1a17151f;--border-h:#1a17153a;--dim:#1a17150a;
  --card-shadow:#1a171533;--stage-g1:#f0e8d8;--stage-g2:#e8e8e0;
  --selection-bg:#1a1715;--selection-fg:#fafaf7;
  --st-ok:#3d8b6e;--st-wip:#c49b2a;--st-dnf:#b85450;
}
html.night{
  --bg:#0c0d10;--ink:#e8e6e1;--paper:#16171a;--muted:#7a7a74;
  --border:#e8e6e11f;--border-h:#e8e6e13a;--dim:#e8e6e10a;
  --card-shadow:#00000066;--stage-g1:#12141a;--stage-g2:#101418;
  --selection-bg:#e8e6e1;--selection-fg:#0c0d10;
  --st-ok:#4ca882;--st-wip:#d4a832;--st-dnf:#c86460;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif}
#root{position:relative;height:100%;width:100%}
::selection{background:var(--selection-bg);color:var(--selection-fg)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}


.stage{
  position:absolute;top:0;left:180px;right:0;bottom:0;overflow:hidden;cursor:grab;
  background-image:
    radial-gradient(circle at 20% 30%,var(--stage-g1) 0%,transparent 40%),
    radial-gradient(circle at 80% 70%,var(--stage-g2) 0%,transparent 40%),
    var(--bg);
}
.stage.grabbing{cursor:grabbing}
.layer{position:absolute;left:0;top:0;transform-origin:0 0}
.lines{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;transform-origin:0 0}

/* Header */
.header{
  position:fixed;top:12px;left:196px;right:24px;
  display:flex;justify-content:space-between;align-items:flex-start;
  pointer-events:none;z-index:50;
}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.title-row{display:flex;align-items:baseline;gap:12px;flex-wrap:nowrap}
.title{font-family:'Fraunces',serif;font-size:28px;font-weight:500;letter-spacing:-0.01em;line-height:1;font-variation-settings:"opsz" 96;white-space:nowrap}
.title em{font-style:italic;color:var(--muted);font-weight:400;margin-left:8px}
.title-info{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.hdr-src{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.04em;
  color:rgba(255,255,255,0.35);white-space:nowrap;
}
.ref-links{display:flex;gap:6px;align-items:center}
.ref-links a{
  display:flex;align-items:center;gap:3px;
  padding:2px 6px 2px 4px;border-radius:4px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);
  transition:all .15s;opacity:0.4;text-decoration:none;
  font-family:'JetBrains Mono',monospace;font-size:7px;color:rgba(255,255,255,0.5);letter-spacing:0.02em;
}
.ref-links a:hover{opacity:1;background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.2)}
.ref-links a img{width:12px;height:12px;border-radius:1px}
.meta{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.18em;color:var(--muted);text-transform:uppercase;text-align:right;line-height:1.9;opacity:0;pointer-events:none;transition:opacity 0.2s ease}
.meta.show{opacity:1;pointer-events:auto}
.meta b{color:var(--ink);font-weight:500}

/* Sidebar */
.sector-bar{
  position:absolute;top:0;left:0;bottom:0;width:180px;
  display:flex;flex-direction:column;gap:0;z-index:50;pointer-events:auto;
  background:var(--paper);border-right:1px solid var(--border);
  padding:20px 0 80px;overflow-y:auto;
}
.sector-bar .s-card{
  padding:12px 16px;cursor:pointer;transition:all 0.15s ease;
  display:flex;flex-direction:column;gap:4px;position:relative;
  border-bottom:1px solid var(--dim);
}
.sector-bar .s-card:hover{background:var(--dim)}
.sector-bar .s-card.active{background:var(--dim);box-shadow:inset 3px 0 0 var(--ink)}
.sector-bar .s-card.active .s-name{color:var(--ink);font-weight:500}
.sector-bar .s-top{display:flex;align-items:center;gap:6px}
.sector-bar .s-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sector-bar .s-name{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.06em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sector-bar .s-bottom{display:flex;align-items:baseline;justify-content:space-between;gap:4px}
.sector-bar .s-amt{
  font-family:'Fraunces',serif;font-size:15px;font-weight:500;line-height:1;
  font-variation-settings:"opsz" 96;white-space:nowrap;
}
.sector-bar .s-pct{
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.05em;
}
.sector-bar .s-bar{height:3px;border-radius:2px;background:var(--dim);overflow:hidden;display:flex}
.sector-bar .s-bar-seg{height:100%;transition:width 0.3s ease}
.sector-bar .s-cnt{
  font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:0.05em;
}
.sector-bar .s-card.s-all{align-items:center;justify-content:center;gap:2px;padding:16px 16px}
.sector-bar .s-card.s-all .s-name{font-size:10px;letter-spacing:0.15em}

.sector-bar .s-divider{
  font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--muted);padding:14px 16px 6px;border-bottom:1px solid var(--dim);
}
.sector-bar .s-card .s-by-cnt{
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);
  margin-left:auto;white-space:nowrap;
}
.sector-bar .s-card .s-sub-amt{
  font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);
  padding:0 16px 2px;opacity:0.7;
}
.s-amt-sub{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;opacity:0.65}
.s-name-big{font-size:11px;letter-spacing:0.04em;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-amt-line{display:flex;align-items:baseline;gap:4px;padding-top:2px}
.s-amt-line .s-amt{font-family:'Fraunces',serif;font-size:16px;font-weight:500;line-height:1;font-variation-settings:"opsz" 96}
.s-amt-line .s-co-paren{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);opacity:0.7;white-space:nowrap}
.s-amt-line .s-co-only{font-family:'JetBrains Mono',monospace;font-size:8px;color:hsl(270 50% 75%);opacity:0.85}
.s-amt-line .s-amt-named{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);opacity:0.6;letter-spacing:0.06em}
.s-tag-line{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);opacity:0.7;padding-top:1px;letter-spacing:0.04em}
.s-row3{display:flex;justify-content:flex-end;padding-top:2px}

/* ---- Detail Panel ---- */
.ct-detail{
  position:absolute;top:24px;right:24px;bottom:24px;width:480px;
  background:var(--paper);border:1px solid var(--border);border-radius:8px;
  box-shadow:0 8px 32px -8px var(--card-shadow);z-index:60;
  display:none;flex-direction:column;overflow:hidden;
  transform:translateX(12px);opacity:0;
  transition:transform .25s ease,opacity .25s ease;
}
.ct-detail.open{display:flex;transform:translateX(0);opacity:1}
.ct-detail-close{
  position:absolute;top:12px;right:12px;width:26px;height:26px;
  border:none;background:var(--dim);border-radius:4px;cursor:pointer;
  font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;
}
.ct-detail-close:hover{background:var(--border-h);color:var(--ink)}
.ct-detail-head{
  padding:18px 22px 14px;border-bottom:1px solid var(--border);
  display:flex;flex-direction:column;gap:6px;flex-shrink:0;
}
.ct-d-entity{
  display:flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--muted);
}
.ct-d-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ct-d-title{
  font-family:'Fraunces',serif;font-size:16px;font-weight:500;
  letter-spacing:-0.01em;line-height:1.35;color:var(--ink);
}
.ct-d-amounts{display:flex;align-items:baseline;gap:10px}
.ct-d-amt{
  font-family:'Fraunces',serif;font-size:20px;font-weight:500;
  font-feature-settings:"tnum";color:var(--c);
}
.ct-d-amt .unit{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.12em;margin-left:2px}
.ct-d-usd{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.ct-d-meta{
  display:flex;gap:8px;flex-wrap:wrap;
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.06em;
}
.ct-d-badge{padding:2px 8px;border-radius:3px;font-size:9px;letter-spacing:0.1em;text-transform:uppercase}
.ct-d-badge.st-complete{background:hsl(145 35% 20%);color:hsl(145 55% 70%)}
.ct-d-badge.st-progress{background:hsl(40 40% 20%);color:hsl(40 60% 70%)}
.ct-d-badge.st-dnf{background:hsl(0 35% 20%);color:hsl(0 55% 70%)}
.ct-detail-body{flex:1;overflow-y:auto;padding:16px 22px 20px}
.ct-detail-body::-webkit-scrollbar{width:4px}
.ct-detail-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ct-d-section{margin-bottom:16px}
.ct-d-label{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px;
}
.ct-d-text{font-size:13px;line-height:1.7;color:var(--ink);word-wrap:break-word}
.ct-d-fetch-btn{
  display:inline-flex;align-items:center;gap:4px;margin-top:8px;
  background:transparent;border:1px solid var(--border);border-radius:4px;
  color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:0.1em;text-transform:uppercase;padding:4px 10px;cursor:pointer;
}
.ct-d-fetch-btn:hover{background:var(--dim);color:var(--ink);border-color:var(--border-h)}
.ct-d-team{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ct-d-team-tag{
  font-family:'JetBrains Mono',monospace;font-size:9px;
  padding:2px 6px;border-radius:3px;background:var(--dim);color:var(--ink);
}
.ct-lens-row{
  border-top:1px solid var(--border);padding:12px 22px;flex-shrink:0;
  display:flex;flex-direction:column;gap:8px;
}
.ct-lens-header{display:flex;align-items:center;gap:8px}
.ct-lens-logo{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.12em;color:var(--muted)}
.ct-lens-logo::before{content:'◉ ';color:var(--c)}
.ct-lens-presets{display:flex;gap:6px;flex-wrap:wrap}
.ct-lens-preset{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.04em;
  padding:4px 10px;border-radius:4px;border:1px solid var(--border);
  background:transparent;color:var(--muted);cursor:pointer;
}
.ct-lens-preset:hover{background:var(--dim);color:var(--ink);border-color:var(--border-h)}
.ct-lens-input-row{display:flex;gap:6px}
.ct-lens-input{
  flex:1;background:var(--dim);border:1px solid var(--border);border-radius:4px;
  padding:6px 10px;font-size:12px;color:var(--ink);outline:none;
  font-family:inherit;
}
.ct-lens-input::placeholder{color:var(--muted)}
.ct-lens-send{
  padding:6px 14px;border:none;border-radius:4px;background:var(--c);
  color:var(--bg);font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:0.08em;cursor:pointer;
}
.ct-lens-send:hover{opacity:0.85}
.ct-lens-log{max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.ct-lens-msg{padding:8px 10px;border-radius:6px;font-size:11px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.ct-lens-msg-user{background:rgba(255,255,255,0.06);color:var(--ink)}
.ct-lens-msg-ai{background:hsla(270,40%,50%,0.12);color:var(--ink)}
.ct-lens-msg-err{background:rgba(239,68,68,0.12);color:#ef4444}
.ct-lens-msg-label{font-size:8px;font-weight:700;letter-spacing:0.08em;color:var(--muted);margin-bottom:2px;text-transform:uppercase}
.ct-lens-thinking{font-size:11px;color:var(--muted);font-style:italic;padding:4px 0}
.fund-tag{background:hsl(270 30% 25%);color:hsl(270 50% 75%)}
/* ---- Main view bar (top center) ---- */
/* ---- Main view bar (top center) ---- */
.view-bar{
  position:fixed;top:8px;left:calc(190px + (100% - 190px)/2);transform:translateX(-50%);z-index:100;
  display:flex;align-items:center;gap:3px;
  background:rgba(20,20,25,0.88);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:3px;
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
}
.view-bar-btn{
  padding:5px 16px;border:none;border-radius:6px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.06em;line-height:1;
  color:rgba(255,255,255,0.4);background:none;transition:all .2s ease;white-space:nowrap;
}
.view-bar-btn:hover{color:rgba(255,255,255,0.7);background:rgba(255,255,255,0.05)}
.view-bar-btn.active{color:#fff;background:hsla(270,50%,55%,0.3);box-shadow:0 0 10px hsla(270,50%,55%,0.15)}
.view-bar-sep{width:1px;height:16px;background:rgba(255,255,255,0.1);margin:0 2px}
.sort-group{display:flex;align-items:center;gap:1px;background:rgba(255,255,255,0.06);border-radius:5px;padding:1px;margin-left:2px;border:1px solid rgba(255,255,255,0.08)}
.sort-btn{padding:3px 7px;border:none;border-radius:4px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.04em;color:rgba(255,255,255,0.3);background:none;transition:all .15s ease;white-space:nowrap;line-height:1}
.sort-btn:hover{color:rgba(255,255,255,0.55)}
.sort-btn.active{color:#fff;background:rgba(255,255,255,0.12)}
.sort-hl{color:hsla(270,70%,75%,1)!important;text-shadow:0 0 10px hsla(270,60%,55%,0.6)}
.lang-toggle{
  position:relative;display:flex;align-items:center;
  background:rgba(255,255,255,0.06);border-radius:6px;padding:2px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.06em;line-height:1;
  border:1px solid rgba(255,255,255,0.08);margin-left:2px;
}
.lang-toggle-label{
  position:relative;z-index:1;padding:4px 7px;color:rgba(255,255,255,0.35);transition:color .2s;user-select:none;
}
.lang-toggle-label.active{color:#fff}
.lang-toggle-pill{
  position:absolute;top:2px;height:calc(100% - 4px);width:50%;border-radius:4px;
  background:rgba(255,255,255,0.12);box-shadow:0 0 6px rgba(255,255,255,0.08);
  transition:left .2s ease;
}
.lang-toggle-pill.en{left:calc(50% - 2px)}
.lang-toggle-pill.ja{left:2px}

/* Nodes */
.node{
  position:absolute;left:0;top:0;
  pointer-events:auto;cursor:default;transition:opacity .25s ease;
}
.node.dim{opacity:0.32}
.node-card{
  background:var(--paper);border:1px solid var(--border);border-radius:6px;
  padding:10px 14px;width:280px;overflow:hidden;
  transition:background .2s,border-color .2s,box-shadow .2s,transform .2s;
  cursor:pointer;user-select:none;
}
.node-card:hover{border-color:var(--c);box-shadow:0 4px 16px -6px var(--card-shadow);transform:translateY(-1px)}
.node-card.expanded{box-shadow:inset 3px 0 0 var(--c)}

.row{display:flex;align-items:baseline;gap:8px;overflow:hidden;min-width:0}
.label{
  font-size:13px;font-weight:500;color:var(--ink);line-height:1.3;letter-spacing:-0.005em;
  flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.amount{
  font-family:'Fraunces',serif;font-size:13px;font-weight:500;
  color:var(--ink);font-feature-settings:"tnum";white-space:nowrap;flex-shrink:0;
}
.amount .unit{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.15em;margin-left:2px}
.toggle{
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.05em;
  border:1px solid var(--border);border-radius:3px;padding:1px 5px;line-height:1.3;
  transition:color .2s,border-color .2s;flex-shrink:0;
}
.node-card:hover .toggle{color:var(--c);border-color:var(--c)}
.cat-tag{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.04em;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;
}
.st-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}
.st-badge{
  font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.04em;
  padding:1px 5px;border-radius:2px;white-space:nowrap;
}
.st-complete{background:hsl(145 35% 20%);color:hsl(145 55% 70%)}
.st-progress{background:hsl(40 40% 20%);color:hsl(40 60% 70%)}
.st-dnf{background:hsl(0 35% 20%);color:hsl(0 55% 70%)}
.st-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.04em;color:var(--muted)}

/* Root pill */
.node.root .node-card{
  background:var(--ink);color:var(--bg);border-color:var(--ink);
  padding:14px 22px;border-radius:999px;text-align:center;width:220px;
}
.node.root .node-card:hover{transform:none;box-shadow:0 8px 24px -8px var(--card-shadow)}
.node.root .label{color:var(--bg);font-family:'Fraunces',serif;font-size:18px;letter-spacing:-0.01em;text-align:center;font-weight:500;white-space:normal}
.node.root .sub{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.25em;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:4px}

/* L1 industry group */
.node.l1 .node-card{padding:10px 16px;width:480px;min-height:42px;height:auto;position:relative}
.node.l1 .row{flex-wrap:nowrap;white-space:nowrap}
.node.l1 .label{font-family:'Fraunces',serif;font-size:15px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:100px}
.node.l1 .cat-tag{max-width:180px;overflow:hidden;text-overflow:ellipsis}
/* 3-column proposer layout */
.l1-prop{display:grid;grid-template-columns:130px 140px 1fr;gap:0 8px;align-items:center}
.l1-col-left{grid-column:1;display:flex;flex-direction:column;gap:0;min-width:0;overflow:hidden;justify-content:center}
.l1-col-left .label{font-family:'Fraunces',serif;font-size:17px;font-weight:500;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1-top-right{position:absolute;top:5px;right:10px;font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:0.04em;color:var(--muted);opacity:0.6}
.l1-col-mid{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:center;align-self:center;gap:0}
.l1-col-mid .l1-mid-label{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:0.04em;color:var(--muted);text-transform:uppercase;display:grid;grid-template-columns:50px auto 50px;gap:0 2px}
.l1-col-mid .l1-mid-label .lbl-l{text-align:right}.l1-col-mid .l1-mid-label .lbl-r{text-align:left}
.l1-col-mid .l1-mid-val{font-family:'Fraunces',serif;font-size:15px;font-weight:500;letter-spacing:-0.01em;font-variation-settings:"opsz" 96;white-space:nowrap;display:grid;grid-template-columns:50px auto 50px;gap:0 2px;align-items:baseline}
.l1-col-mid .l1-mid-val .v-l{text-align:right}.l1-col-mid .l1-mid-val .v-sl{opacity:0.35;font-size:14px}.l1-col-mid .l1-mid-val .v-r{text-align:left}
.l1-col-mid-named{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:center;align-self:center;gap:0}
.l1-col-mid-named .l1-mid-label{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:0.06em;color:var(--muted)}
.l1-col-mid-named .l1-mid-val{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.l1-col-right{grid-column:3;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.02em;white-space:nowrap;display:flex;gap:10px;align-self:center;align-items:flex-start;justify-content:flex-end;padding-top:10px}
.l1-col-right .l1-r-cell{display:flex;flex-direction:column;gap:0;align-items:flex-end}
.l1-col-right .l1-r-title{color:var(--ink);opacity:0.9;font-size:6px;letter-spacing:0.04em;text-transform:uppercase;display:grid;grid-template-columns:30px auto 52px;gap:0 2px}
.l1-col-right .l1-r-title .lbl-l{text-align:right}.l1-col-right .l1-r-title .lbl-r{text-align:left}
.l1-col-right .l1-r-val{color:var(--muted);font-size:8px;display:grid;grid-template-columns:30px auto 52px;gap:0 2px}
.l1-col-right .l1-r-val .v-l{text-align:right}.l1-col-right .l1-r-val .v-sl{opacity:0.35}.l1-col-right .l1-r-val .v-r{text-align:left}
.l1-col-right .l1-r-cell2{display:flex;flex-direction:column;gap:0;align-items:flex-end}
.l1-col-right .l1-r-title2{color:var(--ink);opacity:0.9;font-size:7px;letter-spacing:0.06em;text-transform:uppercase}
.l1-col-right .l1-r-val2{color:var(--muted)}
.node.l1 .mini-bar{height:3px;border-radius:2px;background:var(--dim);overflow:hidden;display:flex;margin-top:4px}
.node.l1 .mini-bar-seg{height:100%}

/* L2 proposals */
.node.l2 .node-card{padding:10px 14px;width:560px;min-height:44px;border-left:3px solid hsl(200 40% 45%)}
.node.l2.cls-co .node-card{border-left-color:hsl(270 50% 55%)}
.node.l2.cls-bridge .node-card{border-left-color:hsl(30 55% 55%)}
.node.l2 .label{font-size:13px;font-weight:400;letter-spacing:0}
.node.l2 .row{gap:6px}
.node.l2 .amount{white-space:nowrap}
.node.l2 .amt-sub{font-size:9px;color:var(--muted);margin-left:4px}
.amt-now{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);opacity:0.55;margin-left:4px;white-space:nowrap}
.role-pfx{font-size:10px;color:var(--muted);opacity:0.7;font-weight:400;letter-spacing:0.02em}
.role-tag{
  font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.04em;
  padding:1px 5px;border-radius:2px;white-space:nowrap;
}
.role-proposer{background:hsl(200 40% 25%);color:hsl(200 60% 80%)}
.role-co{background:hsl(260 30% 25%);color:hsl(260 50% 80%)}
.role-advisor{background:hsl(40 40% 25%);color:hsl(40 60% 80%)}
.role-marketing{background:hsl(330 35% 25%);color:hsl(330 55% 80%)}
.role-dev{background:hsl(150 35% 25%);color:hsl(150 55% 80%)}
.role-ops{background:hsl(20 35% 25%);color:hsl(20 55% 80%)}
.cls-tag{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.06em;padding:1px 5px;border-radius:2px;white-space:nowrap}
.cls-co{background:hsl(270 30% 22%);color:hsl(270 50% 75%)}
.cls-bridge{background:hsl(30 35% 22%);color:hsl(30 55% 75%)}

/* Link icons (tree view) */
.lk-row{display:inline-flex;gap:1px;margin-left:auto;flex-shrink:0;vertical-align:middle}
.lk-icon{
  display:inline-grid;place-items:center;width:18px;height:18px;border-radius:3px;
  font-size:9px;cursor:pointer;color:var(--muted);transition:all .15s;
  border:1px solid transparent;user-select:none;
}
.lk-icon:hover{
  background:color-mix(in srgb,var(--accent) 15%,var(--paper));
  border-color:color-mix(in srgb,var(--accent) 30%,var(--border));
  color:var(--ink);
}
.lk-cr{font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;letter-spacing:-0.02em}

/* Sector view (drill-down) */
.sector-view{
  position:absolute;top:0;left:0;right:0;bottom:0;z-index:55;background:var(--bg);color:var(--ink);
  overflow-y:auto;overflow-x:hidden;display:none;padding:32px 40px 80px;
}
.sector-view.open{display:block}
.sv-head{display:flex;align-items:center;gap:16px;margin-bottom:28px}
.sv-back{
  background:var(--paper);border:1px solid var(--border);border-radius:6px;
  color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:11px;
  padding:6px 14px;cursor:pointer;letter-spacing:0.1em;
}
.sv-back:hover{background:var(--dim)}
.sv-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.sv-title{font-family:'Fraunces',serif;font-size:26px;font-weight:500;letter-spacing:-0.01em;font-variation-settings:"opsz" 96}
.sv-stats{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:0.1em;margin-left:auto}

.sv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;margin-top:16px}
.sv-card{
  background:var(--paper);border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;cursor:default;transition:border-color 0.15s,box-shadow 0.15s;
  display:flex;flex-direction:column;gap:6px;user-select:none;
}
.sv-card:hover{border-color:var(--border-h);box-shadow:0 2px 8px -2px var(--card-shadow)}
.sv-card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sv-card-label{font-size:13px;font-weight:400;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-card-tag{
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:0.06em;
  padding:2px 8px;border-radius:3px;background:var(--dim);color:var(--muted);white-space:nowrap;
}
.sv-card-amt{font-family:'Fraunces',serif;font-size:15px;font-weight:500;font-variation-settings:"opsz" 96}
.sv-card-ch{font-size:11px;color:var(--muted);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hint{
  position:fixed;left:196px;bottom:12px;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.15em;
  color:var(--muted);text-transform:uppercase;pointer-events:none;z-index:50;
}

/* Timeline view */
.tl-wrap{
  position:absolute;top:0;left:180px;right:0;bottom:0;overflow:auto;background:var(--bg);z-index:40;
  padding:80px 24px 40px;display:none;
}
.tl-wrap.open{display:block}
.tl-grid{
  display:grid;gap:0;border-left:1px solid var(--border);
  font-family:'JetBrains Mono',monospace;font-size:10px;
}
.tl-hdr{
  position:sticky;top:0;z-index:3;background:var(--bg);
  font-size:11px;letter-spacing:0.12em;font-weight:500;color:var(--ink);
  text-align:center;padding:10px 4px;border-bottom:2px solid var(--border);border-right:1px solid var(--border);
}
.tl-hdr-name{text-align:left;padding-left:12px;min-width:120px}
.tl-row-name{
  position:sticky;left:0;z-index:2;background:var(--paper);
  font-size:10px;letter-spacing:0.04em;color:var(--ink);font-weight:500;
  padding:6px 10px;border-bottom:1px solid var(--dim);border-right:1px solid var(--border);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px;cursor:pointer;
}
.tl-row-name:hover{background:var(--dim)}
.tl-row-name .tl-cnt{
  font-size:8px;color:var(--muted);margin-left:auto;
}
.tl-cell{
  border-bottom:1px solid var(--dim);border-right:1px solid var(--dim);
  padding:3px 4px;min-height:32px;display:flex;flex-direction:column;gap:2px;align-items:stretch;
}
.tl-cell:nth-child(even){background:var(--dim)}
.tl-pip{
  background:var(--paper);border:1px solid var(--border);border-radius:4px;
  padding:3px 6px;font-size:9px;line-height:1.3;cursor:default;
  transition:border-color .15s,box-shadow .15s;overflow:hidden;
  display:flex;flex-direction:column;gap:2px;
}
.tl-pip:hover{border-color:var(--border-h);box-shadow:0 2px 6px -2px var(--card-shadow)}
.tl-pip-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;color:var(--ink)}
.tl-pip-meta{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tl-pip-amt{font-family:'Fraunces',serif;font-size:10px;font-weight:500;color:var(--ink);white-space:nowrap}

/* ═══════ Network View ═══════ */
.nw-wrap{
  position:absolute;top:0;left:180px;right:0;bottom:0;overflow:hidden;z-index:40;
  display:none;
}
.nw-wrap.open{display:grid;grid-template-columns:1fr 340px}

/* ── Stage ── */
.nw-stage{
  position:relative;overflow:hidden;min-width:0;
  background:
    radial-gradient(1000px 650px at 50% 42%,color-mix(in oklab,var(--accent,#6BA6FF) 6%,transparent),transparent 72%),
    var(--bg);
}
.nw-stage::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,var(--border) 0.8px,transparent 0.8px);
  background-size:26px 26px;opacity:0.25;pointer-events:none;
  mask-image:radial-gradient(ellipse 65% 55% at 50% 48%,black 40%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 65% 55% at 50% 48%,black 40%,transparent 100%);
}
.nw-svg-wrap{position:absolute;inset:0;z-index:1}
.nw-svg-wrap svg{width:100%;height:100%;display:block}

/* ── Edges ── */
.nw-edge{
  stroke-width:1.2;opacity:0.30;
  stroke:color-mix(in oklab,var(--ink) 30%,var(--border));
  transition:stroke .25s ease,stroke-width .25s ease,opacity .25s ease;
}
.nw-edge.hi{
  stroke:var(--hi-c,var(--accent,#6BA6FF));stroke-width:2.6;opacity:0.88;
  filter:drop-shadow(0 0 4px var(--hi-c,var(--accent,#6BA6FF)));
}
.nw-edge.dim{opacity:0.04}
.nw-edge-lbl{
  fill:var(--muted);font-size:8.5px;text-anchor:middle;dominant-baseline:middle;
  pointer-events:auto;cursor:pointer;font-family:'JetBrains Mono',monospace;
  paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;
  opacity:0.7;transition:fill .15s,opacity .15s;
}
.nw-edge-lbl:hover{fill:var(--ink);opacity:1}

/* ── Nodes ── */
.nw-node-g{cursor:pointer;transition:opacity .35s cubic-bezier(.4,0,.2,1)}
.nw-node-g.dim{opacity:0.12}
.nw-node-g.hi .nw-nc{stroke-width:2.8;filter:drop-shadow(0 0 16px var(--c,var(--accent)))}
.nw-node-g.hi .nw-halo{opacity:0.25}
.nw-node-g.hi .nw-label,.nw-node-g.hi .nw-sub{opacity:1}
.nw-node-g.sel .nw-nc{stroke-width:3.2;filter:drop-shadow(0 0 20px var(--c,var(--accent)))}
.nw-node-g.sel .nw-halo{opacity:0.35}
.nw-nc{
  fill:var(--paper,#161A21);stroke:var(--c,var(--border));stroke-width:2;
  transition:stroke-width .2s ease,filter .3s ease;
}
.nw-halo{fill:var(--c,var(--accent));opacity:0;transition:opacity .3s ease}
.nw-ring{fill:none;stroke:var(--c,var(--border));stroke-width:0.5;opacity:0.15}
.nw-init{
  fill:var(--ink);font-size:13px;font-weight:600;
  text-anchor:middle;dominant-baseline:central;pointer-events:none;
  letter-spacing:-0.01em;font-family:'JetBrains Mono',monospace;
}
.nw-label{
  fill:var(--ink);font-size:10.5px;font-weight:500;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;
  font-family:'JetBrains Mono',monospace;letter-spacing:-0.005em;
  opacity:0.88;transition:opacity .2s;
}
.nw-sub{
  fill:var(--muted);font-size:8.5px;text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round;
  font-family:'JetBrains Mono',monospace;opacity:0.6;transition:opacity .2s;
}
.nw-node-g.dim .nw-label,.nw-node-g.dim .nw-sub{opacity:0}
.nw-node-g.solo{opacity:0.55}
.nw-node-g.solo .nw-ring{stroke-dasharray:3 3;opacity:0.25}
.nw-node-g.solo .nw-nc{stroke-dasharray:4 3}
.nw-node-g.solo.hi,.nw-node-g.solo.sel{opacity:1}

/* ── Left legend panel ── */
.nw-legend{
  position:absolute;top:14px;left:14px;z-index:5;width:155px;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);
  display:flex;flex-direction:column;gap:14px;
}
.nw-legend-sec{
  background:color-mix(in srgb,var(--paper) 85%,transparent);
  border:1px solid var(--border);border-radius:10px;padding:12px 14px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.nw-legend-title{
  font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);
  margin-bottom:10px;font-weight:600;
}
.nw-legend-kpi{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.nw-legend-kpi .kv{display:flex;flex-direction:column;gap:1px}
.nw-legend-kpi .kv b{font-size:18px;font-weight:600;color:var(--ink);font-family:'Fraunces',serif;line-height:1}
.nw-legend-kpi .kv span{font-size:8px;letter-spacing:0.06em}
.nw-legend-cat{display:flex;flex-direction:column;gap:5px}
.nw-legend-cat .cat-row{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  padding:2px 0;transition:opacity .15s;
}
.nw-legend-cat .cat-row:hover{opacity:1 !important}
.nw-legend-cat .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nw-legend-cat .cat-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-size:9.5px}
.nw-legend-cat .cat-cnt{color:var(--muted);font-size:9px}
.nw-legend-size{display:flex;align-items:flex-end;gap:8px;padding:4px 0}
.nw-legend-size .sz{
  border-radius:50%;border:1.5px solid var(--border);background:var(--paper);
}
.nw-legend-size span{font-size:8px;margin-left:4px}

/* ── Bottom bar ── */
.nw-bottombar{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:5;
  display:flex;align-items:center;gap:2px;
  background:color-mix(in srgb,var(--paper) 90%,transparent);
  border:1px solid var(--border);border-radius:10px;padding:3px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 8px 24px -6px rgba(0,0,0,0.3);
}
.nw-bottombar button{
  height:28px;min-width:28px;padding:0 10px;border:0;background:transparent;
  color:var(--muted);border-radius:7px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.03em;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  transition:background .15s,color .15s;
}
.nw-bottombar button:hover{background:var(--dim);color:var(--ink)}
.nw-bottombar button.active{background:var(--dim);color:var(--ink)}
.nw-bottombar .sep{width:1px;height:16px;background:var(--border);margin:0 3px}

/* ── Detail panel ── */
.nw-detail{
  border-left:1px solid var(--border);background:var(--bg);
  overflow-y:auto;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.nw-detail::-webkit-scrollbar{width:4px}
.nw-detail::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.nw-detail-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:11px;gap:14px;
  line-height:1.6;text-align:center;
}
.nw-detail-empty .glyph{
  width:60px;height:60px;border-radius:50%;
  border:1.5px dashed color-mix(in srgb,var(--border) 70%,transparent);
  display:grid;place-items:center;color:var(--muted);font-size:20px;
}
.nw-detail-head{
  padding:22px 20px 16px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--accent)) 3%,var(--bg)),var(--bg) 100%);
}
.nw-detail-avatar{
  width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c,var(--accent)) 8%,var(--paper));
  border:2.5px solid var(--c,var(--border));
  font-weight:600;font-size:17px;color:var(--ink);
  font-family:'JetBrains Mono',monospace;letter-spacing:-0.01em;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--c,var(--accent)) 8%,transparent);
}
.nw-detail-name{font-size:16px;font-weight:600;letter-spacing:-0.02em;color:var(--ink);margin:0}
.nw-detail-org{font-size:11px;color:var(--muted);margin-top:3px;font-family:'JetBrains Mono',monospace}
.nw-detail-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.nw-chip{
  font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 9px;border-radius:999px;
  background:var(--paper);border:1px solid var(--border);color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.nw-chip.cat{
  color:var(--ink);font-weight:500;
  border-color:color-mix(in srgb,var(--c,var(--accent)) 40%,var(--border));
  background:color-mix(in srgb,var(--c,var(--accent)) 10%,var(--paper));
}

/* ── Proposal list ── */
.nw-detail-sec{padding:16px 20px;border-bottom:1px solid var(--border)}
.nw-detail-sec h4{
  margin:0 0 12px;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--muted);font-weight:600;font-family:'JetBrains Mono',monospace;
}
.nw-prop-row{
  padding:10px 12px;border-radius:8px;cursor:pointer;
  transition:background .15s,transform .15s;margin-bottom:3px;
  border:1px solid transparent;
}
.nw-prop-row:hover{
  background:color-mix(in srgb,var(--paper) 80%,var(--accent,#6BA6FF));
  border-color:var(--border);
}
.nw-prop-title{font-size:11.5px;color:var(--ink);margin-bottom:4px;line-height:1.35;font-weight:500}
.nw-prop-meta{
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}

/* ── Proposal link icons ── */
.nw-prop-links{
  display:flex;gap:2px;margin-left:auto;flex-shrink:0;
}
.nw-prop-links .lk{
  width:22px;height:22px;border-radius:5px;display:grid;place-items:center;
  cursor:pointer;border:1px solid transparent;transition:all .15s;
  background:transparent;color:var(--muted);font-size:12px;
  font-family:'JetBrains Mono',monospace;
}
.nw-prop-links .lk:hover{
  background:color-mix(in srgb,var(--accent) 12%,var(--paper));
  border-color:color-mix(in srgb,var(--accent) 30%,var(--border));
  color:var(--ink);
}
.nw-prop-links .lk svg{width:13px;height:13px;fill:currentColor}
.nw-prop-links .lk.lk-report{font-size:10px;font-weight:700;letter-spacing:-0.03em}

/* ── Connection list ── */
.nw-conn-row{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  cursor:pointer;transition:background .15s;
}
.nw-conn-row:hover{background:color-mix(in srgb,var(--paper) 80%,var(--c,var(--accent)))}
.nw-conn-av{
  width:28px;height:28px;border-radius:50%;
  background:color-mix(in srgb,var(--c,var(--border)) 8%,var(--paper));
  border:1.5px solid var(--c,var(--border));
  display:grid;place-items:center;font-size:10px;font-weight:600;
  font-family:'JetBrains Mono',monospace;color:var(--ink);flex-shrink:0;
}
.nw-conn-name{font-size:12px;color:var(--ink);font-weight:500}
.nw-conn-cnt{
  margin-left:auto;font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;
  padding:2px 7px;border-radius:999px;background:var(--paper);border:1px solid var(--border);
}

/* ── Popup ── */
.nw-popup{
  position:absolute;pointer-events:auto;z-index:10;
  background:color-mix(in srgb,var(--paper) 95%,transparent);
  border:1px solid var(--border);border-radius:10px;
  padding:12px 16px;width:290px;
  box-shadow:0 14px 40px rgba(0,0,0,0.45);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:none;
}
.nw-popup.open{display:block}
.nw-popup-title{
  font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.06em;
  color:var(--muted);margin-bottom:10px;
}
.nw-popup-item{
  padding:8px 0;border-top:1px solid var(--dim);cursor:pointer;
  transition:background .15s;border-radius:4px;
}
.nw-popup-item:hover{background:var(--dim)}
.nw-popup-item-label{font-size:11px;color:var(--ink);margin-bottom:3px;font-weight:500}
.nw-popup-item-meta{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.api-gear{
  position:fixed;top:8px;right:8px;z-index:9999;
  width:28px;height:28px;border:1px solid rgba(255,255,255,0.1);border-radius:6px;
  background:rgba(255,255,255,0.06);cursor:pointer;font-size:14px;
  color:rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.api-gear:hover{color:#fff;border-color:rgba(255,255,255,0.25);background:rgba(255,255,255,0.1)}
.api-modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:10000;
  display:none;align-items:center;justify-content:center;
}
.api-modal-overlay.open{display:flex}
.api-modal{
  background:var(--paper);border:1px solid var(--border);border-radius:10px;
  padding:24px;width:380px;max-width:90vw;color:var(--ink);
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.api-modal h3{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.api-field{margin-bottom:12px}
.api-field label{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.08em;color:var(--muted);margin-bottom:4px;text-transform:uppercase}
.api-field label .api-dot{width:6px;height:6px;border-radius:50%;background:var(--border)}
.api-field label .api-dot.active{background:#4ca882}
.api-field input{
  width:100%;padding:6px 10px;background:var(--dim);border:1px solid var(--border);
  border-radius:4px;color:var(--ink);font-family:'JetBrains Mono',monospace;font-size:11px;
  outline:none;box-sizing:border-box;
}
.api-field input:focus{border-color:var(--border-h)}
.api-modal-btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.api-modal-btns button{
  padding:6px 16px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:10px;
  letter-spacing:0.08em;cursor:pointer;border:1px solid var(--border);
  background:transparent;color:var(--ink);
}
.api-modal-btns button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.api-modal-btns button:hover{opacity:0.85}
.api-cors-note{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);margin-top:2px;padding-left:12px}
</style>

<div id="root"></div>
<script>
/* ================================================================
   CATALYST JAPAN — CIGNAL OS
   Horizontal Tree Map · Impact Report
   ================================================================ */
var COL=520, ROW=52, GAP=10, DUR=350;

/* ---- Night mode ---- */
var NIGHT=(function(){
  if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches) return true;
  var cs=window.getComputedStyle(document.documentElement);
  var bg=cs.backgroundColor||'';
  var m=bg.match(/\d+/g);
  if(m&&m.length>=3){var lum=(parseInt(m[0])*299+parseInt(m[1])*587+parseInt(m[2])*114)/1000;if(lum<50)return true}
  return false;
})();
if(NIGHT)document.documentElement.classList.add('night');

/* ---- Helpers ---- */
var ADA_USD=0.75, USD_JPY=150;
function esc(s){return s?s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
function trunc(s,m){if(!s)return'';s=s.replace(/\s+/g,' ').trim();return s.length>m?s.slice(0,m-1)+'…':s}
function hsl(h){return 'hsl('+h+' 50% '+(NIGHT?'58':'44')+'%)'}
function fmtAmt(v,u){
  if(u==='ada'){
    if(v>=1000) return (v/1000).toFixed(1)+'M ₳';
    return v+'K ₳';
  }
  if(v>=1000) return '$'+(v/1000).toFixed(v%1000?1:0)+'M';
  if(v<1) return '$'+Math.round(v*1000);
  return '$'+v+'K';
}
function fmtJpy(usdK){
  if(_lang==='en'){
    if(usdK>=1000) return '$'+(usdK/1000).toFixed(1)+'M';
    if(usdK>=1) return '$'+Math.round(usdK)+'K';
    return '$'+(usdK*1000).toFixed(0);
  }
  var jpy=usdK*1000*USD_JPY;
  if(jpy>=1e8) return '¥'+(jpy/1e8).toFixed(1)+'億';
  if(jpy>=1e4) return '¥'+Math.round(jpy/1e4)+'万';
  return '¥'+Math.round(jpy);
}
function fmtJpySub(usdK){
  if(_lang==='en'){
    var jpy=usdK*1000*USD_JPY;
    if(jpy>=1e8) return '¥'+(jpy/1e8).toFixed(1)+'億';
    if(jpy>=1e4) return '¥'+Math.round(jpy/1e4)+'万';
    return '¥'+Math.round(jpy);
  }
  if(usdK>=1000) return '$'+(usdK/1000).toFixed(1)+'M';
  if(usdK>=1) return '$'+Math.round(usdK)+'K';
  return '$'+(usdK*1000).toFixed(0);
}
function fmtDual(v,u,adaP){
  var ap=adaP||ADA_USD;
  var main=fmtAmt(v,u);
  var usd,sub1,sub2;
  if(u==='ada'){
    usd=v*ap;
    sub1=usd>=1000?'$'+(usd/1000).toFixed(1)+'M':'$'+Math.round(usd)+'K';
    sub2=_lang==='en'?'':' '+fmtJpy(usd);
  } else {
    usd=v;
    var ada=v/ap;
    sub1=ada>=1000?(ada/1000).toFixed(1)+'M ₳':Math.round(ada)+'K ₳';
    sub2=_lang==='en'?'':' '+fmtJpy(usd);
  }
  return main+'<span class="amt-sub">'+sub1+sub2+'</span>';
}
/* ---- i18n ---- */
var _lang='ja';
var _i18n={
  complete:{ja:'完了',en:'Completed'},progress:{ja:'進行中',en:'In Progress'},dnf:{ja:'中止',en:'Discontinued'},
  main:{ja:'メイン',en:'Main'},co:{ja:'共同提案者',en:'Co-proposer'},bridge:{ja:'仲介',en:'Bridge'},
  solo:{ja:'単独',en:'Solo'},coLabel:{ja:'共同提案者',en:'Co-proposer'},allCo:{ja:'全て共同提案',en:'All co-proposed'},
  totalInvolved:{ja:'関与総額',en:'Involved total'},totalInvolvedLong:{ja:'関与提案の総額',en:'Total value of involved proposals'},
  proposalInfo:{ja:'提案情報',en:'Proposal Info'},challenge:{ja:'チャレンジ',en:'Challenge'},
  team:{ja:'チーム',en:'Team'},proposer:{ja:'提案者',en:'Proposer'},proposals:{ja:'件',en:''},
  propCount:{ja:'件の提案',en:' proposals'},connections:{ja:'接続',en:' connections'},
  overview:{ja:'概況',en:'Overview'},people:{ja:'人物',en:'People'},
  hasCollab:{ja:'共同提案あり',en:'Co-proposed'},sharedProp:{ja:'共有提案',en:'Shared'},
  categories:{ja:'カテゴリ',en:'Categories'},completionReport:{ja:'完了報告',en:'Completion Report'},
  openPeople:{ja:'人物ビューで開く →',en:'Open in People view →'},
  hint:{ja:'ドラッグ · スクロール · クリックで展開',en:'Drag · Scroll · Click to expand'},
  sector:{ja:'業界',en:'Sector'},peopleTab:{ja:'人物',en:'People'},timeline:{ja:'時系列',en:'Timeline'},
  avg:{ja:'平均',en:'Avg'},max:{ja:'最大',en:'Max'},funded:{ja:'PROPOSALS FUNDED',en:'PROPOSALS FUNDED'},
  propS:{ja:'提案',en:'Proposals'},nameLabel:{ja:'名',en:''},
  allShow:{ja:'全表示',en:'Show all'},peopleArrow:{ja:'人物 ↗',en:'People ↗'},
  loading:{ja:'読み込み中...',en:'Loading...'},fetchOriginal:{ja:'⟳ 原文を取得',en:'⟳ Fetch original'},
  problem:{ja:'課題',en:'Problem'},solutionLabel:{ja:'解決策',en:'Solution'},
  votesLabel:{ja:'投票',en:'Votes'},linkLabel:{ja:'リンク',en:'Links'},
  descLabel:{ja:'説明',en:'Description'},apiFailed:{ja:'API取得失敗。LENSで質問してください。',en:'API fetch failed. Use LENS to ask.'},
  adaPriceLabel:{ja:'ADA価格',en:'ADA Price'},sortCount:{ja:'提案数順',en:'By count'},sortAmount:{ja:'調達額順',en:'By amount'},
  incomplete:{ja:'未完了',en:'Incomplete'},nodeSize:{ja:'ノードサイズ',en:'Node size'},
  propToNode:{ja:'提案数に比例',en:'Proportional to proposals'},
  selectNodeHint:{ja:'ノードを選択すると<br>詳細が表示されます',en:'Select a node to<br>view details'},
  sharedN:{ja:'件共有',en:' shared'},noTeamData:{ja:'チームデータのある提案がありません',en:'No proposals with team data'},
  collapseAll:{ja:'全部閉じる',en:'Collapse all'},expandAll:{ja:'全部開く',en:'Expand all'},
  japan:{ja:'日本',en:'Japan'},connLabel:{ja:'接続',en:' connections'},
  propsOf:{ja:'件の提案',en:' proposals'},total:{ja:'総額',en:'Total'},
  summary:{ja:'要約',en:'Summary'},riskAnalysis:{ja:'リスク分析',en:'Risk Analysis'},
  prosAndCons:{ja:'賛否の論点',en:'Pros & Cons'},comparison:{ja:'類似比較',en:'Compare similar'},
  lensAsk:{ja:'してください。',en:'. Please provide details.'},
  nwTooltipPeople:{ja:'人物ビューへ',en:'Go to People view'},nwTooltipAll:{ja:'全ノード表示',en:'Show all nodes'},
  members:{ja:'名',en:' members'}
};
function T(k){return _i18n[k]?(_i18n[k][_lang]||_i18n[k].ja):k}
function secName(sec){return _lang==='en'?sec.label:sec.ja}

function stColor(st){return st==='complete'?'var(--st-ok)':st==='progress'?'var(--st-wip)':'var(--st-dnf)'}
function stLabel(st){return st==='complete'?T('complete'):st==='progress'?T('progress'):T('dnf')}
function stBadgeClass(st){return st==='complete'?'st-complete':st==='progress'?'st-progress':'st-dnf'}
function stBadge(st){return '<span class="st-badge '+stBadgeClass(st)+'">'+stLabel(st)+'</span>'}
function roleClass(r){
  if(!r)return'role-proposer';
  if(r==='共同提案')return'role-co';
  if(r==='アドバイザー')return'role-advisor';
  if(r==='マーケティング')return'role-marketing';
  if(r==='開発')return'role-dev';
  if(r==='運営')return'role-ops';
  return'role-proposer';
}
function roleName(r){
  if(!r||r==='提案者')return T('proposer');
  if(r==='共同提案')return T('co');
  if(_lang==='en'){
    if(r==='アドバイザー')return'Advisor';if(r==='マーケティング')return'Marketing';
    if(r==='開発')return'Dev';if(r==='運営')return'Ops';if(r==='法務')return'Legal';if(r==='実行者')return'Executor';
  }
  return r;
}
function roleTag(role){
  if(!role)return'';
  return '<span class="role-tag '+roleClass(role)+'">'+esc(roleName(role))+'</span>';
}
function pathD(x1,y1,x2,y2){var mx=(x1+x2)/2;return'M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2}

function fmtPlain(amt,u,adaPrice){
  if(u==='ada'){var usd=amt*(adaPrice||ADA_USD);return Math.round(amt)+'K ₳ ($'+Math.round(usd)+'K)';}
  return '$'+Math.round(amt)+'K';
}
var _ctDetailProp=null;
var _ctDetailApi=null;

var _lensLog=[];
function _lensAppend(role,text){
  _lensLog.push({role:role,text:text});
  var log=document.getElementById('ct-lens-log');
  if(!log)return;
  var cls=role==='user'?'ct-lens-msg-user':role==='error'?'ct-lens-msg-err':'ct-lens-msg-ai';
  var label=role==='user'?'You':role==='error'?'Error':'AI';
  var div=document.createElement('div');div.className='ct-lens-msg '+cls;
  div.innerHTML='<div class="ct-lens-msg-label">'+label+'</div>'+esc(text);
  log.appendChild(div);
  log.scrollTop=log.scrollHeight;
}

function _buildLensContext(p,question){
  var teamStr='';
  if(p.team){for(var i=0;i<p.team.length;i++){teamStr+='\n  '+p.team[i].name+' ('+p.team[i].role+')';}}
  var msg='【'+p.label+'】\n提案者: '+(p.by||'不明')+'\n'
    +(teamStr?'チーム:'+teamStr+'\n':'')
    +'Fund: '+(p.fund||'?')+' / 金額: '+fmtPlain(p.amt,p.u,p.adaPrice)+' / 状態: '+stLabel(p.st)+'\n'
    +'チャレンジ: '+(p.ch||'');
  if(_ctDetailApi){
    msg+='\n\n--- Catalyst Explorer ---\n'
      +'課題: '+(_ctDetailApi.problem||'N/A')+'\n'
      +'解決策: '+(_ctDetailApi.solution||'N/A')+'\n'
      +(_ctDetailApi.content?'詳細: '+_ctDetailApi.content.substring(0,800)+'\n':'');
  }
  msg+='\n\n'+question;
  return msg;
}

function sendToLens(p,question){
  var msg=_buildLensContext(p,question);
  _lensAppend('user',question);

  var keys={};
  try{keys=JSON.parse(localStorage.getItem('catalyst_apikeys')||'{}');}catch(e){}
  var providers=['claude','grok','gemini','groq','openrouter'];

  var log=document.getElementById('ct-lens-log');
  var loadDiv=document.createElement('div');
  loadDiv.className='ct-lens-thinking';
  loadDiv.textContent='考え中...';
  if(log)log.appendChild(loadDiv);

  (function tryProvider(idx){
    if(idx>=providers.length){
      if(loadDiv.parentNode)loadDiv.remove();
      _lensAppend('error','API キー未設定です。右上の ⚙ から設定してください。');
      return;
    }
    var pName=providers[idx],key=keys[pName];
    if(!key){tryProvider(idx+1);return;}

    var url,headers={},body;

    switch(pName){
      case 'claude':
        tryProvider(idx+1);return;
      case 'grok':
        url='https://api.x.ai/v1/chat/completions';
        headers={'Content-Type':'application/json','Authorization':'Bearer '+key};
        body=JSON.stringify({model:'grok-3-mini',messages:[{role:'user',content:msg}],max_tokens:2048});
        break;
      case 'gemini':
        url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+key;
        headers={'Content-Type':'application/json'};
        body=JSON.stringify({contents:[{parts:[{text:msg}]}]});
        break;
      case 'groq':
        url='https://api.groq.com/openai/v1/chat/completions';
        headers={'Content-Type':'application/json','Authorization':'Bearer '+key};
        body=JSON.stringify({model:'llama-3.3-70b-versatile',messages:[{role:'user',content:msg}],max_tokens:2048});
        break;
      case 'openrouter':
        url='https://openrouter.ai/api/v1/chat/completions';
        headers={'Content-Type':'application/json','Authorization':'Bearer '+key};
        body=JSON.stringify({model:'meta-llama/llama-3.3-70b-instruct',messages:[{role:'user',content:msg}],max_tokens:2048});
        break;
      default:tryProvider(idx+1);return;
    }

    fetch(url,{method:'POST',headers:headers,body:body})
    .then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(data){
      if(loadDiv.parentNode)loadDiv.remove();
      var text='';
      if(pName==='gemini'){
        text=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]?data.candidates[0].content.parts[0].text:'No response';
      }else{
        text=data.choices&&data.choices[0]&&data.choices[0].message?data.choices[0].message.content:'No response';
      }
      _lensAppend('ai','['+pName.toUpperCase()+']\n'+text);
    })
    .catch(function(err){
      var es=String(err);
      if(es.indexOf('429')>=0){tryProvider(idx+1);return;}
      if(loadDiv.parentNode)loadDiv.remove();
      _lensAppend('error',pName+': '+es);
    });
  })(0);
}

function openInLens(p){
  _ctDetailProp=p;
  _ctDetailApi=null;
  var panel=document.getElementById('ct-detail');
  if(!panel)return;

  var c=p.hue!=null?hsl(p.hue):'var(--ink)';
  panel.style.setProperty('--c',c);
  document.getElementById('ct-d-dot').style.background=c;
  document.getElementById('ct-d-ent').textContent=(p.by||'').toUpperCase();
  document.getElementById('ct-d-title').textContent=p.label||'';
  document.getElementById('ct-d-amt').innerHTML=fmtDual(p.amt,p.u,p.adaPrice);
  document.getElementById('ct-d-usd').textContent='';

  var metaHtml='<span class="ct-d-badge st-'+p.st+'">'+stLabel(p.st)+'</span>';
  if(p.fund)metaHtml+='<span>F'+p.fund+'</span>';
  if(p.cls&&p.cls!=='main')metaHtml+='<span class="ct-d-badge" style="background:var(--dim);color:var(--ink)">'+clsLabel(p.cls)+'</span>';
  if(p.ch)metaHtml+='<span>'+esc(trunc(p.ch,30))+'</span>';
  document.getElementById('ct-d-meta').innerHTML=metaHtml;

  var bodyEl=document.getElementById('ct-d-body');

  /* ---- Local enrichment ---- */
  var localHtml='';

  /* Proposal details */
  var adaP=p.adaPrice||ADA_USD;
  var usdVal=p.u==='ada'?p.amt*adaP:p.amt;
  var jpyS=fmtJpy(usdVal);
  var adaVal=p.u==='ada'?p.amt:p.amt/adaP;
  localHtml+='<div class="ct-d-section"><div class="ct-d-label">'+T('proposalInfo')+'</div><div class="ct-d-text">'
    +'<b>'+fmtDual(p.amt,p.u,adaP)+'</b> ('+jpyS+')<br>'
    +T('adaPriceLabel')+': $'+adaP.toFixed(2)+' (F'+(p.fund||'?')+')'
    +(p.cls&&p.cls!=='main'?' · <span style="color:hsl(270 50% 65%)">'+clsLabel(p.cls)+'</span>':'')
    +'</div></div>';

  /* Challenge */
  if(p.ch){
    localHtml+='<div class="ct-d-section"><div class="ct-d-label">'+T('challenge')+'</div><div class="ct-d-text">'+esc(p.ch)+'</div></div>';
  }

  /* Team */
  if(p.team&&p.team.length){
    localHtml+='<div class="ct-d-section"><div class="ct-d-label">'+T('team')+' ('+p.team.length+T('members')+')</div><div class="ct-d-team">';
    for(var i=0;i<p.team.length;i++)localHtml+='<span class="ct-d-team-tag">'+esc(p.team[i].name)+' <span style="color:var(--muted)">('+esc(p.team[i].role)+')</span></span>';
    localHtml+='</div></div>';
  }

  /* Proposer profile */
  if(p.by){
    var ps=null;
    for(var pi=0;pi<PROPOSER_STATS.length;pi++){if(PROPOSER_STATS[pi].name===p.by){ps=PROPOSER_STATS[pi];break;}}
    if(ps){
      var pJpyS=fmtJpy(ps.allUsdK);
      var compRate=ps.allCount?Math.round(((ps.mainCount+ps.coCount)>0?1:0)*100):0;
      var otherProps=[];
      for(var ii=0;ii<INDUSTRIES.length;ii++){for(var jj=0;jj<INDUSTRIES[ii].children.length;jj++){
        var op=INDUSTRIES[ii].children[jj];
        if(op.by===p.by&&op.id!==p.id)otherProps.push(op);
      }}
      localHtml+='<div class="ct-d-section"><div class="ct-d-label">'+T('proposer')+': '+esc(p.by)+'</div><div class="ct-d-text">'
        +T('propS')+' <b>'+ps.allCount+'</b> · '+T('total')+' <b>'+pJpyS+'</b>';
      if(ps.mainCount>0)localHtml+=' · '+T('solo')+' <b>'+ps.mainCount+'</b>';
      if(ps.coCount>0)localHtml+=' · '+T('coLabel')+' <b>'+ps.coCount+'</b>';
      localHtml+='</div>';
      if(otherProps.length>0){

          localHtml+='<div style="display:flex;align-items:center;gap:6px;padding:2px 0;font-size:11px">'
            +'<span class="st-dot" style="background:'+stColor(op.st)+';width:5px;height:5px;min-width:5px;border-radius:50%"></span>'
            +'<span style="flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(trunc(op.label,40))+'</span>'
            +'<span style="color:var(--muted);font-size:9px;white-space:nowrap">F'+(op.fund||'?')+'</span>'
            +'</div>';
        }
        localHtml+='</div>';
      }
      localHtml+='</div>';
    }
  }

  bodyEl.innerHTML=localHtml
    +'<div class="ct-d-section" id="ct-d-desc" style="border-top:1px solid var(--border);padding-top:12px"><div class="ct-d-label">Catalyst Explorer</div>'
    +'<div class="ct-d-text" style="color:var(--muted);font-style:italic">'+T('loading')+'</div></div>'
    +'<button class="ct-d-fetch-btn" id="ct-d-fetch" style="display:none">'+T('fetchOriginal')+'</button>'
    +'<div id="ct-d-extra"></div>';

  /* clear lens log for new proposal */
  _lensLog=[];
  var lensLogEl=document.getElementById('ct-lens-log');
  if(lensLogEl)lensLogEl.innerHTML='';

  var presets=document.getElementById('ct-lens-presets');
  var _presetData=[{ja:'要約',en:'Summary'},{ja:'リスク分析',en:'Risk Analysis'},{ja:'賛否の論点',en:'Pros & Cons'},{ja:'類似比較',en:'Compare similar'}];
  presets.innerHTML=_presetData.map(function(t){
    return '<button class="ct-lens-preset" data-q="'+t.ja+'">'+(_lang==='en'?t.en:t.ja)+'</button>';
  }).join('');
  presets.onclick=function(e){
    var btn=e.target.closest('.ct-lens-preset');
    if(btn&&_ctDetailProp)sendToLens(_ctDetailProp,btn.getAttribute('data-q')+(_lang==='ja'?'してください。':'. Please analyze.'));
  };

  panel.classList.add('open');
  fetchCatalystApi(p);
}

function fetchCatalystApi(p){
  var apiUrl='https://catalystexplorer.com/api/proposals?search='+encodeURIComponent(p.label)+'&limit=3';

  fetch(apiUrl).then(function(r){return r.json();})
  .then(function(json){
    var items=json.data||json;
    var found=null;
    if(Array.isArray(items)){
      for(var i=0;i<items.length;i++){
        if(items[i].title&&items[i].title.toLowerCase()===p.label.toLowerCase()){found=items[i];break;}
      }
      if(!found&&items.length>0)found=items[0];
    }
    if(!found){showDescFallback();return;}
    _ctDetailApi=found;
    var descEl=document.getElementById('ct-d-desc');
    var html='<div class="ct-d-label">'+T('problem')+'</div><div class="ct-d-text">'+esc(found.problem||'N/A')+'</div>';
    html+='<br><div class="ct-d-label">'+T('solutionLabel')+'</div><div class="ct-d-text">'+esc(found.solution||'N/A')+'</div>';
    if(found.yes_votes_count||found.no_votes_count){
      html+='<br><div class="ct-d-label">'+T('votesLabel')+'</div><div class="ct-d-text">Yes: '+(found.yes_votes_count||0)+' / No: '+(found.no_votes_count||0)+'</div>';
    }
    if(found.link){
      html+='<br><div class="ct-d-label">'+T('linkLabel')+'</div><div class="ct-d-text" style="font-size:11px;word-break:break-all">'+esc(found.link)+'</div>';
    }
    descEl.innerHTML=html;
    if(found.content){
      var fb=document.getElementById('ct-d-fetch');
      fb.style.display='inline-flex';
      fb.onclick=function(){
        var extra=document.getElementById('ct-d-extra');
        extra.innerHTML='<div class="ct-d-section" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">'
          +'<div class="ct-d-label">'+(_lang==='en'?'Original text':'\u539f\u6587')+'</div><div class="ct-d-text" style="font-size:12px;line-height:1.8">'+esc(found.content).replace(/\n/g,'<br>')+'</div></div>';
        fb.style.display='none';
      };
    }
  }).catch(function(){showDescFallback();});

  function showDescFallback(){
    var descEl=document.getElementById('ct-d-desc');
    descEl.innerHTML='<div class="ct-d-label">'+T('descLabel')+'</div><div class="ct-d-text" style="color:var(--muted)">'+T('apiFailed')+'</div>';
  }
}

  function init(){return{mainCount:0,mainUsdK:0,mainAda:0,coCount:0,coUsdK:0,coAda:0,teamCount:0,teamUsdK:0,teamAda:0,namedFor:{}};}
  var map={},unkCount=0,unkUsd=0;
  for(var i=0;i<INDUSTRIES.length;i++){
    for(var j=0;j<INDUSTRIES[i].children.length;j++){
      var p=INDUSTRIES[i].children[j];
      var uK=p.u==='ada'?p.amt*p.adaPrice:p.amt;
      var ada=p.u==='ada'?p.amt:p.amt/p.adaPrice;
      if(p.by){
        if(!map[p.by])map[p.by]=init();
        if(p.cls==='main'){
          map[p.by].mainCount++;map[p.by].mainUsdK+=uK;map[p.by].mainAda+=ada;
        }else{
          map[p.by].coCount++;map[p.by].coUsdK+=uK;map[p.by].coAda+=ada;
        }
      } else {
        unkCount++;unkUsd+=uK;
      }
      if(p.team){
        var owner=p.by||'unknown';
        for(var t=0;t<p.team.length;t++){
          var tn=p.team[t].name;
          var tRole=p.team[t].role;
          if(!map[tn])map[tn]=init();
          if(tRole==='共同提案'){
            map[tn].coCount++;map[tn].coUsdK+=uK;map[tn].coAda+=ada;
          } else {
            map[tn].teamCount++;map[tn].teamUsdK+=uK;map[tn].teamAda+=ada;
            if(!map[tn].namedFor[owner]) map[tn].namedFor[owner]=0;
            map[tn].namedFor[owner]++;
          }
        }
      }
    }
  }
  var arr=[];
  for(var k in map){
    var m=map[k];
    var allCount=m.mainCount+m.coCount+m.teamCount;
    var allUsdK=m.mainUsdK+m.coUsdK+m.teamUsdK;
    var allAda=m.mainAda+m.coAda+m.teamAda;
    arr.push({name:k,
      mainCount:m.mainCount,mainUsdK:m.mainUsdK,mainAda:m.mainAda,
      coCount:m.coCount,coUsdK:m.coUsdK,coAda:m.coAda,
      teamCount:m.teamCount,teamUsdK:m.teamUsdK,teamAda:m.teamAda,
      namedFor:m.namedFor,
      count:m.mainCount+m.coCount,usdK:m.mainUsdK+m.coUsdK,
      allCount:allCount,allUsdK:allUsdK,allAda:allAda});
  }
  arr.sort(function(a,b){return b.allCount-a.allCount});
  if(unkCount) arr.push({name:'未確認',mainCount:unkCount,mainUsdK:unkUsd,mainAda:0,coCount:0,coUsdK:0,coAda:0,teamCount:0,teamUsdK:0,teamAda:0,count:unkCount,usdK:unkUsd,allCount:unkCount,allUsdK:unkUsd,allAda:0,unknown:true});
  return arr;
})();

var filterBy=null;  // proposer filter

/* ================================================================
   BUILD TREE
   ================================================================ */
function sumUsdK(kids){
  var s=0;for(var i=0;i<kids.length;i++){var c=kids[i];s+=c.u==='ada'?c.amt*(c.adaPrice||ADA_USD):c.amt;}return s;
}
function fmtTotal(usdK){
  if(_lang==='en'){
    if(usdK>=1000) return '$'+(usdK/1000).toFixed(2)+'M';
    return '$'+Math.round(usdK)+'K';
  }
  var jpy=usdK*1000*USD_JPY;
  var jpyStr=jpy>=1e8?'¥'+(jpy/1e8).toFixed(1)+'億':'¥'+Math.round(jpy/1e4)+'万';
  if(usdK>=1000) return '$'+(usdK/1000).toFixed(2)+'M · '+jpyStr;
  return '$'+Math.round(usdK)+'K · '+jpyStr;
}

function buildTreeBySector(){
  var active=filterSec?INDUSTRIES.filter(function(d){return d.id===filterSec}):INDUSTRIES;
  var rootKids=[];
  for(var k=0;k<active.length;k++){
    var ind=active[k];
    var propKids=[];
    for(var j=0;j<ind.children.length;j++){
      var p=ind.children[j];
      if(filterBy&&p.by!==filterBy) continue;
      propKids.push({id:p.id,label:p.label,amt:p.amt,u:p.u,st:p.st,ch:p.ch,by:p.by,role:p.role,fund:p.fund,adaPrice:p.adaPrice,team:p.team,cls:p.cls,hue:ind.hue,children:[]});
    }
    if(filterBy&&propKids.length===0) continue;
    var ok=0,wip=0,dnf=0;
    for(var m=0;m<propKids.length;m++){var s=propKids[m].st;if(s==='complete')ok++;else if(s==='progress')wip++;else dnf++;}
    rootKids.push({id:ind.id,label:secName(ind),amt:0,hue:ind.hue,children:propKids,_ok:ok,_wip:wip,_dnf:dnf,_total:propKids.length});
  }
  var rootLabel='Catalyst Japan', rootSub=fmtTotal(TOTAL_USD_K);
  if(filterBy){
    var allKids=[];for(var i=0;i<rootKids.length;i++)allKids=allKids.concat(rootKids[i].children);
    rootLabel=filterBy; rootSub=fmtTotal(sumUsdK(allKids));
  }
  return {id:'root',label:rootLabel,sub:rootSub,children:rootKids};
}

function buildTreeByProposer(){
  var rootKids=[];
  /* sort PROPOSER_STATS by current sortMode */
  var sortedPS=PROPOSER_STATS.slice().sort(function(a,b){
    if(a.unknown) return 1;if(b.unknown) return -1;
    if(sortMode==='solo') return b.mainUsdK-a.mainUsdK||b.allCount-a.allCount;
    if(sortMode==='co') return b.coUsdK-a.coUsdK||b.allCount-a.allCount;
    if(sortMode==='named') return b.teamUsdK-a.teamUsdK||b.allCount-a.allCount;
    if(sortMode==='total') return b.allUsdK-a.allUsdK||b.allCount-a.allCount;
    if(sortMode==='count') return b.allCount-a.allCount;
    return b.allCount-a.allCount;
  });
  var hueStep=Math.floor(360/sortedPS.length);
  for(var pi=0;pi<sortedPS.length;pi++){
    var ps=sortedPS[pi];
    if(filterBy&&ps.name!==filterBy) continue;
    var propKids=[],seen={};
    for(var i=0;i<INDUSTRIES.length;i++){
      for(var j=0;j<INDUSTRIES[i].children.length;j++){
        var p=INDUSTRIES[i].children[j];
        if(ps.unknown?!p.by:p.by===ps.name){
          seen[p.id]=true;
          propKids.push({id:p.id,label:p.label,amt:p.amt,u:p.u,st:p.st,ch:p.ch,by:p.by,role:p.role,
            fund:p.fund,adaPrice:p.adaPrice,team:p.team,cls:p.cls,sector:secName(INDUSTRIES[i]),hue:pi*hueStep,children:[]});
        }
      }
    }
    /* チーム参加の提案も追加 */
    if(!ps.unknown){
      for(var i=0;i<INDUSTRIES.length;i++){
        for(var j=0;j<INDUSTRIES[i].children.length;j++){
          var p=INDUSTRIES[i].children[j];
          if(seen[p.id]||!p.team) continue;
          for(var t=0;t<p.team.length;t++){
            if(p.team[t].name===ps.name){
              seen[p.id]=true;
              propKids.push({id:p.id+'-t',label:p.label,amt:p.amt,u:p.u,st:p.st,ch:p.ch,by:p.by,
                role:p.team[t].role,fund:p.fund,adaPrice:p.adaPrice,team:p.team,cls:p.cls,
                sector:secName(INDUSTRIES[i]),hue:pi*hueStep,children:[],_teamRole:p.team[t].role});
              break;
            }
          }
        }
      }
    }
    var ok=0,wip=0,dnf=0;
    for(var m=0;m<propKids.length;m++){var s=propKids[m].st;if(s==='complete')ok++;else if(s==='progress')wip++;else dnf++;}
    var personUsd=sumUsdK(propKids);
    rootKids.push({id:'by-'+pi,label:ps.name,amt:personUsd,hue:pi*hueStep,children:propKids,
      _ok:ok,_wip:wip,_dnf:dnf,_total:propKids.length,_usdK:personUsd,
      _mainUsdK:ps.mainUsdK,_coUsdK:ps.coUsdK,_teamCount:ps.teamCount,_teamUsdK:ps.teamUsdK,_namedFor:ps.namedFor,_allUsdK:ps.allUsdK});
  }
  var rootLabel='Catalyst Japan', rootSub=fmtTotal(TOTAL_USD_K);
  if(filterBy){
    var allKids=[];for(var i=0;i<rootKids.length;i++)allKids=allKids.concat(rootKids[i].children);
    rootLabel=filterBy; rootSub=fmtTotal(sumUsdK(allKids));
  }
  return {id:'root',label:rootLabel,sub:rootSub,children:rootKids};
}

function buildTree(){
  return viewMode==='proposer'?buildTreeByProposer():buildTreeBySector();
}

/* ================================================================
   FLATTEN + LAYOUT
   ================================================================ */
function flatTree(root){
  var list=[],byId={};
  function walk(n,par,depth,bh){
    var h=(depth>=1&&n.hue!=null)?n.hue:(bh!=null?bh:null);
    var nd={id:n.id,label:n.label,raw:n,depth:depth,parent:par?par.id:null,hue:h,
      hasKids:!!(n.children&&n.children.length),expanded:vis.has(n.id)||(filterBy&&depth<=1),_ch:[]};
    if(par)par._ch.push(nd);
    byId[nd.id]=nd;list.push(nd);
    if(nd.hasKids&&nd.expanded){
      for(var i=0;i<n.children.length;i++)walk(n.children[i],nd,depth+1,h);
    }
  }
  walk(root,null,0,null);
  return{list:list,byId:byId};
}

function doLayout(root){
  var ft=flatTree(root);
  var list=ft.list;
  var lay={};
  var yOff=0;
  function place(n){
    var x=n.depth*COL;
    var y=yOff;
    var h=n.depth===0?80:n.depth===1?(viewMode==='proposer'?67:52):50;
    var w=n.depth===0?220:n.depth===1?480:560;
    lay[n.id]={id:n.id,x:x,y:y,w:w,h:h,depth:n.depth,hue:n.hue,parent:n.parent,hasKids:n.hasKids,expanded:n.expanded,raw:n.raw,label:n.label};
    yOff+=h+GAP;
    if(n.expanded){
      for(var i=0;i<n._ch.length;i++) place(n._ch[i]);
    }
  }
  place(list[0]);
  return lay;
}

      var teamTags='';
      if(p.team&&!p._teamRole){for(var ti=0;ti<p.team.length;ti++){
        teamTags+='<span class="role-tag '+roleClass(p.team[ti].role)+'">'+esc(p.team[ti].name)+'</span>';
      }}
      var lkIcons='';
      if(p.url)lkIcons+='<span class="lk-icon" title="Project" data-href="'+esc(p.url)+'">↗</span>';
      if(p.x)lkIcons+='<span class="lk-icon" title="X" data-href="'+esc(p.x)+'">𝕏</span>';
      if(p.yt)lkIcons+='<span class="lk-icon" title="YouTube" data-href="'+esc(p.yt)+'">▶</span>';
      if(p.report)lkIcons+='<span class="lk-icon lk-cr" title="'+T('completionReport')+'" data-report="'+esc(p.id)+'">CR</span>';
      var lblPrefix=(viewMode==='proposer'&&myRole&&myRole!=='提案者')?(roleName(myRole)+' → '):'';
      card.innerHTML='<div class="row"><span class="st-dot" style="background:'+stColor(p.st)+'"></span>'
        +'<div class="label">'+(lblPrefix?'<span class="role-pfx">'+esc(lblPrefix)+'</span>':'')+esc(n.label)+'</div>'
        +(lkIcons?'<span class="lk-row">'+lkIcons+'</span>':'')
        +'<span class="amount">'+fmtDual(p.amt,p.u,p.adaPrice)+'</span></div>'
        +'<div class="row">'+stBadge(p.st)
        +clsTag(p.cls)+fTag+ctxTag+rTag+teamTags
        +'<span class="cat-tag">'+esc(trunc(p.ch,28))+'</span></div>';
    }

    card.onclick=(function(nid,depth,raw){return function(e){
      e.stopPropagation();
      var lki=e.target.closest('.lk-icon');
      if(lki){
        var href=lki.getAttribute('data-href');
        var reportId=lki.getAttribute('data-report');
        if(href){
          if(href){window.open(href,'_blank');}
        }else if(reportId&&raw){
          var crUrl='https://catalystexplorer.com/proposals?search='+encodeURIComponent(raw.label);
          window.open(crUrl,'_blank');
        }
        return;
      }
      if(depth===0||depth===1){
        if(vis.has(nid))vis.delete(nid);else vis.add(nid);
        render();
      } else if(depth===2&&raw){
        openInLens(raw);
      }
    }})(n.id,n.depth,n.depth===2?n.raw:null);

    el.appendChild(card);
    layer.appendChild(el);

    /* draw line to parent */
    if(n.parent&&lay[n.parent]){
      var pn=lay[n.parent];
      var x1=pn.x+pn.w, y1=pn.y+pn.h/2;
      var x2=n.x, y2=n.y+n.h/2;
      var path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',pathD(x1,y1,x2,y2));
      path.setAttribute('fill','none');
      path.setAttribute('stroke',n.hue!=null?hsl(n.hue):'var(--border)');
      path.setAttribute('stroke-width','1.5');
      path.setAttribute('opacity','0.4');
      svg.appendChild(path);
    }
  }

  svg.setAttribute('width',maxX+200);
  svg.setAttribute('height',maxY+200);
  setTfm();
}

/* ================================================================

  stage.addEventListener('pointerdown',ptrDown);
  stage.addEventListener('pointermove',ptrMove);
