<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>Catalyst Japan Catalog — Mobile (DEV)</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#000000" />
<!-- Cache directives: HTML always re-fetched (same pattern as catalog.html / index.html) -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:#000;color:#fff;
    font-family:'Geist','Noto Sans JP',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    height:100%;overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #root{min-height:100dvh;display:flex;flex-direction:column}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  input{font-family:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{display:none}
  /* hide scrollbars on horizontal chip rows */
  .hscroll{overflow-x:auto;scrollbar-width:none}
  .hscroll::-webkit-scrollbar{display:none}
</style>

<!-- Cache-bust: each page load gets fresh ?v= on every LOCAL script. Same pattern as catalog.html. -->
<script>window.__V='?v='+Date.now();</script>
<script>
  document.write('<script src="data.js'+__V+'"><\/script>');
  document.write('<script src="descriptions.js'+__V+'"><\/script>');
  document.write('<script src="proposal-meta.js'+__V+'"><\/script>');
  document.write('<script src="unlisted.js'+__V+'"><\/script>');
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Reuse the desktop catalog's data adapter — PROPOSALS / FUND_ORDER / FUND_COUNTS are shared.
     Mobile app file is separate so the mobile UI is decoupled from the desktop's 6500-line app. -->
<script>
  document.write('<script type="text/babel" src="src/catalog-data.jsx'+__V+'"><\/script>');
  document.write('<script type="text/babel" src="src/catalog-mobile.jsx'+__V+'"><\/script>');
</script>

<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<CatalogMobileApp />);
</script>
</body>
</html>
