/* ── Fund list (each Fund as a row, tap to expand its proposals) ── */
var _mobileExpandedFund=null, _mobileFundFirst=null;
function _renderMobileFundList(scroll){
  /* Group proposals by fund */
  var byFund={};
  D.INDUSTRIES.forEach(function(ind){
    ind.children.forEach(function(p){
      var f=p.fund||0;if(!f) return;
      if(!byFund[f]) byFund[f]={f:f,total:0,complete:0,progress:0,dnf:0,ada:0,distributed:0,usdK:0,props:[]};
      var bf=byFund[f];
      bf.total++;
      if(p.st==='complete') bf.complete++;
      else if(p.st==='progress') bf.progress++;
      else bf.dnf++;
      var ada=(p.u==='ada'?p.amt:p.amt/(p.adaPrice||0.5));
      bf.ada+=ada;
      bf.usdK+=(p.u==='ada'?p.amt*(p.adaPrice||ADA_USD):p.amt);
      /* Distributed approximation */
      var MS=window.CJ_MILESTONES||{};
      var ms=MS[p.id];
      if(ms&&ms.length){
        var sg=0,tot=0;
        ms[0].milestones.forEach(function(m){tot+=m.cost;if(m.signoff)sg+=m.cost;});
        bf.distributed+=tot>0?(sg/tot)*ada:0;
      } else if(p.st==='complete'||p.st==='dnf'){
        bf.distributed+=ada;
      }
      bf.props.push(p);
    });
  });
  var fundList=Object.keys(byFund).map(function(k){return byFund[k];}).sort(function(a,b){return b.f-a.f;});
  /* If a Fund was tapped from the strip, move it to the top */
  if(_mobileFundFirst){
    var idx=-1;for(var i=0;i<fundList.length;i++) if(fundList[i].f===_mobileFundFirst){idx=i;break;}
    if(idx>0){var first=fundList.splice(idx,1)[0];fundList.unshift(first);}
  }

  var listWrap=document.createElement('div');
  listWrap.style.cssText='padding:0 8px 12px';
  fundList.forEach(function(fs){
    var rate=fs.total>0?Math.round((fs.complete/fs.total)*100):0;
    var row=document.createElement('div');
    row.style.cssText='border-bottom:1px solid var(--border);cursor:pointer';
    row.setAttribute('data-row-search','F'+fs.f+' '+fs.props.map(function(p){return (p.label||'')+(p.labelJa||'')+(p.by||'');}).join(' '));
    var head=document.createElement('div');
    head.style.cssText='display:flex;align-items:center;gap:8px;padding:10px 8px';
    var totalUsd=fs.usdK;
    var distUsd=(fs.distributed*(ADA_USD||0.5));
    head.innerHTML='<div style="flex-shrink:0;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);min-width:30px">F'+fs.f+'</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-family:var(--mono);font-size:11px;color:var(--ink)"><span style="font-weight:600">'+fs.total+'</span>件 · '+fmtAmt(totalUsd)+'</div>'
      +'<div style="display:flex;height:3px;border-radius:2px;overflow:hidden;background:var(--border);margin-top:4px">'
      +'<div style="width:'+rate+'%;background:#3d8b6e"></div>'
      +'<div style="width:'+(fs.total>0?Math.round((fs.progress/fs.total)*100):0)+'%;background:#c49b2a"></div>'
      +'<div style="width:'+(fs.total>0?Math.round((fs.dnf/fs.total)*100):0)+'%;background:#b85450"></div></div>'
      +'<div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:3px">完 '+fs.complete+' · 進 '+fs.progress+' · 止 '+fs.dnf+'</div>'
      +'</div>';
    row.appendChild(head);
    var expanded=null;
    function fundDateInfo(){
      /* Build Fund info card with submit date, result date, distribution */
      var submitD=(D.FUND_SUBMIT_DATES||{})[fs.f]||'—';
      var resultD=(D.FUND_RESULT_DATES||{})[fs.f]||'—';
      function ymd(d){if(d==='—') return d; var p=d.split('-');return p[2]+'-'+p[1]+'-'+p[0];}
      var info=document.createElement('div');
      info.style.cssText='padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;margin:4px;font-family:var(--mono);font-size:9px;line-height:1.5';
      info.innerHTML=
        '<div style="display:grid;grid-template-columns:auto 1fr;gap:4px 10px">'
        +'<span style="color:var(--muted)">提案募集</span><span style="color:var(--ink)">'+ymd(submitD)+'</span>'
        +'<span style="color:var(--muted)">採択決定</span><span style="color:var(--ink)">'+ymd(resultD)+'</span>'
        +'<span style="color:var(--muted)">配布総額</span><span style="color:rgba(232,160,72,1);font-weight:600">'+fmtAmt(distUsd)+' / '+fmtAmt(totalUsd)+'</span>'
        +'<span style="color:var(--muted)">完了率</span><span style="color:var(--ink)">'+rate+'% (完'+fs.complete+' / 進'+fs.progress+' / 止'+fs.dnf+')</span>'
        +'</div>';
      return info;
    }
    function toggleExpand(forceOpen){
      if(expanded && !forceOpen){expanded.remove();expanded=null;_mobileExpandedFund=null;return;}
      if(expanded) return; /* already open and force-open */
      expanded=document.createElement('div');
      expanded.style.cssText='padding:2px 0 6px;background:var(--dim);border-radius:6px;margin:0 4px 6px';
      expanded.appendChild(fundDateInfo());
      fs.props.slice().sort(function(a,b){
        var ord={progress:0,dnf:1,complete:2};
        return (ord[a.st]||9)-(ord[b.st]||9);
      }).forEach(function(p){
        expanded.appendChild(_mobileMakeProposalRow(p));
      });
      row.appendChild(expanded);
      _mobileExpandedFund=fs.f;
    }
    row.addEventListener('click',function(e){
      /* Filter chart to this fund */
      _mobileChartFilter={type:'fund',fund:fs.f,label:'F'+fs.f+' ('+fs.total+'件 / '+(fs.ada/1000).toFixed(1)+'M ₳)'};
      _mobileUpdateSelectionStrip();
      var cb=document.getElementById('mobile-chart');
      if(cb) _mobileBuildChart(cb);
      toggleExpand(false);
    });
    /* Auto-expand if marked */
    if(_mobileExpandedFund===fs.f){
      setTimeout(function(){toggleExpand(true);},0);
    }
    listWrap.appendChild(row);
  });
  scroll.appendChild(listWrap);
}

/* ── Proposal list (every proposal, with status flags inline) ── */
function _renderMobilePropList(scroll){
  var all=[];
  D.INDUSTRIES.forEach(function(ind){ind.children.forEach(function(p){all.push(p);});});
  function severity(p){
    if(p.st==='dnf') return 0;
    var ps=_mobileProposalStatus(p);
    if(ps.overdue) return 1;
    if(ps.gap) return 2;
    if(ps.pastOverdue) return 3;
    if(ps.longGap) return 4;
    return 9;
  }
  function propAda(p){return p.u==='ada'?p.amt:p.amt/(p.adaPrice||0.5);}
  if(_mobilePropSort==='amount') all.sort(function(a,b){return propAda(b)-propAda(a);});
  else if(_mobilePropSort==='flag') all.sort(function(a,b){return severity(a)-severity(b);});
  else all.sort(function(a,b){var fd=(b.fund||0)-(a.fund||0);return fd!==0?fd:severity(a)-severity(b);}); /* fund */

  var listWrap=document.createElement('div');
  listWrap.style.cssText='padding:0 8px 12px';
  var curFund=0,showFundHdr=(_mobilePropSort==='fund');
  all.forEach(function(p){
    if(showFundHdr && (p.fund||0)!==curFund){
      curFund=p.fund||0;
      var hdr=document.createElement('div');
      hdr.style.cssText='font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.06em;padding:10px 4px 4px;border-bottom:1px solid var(--border)';
      hdr.textContent='F'+curFund;
      listWrap.appendChild(hdr);
    }
    listWrap.appendChild(_mobileMakeProposalRow(p));
  });
  scroll.appendChild(listWrap);
}

/* ── MS+金額 list (chronological milestone signoffs) ── */
function _renderMobileMsList(scroll){
  var MS=window.CJ_MILESTONES||{};
  var flat=[];
  for(var pid in MS){
    var entries=MS[pid];
    /* Find the parent proposal in INDUSTRIES */
    var parent=null;
    D.INDUSTRIES.forEach(function(ind){ind.children.forEach(function(p){if(p.id===pid) parent=p;});});
    if(!parent) continue;
    entries.forEach(function(e){
      var totalCost=0;
      e.milestones.forEach(function(m){totalCost+=m.cost;});
      var adaK=(parent.u==='ada'?parent.amt:parent.amt/(parent.adaPrice||0.5));
      e.milestones.forEach(function(m){
        if(!m.signoff) return;
        var msAda=totalCost>0?(m.cost/totalCost)*adaK*1000:m.cost;
        flat.push({
          date:m.signoff.substring(0,10), ms:m.ms, cost:msAda,
          label:parent.labelJa||parent.label, fund:parent.fund, parent:parent
        });
      });
    });
  }
  flat.sort(function(a,b){return a.date>b.date?-1:1;});

  var listWrap=document.createElement('div');
  listWrap.style.cssText='padding:0 8px 12px';
  flat.forEach(function(f){
    var msLbl=f.ms<=10?'①②③④⑤⑥⑦⑧⑨⑩'.charAt(f.ms-1):'M'+f.ms;
    var row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--border);cursor:pointer';
    row.innerHTML=
      '<div style="flex-shrink:0;text-align:center"><div style="font-family:var(--mono);font-size:9px;color:var(--muted)">'+f.date.substring(0,7)+'</div>'
      +'<div style="font-size:14px;color:#5b8af0;font-weight:600">'+msLbl+'</div></div>'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(f.label)+_mobileFlagChips(f.parent)+'</div>'
      +'<div style="font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px">F'+f.fund+' · '+esc(f.parent.by||'?')+'</div>'
      +'</div>'
      +'<div style="flex-shrink:0;font-family:var(--mono);font-size:11px;color:rgba(232,160,72,0.9);font-weight:600">₳'+Math.round(f.cost/1000)+'K</div>';
    row.addEventListener('click',function(){
      _mobileChartFilter={type:'prop',id:f.parent.id,label:f.parent.labelJa||f.parent.label};
      _mobileUpdateSelectionStrip();
      var cb=document.getElementById('mobile-chart');
      if(cb) _mobileBuildChart(cb);
    });
    listWrap.appendChild(row);
  });
  scroll.appendChild(listWrap);
}

/* Status detection helpers (simplified ports from index.html) */
function _mobileDnfFunded(p){
  if(p.fund<10) return true;
  var MS=window.CJ_MILESTONES||{};
  var ms=MS[p.id];
  if(ms&&ms.length) return (ms[0].distributed||0)>0;
  return false;
}
function _mobileProposalStatus(p){
  var out={overdue:false,gap:false,longGap:false,pastOverdue:false,years:0};
  var FRD=(D&&D.FUND_RESULT_DATES)||{};
  var frd=FRD[p.fund||0];if(!frd) return out;
  var pp=frd.split('-');
  var fd=new Date(parseInt(pp[2]),parseInt(pp[1])-1,parseInt(pp[0]));
  var now=new Date();
  out.years=(now-fd)/(365.25*24*60*60*1000);
  var MS=window.CJ_MILESTONES||{};
  var msData=MS[p.id];
  if(!msData||!msData.length) return out;
  if(p.st==='progress'){
    for(var ei=0;ei<msData.length;ei++){
      var mss=msData[ei].milestones;
      for(var mi=0;mi<mss.length;mi++){
        var m=mss[mi];
        if(m.signoff) continue;
        var mo=parseInt(m.month);if(isNaN(mo)) continue;
        var ed=new Date(fd);ed.setMonth(ed.getMonth()+mo+3);
        if(now>ed){out.overdue=true;break;}
      }
    }
  }
  var maxGap=0;
  for(var e2=0;e2<msData.length;e2++){
    var ms2=msData[e2].milestones.slice().sort(function(a,b){return a.ms-b.ms;});
    var prev=null;
    for(var m2=0;m2<ms2.length;m2++){
      var mm=ms2[m2];
      if(!mm.signoff){prev=null;continue;}
      var cur=new Date(mm.signoff);
      if(prev){var diff=(cur-prev)/(30*24*60*60*1000);if(diff>maxGap)maxGap=diff;}
      prev=cur;
    }
  }
  if(p.st==='progress'&&maxGap>=6) out.gap=true;
  else if(p.st==='complete'&&maxGap>=8) out.longGap=true;
  if(p.st==='complete'){
    var worstLate=0;
    for(var e3=0;e3<msData.length;e3++){
      var ms3=msData[e3].milestones;
      for(var m3=0;m3<ms3.length;m3++){
        var mmm=ms3[m3];
        if(!mmm.signoff) continue;
        var mo3=parseInt(mmm.month);if(isNaN(mo3)) continue;
        var pl=new Date(fd);pl.setMonth(pl.getMonth()+mo3);
        var ac=new Date(mmm.signoff);
        var lt=(ac-pl)/(30.44*24*60*60*1000);
        if(lt>worstLate) worstLate=lt;
      }
    }
    if(worstLate>=6) out.pastOverdue=true;
  }
  return out;
}

/* Build the lightweight-chart (ADA price + withdrawal bars + fund markers) */
function _mobileBuildChart(el){
  if(_mobileChart){try{_mobileChart.remove();}catch(e){}_mobileChart=null;}
  if(!window.LightweightCharts) {el.innerHTML='<div style="padding:20px;color:var(--muted);font-size:11px;text-align:center">Chart library failed to load</div>';return;}
  var isNight=NIGHT;
  _mobileChart=LightweightCharts.createChart(el,{
    width:el.clientWidth, height:240,
    localization:{dateFormat:'yyyy-MM'},
    layout:{background:{type:'solid',color:isNight?'#16171a':'#ffffff'},textColor:isNight?'#7a7a74':'#8a8a83',fontSize:9},
    grid:{vertLines:{color:isNight?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)'},horzLines:{color:isNight?'rgba(255,255,255,0.04)':'rgba(0,0,0,0.04)'}},
    rightPriceScale:{borderColor:isNight?'rgba(255,255,255,0.1)':'rgba(0,0,0,0.1)',scaleMargins:{top:0.05,bottom:0.05}},
    timeScale:{borderColor:isNight?'rgba(255,255,255,0.1)':'rgba(0,0,0,0.1)',timeVisible:false,secondsVisible:false,fixLeftEdge:true,fixRightEdge:true,rightOffset:5}
  });

  /* Blue Fund-adoption histogram (separate scale 'fundBar') so it doesn't dominate the wd scale */
  var fundBarSeries=_mobileChart.addHistogramSeries({
    color:'rgba(91,138,240,0.75)',priceLineVisible:false,lastValueVisible:false,
    priceScaleId:'fundBar'
  });
  _mobileChart.priceScale('fundBar').applyOptions({scaleMargins:{top:0.02,bottom:0},visible:false});
  window._mobileFundBarSeries=fundBarSeries;

  /* Orange withdrawal histogram on 'wd' scale spanning bottom 85% */
  _mobileWdSeries=_mobileChart.addHistogramSeries({
    color:'rgba(232,160,72,0.7)',priceLineVisible:false,lastValueVisible:false,
    priceScaleId:'wd'
  });
  _mobileChart.priceScale('wd').applyOptions({scaleMargins:{top:0.15,bottom:0},visible:false});

  /* ADA price line on TOP (rendered after bars, so it's in front) */
  _mobileAdaLine=_mobileChart.addLineSeries({color:'#5b8af0',lineWidth:2,lastValueVisible:true,priceLineVisible:false,
    /* Limit lower display range to -1 by adding a synthetic baseline anchor below */
    autoscaleInfoProvider:function(){
      return {priceRange:{minValue:-1,maxValue:3.5}};
    }
  });
  var pricePts=_mobileBuildPriceData();
  _mobileAdaLine.setData(pricePts);
  _mobileWdSeries.createPriceLine({price:0,color:'rgba(255,255,255,0.12)',lineWidth:2,axisLabelVisible:false});
  _mobileWdSeries.setData(_mobileBuildWdData(_mobileChartFilter));
  if(window._mobileFundBarSeries){
    window._mobileFundBarSeries.setData(_mobileBuildFundBarData(_mobileChartFilter));
  }

  /* Markers — combine Fund result + MS signoff markers based on filter */
  var markers=[];
  var FRD2=(D&&D.FUND_RESULT_DATES)||{};
  var filter=_mobileChartFilter;
  /* Determine which Fund result markers to show */
  var fundsToShow={};
  if(!filter){for(var f in FRD2) fundsToShow[f]=true;}
  else if(filter.type==='acct'){
    /* Only funds this account participated in */
    D.INDUSTRIES.forEach(function(ind){ind.children.forEach(function(p){
      var inv=(p.by===filter.name)||(p.team&&p.team.some(function(t){return t.name===filter.name;}));
      if(inv && p.fund) fundsToShow[p.fund]=true;
    });});
  } else if(filter.type==='prop'){
    /* Only this proposal's fund */
    D.INDUSTRIES.forEach(function(ind){ind.children.forEach(function(p){
      if(p.id===filter.id && p.fund) fundsToShow[p.fund]=true;
    });});
  } else if(filter.type==='fund'){
    /* Only this fund's marker */
    fundsToShow[filter.fund]=true;
  }
  for(var ff in fundsToShow){
    if(!FRD2[ff]) continue;
    var d=FRD2[ff].split('-');
    markers.push({time:d[2]+'-'+d[1]+'-'+d[0],position:'belowBar',color:'rgba(61,139,110,0.7)',shape:'arrowUp',text:'F'+ff});
  }
  /* If proposal filter, also add MS signoff markers for that proposal */
  if(filter && filter.type==='prop'){
    var MS=window.CJ_MILESTONES||{};
    var ms=MS[filter.id];
    if(ms&&ms.length){
      ms[0].milestones.forEach(function(m){
        if(!m.signoff) return;
        var msLbl=m.ms<=10?'①②③④⑤⑥⑦⑧⑨⑩'.charAt(m.ms-1):'M'+m.ms;
        markers.push({time:m.signoff.substring(0,10),position:'aboveBar',color:'rgba(91,138,240,0.95)',shape:'arrowDown',size:0.5,text:msLbl});
      });
    }
  }
  markers.sort(function(a,b){return a.time<b.time?-1:1;});
  if(markers.length) _mobileAdaLine.setMarkers(markers);
  else _mobileAdaLine.setMarkers([]);
  _mobileChart.timeScale().fitContent();
}

function _mobileBuildPriceData(){
  var raw=[];
  function addPts(dates,prices){
    if(!dates||!prices) return;
    for(var f in dates){
      var p=dates[f].split('-');
      var ms=new Date(Number(p[2]),Number(p[1])-1,Number(p[0])).getTime();
      raw.push({t:ms,v:prices[f]||0.3});
    }
  }
  if(D.FUND_SUBMIT_DATES) addPts(D.FUND_SUBMIT_DATES,D.FUND_SUBMIT_PRICES);
  if(D.FUND_RESULT_DATES) addPts(D.FUND_RESULT_DATES,D.FUND_RESULT_PRICES);
  /* Known reference points */
  raw.push({t:new Date(2021,8,2).getTime(),v:3.10});
  raw.push({t:new Date(2022,5,18).getTime(),v:0.44});
  raw.push({t:new Date(2023,9,15).getTime(),v:0.27});
  raw.push({t:new Date(2024,10,22).getTime(),v:1.15});
  if(ADA_USD>0) raw.push({t:Date.now(),v:ADA_USD});
  raw.sort(function(a,b){return a.t-b.t;});
  /* Weekly interpolation */
  var pts=[],seen={};
  for(var i=0;i<raw.length-1;i++){
    var a=raw[i],b=raw[i+1],step=7*86400000;
    for(var t=a.t;t<=b.t;t+=step){
      var r=(t-a.t)/Math.max(1,(b.t-a.t));
      var v=a.v+(b.v-a.v)*r;
      var d=new Date(t);
      var key=d.toISOString().substring(0,10);
      if(!seen[key]){seen[key]=true;pts.push({time:key,value:v});}
    }
  }
  pts.sort(function(a,b){return a.time<b.time?-1:1;});
  return pts;
}

function _mobileBuildWdData(filter){
  var MS=window.CJ_MILESTONES||{};
  /* Build lookup: pid → proposal (for account/fund filter) */
  var pidToProp={};
  D.INDUSTRIES.forEach(function(ind){ind.children.forEach(function(p){pidToProp[p.id]=p;});});
  var FRD=(D&&D.FUND_RESULT_DATES)||{};
  var bars=[],used={};
  for(var pid in MS){
    /* Apply filter */
    if(filter){
      if(filter.type==='prop' && pid!==filter.id) continue;
      if(filter.type==='acct'){
        var pp=pidToProp[pid];if(!pp) continue;
        var involved=(pp.by===filter.name)||(pp.team&&pp.team.some(function(t){return t.name===filter.name;}));
        if(!involved) continue;
      }
      if(filter.type==='fund'){
        var pp2=pidToProp[pid];if(!pp2||pp2.fund!==filter.fund) continue;
      }
    }
    var entries=MS[pid];
    var pp=pidToProp[pid];
    /* Compute fund result date for clamping (signoff can't predate fund result) */
    var fundDate=null;
    if(pp&&pp.fund&&FRD[pp.fund]){
      var fp=FRD[pp.fund].split('-');
      fundDate=fp[2]+'-'+fp[1]+'-'+fp[0];
    }
    for(var ei=0;ei<entries.length;ei++){
      var e=entries[ei];
      var adaK=e.budget/1000;
      var totalCost=0;
      for(var i=0;i<e.milestones.length;i++) totalCost+=e.milestones[i].cost;
      for(var mi=0;mi<e.milestones.length;mi++){
        var m=e.milestones[mi];
        if(!m.signoff||m.cost<=0) continue;
        var msAda=totalCost>0?(m.cost/totalCost)*adaK:m.cost/1000;
        var dt=m.signoff.substring(0,10);
        /* Clamp: signoff can't be before fund result date (data anomaly) */
        if(fundDate && dt<fundDate) dt=fundDate;
        var attempt=0,tryDt=dt;
        while(used[tryDt]){attempt++;var dd=new Date(dt);dd.setDate(dd.getDate()+attempt);tryDt=dd.toISOString().substring(0,10);}
        used[tryDt]=true;
        bars.push({time:tryDt,value:msAda,color:'rgba(232,160,72,0.55)'});
      }
    }
  }

  /* Also add bars for pre-MS proposals (F2-F9) that don't have CJ_MILESTONES data.
     Place at fund result date as lump-sum payment received then. */
  D.INDUSTRIES.forEach(function(ind){ind.children.forEach(function(p){
    if(MS[p.id]&&MS[p.id].length) return; /* already handled above */
    if((p.fund||0)>=10) return; /* only pre-MS */
    /* Apply filter */
    if(filter){
      if(filter.type==='prop' && p.id!==filter.id) return;
      if(filter.type==='acct'){
        var inv=(p.by===filter.name)||(p.team&&p.team.some(function(t){return t.name===filter.name;}));
        if(!inv) return;
      }
      if(filter.type==='fund' && p.fund!==filter.fund) return;
    }
    if(!FRD[p.fund]) return;
    var fp=FRD[p.fund].split('-');
    var dt=fp[2]+'-'+fp[1]+'-'+fp[0];
    var ada=(p.u==='ada'?p.amt:p.amt/(p.adaPrice||0.5));
    var attempt=0,tryDt=dt;
    while(used[tryDt]){attempt++;var dd=new Date(dt);dd.setDate(dd.getDate()+attempt);tryDt=dd.toISOString().substring(0,10);}
    used[tryDt]=true;
    /* Slightly different orange tone for pre-MS to distinguish from MS bars */
    bars.push({time:tryDt,value:ada,color:'rgba(232,160,72,0.55)'});
  });});

  bars.sort(function(a,b){return a.time<b.time?-1:1;});
  return bars;
}

/* Build blue Fund-adoption bars on a SEPARATE series so they don't squash the orange bars' scale */
function _mobileBuildFundBarData(filter){
  var FRD=(D&&D.FUND_RESULT_DATES)||{};
  var fundTotals={};
  D.INDUSTRIES.forEach(function(ind){ind.children.forEach(function(p){
    var f=p.fund||0;if(!f) return;
    if(filter){
      if(filter.type==='prop' && p.id!==filter.id) return;
      if(filter.type==='acct'){
        var inv=(p.by===filter.name)||(p.team&&p.team.some(function(t){return t.name===filter.name;}));
        if(!inv) return;
      }
      if(filter.type==='fund' && p.fund!==filter.fund) return;
    }
    var ada=(p.u==='ada'?p.amt:p.amt/(p.adaPrice||0.5));
    fundTotals[f]=(fundTotals[f]||0)+ada;
  });});
  var bars=[];
  var seenDates={};
  for(var ff in fundTotals){
    if(!FRD[ff]) continue;
    var fparts=FRD[ff].split('-');
    var fdt=fparts[2]+'-'+fparts[1]+'-'+fparts[0];
    /* Place fund bar 1 day BEFORE the fund result date so it doesn't collide with MS bars */
    var fdtObj=new Date(fdt);fdtObj.setDate(fdtObj.getDate()-1);
    var dKey=fdtObj.toISOString().substring(0,10);
    var attempt=0,tryDt=dKey;
    while(seenDates[tryDt]){attempt++;var dd=new Date(dKey);dd.setDate(dd.getDate()-attempt);tryDt=dd.toISOString().substring(0,10);}
    seenDates[tryDt]=true;
    bars.push({time:tryDt,value:fundTotals[ff]});
  }
  bars.sort(function(a,b){return a.time<b.time?-1:1;});
  return bars;
}

/* ---- Network/関係図 — force bubble chart (PC版同等) ---- */
function renderNetwork(){
  /* Build graph data */
  var ppl={},edg={};
  D.INDUSTRIES.forEach(function(ind){
    ind.children.forEach(function(p){
      var inv=[];
      if(p.by) inv.push(p.by);
      if(p.team) p.team.forEach(function(tm){inv.push(tm.name)});
      inv=inv.filter(Boolean);
      /* dedupe */
      var uniq=[];inv.forEach(function(n){if(uniq.indexOf(n)<0)uniq.push(n)});
      uniq.forEach(function(nm){
        if(!ppl[nm]) ppl[nm]={name:nm,props:[],_sectors:{}};
        ppl[nm].props.push(p);
        ppl[nm]._sectors[ind.id]=(ppl[nm]._sectors[ind.id]||0)+1;
      });
      if(uniq.length>=2){
        for(var a=0;a<uniq.length;a++){for(var b=a+1;b<uniq.length;b++){
          var ns=[uniq[a],uniq[b]].sort();var ek=ns[0]+'|'+ns[1];
          if(!edg[ek]) edg[ek]={a:ns[0],b:ns[1],proposals:[]};
          edg[ek].proposals.push(p);
        }}
      }
    });
  });

  var edges=[];for(var ek in edg) edges.push(edg[ek]);
  var conn={};
  for(var ei=0;ei<edges.length;ei++){conn[edges[ei].a]=true;conn[edges[ei].b]=true;}

  var nodes=[];for(var pk in ppl) nodes.push(ppl[pk]);
  var nameIdx={};
  for(var ni=0;ni<nodes.length;ni++){
    var c=0;
    for(var ei=0;ei<edges.length;ei++){if(edges[ei].a===nodes[ni].name||edges[ei].b===nodes[ni].name)c++;}
    nodes[ni].edgeCnt=c;
    nodes[ni].connected=!!conn[nodes[ni].name];
    /* primary sector hue */
    var best=null,bestCnt=0;
    for(var sk in nodes[ni]._sectors){if(nodes[ni]._sectors[sk]>bestCnt){bestCnt=nodes[ni]._sectors[sk];best=sk;}}
    nodes[ni].hue=0;
    D.INDUSTRIES.forEach(function(ind){if(ind.id===best) nodes[ni].hue=ind.hue});
    nodes[ni].radius=14+Math.min(nodes[ni].props.length*2.5,22);
    nameIdx[nodes[ni].name]=ni;
  }
  nodes.sort(function(a,b){return b.props.length-a.props.length});
  /* rebuild nameIdx after sort */
  nameIdx={};for(var ni=0;ni<nodes.length;ni++) nameIdx[nodes[ni].name]=ni;

  /* adjacency */
  var adjSets=[];
  for(var ni=0;ni<nodes.length;ni++) adjSets.push({});
  for(var ei=0;ei<edges.length;ei++){
    var ai=nameIdx[edges[ei].a],bi=nameIdx[edges[ei].b];
    if(ai!=null&&bi!=null){adjSets[ai][bi]=true;adjSets[bi][ai]=true;}
  }

  /* Force simulation */
  var VW=720,VH=720;
  var vcx=VW/2,vcy=VH/2;
  var pos=[];
  var initR=Math.min(VW,VH)*0.32;
  for(var ni=0;ni<nodes.length;ni++){
    var angle=(2*Math.PI*ni/nodes.length)-Math.PI/2;
    pos[ni]={x:vcx+Math.cos(angle)*initR,y:vcy+Math.sin(angle)*initR};
  }

  var SIM_ITER=400,linkDist=120,linkStr=0.04,charge=-1500,centerStr=0.008,collidePad=20;
  for(var it=0;it<SIM_ITER;it++){
    var alpha=1-it/SIM_ITER;
    for(var ei=0;ei<edges.length;ei++){
      var ai=nameIdx[edges[ei].a],bi=nameIdx[edges[ei].b];
      if(ai==null||bi==null)continue;
      var dx=pos[bi].x-pos[ai].x,dy=pos[bi].y-pos[ai].y;
      var dist=Math.sqrt(dx*dx+dy*dy)||0.01;
      var f=(dist-linkDist)*linkStr*alpha;
      var fx=(dx/dist)*f,fy=(dy/dist)*f;
      pos[ai].x+=fx;pos[ai].y+=fy;pos[bi].x-=fx;pos[bi].y-=fy;
    }
    for(var a=0;a<nodes.length;a++){for(var b=a+1;b<nodes.length;b++){
      var dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;
      var d2=dx*dx+dy*dy;if(d2<1)d2=1;var dist=Math.sqrt(d2);
      var force=(charge*alpha)/d2;var fx=(dx/dist)*force,fy=(dy/dist)*force;
      pos[a].x-=fx;pos[a].y-=fy;pos[b].x+=fx;pos[b].y+=fy;
    }}
    for(var ni=0;ni<nodes.length;ni++){
      pos[ni].x+=(vcx-pos[ni].x)*centerStr*alpha;
      pos[ni].y+=(vcy-pos[ni].y)*centerStr*alpha;
    }
    for(var a=0;a<nodes.length;a++){for(var b=a+1;b<nodes.length;b++){
      var dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;
      var dist=Math.sqrt(dx*dx+dy*dy)||0.01;
      var minD=nodes[a].radius+nodes[b].radius+collidePad;
      if(dist<minD){var ov=(minD-dist)/2;var ox=(dx/dist)*ov,oy=(dy/dist)*ov;
        pos[a].x-=ox;pos[a].y-=oy;pos[b].x+=ox;pos[b].y+=oy;}
    }}
    var pad=40;
    for(var ni=0;ni<nodes.length;ni++){
      pos[ni].x=Math.max(pad,Math.min(VW-pad,pos[ni].x));
      pos[ni].y=Math.max(pad,Math.min(VH-pad,pos[ni].y));
    }
  }

  /* Auto-fit viewBox */
  var minX=9999,minY=9999,maxX=0,maxY=0;
  for(var ni=0;ni<nodes.length;ni++){
    var r=nodes[ni].radius+30;
    if(pos[ni].x-r<minX)minX=pos[ni].x-r;if(pos[ni].y-r<minY)minY=pos[ni].y-r;
    if(pos[ni].x+r>maxX)maxX=pos[ni].x+r;if(pos[ni].y+r>maxY)maxY=pos[ni].y+r;
  }
  var vbX=Math.max(0,minX-20),vbY=Math.max(0,minY-20);
  var vbW=maxX-vbX+20,vbH=maxY-vbY+20;

  /* Build DOM */
  var wrap=document.createElement('div');wrap.className='da-relnet-wrap';
  var relnet=document.createElement('div');relnet.className='da-relnet';
  var svgNS='http://www.w3.org/2000/svg';
  var svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox',vbX+' '+vbY+' '+vbW+' '+vbH);
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  svg.setAttribute('class','da-relnet-svg');
  svg.setAttribute('width',vbW);svg.setAttribute('height',vbH);

  /* Edge lines */
  var lineColor=NIGHT?'rgba(232,230,225,0.18)':'rgba(26,23,21,0.12)';
  for(var ei=0;ei<edges.length;ei++){
    var e=edges[ei],ai=nameIdx[e.a],bi=nameIdx[e.b];
    if(ai==null||bi==null)continue;
    var line=document.createElementNS(svgNS,'line');
    line.setAttribute('x1',pos[ai].x.toFixed(1));line.setAttribute('y1',pos[ai].y.toFixed(1));
    line.setAttribute('x2',pos[bi].x.toFixed(1));line.setAttribute('y2',pos[bi].y.toFixed(1));
    line.setAttribute('stroke',lineColor);
    line.setAttribute('stroke-width',String(Math.min(1.2+e.proposals.length*0.4,3)));
    line.setAttribute('opacity',String(Math.min(1,0.25+e.proposals.length*0.08)));
    line.setAttribute('class','rl-line');
    svg.appendChild(line);
  }

  /* Node circles */
  var nodeEls=[];
  for(var ni=0;ni<nodes.length;ni++){
    var node=nodes[ni],p=pos[ni],r=node.radius,h=node.hue;
    var col='hsl('+h+' '+(NIGHT?55:50)+'% '+(NIGHT?60:44)+'%)';
    var g=document.createElementNS(svgNS,'g');
    g.style.cursor='pointer';g.style.transition='opacity 0.2s';
    g.setAttribute('data-ni',String(ni));g.setAttribute('class','rl-node');
    g.setAttribute('transform','translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')');

    var circle=document.createElementNS(svgNS,'circle');
    circle.setAttribute('r',r);circle.setAttribute('fill',NIGHT?'#16171a':'#fff');
    circle.setAttribute('stroke',col);circle.setAttribute('stroke-width','1.5');
    g.appendChild(circle);

    var initial=node.name.charAt(0);
    if(/[a-zA-Z]/.test(initial)) initial=initial.toUpperCase();
    var txt=document.createElementNS(svgNS,'text');
    txt.setAttribute('text-anchor','middle');txt.setAttribute('dy','0.35em');
    txt.setAttribute('font-size',r*0.9);txt.setAttribute('font-family',"'Fraunces',serif");
    txt.setAttribute('font-weight','500');txt.setAttribute('fill',NIGHT?'#e8e6e1':'#1a1715');
    txt.textContent=initial;g.appendChild(txt);

    var nameTxt=document.createElementNS(svgNS,'text');
    nameTxt.setAttribute('y',r+14);nameTxt.setAttribute('text-anchor','middle');
    nameTxt.setAttribute('font-size','11');nameTxt.setAttribute('font-family',"'Noto Sans JP','JetBrains Mono',sans-serif");
    nameTxt.setAttribute('font-weight','500');
    nameTxt.setAttribute('fill',NIGHT?'rgba(232,230,225,0.92)':'rgba(26,23,21,0.85)');
    nameTxt.setAttribute('stroke',NIGHT?'#0c0d10':'#faf7f0');
    nameTxt.setAttribute('stroke-width','3');
    nameTxt.setAttribute('paint-order','stroke');
    nameTxt.textContent=node.name.length>12?node.name.slice(0,12)+'…':node.name;
    g.appendChild(nameTxt);

    var statTxt=document.createElementNS(svgNS,'text');
    statTxt.setAttribute('y',r+26);statTxt.setAttribute('text-anchor','middle');
    statTxt.setAttribute('font-size','9');statTxt.setAttribute('font-family',"'JetBrains Mono',monospace");
    statTxt.setAttribute('fill',NIGHT?'rgba(232,230,225,0.5)':'rgba(26,23,21,0.45)');
    statTxt.setAttribute('stroke',NIGHT?'#0c0d10':'#faf7f0');
    statTxt.setAttribute('stroke-width','2.5');
    statTxt.setAttribute('paint-order','stroke');
    statTxt.textContent=node.props.length+' · '+node.edgeCnt;
    g.appendChild(statTxt);

    svg.appendChild(g);
    nodeEls.push({el:g,ni:ni});
  }

  var inner=document.createElement('div');inner.className='da-relnet-inner';
  inner.appendChild(svg);
  relnet.appendChild(inner);
  wrap.appendChild(relnet);

  /* Stats overlay */
  var statsDiv=document.createElement('div');statsDiv.className='da-relnet-stats';
  statsDiv.innerHTML='<div><b>'+nodes.length+'</b> '+(LANG==='ja'?'アカウント':'accounts')+' · <b>'+edges.length+'</b> '+(LANG==='ja'?'関係':'connections')+'</div>'
    +'<div class="da-relnet-hint">'+(LANG==='ja'?'ノードをタップ':'tap a node')+'</div>';
  wrap.appendChild(statsDiv);

  /* Store state for selection updates */
  _relState={wrap:wrap,nodes:nodes,edges:edges,nodeEls:nodeEls,adjSets:adjSets,pos:pos,nameIdx:nameIdx};

  /* Tap interactions */
  for(var i=0;i<nodeEls.length;i++){
    (function(ne){
      ne.el.addEventListener('click',function(ev){
        ev.stopPropagation();
        _relSelected=(_relSelected===nodes[ne.ni].name)?null:nodes[ne.ni].name;
        _updateRelSelection();
      });
    })(nodeEls[i]);
  }
  relnet.addEventListener('click',function(ev){
    if(!ev.target.closest('.rl-node')){_relSelected=null;_updateRelSelection();}
  });

  /* Pinch-to-zoom */
  var _pinchDist0=0,_svgScale=1,_baseW=vbW,_baseH=vbH;
  relnet.addEventListener('touchstart',function(e){
    if(e.touches.length===2){
      _pinchDist0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    }
  },{passive:true});
  relnet.addEventListener('touchmove',function(e){
    if(e.touches.length===2&&_pinchDist0>0){
      e.preventDefault();
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      var ratio=d/_pinchDist0;
      _svgScale=Math.max(0.3,Math.min(4,_svgScale*ratio));
      svg.setAttribute('width',Math.round(_baseW*_svgScale));
      svg.setAttribute('height',Math.round(_baseH*_svgScale));
      _pinchDist0=d;
    }
  },{passive:false});
  relnet.addEventListener('touchend',function(e){
    if(e.touches.length<2) _pinchDist0=0;
  },{passive:true});

  /* Insert into DOM */
  var daRoot=document.getElementById('app');
  var dock=daRoot.querySelector('.da-dock');
  daRoot.insertBefore(wrap,dock);

  /* Center on densest node */
  setTimeout(function(){
    if(nodes.length>0){
      var t=nodes[0],p=pos[nameIdx[t.name]];
      relnet.scrollTo({left:Math.max(0,p.x-relnet.clientWidth/2),top:Math.max(0,p.y-relnet.clientHeight/2)});
    }
  },50);
}

function _updateRelSelection(){
  var st=_relState;if(!st)return;
  var selName=_relSelected;
  var selIdx=selName!=null?st.nameIdx[selName]:null;
  var adj=selIdx!=null?st.adjSets[selIdx]:null;

  /* Dim/highlight nodes */
  for(var i=0;i<st.nodeEls.length;i++){
    var ne=st.nodeEls[i],ni=ne.ni,isSel=st.nodes[ni].name===selName;
    var dimmed=selName&&!isSel&&(!adj||!adj[ni]);
    ne.el.style.opacity=dimmed?'0.2':'1';
    var circle=ne.el.querySelector('circle');
    if(circle) circle.setAttribute('stroke-width',isSel?'3':'1.5');
  }

  /* Highlight lines */
  st.wrap.querySelectorAll('.rl-highlight').forEach(function(el){el.remove()});
  var oldDetail=st.wrap.querySelector('.da-relnet-detail');
  if(oldDetail) oldDetail.remove();

  /* Update hint */
  var hint=st.wrap.querySelector('.da-relnet-hint');
  if(hint) hint.textContent=selName?(LANG==='ja'?'タップで閉じる':'tap to close'):(LANG==='ja'?'ノードをタップ':'tap a node');

  if(selIdx==null) return;

  /* Draw highlight edges — insert BEFORE nodes so lines go under circles */
  var svgNS='http://www.w3.org/2000/svg';
  var svg=st.wrap.querySelector('svg');
  var firstNode=svg.querySelector('.rl-node');
  var me=st.pos[selIdx];
  var hCol='hsl('+st.nodes[selIdx].hue+' '+(NIGHT?60:50)+'% '+(NIGHT?70:50)+'%)';
  for(var k in adj){
    var other=st.pos[k];if(!other)continue;
    var hl=document.createElementNS(svgNS,'line');
    hl.setAttribute('x1',me.x.toFixed(1));hl.setAttribute('y1',me.y.toFixed(1));
    hl.setAttribute('x2',other.x.toFixed(1));hl.setAttribute('y2',other.y.toFixed(1));
    hl.setAttribute('stroke',hCol);hl.setAttribute('stroke-width','2');hl.setAttribute('opacity','0.85');
    hl.setAttribute('class','rl-highlight');
    if(firstNode) svg.insertBefore(hl,firstNode); else svg.appendChild(hl);
  }

  /* Detail panel — collapsed by default */
  var node=st.nodes[selIdx];
  var collabNames=[];for(var k in adj) collabNames.push({name:st.nodes[k].name,ni:k});
  var selProps=[].concat(node.props).sort(function(a,b){return pUsdK(b)-pUsdK(a)});

  /* Compute proposer stats for selected node */
  var _mainK=0,_coK=0,_mainC=0,_coC=0;
  selProps.forEach(function(p){
    var uK=pUsdK(p);
    if(p.by===node.name){
      if(p.cls==='main'){_mainK+=uK;_mainC++}else{_coK+=uK;_coC++}
    } else {
      /* team member — check role */
      if(p.team){
        var found=p.team.find(function(tm){return tm.name===node.name});
        if(found&&found.role==='共同提案'){_coK+=uK;_coC++}
      }
    }
  });
  var _totalK=_mainK+_coK;

  var detail=document.createElement('div');detail.className='da-relnet-detail collapsed';

  /* Header (always visible) */
  var headDiv=document.createElement('div');headDiv.className='da-relnet-detail-head';
  var _sLbl=LANG==='ja'?'単独':'Solo',_cLbl=LANG==='ja'?'共同提案者':'Co-proposed';
  headDiv.innerHTML='<div class="da-relnet-detail-name">'+esc(node.name)+'</div>'
    +'<span class="da-rds-val">'+fmtAmt(_totalK)+'</span>'
    +'<button class="da-relnet-close">×</button>';
  detail.appendChild(headDiv);

  /* Stats row: eyebrow left, solo/co right */
  var statsRow=document.createElement('div');statsRow.className='da-relnet-detail-row2';
  statsRow.innerHTML='<div class="da-relnet-detail-eyebrow">'+selProps.length+(LANG==='ja'?'件の提案':' props')+' · '+collabNames.length+(LANG==='ja'?'接続':' links')+'</div>'
    +'<span class="da-rds-pair"><span class="da-rds-lbl">'+_sLbl+'</span><span class="da-rds-v">'+(_mainK>0?fmtAmt(_mainK):'—')+'</span>'
    +'<span class="da-rds-lbl" style="margin-left:6px">'+_cLbl+'</span><span class="da-rds-v">'+(_coK>0?fmtAmt(_coK):'—')+'</span></span>';
  detail.appendChild(statsRow);

  /* Expand button (visible when collapsed) */
  var expandBtn=document.createElement('button');expandBtn.className='da-relnet-detail-expand';
  expandBtn.innerHTML='▼ '+(LANG==='ja'?'詳細を見る':'Show details');
  detail.appendChild(expandBtn);

  /* Body (hidden when collapsed) */
  var bodyDiv=document.createElement('div');bodyDiv.className='da-relnet-detail-body';
  bodyDiv.style.display='none';
  var b='';
  if(collabNames.length>0){
    b+='<div class="da-relnet-section-label">'+(LANG==='ja'?'主な共同提案者':'Top collaborators')+'</div><div class="da-relnet-collabs">';
    collabNames.forEach(function(c){b+='<span class="da-relchip"><span class="da-relchip-name">'+esc(c.name)+'</span></span>'});
    b+='</div>';
  }
  b+='<div class="da-relnet-section-label">'+(LANG==='ja'?'関連する提案':'Proposals')+' <em>· '+selProps.length+'</em></div><div class="da-relnet-props">';
  selProps.forEach(function(p){
    b+='<button class="da-relnet-prop" data-pid="'+p.id+'"><span class="da-rnp-bar" style="background:'+stColor(p.st)+'"></span>'
      +'<span class="da-rnp-title">'+esc(propTitle(p))+'</span><span class="da-rnp-amt">'+fmtAmt(pUsdK(p),pAdaK(p))+'</span></button>';
  });
  b+='</div>';
  bodyDiv.innerHTML=b;
  detail.appendChild(bodyDiv);

  /* Toggle expand/collapse */
  expandBtn.addEventListener('click',function(){
    var isCollapsed=detail.classList.contains('collapsed');
    if(isCollapsed){
      detail.classList.remove('collapsed');
      bodyDiv.style.display='';
      expandBtn.innerHTML='▲ '+(LANG==='ja'?'閉じる':'Hide');
    } else {
      detail.classList.add('collapsed');
      bodyDiv.style.display='none';
      expandBtn.innerHTML='▼ '+(LANG==='ja'?'詳細を見る':'Show details');
    }
  });

  /* Close button */
  headDiv.querySelector('.da-relnet-close').addEventListener('click',function(){_relSelected=null;_updateRelSelection()});

  /* Proposal click handlers */
  bodyDiv.querySelectorAll('.da-relnet-prop').forEach(function(btn){
    btn.addEventListener('click',function(){
      var pid=btn.getAttribute('data-pid'),found=null;
      D.INDUSTRIES.forEach(function(ind){ind.children.forEach(function(p){if(p.id==pid)found=p})});
      if(found) openSheet(found);
    });
  });
  st.wrap.appendChild(detail);
}

/* ---- Build a proposal row ---- */
function buildRow(p){
  var btn=document.createElement('button');
  btn.className='da-row';
  var cls='';
  if(p.cls==='co') cls='<span class="cj-cls cj-cls-co">'+t('co')+'</span>';
  else if(p.cls==='bridge') cls='<span class="cj-cls cj-cls-br">'+t('bridge')+'</span>';
  var fund=p.fund?'<span class="da-fund">F'+p.fund+'</span>':'';
  var by=p.by?'<span class="da-by">'+esc(p.by)+'</span>':'';
  btn.innerHTML='<div class="da-row-bar" style="background:'+stColor(p.st)+'"></div>'
    +'<div class="da-row-body">'
    +'<div class="da-row-title">'+esc(propTitle(p))+'</div>'
    +'<div class="da-row-meta">'+by+cls+fund+'</div>'
    +'</div>'
    +'<div class="da-row-amt"><div class="da-row-amt-big">'+fmtAmt(pUsdK(p),pAdaK(p))+'</div></div>';
  btn.addEventListener('click',function(e){
    e.stopPropagation();
    openSheet(p);
  });
  return btn;
}

/* ---- Build dock ---- */
function buildDock(){
  var dock=document.createElement('div');
  dock.className='da-dock';

  /* Controls row */
  var ctrls=document.createElement('div');
  ctrls.className='da-dock-ctrls';

  /* Currency (left) */
  var cGrp=document.createElement('div');
  cGrp.className='da-dock-grp';
  ['ada','usd','jpy'].forEach(function(c){
    var b=document.createElement('button');
    b.textContent=c==='ada'?'₳':c==='usd'?'$':'¥';
    if(CURRENCY===c) b.className='on';
    b.addEventListener('click',function(){CURRENCY=c;render()});
    cGrp.appendChild(b);
  });
  ctrls.appendChild(cGrp);

  /* Price mode: 提案時 / 採択時 */
  ctrls.appendChild(sep());
  var pmGrp=document.createElement('div');
  pmGrp.className='da-dock-grp sm';
  [{id:'submit',ja:'提案時',en:'Submit'},{id:'result',ja:'採択時',en:'Result'}].forEach(function(m){
    var b=document.createElement('button');
    b.textContent=LANG==='ja'?m.ja:m.en;
    if((D.priceMode||'submit')===m.id) b.className='on';
    b.addEventListener('click',function(){
      window._cjSetPriceMode(m.id);
    });
    pmGrp.appendChild(b);
  });
  ctrls.appendChild(pmGrp);

  /* Proposer sort (only on ppl tab) */
  if(TAB==='ppl'){
    ctrls.appendChild(sep());
    var sGrp=document.createElement('div');
    sGrp.className='da-dock-grp sm';
    [{id:'std',ja:'標準',en:'All'},{id:'solo',ja:'単独',en:'Solo'},{id:'co',ja:'共同',en:'Joint'},{id:'named',ja:'名義',en:'Team'},{id:'total',ja:'関連',en:'Total'}].forEach(function(s){
      var b=document.createElement('button');
      b.textContent=LANG==='ja'?s.ja:s.en;
      if(PPL_SORT===s.id) b.className='on';
      b.addEventListener('click',function(){
        PPL_SORT=s.id;
        sGrp.querySelectorAll('button').forEach(function(x){x.className=''});
        b.className='on';
        renderContent(document.getElementById('mainScroll'));
      });
      sGrp.appendChild(b);
    });
    ctrls.appendChild(sGrp);
  }

  /* Spacer pushes lang+theme to right */
  var spacer=document.createElement('div');
  spacer.style.cssText='flex:1';
  ctrls.appendChild(spacer);

  /* Lang */
  var lGrp=document.createElement('div');
  lGrp.className='da-dock-grp';
  [['ja','日'],['en','EN']].forEach(function(l){
    var b=document.createElement('button');
    b.textContent=l[1];
    if(LANG===l[0]) b.className='on';
    b.addEventListener('click',function(){LANG=l[0];render()});
    lGrp.appendChild(b);
  });
  ctrls.appendChild(lGrp);

  /* Theme (no separator, tight to lang) */
  var tb=document.createElement('button');
  tb.className='da-dock-theme';
  tb.textContent=NIGHT?'☾':'☀';
  tb.addEventListener('click',function(){
    NIGHT=!NIGHT;
    document.documentElement.classList.toggle('night',NIGHT);
    render();
  });
  ctrls.appendChild(tb);
  dock.appendChild(ctrls);

  /* Tabs */
  var tabs=document.createElement('nav');
  tabs.className='da-tabs';
  var tabDefs=[
    {id:'sectors',ja:'業界',en:'Sectors',icon:'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/>'},
    {id:'ppl',ja:'アカ',en:'Accounts',icon:'<circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 14.5c3 0 6 1.7 6 5.5"/>'},
    {id:'time',ja:'時系列',en:'Timeline',icon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'},
    {id:'rel',ja:'関係',en:'Network',icon:'<circle cx="6" cy="8" r="2.4"/><circle cx="18" cy="8" r="2.4"/><circle cx="12" cy="17" r="2.4"/><path d="M8 8h8M7.5 10l3.5 5M16.5 10L13 15"/>'},
    {id:'chart',ja:'チャート',en:'Chart',icon:'<path d="M3 20h18M5 17l4-6 4 4 5-8"/><circle cx="9" cy="11" r="1.5"/><circle cx="13" cy="15" r="1.5"/><circle cx="18" cy="7" r="1.5"/>'}
  ];
  tabDefs.forEach(function(td){
    var b=document.createElement('button');
    if(TAB===td.id) b.className='active';
    var sw=TAB===td.id?2:1.5;
    b.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="'+sw+'">'+td.icon+'</svg>'
      +'<span>'+(LANG==='ja'?td.ja:td.en)+'</span>';
    b.addEventListener('click',function(){TAB=td.id;openSectors={};render()});
    tabs.appendChild(b);
  });
  dock.appendChild(tabs);
  return dock;
}

function sep(){var d=document.createElement('div');d.className='da-dock-sep';return d}

/* ================================================================
   DETAIL SHEET
   ================================================================ */
function openSheet(p){
  var backdrop=document.createElement('div');
  backdrop.className='cj-sheet-backdrop';
  if(NIGHT) backdrop.classList.add('night');

  var sheet=document.createElement('div');
  sheet.className='cj-sheet';

  /* Grip */
  sheet.innerHTML='<div class="cj-sheet-grip"></div>';

  /* Close */
  var cls=document.createElement('button');
  cls.className='cj-sheet-close';
  cls.textContent='×';
  cls.addEventListener('click',close);
  sheet.appendChild(cls);

  /* Head */
  var head=document.createElement('div');
  head.className='cj-sheet-head';

  var sectorInfo='<div class="cj-d-sector">'
    +'<span class="cj-sec-dot" style="background:'+secColor(p.sectorHue)+'"></span>'
    +esc(LANG==='ja'?p.sectorJa:p.sectorLabel)
    +'</div>';
  var title='<div class="cj-d-title">'+esc(propTitle(p))+'</div>';

  /* Badges */
  var badges='<div class="cj-d-row">'
    +'<span class="cj-badge st-'+p.st+'">'+stLabel(p.st)+'</span>';
  if(p.fund) badges+='<span class="cj-badge cj-badge-fund">F'+p.fund+'</span>';
  if(p.cls&&p.cls!=='main') badges+='<span class="cj-badge cj-badge-cls">'+(p.cls==='co'?t('co'):t('bridge'))+'</span>';
  if(p.ch) badges+='<span class="cj-badge cj-badge-fund">'+esc(p.ch)+'</span>';
  badges+='</div>';

  /* Amount */
  var amtMain=p.u==='ada'?p.amt+(p.amt>=1000?'K':'')+'K ₳':fmtAmt(pUsdK(p),'usd');
  var amtSub=fmtAmt(pUsdK(p),CURRENCY==='ada'?'usd':'ada');
  var amts='<div class="cj-d-amts">'
    +'<span class="cj-d-amt-big">'+fmtAmt(pUsdK(p),pAdaK(p))+'</span>'
    +'<span class="cj-d-amt-sub">'+amtSub+'</span>'
    +'</div>';

  /* ADA price info */
  var adaP=p.adaPrice||ADA_USD;
  var pmLabel=(D.priceMode||'submit')==='submit'?(LANG==='ja'?'提案時':'Proposal'):(LANG==='ja'?'採択時':'Result');
  var priceInfo='<div class="cj-d-price">ADA $'+adaP.toFixed(2)+' (F'+(p.fund||'?')+' '+pmLabel+')</div>';

  head.innerHTML=sectorInfo+title+badges+amts+priceInfo;
  sheet.appendChild(head);

  /* Body */
  var body=document.createElement('div');
  body.className='cj-sheet-body';

  /* Proposer */
  if(p.by){
    var initial=p.by.charAt(0).toUpperCase();
    var hue=nameHue(p.by);
    body.innerHTML+='<div class="cj-d-section">'
      +'<div class="cj-d-label">'+t('proposer')+'</div>'
      +'<div class="cj-d-by">'
      +'<div class="cj-avatar" style="background:hsl('+hue+' 30% '+(NIGHT?25:90)+'%);color:hsl('+hue+' 50% '+(NIGHT?70:40)+'%)">'+initial+'</div>'
      +'<div><div class="cj-d-by-name">'+esc(p.by)+'</div>'
      +'<div class="cj-d-by-role">'+(p.role||t('proposer'))+'</div></div>'
      +'</div></div>';
  }

  /* Team */
  if(p.team&&p.team.length){
    var teamHtml='<div class="cj-d-section"><div class="cj-d-label">'+t('team')+'</div><div class="cj-team-tags">';
    p.team.forEach(function(tm){
      teamHtml+='<span class="cj-team-tag"><b>'+esc(tm.name)+'</b><em>'+esc(tm.role)+'</em></span>';
    });
    teamHtml+='</div></div>';
    body.innerHTML+=teamHtml;
  }

  /* Links */
  var hasLinks=p.url||p.x||p.yt||p.report;
  if(hasLinks){
    var linkHtml='<div class="cj-d-section"><div class="cj-d-label">'+t('links')+'</div><div class="cj-link-grid">';
    if(p.url) linkHtml+='<a class="cj-link-pill" href="'+p.url+'" target="_blank" rel="noopener">› Web</a>';
    if(p.x) linkHtml+='<a class="cj-link-pill" href="'+p.x+'" target="_blank" rel="noopener">› X</a>';
    if(p.yt) linkHtml+='<a class="cj-link-pill" href="'+p.yt+'" target="_blank" rel="noopener">› YouTube</a>';
    if(p.report){
      var ceUrl='https://catalystexplorer.com/proposals?search='+encodeURIComponent(p.label);
      linkHtml+='<a class="cj-link-pill" href="'+ceUrl+'" target="_blank" rel="noopener">› Explorer</a>';
    }
    linkHtml+='</div></div>';
    body.innerHTML+=linkHtml;
  }
  sheet.appendChild(body);

  /* Footer */
  var foot=document.createElement('div');
  foot.className='cj-sheet-foot';
  var askBtn=document.createElement('button');
  askBtn.className='cj-ask-btn';
  askBtn.innerHTML='✨ '+t('askLens');
  askBtn.addEventListener('click',function(){
    /* AI Lens placeholder — could link to external service */
    var ceUrl='https://catalystexplorer.com/proposals?search='+encodeURIComponent(p.label);
    window.open(ceUrl,'_blank');
  });
  foot.appendChild(askBtn);
  sheet.appendChild(foot);

  backdrop.appendChild(sheet);
  document.body.appendChild(backdrop);

  /* Close on backdrop click */
  backdrop.addEventListener('click',function(e){
    if(e.target===backdrop) close();
  });

  function close(){
    backdrop.style.animation='none';
    backdrop.style.opacity='0';
    backdrop.style.transition='opacity 0.2s';
    setTimeout(function(){backdrop.remove()},200);
  }
}

/* ================================================================
   INIT
   ================================================================ */
window.addEventListener('DOMContentLoaded',function(){
  /* Detect system dark mode */
  if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches){
    NIGHT=true;
    document.documentElement.classList.add('night');
  }
  render();
});
</script>
<div id="app"></div>
</body>
</html>
